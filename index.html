ion, target, position size aur expected risk record karo."}]],"a":1},{"k":"mc","q":{"en":"Which result is more useful for evaluating performance?","hn":"Performance evaluate karne ke liye kaunsa result zyada useful hai?"},"o":[[{"en":"Net result after realistic execution costs","hn":"Realistic execution costs ke baad net result"},{"en":"Correct. Record actual fills, partial fills, spread, slippage, brokerage, taxes and other costs; gross P&L can overstate the real result.","hn":"Sahi. Actual fills, partial fills, spread, slippage, brokerage, taxes aur doosre costs record karo; gross P&L real result ko overstate kar sakta hai."}],[{"en":"Gross result without any costs","hn":"Bina costs ka gross result"},{"en":"Not quite. Record actual fills, partial fills, spread, slippage, brokerage, taxes and other costs; gross P&L can overstate the real result.","hn":"Dobara socho. Actual fills, partial fills, spread, slippage, brokerage, taxes aur doosre costs record karo; gross P&L real result ko overstate kar sakta hai."}],[{"en":"The biggest intraday move only","hn":"Sirf biggest intraday move"},{"en":"Not quite. Record actual fills, partial fills, spread, slippage, brokerage, taxes and other costs; gross P&L can overstate the real result.","hn":"Dobara socho. Actual fills, partial fills, spread, slippage, brokerage, taxes aur doosre costs record karo; gross P&L real result ko overstate kar sakta hai."}]],"a":0},{"k":"mc","q":{"en":"Can a high win rate still produce a negative result?","hn":"Kya high win rate ke bawajood negative result ho sakta hai?"},"o":[[{"en":"No, win rate alone determines profit","hn":"Nahi, win rate akela profit decide karta hai"},{"en":"Not quite. Win rate ignores the size of wins and losses. Expectancy considers probability, average win, average loss and costs.","hn":"Dobara socho. Win rate wins/losses ki size ignore karti hai. Expectancy probability, average win, average loss aur costs consider karti hai."}],[{"en":"Only if every trade has the same size","hn":"Sirf jab har trade same size ka ho"},{"en":"Not quite. Win rate ignores the size of wins and losses. Expectancy considers probability, average win, average loss and costs.","hn":"Dobara socho. Win rate wins/losses ki size ignore karti hai. Expectancy probability, average win, average loss aur costs consider karti hai."}],[{"en":"Yes, if losses and costs outweigh wins","hn":"Haan, agar losses aur costs wins se zyada hon"},{"en":"Correct. Win rate ignores the size of wins and losses. Expectancy considers probability, average win, average loss and costs.","hn":"Sahi. Win rate wins/losses ki size ignore karti hai. Expectancy probability, average win, average loss aur costs consider karti hai."}]],"a":2},{"k":"mc","q":{"en":"What is the main purpose of mistake tags?","hn":"Mistake tags ka main purpose kya hai?"},"o":[[{"en":"Blame the market for every loss","hn":"Har loss ka blame market par daalna"},{"en":"Not quite. Use consistent tags such as late entry, moved stop, oversized position, skipped setup or revenge trading to spot patterns.","hn":"Dobara socho. Late entry, stop move, oversized position, skipped setup ya revenge trading jaise consistent tags use karo taaki patterns dikhein."}],[{"en":"Find repeated behaviours that can be improved","hn":"Improve kiye ja sakne wale repeated behaviours dhoondhna"},{"en":"Correct. Use consistent tags such as late entry, moved stop, oversized position, skipped setup or revenge trading to spot patterns.","hn":"Sahi. Late entry, stop move, oversized position, skipped setup ya revenge trading jaise consistent tags use karo taaki patterns dikhein."}],[{"en":"Delete losing trades from the sample","hn":"Losing trades sample se delete karna"},{"en":"Not quite. Use consistent tags such as late entry, moved stop, oversized position, skipped setup or revenge trading to spot patterns.","hn":"Dobara socho. Late entry, stop move, oversized position, skipped setup ya revenge trading jaise consistent tags use karo taaki patterns dikhein."}]],"a":1},{"k":"mc","q":{"en":"A profitable trade that broke the plan should be classified how?","hn":"Plan todkar profitable hua trade kaise classify karna chahiye?"},"o":[[{"en":"Proof that the rule should be abandoned","hn":"Rule abandon karne ka proof"},{"en":"Not quite. A well-planned trade can lose and a poorly planned trade can win. Evaluate whether rules were followed separately from the result.","hn":"Dobara socho. Well-planned trade lose ho sakta hai aur poorly planned trade win. Rules follow hue ya nahi, result se alag evaluate karo."}],[{"en":"A guaranteed repeatable edge","hn":"Guaranteed repeatable edge"},{"en":"Not quite. A well-planned trade can lose and a poorly planned trade can win. Evaluate whether rules were followed separately from the result.","hn":"Dobara socho. Well-planned trade lose ho sakta hai aur poorly planned trade win. Rules follow hue ya nahi, result se alag evaluate karo."}],[{"en":"Positive outcome but poor process adherence","hn":"Positive outcome par poor process adherence"},{"en":"Correct. A well-planned trade can lose and a poorly planned trade can win. Evaluate whether rules were followed separately from the result.","hn":"Sahi. Well-planned trade lose ho sakta hai aur poorly planned trade win. Rules follow hue ya nahi, result se alag evaluate karo."}]],"a":2},{"k":"mc","q":{"en":"Why can paper performance overstate live performance?","hn":"Paper performance live performance ko overstate kyun kar sakti hai?"},"o":[[{"en":"It may omit real fills, costs and behavioural pressure","hn":"Real fills, costs aur behavioural pressure omit ho sakte hain"},{"en":"Correct. Paper trading may omit queue position, partial fills, slippage, fees, liquidity constraints and emotional pressure. Document assumptions.","hn":"Sahi. Paper trading queue position, partial fills, slippage, fees, liquidity constraints aur emotional pressure omit kar sakti hai. Assumptions document karo."}],[{"en":"Paper orders always pay more fees","hn":"Paper orders hamesha zyada fees deti hain"},{"en":"Not quite. Paper trading may omit queue position, partial fills, slippage, fees, liquidity constraints and emotional pressure. Document assumptions.","hn":"Dobara socho. Paper trading queue position, partial fills, slippage, fees, liquidity constraints aur emotional pressure omit kar sakti hai. Assumptions document karo."}],[{"en":"Live orders always fill at the signal price","hn":"Live orders hamesha signal price par fill hote hain"},{"en":"Not quite. Paper trading may omit queue position, partial fills, slippage, fees, liquidity constraints and emotional pressure. Document assumptions.","hn":"Dobara socho. Paper trading queue position, partial fills, slippage, fees, liquidity constraints aur emotional pressure omit kar sakti hai. Assumptions document karo."}]],"a":0},{"k":"mc","q":{"en":"What is a better basis for judging a strategy?","hn":"Strategy judge karne ka better basis kya hai?"},"o":[[{"en":"One unusually large win","hn":"Ek unusually large win"},{"en":"Not quite. Look for patterns across a meaningful sample and segment by setup, market regime and execution quality. Avoid changing rules after every result.","hn":"Dobara socho. Meaningful sample mein patterns dekho aur setup, market regime aur execution quality ke hisaab se segment karo. Har result ke baad rules mat badlo."}],[{"en":"A meaningful sample with consistent rules","hn":"Consistent rules ke saath meaningful sample"},{"en":"Correct. Look for patterns across a meaningful sample and segment by setup, market regime and execution quality. Avoid changing rules after every result.","hn":"Sahi. Meaningful sample mein patterns dekho aur setup, market regime aur execution quality ke hisaab se segment karo. Har result ke baad rules mat badlo."}],[{"en":"A single emotional reaction","hn":"Ek emotional reaction"},{"en":"Not quite. Look for patterns across a meaningful sample and segment by setup, market regime and execution quality. Avoid changing rules after every result.","hn":"Dobara socho. Meaningful sample mein patterns dekho aur setup, market regime aur execution quality ke hisaab se segment karo. Har result ke baad rules mat badlo."}]],"a":1},{"k":"mc","q":{"en":"How should a journal review lead to improvement?","hn":"Journal review se improvement kaise aani chahiye?"},"o":[[{"en":"Change every rule immediately","hn":"Har rule turant badal do"},{"en":"Not quite. Choose a specific process improvement, define how to measure it and review again after enough observations; avoid changing many variables at once.","hn":"Dobara socho. Specific process improvement choose karo, measure define karo aur enough observations ke baad review karo; ek saath bahut variables mat badlo."}],[{"en":"Stop recording trades after a loss","hn":"Loss ke baad trades record karna band karo"},{"en":"Not quite. Choose a specific process improvement, define how to measure it and review again after enough observations; avoid changing many variables at once.","hn":"Dobara socho. Specific process improvement choose karo, measure define karo aur enough observations ke baad review karo; ek saath bahut variables mat badlo."}],[{"en":"Make one measurable change and review a new sample","hn":"Ek measurable change karke naya sample review karo"},{"en":"Correct. Choose a specific process improvement, define how to measure it and review again after enough observations; avoid changing many variables at once.","hn":"Sahi. Specific process improvement choose karo, measure define karo aur enough observations ke baad review karo; ek saath bahut variables mat badlo."}]],"a":2},{"k":"end"}];
UNITS.x23=[{"k":"info","t":{"en":"Define risk-reward before entry","hn":"Entry se pehle risk-reward define karo"},"hook":{"en":"A planned risk of ₹500 and reward of ₹1,000 gives what ratio?","hn":"₹500 risk aur ₹1,000 reward ka ratio kya hai?"},"story":{"en":"Risk ₹500 and planned reward ₹1,000 gives a gross 1:2 risk-reward ratio before costs.","hn":"Risk ₹500 aur planned reward ₹1,000 se costs se pehle gross 1:2 ratio banta hai."},"s":{"en":"Compare the planned loss to the planned reward, while remembering that targets are uncertain and costs matter.","hn":"Planned loss ko planned reward se compare karo, lekin target uncertain hai aur costs matter karti hain."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"A planned risk of ₹500 and reward of ₹1,000 gives what ratio?","hn":"₹500 risk aur ₹1,000 reward ka ratio kya hai?"},"reveal":{"en":"1:2","hn":"1:2"}},{"k":"info","t":{"en":"Invalidation is the reason to exit","hn":"Invalidation exit ka reason hai"},"hook":{"en":"What does invalidation specify?","hn":"Invalidation kya specify karta hai?"},"story":{"en":"A breakout setup is invalidated if price closes back inside the prior range, as defined by the plan.","hn":"Plan ke mutabik price prior range mein close ho toh breakout setup invalidate ho sakta hai."},"s":{"en":"Invalidation identifies what would make the trade idea no longer valid; it should be chosen before entry.","hn":"Invalidation batata hai ki kis condition mein trade idea valid nahi rahega; ise entry se pehle choose karo."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"What does invalidation specify?","hn":"Invalidation kya specify karta hai?"},"reveal":{"en":"The condition that disproves the trade idea","hn":"Trade idea galat hone ki condition"}},{"k":"info","t":{"en":"A stop order is not a guaranteed fill price","hn":"Stop order guaranteed fill price nahi hai"},"hook":{"en":"What does a stop trigger fail to guarantee?","hn":"Stop trigger kya guarantee nahi karta?"},"story":{"en":"A stock gaps below a stop level; execution occurs at the next available price, not necessarily the stop price.","hn":"Stock stop level se neeche gap karta hai; execution next available price par ho sakta hai, stop price par zaroori nahi."},"s":{"en":"A stop trigger may become a market order or follow venue-specific rules. Fast moves and gaps can cause fills away from the trigger.","hn":"Stop trigger market order ban sakta hai ya venue-specific rules follow kar sakta hai. Fast moves aur gaps mein fill trigger se alag ho sakta hai."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"What does a stop trigger fail to guarantee?","hn":"Stop trigger kya guarantee nahi karta?"},"reveal":{"en":"The exact execution price","hn":"Exact execution price"}},{"k":"info","t":{"en":"Position size converts risk into quantity","hn":"Position size risk ko quantity mein badalta hai"},"hook":{"en":"Which inputs are central to position sizing?","hn":"Position sizing mein kaunse inputs central hain?"},"story":{"en":"A ₹1 stop distance and a ₹10 stop distance should not automatically use the same quantity for the same risk budget.","hn":"₹1 aur ₹10 stop distance par same risk budget ke liye same quantity automatically use nahi karni chahiye."},"s":{"en":"Quantity should reflect the risk budget, the absolute distance between entry and stop, contract multiplier and costs.","hn":"Quantity risk budget, entry aur stop ke absolute distance, contract multiplier aur costs reflect kare."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"Which inputs are central to position sizing?","hn":"Position sizing mein kaunse inputs central hain?"},"reveal":{"en":"Risk budget and absolute distance between entry and stop","hn":"Risk budget aur entry-stop ka absolute distance"}},{"k":"info","t":{"en":"Risk-reward is not a probability","hn":"Risk-reward probability nahi hai"},"hook":{"en":"Does a 1:3 risk-reward ratio imply a 75% win probability?","hn":"Kya 1:3 risk-reward ka matlab 75% win probability hai?"},"story":{"en":"A setup targets three units but wins rarely; the ratio alone cannot show expected performance.","hn":"Setup three units target karta hai par rarely win hota hai; ratio akela expected performance nahi batata."},"s":{"en":"A 1:3 planned ratio does not mean a trade has a 3-in-4 chance of winning. Probability and payoff distribution are separate.","hn":"1:3 planned ratio ka matlab 3-in-4 win chance nahi hai. Probability aur payoff distribution alag cheezein hain."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"Does a 1:3 risk-reward ratio imply a 75% win probability?","hn":"Kya 1:3 risk-reward ka matlab 75% win probability hai?"},"reveal":{"en":"No; ratio and win probability are different","hn":"Nahi; ratio aur win probability alag hain"}},{"k":"info","t":{"en":"Leverage magnifies exposure, not skill","hn":"Leverage exposure badhata hai, skill nahi"},"hook":{"en":"What does leverage change most directly?","hn":"Leverage directly sabse zyada kya badalta hai?"},"story":{"en":"A small adverse move on a leveraged position can consume a large share of the trader’s capital.","hn":"Leveraged position mein chhota adverse move capital ka bada hissa consume kar sakta hai."},"s":{"en":"Leverage can amplify gains and losses relative to own capital; it does not improve the quality of a trade idea.","hn":"Leverage own capital ke comparison mein gains aur losses amplify kar sakta hai; trade idea ki quality improve nahi karta."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"What does leverage change most directly?","hn":"Leverage directly sabse zyada kya badalta hai?"},"reveal":{"en":"Exposure relative to own capital and loss sensitivity","hn":"Own capital ke comparison mein exposure aur loss sensitivity"}},{"k":"info","t":{"en":"Targets must fit market structure","hn":"Target market structure ke fit hona chahiye"},"hook":{"en":"Why not choose a target only to improve the ratio?","hn":"Sirf ratio improve karne ke liye target kyun nahi choose karein?"},"story":{"en":"A very distant target creates an impressive ratio but is rarely reached in the setup’s tested conditions.","hn":"Bahut distant target impressive ratio deta hai par tested conditions mein rarely reach hota hai."},"s":{"en":"Targets should be tested against structure, volatility, liquidity and realistic costs rather than chosen only to make a ratio look attractive.","hn":"Target ko structure, volatility, liquidity aur realistic costs ke against test karo; sirf ratio attractive banane ke liye choose mat karo."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"Why not choose a target only to improve the ratio?","hn":"Sirf ratio improve karne ke liye target kyun nahi choose karein?"},"reveal":{"en":"It may be unrealistic and distort the plan","hn":"Woh unrealistic ho sakta hai aur plan distort karega"}},{"k":"info","t":{"en":"Review planned versus realised risk","hn":"Planned aur realised risk review karo"},"hook":{"en":"What should be compared after a trade?","hn":"Trade ke baad kya compare karna chahiye?"},"story":{"en":"A journal shows exits repeatedly worse than planned because the instrument is illiquid.","hn":"Journal dikhata hai ki illiquid instrument ke kaaran exits baar-baar plan se worse hote hain."},"s":{"en":"Record the planned stop, actual exit, slippage and reason for deviation. Repeated gaps or execution issues may require smaller size or a different instrument.","hn":"Planned stop, actual exit, slippage aur deviation ka reason record karo. Repeated gaps ya execution issue par smaller size ya different instrument chahiye ho sakta hai."},"p":{"en":"Stops and targets are planning tools, not guarantees. Gaps, slippage, liquidity and execution can produce a different result.","hn":"Stop aur target planning tools hain, guarantees nahi. Gap, slippage, liquidity aur execution se result alag ho sakta hai."},"think":{"en":"What should be compared after a trade?","hn":"Trade ke baad kya compare karna chahiye?"},"reveal":{"en":"Planned risk versus realised outcome and execution","hn":"Planned risk vs realised outcome aur execution"}},{"k":"mc","q":{"en":"A planned risk of ₹500 and reward of ₹1,000 gives what ratio?","hn":"₹500 risk aur ₹1,000 reward ka ratio kya hai?"},"o":[[{"en":"2:1","hn":"2:1"},{"en":"Not quite. Compare the planned loss to the planned reward, while remembering that targets are uncertain and costs matter.","hn":"Dobara socho. Planned loss ko planned reward se compare karo, lekin target uncertain hai aur costs matter karti hain."}],[{"en":"1:2","hn":"1:2"},{"en":"Correct. Compare the planned loss to the planned reward, while remembering that targets are uncertain and costs matter.","hn":"Sahi. Planned loss ko planned reward se compare karo, lekin target uncertain hai aur costs matter karti hain."}],[{"en":"1:1","hn":"1:1"},{"en":"Not quite. Compare the planned loss to the planned reward, while remembering that targets are uncertain and costs matter.","hn":"Dobara socho. Planned loss ko planned reward se compare karo, lekin target uncertain hai aur costs matter karti hain."}]],"a":1},{"k":"mc","q":{"en":"What does invalidation specify?","hn":"Invalidation kya specify karta hai?"},"o":[[{"en":"The condition that disproves the trade idea","hn":"Trade idea galat hone ki condition"},{"en":"Correct. Invalidation identifies what would make the trade idea no longer valid; it should be chosen before entry.","hn":"Sahi. Invalidation batata hai ki kis condition mein trade idea valid nahi rahega; ise entry se pehle choose karo."}],[{"en":"A guaranteed profit level","hn":"Guaranteed profit level"},{"en":"Not quite. Invalidation identifies what would make the trade idea no longer valid; it should be chosen before entry.","hn":"Dobara socho. Invalidation batata hai ki kis condition mein trade idea valid nahi rahega; ise entry se pehle choose karo."}],[{"en":"The broker’s maximum quantity","hn":"Broker ki maximum quantity"},{"en":"Not quite. Invalidation identifies what would make the trade idea no longer valid; it should be chosen before entry.","hn":"Dobara socho. Invalidation batata hai ki kis condition mein trade idea valid nahi rahega; ise entry se pehle choose karo."}]],"a":0},{"k":"mc","q":{"en":"What does a stop trigger fail to guarantee?","hn":"Stop trigger kya guarantee nahi karta?"},"o":[[{"en":"That the rule was submitted","hn":"Rule submit hua tha"},{"en":"Not quite. A stop trigger may become a market order or follow venue-specific rules. Fast moves and gaps can cause fills away from the trigger.","hn":"Dobara socho. Stop trigger market order ban sakta hai ya venue-specific rules follow kar sakta hai. Fast moves aur gaps mein fill trigger se alag ho sakta hai."}],[{"en":"That risk should be planned","hn":"Risk plan karna chahiye"},{"en":"Not quite. A stop trigger may become a market order or follow venue-specific rules. Fast moves and gaps can cause fills away from the trigger.","hn":"Dobara socho. Stop trigger market order ban sakta hai ya venue-specific rules follow kar sakta hai. Fast moves aur gaps mein fill trigger se alag ho sakta hai."}],[{"en":"The exact execution price","hn":"Exact execution price"},{"en":"Correct. A stop trigger may become a market order or follow venue-specific rules. Fast moves and gaps can cause fills away from the trigger.","hn":"Sahi. Stop trigger market order ban sakta hai ya venue-specific rules follow kar sakta hai. Fast moves aur gaps mein fill trigger se alag ho sakta hai."}]],"a":2},{"k":"mc","q":{"en":"Which inputs are central to position sizing?","hn":"Position sizing mein kaunse inputs central hain?"},"o":[[{"en":"Only conviction","hn":"Sirf conviction"},{"en":"Not quite. Quantity should reflect the risk budget, the absolute distance between entry and stop, contract multiplier and costs.","hn":"Dobara socho. Quantity risk budget, entry aur stop ke absolute distance, contract multiplier aur costs reflect kare."}],[{"en":"Risk budget and absolute distance between entry and stop","hn":"Risk budget aur entry-stop ka absolute distance"},{"en":"Correct. Quantity should reflect the risk budget, the absolute distance between entry and stop, contract multiplier and costs.","hn":"Sahi. Quantity risk budget, entry aur stop ke absolute distance, contract multiplier aur costs reflect kare."}],[{"en":"Only recent win rate","hn":"Sirf recent win rate"},{"en":"Not quite. Quantity should reflect the risk budget, the absolute distance between entry and stop, contract multiplier and costs.","hn":"Dobara socho. Quantity risk budget, entry aur stop ke absolute distance, contract multiplier aur costs reflect kare."}]],"a":1},{"k":"mc","q":{"en":"Does a 1:3 risk-reward ratio imply a 75% win probability?","hn":"Kya 1:3 risk-reward ka matlab 75% win probability hai?"},"o":[[{"en":"Yes, by definition","hn":"Haan, definition se"},{"en":"Not quite. A 1:3 planned ratio does not mean a trade has a 3-in-4 chance of winning. Probability and payoff distribution are separate.","hn":"Dobara socho. 1:3 planned ratio ka matlab 3-in-4 win chance nahi hai. Probability aur payoff distribution alag cheezein hain."}],[{"en":"Only in intraday trades","hn":"Sirf intraday trades mein"},{"en":"Not quite. A 1:3 planned ratio does not mean a trade has a 3-in-4 chance of winning. Probability and payoff distribution are separate.","hn":"Dobara socho. 1:3 planned ratio ka matlab 3-in-4 win chance nahi hai. Probability aur payoff distribution alag cheezein hain."}],[{"en":"No; ratio and win probability are different","hn":"Nahi; ratio aur win probability alag hain"},{"en":"Correct. A 1:3 planned ratio does not mean a trade has a 3-in-4 chance of winning. Probability and payoff distribution are separate.","hn":"Sahi. 1:3 planned ratio ka matlab 3-in-4 win chance nahi hai. Probability aur payoff distribution alag cheezein hain."}]],"a":2},{"k":"mc","q":{"en":"What does leverage change most directly?","hn":"Leverage directly sabse zyada kya badalta hai?"},"o":[[{"en":"Exposure relative to own capital and loss sensitivity","hn":"Own capital ke comparison mein exposure aur loss sensitivity"},{"en":"Correct. Leverage can amplify gains and losses relative to own capital; it does not improve the quality of a trade idea.","hn":"Sahi. Leverage own capital ke comparison mein gains aur losses amplify kar sakta hai; trade idea ki quality improve nahi karta."}],[{"en":"The probability that a prediction is correct","hn":"Prediction sahi hone ki probability"},{"en":"Not quite. Leverage can amplify gains and losses relative to own capital; it does not improve the quality of a trade idea.","hn":"Dobara socho. Leverage own capital ke comparison mein gains aur losses amplify kar sakta hai; trade idea ki quality improve nahi karta."}],[{"en":"The market’s volatility itself","hn":"Market ki volatility khud"},{"en":"Not quite. Leverage can amplify gains and losses relative to own capital; it does not improve the quality of a trade idea.","hn":"Dobara socho. Leverage own capital ke comparison mein gains aur losses amplify kar sakta hai; trade idea ki quality improve nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Why not choose a target only to improve the ratio?","hn":"Sirf ratio improve karne ke liye target kyun nahi choose karein?"},"o":[[{"en":"A larger target guarantees a larger win","hn":"Bada target larger win guarantee karta hai"},{"en":"Not quite. Targets should be tested against structure, volatility, liquidity and realistic costs rather than chosen only to make a ratio look attractive.","hn":"Dobara socho. Target ko structure, volatility, liquidity aur realistic costs ke against test karo; sirf ratio attractive banane ke liye choose mat karo."}],[{"en":"It may be unrealistic and distort the plan","hn":"Woh unrealistic ho sakta hai aur plan distort karega"},{"en":"Correct. Targets should be tested against structure, volatility, liquidity and realistic costs rather than chosen only to make a ratio look attractive.","hn":"Sahi. Target ko structure, volatility, liquidity aur realistic costs ke against test karo; sirf ratio attractive banane ke liye choose mat karo."}],[{"en":"Targets remove execution costs","hn":"Targets execution costs hata dete hain"},{"en":"Not quite. Targets should be tested against structure, volatility, liquidity and realistic costs rather than chosen only to make a ratio look attractive.","hn":"Dobara socho. Target ko structure, volatility, liquidity aur realistic costs ke against test karo; sirf ratio attractive banane ke liye choose mat karo."}]],"a":1},{"k":"mc","q":{"en":"What should be compared after a trade?","hn":"Trade ke baad kya compare karna chahiye?"},"o":[[{"en":"Only whether the candle was green","hn":"Sirf candle green thi ya nahi"},{"en":"Not quite. Record the planned stop, actual exit, slippage and reason for deviation. Repeated gaps or execution issues may require smaller size or a different instrument.","hn":"Dobara socho. Planned stop, actual exit, slippage aur deviation ka reason record karo. Repeated gaps ya execution issue par smaller size ya different instrument chahiye ho sakta hai."}],[{"en":"Only the headline target","hn":"Sirf headline target"},{"en":"Not quite. Record the planned stop, actual exit, slippage and reason for deviation. Repeated gaps or execution issues may require smaller size or a different instrument.","hn":"Dobara socho. Planned stop, actual exit, slippage aur deviation ka reason record karo. Repeated gaps ya execution issue par smaller size ya different instrument chahiye ho sakta hai."}],[{"en":"Planned risk versus realised outcome and execution","hn":"Planned risk vs realised outcome aur execution"},{"en":"Correct. Record the planned stop, actual exit, slippage and reason for deviation. Repeated gaps or execution issues may require smaller size or a different instrument.","hn":"Sahi. Planned stop, actual exit, slippage aur deviation ka reason record karo. Repeated gaps ya execution issue par smaller size ya different instrument chahiye ho sakta hai."}]],"a":2},{"k":"end"}];
UNITS.x24=[{"k":"info","t":{"en":"Start with a fixed risk budget","hn":"Fixed risk budget se start karo"},"hook":{"en":"What should be decided before quantity?","hn":"Quantity se pehle kya decide karna chahiye?"},"story":{"en":"A ₹50,000 account uses a hypothetical ₹500 risk budget, then calculates quantity from stop distance.","hn":"₹50,000 account hypothetical ₹500 risk budget use karta hai, phir stop distance se quantity calculate hoti hai."},"s":{"en":"Choose a rupee amount or small portfolio fraction you can tolerate losing on one trade before calculating quantity.","hn":"Quantity calculate karne se pehle ek trade par tolerate karne layak rupee amount ya portfolio ka chhota fraction choose karo."},"p":{"en":"Sizing formulas are planning aids. Contract specifications, gaps, costs, margin rules and correlated positions can make realised risk larger.","hn":"Sizing formulas planning aids hain. Contract specs, gaps, costs, margin rules aur correlated positions actual risk badha sakte hain."},"think":{"en":"What should be decided before quantity?","hn":"Quantity se pehle kya decide karna chahiye?"},"reveal":{"en":"Risk budget","hn":"Risk budget"}},{"k":"info","t":{"en":"Use absolute entry-stop distance","hn":"Entry-stop ka absolute distance use karo"},"hook":{"en":"Entry ₹120 and stop ₹116: what is the absolute distance?","hn":"Entry ₹120 aur stop ₹116: absolute distance kitna hai?"},"story":{"en":"Entry ₹120 and stop ₹116 gives a ₹4 distance per share before costs.","hn":"Entry ₹120 aur stop ₹116 ho toh costs se pehle ₹4 per-share distance hai."},"s":{"en":"For a simple linear instrument, use the absolute distance between entry and stop as the starting per-unit risk, then adjust for multiplier and costs.","hn":"Simple linear instrument mein per-unit planned risk entry aur stop ke absolute distance se start hota hai, multiplier aur costs adjust karke."},"p":{"en":"Sizing formulas are planning aids. Contract specifications, gaps, costs, margin rules and correlated positions can make realised risk larger.","hn":"Sizing formulas planning aids hain. Contract specs, gaps, costs, margin rules aur correlated positions actual risk badha sakte hain."},"think":{"en":"Entry ₹120 and stop ₹116: what is the absolute distance?","hn":"Entry ₹120 aur stop ₹116: absolute distance kitna hai?"},"reveal":{"en":"₹4","hn":"₹4"}},{"k":"info","t":{"en":"Quantity depends on per-unit risk","hn":"Quantity per-unit risk par depend karti hai"},"hook":{"en":"With ₹600 risk budget and ₹3 per-unit risk, what is the simple quantity?","hn":"₹600 risk budget aur ₹3 per-unit risk par simple quantity kya hai?"},"story":{"en":"₹600 budget divided by ₹3 planned risk per share suggests 200 shares before costs and constraints.","hn":"₹600 budget ko ₹3 per-share planned risk se divide karne par costs/constraints se pehle 200 shares ka estimate aata hai."},"s":{"en":"A simple estimate is risk budget divided by per-unit risk. Derivatives need contract multipliers and instrument-specific payoff/risk treatment.","hn":"Simple estimate risk budget divided by per-unit risk hai. Derivatives mein contract multiplier aur instrument-specific risk treatment chahiye."},"p":{"en":"Sizing formulas are planning aids. Contract specifications, gaps, costs, margin rules and correlated positions can make realised risk larger.","hn":"Sizing formulas planning aids hain. Contract specs, gaps, costs, margin rules aur correlated positions actual risk badha sakte hain."},"think":{"en":"With ₹600 risk budget and ₹3 per-unit risk, what is the simple quantity?","hn":"₹600 risk budget aur ₹3 per-unit risk par simple quantity kya hai?"},"reveal":{"en":"200 units","hn":"200 units"}},{"k":"info","t":{"en":"A stop distance does not cap every loss","hn":"Stop distance har loss ko cap nahi karta"},"hook":{"en":"Why can realised loss exceed planned stop risk?","hn":"Realised loss planned stop risk se zyada kyun ho sakta hai?"},"story":{"en":"A stock opens below the stop; the fill is much worse than the pl UNITS.x25=[{"k":"info","t":{"en":"Loss aversion can distort decisions","hn":"Loss aversion decisions distort kar sakta hai"},"hook":{"en":"What is loss aversion?","hn":"Loss aversion kya hai?"},"story":{"en":"A trader refuses to exit a losing position only to avoid admitting a loss.","hn":"Trader loss accept karne se bachne ke liye losing position exit nahi karta."},"s":{"en":"Loss aversion describes how a loss may feel more painful than an equivalent gain feels rewarding, encouraging poor holding or exit decisions.","hn":"Loss aversion mein equivalent gain ke muqable loss zyada painful lag sakta hai, jisse poor holding/exit decisions ho sakte hain."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"What is loss aversion?","hn":"Loss aversion kya hai?"},"reveal":{"en":"A loss feels more painful than an equivalent gain feels good","hn":"Equivalent gain ki khushi se loss ka dard zyada lagna"}},{"k":"info","t":{"en":"FOMO creates late entries","hn":"FOMO late entries create karta hai"},"hook":{"en":"What is a sensible response to FOMO?","hn":"FOMO ka sensible response kya hai?"},"story":{"en":"A stock has already surged; a trader enters because others are posting gains.","hn":"Stock pehle hi surge kar chuka; doosron ke gains post karne par trader entry leta hai."},"s":{"en":"Fear of missing out can push someone to chase a move without a valid trigger or planned risk.","hn":"FOMO kisi ko valid trigger ya planned risk ke bina move chase karne par push kar sakta hai."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"What is a sensible response to FOMO?","hn":"FOMO ka sensible response kya hai?"},"reveal":{"en":"Wait for the predefined setup or skip the trade","hn":"Predefined setup ka wait karo ya trade skip karo"}},{"k":"info","t":{"en":"Confirmation bias filters evidence","hn":"Confirmation bias evidence filter karta hai"},"hook":{"en":"Which action helps counter confirmation bias?","hn":"Confirmation bias counter karne mein kya help karta hai?"},"story":{"en":"A bullish trader reads only positive news and ignores a failed price level.","hn":"Bullish trader sirf positive news padhta hai aur failed price level ignore karta hai."},"s":{"en":"Confirmation bias favours information supporting an existing view and discounts conflicting evidence.","hn":"Confirmation bias apne existing view ko support karne wali information ko favour karta hai aur conflicting evidence discount karta hai."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"Which action helps counter confirmation bias?","hn":"Confirmation bias counter karne mein kya help karta hai?"},"reveal":{"en":"Write down evidence that would disprove the view","hn":"View ko galat sabit karne wala evidence likho"}},{"k":"info","t":{"en":"Revenge trading follows emotional loss","hn":"Revenge trading emotional loss ke baad hoti hai"},"hook":{"en":"What is the safer response after a rule-breaking emotional trade?","hn":"Rule-breaking emotional trade ke baad safer response kya hai?"},"story":{"en":"After a loss, a trader immediately doubles quantity without a fresh setup.","hn":"Loss ke baad trader fresh setup ke bina quantity double kar deta hai."},"s":{"en":"Revenge trading means taking impulsive trades to recover a loss rather than following the planned setup and risk limits.","hn":"Revenge trading loss recover karne ke liye impulsive trade lena hai, planned setup aur risk limits follow karna nahi."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"What is the safer response after a rule-breaking emotional trade?","hn":"Rule-breaking emotional trade ke baad safer response kya hai?"},"reveal":{"en":"Pause, review and resume only under the written plan","hn":"Pause, review aur written plan ke under hi resume karo"}},{"k":"info","t":{"en":"A checklist reduces impulsive choices","hn":"Checklist impulsive choices reduce karti hai"},"hook":{"en":"What is a useful checklist purpose?","hn":"Checklist ka useful purpose kya hai?"},"story":{"en":"A trader skips a trade because the risk budget is exceeded, even though the chart looks exciting.","hn":"Chart exciting lagne ke bawajood trader trade skip karta hai kyunki risk budget exceed hai."},"s":{"en":"A pre-trade checklist can ask whether the setup is valid, risk is within budget, liquidity is acceptable and the exit is defined.","hn":"Pre-trade checklist check kar sakti hai setup valid hai, risk budget mein hai, liquidity acceptable hai aur exit defined hai."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"What is a useful checklist purpose?","hn":"Checklist ka useful purpose kya hai?"},"reveal":{"en":"Apply the same risk rules before acting","hn":"Action se pehle same risk rules apply karna"}},{"k":"info","t":{"en":"Separate confidence from evidence","hn":"Confidence aur evidence alag rakho"},"hook":{"en":"Should high confidence override a missing setup trigger?","hn":"Kya high confidence missing setup trigger ko override karna chahiye?"},"story":{"en":"A trader feels sure after several wins but the next setup does not meet the written criteria.","hn":"Kai wins ke baad trader sure feel karta hai par next setup written criteria meet nahi karta."},"s":{"en":"Confidence is not evidence. Require observable conditions and predefined invalidation rather than changing rules because a trade feels certain.","hn":"Confidence evidence nahi hai. Trade certain feel hone par rules badalne ke bajay observable conditions aur predefined invalidation require karo."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"Should high confidence override a missing setup trigger?","hn":"Kya high confidence missing setup trigger ko override karna chahiye?"},"reveal":{"en":"No; follow the predefined conditions","hn":"Nahi; predefined conditions follow karo"}},{"k":"info","t":{"en":"Use a cooling-off rule","hn":"Cooling-off rule use karo"},"hook":{"en":"Why define a cooling-off rule in advance?","hn":"Cooling-off rule pehle kyun define karein?"},"story":{"en":"The plan says to stop trading for the session after two rule violations.","hn":"Plan kehta hai do rule violations ke baad session ke liye trading stop."},"s":{"en":"A pause after a large loss, rule violation or strong emotional response can prevent impulsive decisions. Define the trigger in advance.","hn":"Large loss, rule violation ya strong emotion ke baad pause impulsive decision rok sakta hai. Trigger pehle define karo."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"Why define a cooling-off rule in advance?","hn":"Cooling-off rule pehle kyun define karein?"},"reveal":{"en":"It limits decisions made in an emotional state","hn":"Emotional state mein decisions limit karta hai"}},{"k":"info","t":{"en":"Review behaviour without hiding losses","hn":"Loss chhupaye bina behaviour review karo"},"hook":{"en":"What makes a behaviour review credible?","hn":"Behaviour review credible kya banata hai?"},"story":{"en":"A trader records only winning trades and concludes the setup is reliable.","hn":"Trader sirf winning trades record karke setup reliable conclude karta hai."},"s":{"en":"Record wins and losses, plan adherence, emotions and mistakes consistently. Selective records create misleading conclusions.","hn":"Wins/losses, plan adherence, emotions aur mistakes consistently record karo. Selective records misleading conclusions dete hain."},"p":{"en":"Behavioural biases are common. Use written rules and review patterns; do not treat psychology labels as diagnoses.","hn":"Behavioural biases common hain. Written rules aur pattern review use karo; psychology labels ko diagnosis mat samjho."},"think":{"en":"What makes a behaviour review credible?","hn":"Behaviour review credible kya banata hai?"},"reveal":{"en":"Complete and consistent records","hn":"Complete aur consistent records"}},{"k":"mc","q":{"en":"What is loss aversion?","hn":"Loss aversion kya hai?"},"o":[[{"en":"Believing every trade is independent","hn":"Har trade independent hai maanna"},{"en":"Not quite. Loss aversion describes how a loss may feel more painful than an equivalent gain feels rewarding, encouraging poor holding or exit decisions.","hn":"Dobara socho. Loss aversion mein equivalent gain ke muqable loss zyada painful lag sakta hai, jisse poor holding/exit decisions ho sakte hain."}],[{"en":"A loss feels more painful than an equivalent gain feels good","hn":"Equivalent gain ki khushi se loss ka dard zyada lagna"},{"en":"Correct. Loss aversion describes how a loss may feel more painful than an equivalent gain feels rewarding, encouraging poor holding or exit decisions.","hn":"Sahi. Loss aversion mein equivalent gain ke muqable loss zyada painful lag sakta hai, jisse poor holding/exit decisions ho sakte hain."}],[{"en":"Buying only low-priced shares","hn":"Sirf low-price shares buy karna"},{"en":"Not quite. Loss aversion describes how a loss may feel more painful than an equivalent gain feels rewarding, encouraging poor holding or exit decisions.","hn":"Dobara socho. Loss aversion mein equivalent gain ke muqable loss zyada painful lag sakta hai, jisse poor holding/exit decisions ho sakte hain."}]],"a":1},{"k":"mc","q":{"en":"What is a sensible response to FOMO?","hn":"FOMO ka sensible response kya hai?"},"o":[[{"en":"Wait for the predefined setup or skip the trade","hn":"Predefined setup ka wait karo ya trade skip karo"},{"en":"Correct. Fear of missing out can push someone to chase a move without a valid trigger or planned risk.","hn":"Sahi. FOMO kisi ko valid trigger ya planned risk ke bina move chase karne par push kar sakta hai."}],[{"en":"Double size to catch up","hn":"Catch up karne ke liye size double karo"},{"en":"Not quite. Fear of missing out can push someone to chase a move without a valid trigger or planned risk.","hn":"Dobara socho. FOMO kisi ko valid trigger ya planned risk ke bina move chase karne par push kar sakta hai."}],[{"en":"Remove the stop","hn":"Stop hata do"},{"en":"Not quite. Fear of missing out can push someone to chase a move without a valid trigger or planned risk.","hn":"Dobara socho. FOMO kisi ko valid trigger ya planned risk ke bina move chase karne par push kar sakta hai."}]],"a":0},{"k":"mc","q":{"en":"Which action helps counter confirmation bias?","hn":"Confirmation bias counter karne mein kya help karta hai?"},"o":[[{"en":"Read only supportive opinions","hn":"Sirf supportive opinions padho"},{"en":"Not quite. Confirmation bias favours information supporting an existing view and discounts conflicting evidence.","hn":"Dobara socho. Confirmation bias apne existing view ko support karne wali information ko favour karta hai aur conflicting evidence discount karta hai."}],[{"en":"Increase conviction after every post","hn":"Har post ke baad conviction badhao"},{"en":"Not quite. Confirmation bias favours information supporting an existing view and discounts conflicting evidence.","hn":"Dobara socho. Confirmation bias apne existing view ko support karne wali information ko favour karta hai aur conflicting evidence discount karta hai."}],[{"en":"Write down evidence that would disprove the view","hn":"View ko galat sabit karne wala evidence likho"},{"en":"Correct. Confirmation bias favours information supporting an existing view and discounts conflicting evidence.","hn":"Sahi. Confirmation bias apne existing view ko support karne wali information ko favour karta hai aur conflicting evidence discount karta hai."}]],"a":2},{"k":"mc","q":{"en":"What is the safer response after a rule-breaking emotional trade?","hn":"Rule-breaking emotional trade ke baad safer response kya hai?"},"o":[[{"en":"Immediately double the next position","hn":"Next position turant double karo"},{"en":"Not quite. Revenge trading means taking impulsive trades to recover a loss rather than following the planned setup and risk limits.","hn":"Dobara socho. Revenge trading loss recover karne ke liye impulsive trade lena hai, planned setup aur risk limits follow karna nahi."}],[{"en":"Pause, review and resume only under the written plan","hn":"Pause, review aur written plan ke under hi resume karo"},{"en":"Correct. Revenge trading means taking impulsive trades to recover a loss rather than following the planned setup and risk limits.","hn":"Sahi. Revenge trading loss recover karne ke liye impulsive trade lena hai, planned setup aur risk limits follow karna nahi."}],[{"en":"Remove journaling for the day","hn":"Aaj journal karna band karo"},{"en":"Not quite. Revenge trading means taking impulsive trades to recover a loss rather than following the planned setup and risk limits.","hn":"Dobara socho. Revenge trading loss recover karne ke liye impulsive trade lena hai, planned setup aur risk limits follow karna nahi."}]],"a":1},{"k":"mc","q":{"en":"What is a useful checklist purpose?","hn":"Checklist ka useful purpose kya hai?"},"o":[[{"en":"Predict every market move","hn":"Har market move predict karna"},{"en":"Not quite. A pre-trade checklist can ask whether the setup is valid, risk is within budget, liquidity is acceptable and the exit is defined.","hn":"Dobara socho. Pre-trade checklist check kar sakti hai setup valid hai, risk budget mein hai, liquidity acceptable hai aur exit defined hai."}],[{"en":"Ensure every trade wins","hn":"Har trade win karwana"},{"en":"Not quite. A pre-trade checklist can ask whether the setup is valid, risk is within budget, liquidity is acceptable and the exit is defined.","hn":"Dobara socho. Pre-trade checklist check kar sakti hai setup valid hai, risk budget mein hai, liquidity acceptable hai aur exit defined hai."}],[{"en":"Apply the same risk rules before acting","hn":"Action se pehle same risk rules apply karna"},{"en":"Correct. A pre-trade checklist can ask whether the setup is valid, risk is within budget, liquidity is acceptable and the exit is defined.","hn":"Sahi. Pre-trade checklist check kar sakti hai setup valid hai, risk budget mein hai, liquidity acceptable hai aur exit defined hai."}]],"a":2},{"k":"mc","q":{"en":"Should high confidence override a missing setup trigger?","hn":"Kya high confidence missing setup trigger ko override karna chahiye?"},"o":[[{"en":"No; follow the predefined conditions","hn":"Nahi; predefined conditions follow karo"},{"en":"Correct. Confidence is not evidence. Require observable conditions and predefined invalidation rather than changing rules because a trade feels certain.","hn":"Sahi. Confidence evidence nahi hai. Trade certain feel hone par rules badalne ke bajay observable conditions aur predefined invalidation require karo."}],[{"en":"Yes, if recent trades won","hn":"Haan, agar recent trades win hue"},{"en":"Not quite. Confidence is not evidence. Require observable conditions and predefined invalidation rather than changing rules because a trade feels certain.","hn":"Dobara socho. Confidence evidence nahi hai. Trade certain feel hone par rules badalne ke bajay observable conditions aur predefined invalidation require karo."}],[{"en":"Only with extra leverage","hn":"Sirf extra leverage ke saath"},{"en":"Not quite. Confidence is not evidence. Require observable conditions and predefined invalidation rather than changing rules because a trade feels certain.","hn":"Dobara socho. Confidence evidence nahi hai. Trade certain feel hone par rules badalne ke bajay observable conditions aur predefined invalidation require karo."}]],"a":0},{"k":"mc","q":{"en":"Why define a cooling-off rule in advance?","hn":"Cooling-off rule pehle kyun define karein?"},"o":[[{"en":"It guarantees a profitable next trade","hn":"Next trade profitable guarantee karta hai"},{"en":"Not quite. A pause after a large loss, rule violation or strong emotional response can prevent impulsive decisions. Define the trigger in advance.","hn":"Dobara socho. Large loss, rule violation ya strong emotion ke baad pause impulsive decision rok sakta hai. Trigger pehle define karo."}],[{"en":"It limits decisions made in an emotional state","hn":"Emotional state mein decisions limit karta hai"},{"en":"Correct. A pause after a large loss, rule violation or strong emotional response can prevent impulsive decisions. Define the trigger in advance.","hn":"Sahi. Large loss, rule violation ya strong emotion ke baad pause impulsive decision rok sakta hai. Trigger pehle define karo."}],[{"en":"It removes all uncertainty","hn":"Saari uncertainty hata deta hai"},{"en":"Not quite. A pause after a large loss, rule violation or strong emotional response can prevent impulsive decisions. Define the trigger in advance.","hn":"Dobara socho. Large loss, rule violation ya strong emotion ke b i hain. Documented limits, backoff ke saath bounded retries aur appropriate caching use karo; uncontrolled loops outage badha sakte hain."}],[{"en":"Back off and retry within documented limits","hn":"Back off karke documented limits mein retry"},{"en":"Correct. APIs may throttle requests. Use documented limits, bounded retries with backoff and caching where appropriate; uncontrolled loops can worsen outages.","hn":"Sahi. API requests throttle kar sakti hain. Documented limits, backoff ke saath bounded retries aur appropriate caching use karo; uncontrolled loops outage badha sakte hain."}]],"a":2},{"k":"mc","q":{"en":"Why check order status after a timeout?","hn":"Timeout ke baad order status kyun check karein?"},"o":[[{"en":"A timeout proves the order was rejected","hn":"Timeout prove karta hai order reject hua"},{"en":"Not quite. A request acknowledgement is not the same as a filled order. Track order IDs and reconcile pending, partial, rejected, cancelled and filled states.","hn":"Dobara socho. Request acknowledgement filled order ke barabar nahi. Order IDs track karo aur pending, partial, rejected, cancelled, filled states reconcile karo."}],[{"en":"The first order may have reached the broker despite no response","hn":"Response na aaye tab bhi first order broker tak pahunch sakta hai"},{"en":"Correct. A request acknowledgement is not the same as a filled order. Track order IDs and reconcile pending, partial, rejected, cancelled and filled states.","hn":"Sahi. Request acknowledgement filled order ke barabar nahi. Order IDs track karo aur pending, partial, rejected, cancelled, filled states reconcile karo."}],[{"en":"Order IDs are not useful","hn":"Order IDs useful nahi"},{"en":"Not quite. A request acknowledgement is not the same as a filled order. Track order IDs and reconcile pending, partial, rejected, cancelled and filled states.","hn":"Dobara socho. Request acknowledgement filled order ke barabar nahi. Order IDs track karo aur pending, partial, rejected, cancelled, filled states reconcile karo."}]],"a":1},{"k":"mc","q":{"en":"What problem does duplicate protection address?","hn":"Duplicate protection kaunsa problem address karti hai?"},"o":[[{"en":"Missing chart labels","hn":"Chart labels missing hona"},{"en":"Not quite. Where supported, use client order IDs or idempotency mechanisms and reconcile state to prevent duplicate orders after retries.","hn":"Dobara socho. Jahan supported ho client order IDs/idempotency use karo aur retries ke baad duplicate orders rokne ke liye state reconcile karo."}],[{"en":"Lowering exchange fees","hn":"Exchange fees kam karna"},{"en":"Not quite. Where supported, use client order IDs or idempotency mechanisms and reconcile state to prevent duplicate orders after retries.","hn":"Dobara socho. Jahan supported ho client order IDs/idempotency use karo aur retries ke baad duplicate orders rokne ke liye state reconcile karo."}],[{"en":"Repeated submission of the same order intent","hn":"Same order intent baar-baar submit hona"},{"en":"Correct. Where supported, use client order IDs or idempotency mechanisms and reconcile state to prevent duplicate orders after retries.","hn":"Sahi. Jahan supported ho client order IDs/idempotency use karo aur retries ke baad duplicate orders rokne ke liye state reconcile karo."}]],"a":2},{"k":"mc","q":{"en":"What should precede live order automation?","hn":"Live order automation se pehle kya hona chahiye?"},"o":[[{"en":"Sandbox/paper testing and failure-case checks","hn":"Sandbox/paper testing aur failure-case checks"},{"en":"Correct. Test request formats, error handling, partial fills and cancellation behaviour in a sandbox or paper environment before live access.","hn":"Sahi. Live access se pehle sandbox/paper environment mein request format, error handling, partial fills aur cancellation behaviour test karo."}],[{"en":"Only a successful login","hn":"Sirf successful login"},{"en":"Not quite. Test request formats, error handling, partial fills and cancellation behaviour in a sandbox or paper environment before live access.","hn":"Dobara socho. Live access se pehle sandbox/paper environment mein request format, error handling, partial fills aur cancellation behaviour test karo."}],[{"en":"A larger live order","hn":"Bada live order"},{"en":"Not quite. Test request formats, error handling, partial fills and cancellation behaviour in a sandbox or paper environment before live access.","hn":"Dobara socho. Live access se pehle sandbox/paper environment mein request format, error handling, partial fills aur cancellation behaviour test karo."}]],"a":0},{"k":"mc","q":{"en":"What is least privilege?","hn":"Least privilege kya hai?"},"o":[[{"en":"Give every script full account access","hn":"Har script ko full account access dena"},{"en":"Not quite. Grant only required permissions; separate development and production credentials, and avoid enabling order permissions for a data-only tool.","hn":"Dobara socho. Sirf required permissions do; dev aur production credentials alag rakho, data-only tool ke liye order permissions enable mat karo."}],[{"en":"Grant only the permissions needed for the task","hn":"Task ke liye sirf required permissions dena"},{"en":"Correct. Grant only required permissions; separate development and production credentials, and avoid enabling order permissions for a data-only tool.","hn":"Sahi. Sirf required permissions do; dev aur production credentials alag rakho, data-only tool ke liye order permissions enable mat karo."}],[{"en":"Use one key for every environment","hn":"Har environment mein ek hi key use karna"},{"en":"Not quite. Grant only required permissions; separate development and production credentials, and avoid enabling order permissions for a data-only tool.","hn":"Dobara socho. Sirf required permissions do; dev aur production credentials alag rakho, data-only tool ke liye order permissions enable mat karo."}]],"a":1},{"k":"mc","q":{"en":"What should a safe API log avoid?","hn":"Safe API log ko kya avoid karna chahiye?"},"o":[[{"en":"Request IDs and status codes","hn":"Request IDs aur status codes"},{"en":"Not quite. Log timestamps, request IDs, status codes and non-sensitive diagnostics. Do not log full secrets, passwords or unnecessary personal/account data.","hn":"Dobara socho. Timestamp, request ID, status code aur non-sensitive diagnostics log karo. Full secrets, passwords ya unnecessary personal/account data log mat karo."}],[{"en":"Failure timestamps","hn":"Failure timestamps"},{"en":"Not quite. Log timestamps, request IDs, status codes and non-sensitive diagnostics. Do not log full secrets, passwords or unnecessary personal/account data.","hn":"Dobara socho. Timestamp, request ID, status code aur non-sensitive diagnostics log karo. Full secrets, passwords ya unnecessary personal/account data log mat karo."}],[{"en":"Full secrets and unnecessary sensitive data","hn":"Full secrets aur unnecessary sensitive data"},{"en":"Correct. Log timestamps, request IDs, status codes and non-sensitive diagnostics. Do not log full secrets, passwords or unnecessary personal/account data.","hn":"Sahi. Timestamp, request ID, status code aur non-sensitive diagnostics log karo. Full secrets, passwords ya unnecessary personal/account data log mat karo."}]],"a":2},{"k":"end"}];

ical spread mein strike width expiry par maximum spread value determine karne mein help karti hai. Lot size rupee outcomes scale karta hai."}]],"a":1},{"k":"mc","q":{"en":"What is a risk when legs do not fill together?","hn":"Legs ek saath fill na hon toh kya risk hai?"},"o":[[{"en":"Guaranteed lower fees","hn":"Guaranteed lower fees"},{"en":"Not quite. If legs fill at different times or prices, the position can temporarily carry unintended exposure. Spread orders may reduce but not eliminate execution risk.","hn":"Dobara socho. Legs alag time ya price par fill hon toh position temporarily unintended exposure le sakti hai. Spread order execution risk reduce kar sakta hai, eliminate nahi."}],[{"en":"Automatic risk elimination","hn":"Automatic risk elimination"},{"en":"Not quite. If legs fill at different times or prices, the position can temporarily carry unintended exposure. Spread orders may reduce but not eliminate execution risk.","hn":"Dobara socho. Legs alag time ya price par fill hon toh position temporarily unintended exposure le sakti hai. Spread order execution risk reduce kar sakta hai, eliminate nahi."}],[{"en":"Temporary unintended exposure","hn":"Temporary unintended exposure"},{"en":"Correct. If legs fill at different times or prices, the position can temporarily carry unintended exposure. Spread orders may reduce but not eliminate execution risk.","hn":"Sahi. Legs alag time ya price par fill hon toh position temporarily unintended exposure le sakti hai. Spread order execution risk reduce kar sakta hai, eliminate nahi."}]],"a":2},{"k":"mc","q":{"en":"A ₹2 per-unit payoff on lot size 25 equals what gross amount?","hn":"Lot size 25 par ₹2 per-unit payoff ka gross amount kya hai?"},"o":[[{"en":"₹50","hn":"₹50"},{"en":"Correct. Multiply per-unit payoff by lot size and account for premiums, bid-ask spread, brokerage, taxes and slippage.","hn":"Sahi. Per-unit payoff ko lot size se multiply karo aur premiums, bid-ask spread, brokerage, taxes aur slippage account karo."}],[{"en":"₹2","hn":"₹2"},{"en":"Not quite. Multiply per-unit payoff by lot size and account for premiums, bid-ask spread, brokerage, taxes and slippage.","hn":"Dobara socho. Per-unit payoff ko lot size se multiply karo aur premiums, bid-ask spread, brokerage, taxes aur slippage account karo."}],[{"en":"₹500","hn":"₹500"},{"en":"Not quite. Multiply per-unit payoff by lot size and account for premiums, bid-ask spread, brokerage, taxes and slippage.","hn":"Dobara socho. Per-unit payoff ko lot size se multiply karo aur premiums, bid-ask spread, brokerage, taxes aur slippage account karo."}]],"a":0},{"k":"mc","q":{"en":"Why review contract and settlement rules before a spread?","hn":"Spread se pehle contract aur settlement rules kyun review karein?"},"o":[[{"en":"All brokers settle every option identically","hn":"Sab brokers har option same settle karte hain"},{"en":"Not quite. Exercise style, assignment, settlement method, expiry timing and broker risk policies can affect multi-leg positions; verify current contract specifications.","hn":"Dobara socho. Exercise style, assignment, settlement method, expiry timing aur broker risk policy multi-leg positions affect kar sakte hain; current contract specs verify karo."}],[{"en":"Legs may have operational outcomes that affect exposure","hn":"Legs ke operational outcomes exposure affect kar sakte hain"},{"en":"Correct. Exercise style, assignment, settlement method, expiry timing and broker risk policies can affect multi-leg positions; verify current contract specifications.","hn":"Sahi. Exercise style, assignment, settlement method, expiry timing aur broker risk policy multi-leg positions affect kar sakte hain; current contract specs verify karo."}],[{"en":"Settlement rules never change","hn":"Settlement rules kabhi change nahi hote"},{"en":"Not quite. Exercise style, assignment, settlement method, expiry timing and broker risk policies can affect multi-leg positions; verify current contract specifications.","hn":"Dobara socho. Exercise style, assignment, settlement method, expiry timing aur broker risk policy multi-leg positions affect kar sakte hain; current contract specs verify karo."}]],"a":1},{"k":"mc","q":{"en":"What does a payoff diagram not guarantee?","hn":"Payoff diagram kya guarantee nahi karta?"},"o":[[{"en":"The arithmetic under stated assumptions","hn":"Stated assumptions ke under arithmetic"},{"en":"Not quite. Evaluate payoff at several underlying prices, volatility/time scenarios where relevant, and adverse execution assumptions. A diagram does not predict the path.","hn":"Dobara socho. Several underlying prices, relevant volatility/time scenarios aur adverse execution assumptions par payoff evaluate karo. Diagram price path predict nahi karta."}],[{"en":"The chosen strike width","hn":"Chosen strike width"},{"en":"Not quite. Evaluate payoff at several underlying prices, volatility/time scenarios where relevant, and adverse execution assumptions. A diagram does not predict the path.","hn":"Dobara socho. Several underlying prices, relevant volatility/time scenarios aur adverse execution assumptions par payoff evaluate karo. Diagram price path predict nahi karta."}],[{"en":"The path, interim mark-to-market or actual execution","hn":"Price path, interim mark-to-market ya actual execution"},{"en":"Correct. Evaluate payoff at several underlying prices, volatility/time scenarios where relevant, and adverse execution assumptions. A diagram does not predict the path.","hn":"Sahi. Several underlying prices, relevant volatility/time scenarios aur adverse execution assumptions par payoff evaluate karo. Diagram price path predict nahi karta."}]],"a":2},{"k":"end"}];
UNITS.x31=[{"k":"info","t":{"en":"Define the hypothesis before testing","hn":"Test se pehle hypothesis define karo"},"hook":{"en":"Why define a strategy hypothesis before testing?","hn":"Testing se pehle strategy hypothesis kyun define karein?"},"story":{"en":"A written hypothesis prevents changing the rule after seeing which version performed best historically.","hn":"Written hypothesis historical best version dekhne ke baad rule badalne se bachata hai."},"s":{"en":"State the rule, universe, timeframe, entry, exit, sizing and evaluation metrics before looking for the best result.","hn":"Best result dhoondhne se pehle rule, universe, timeframe, entry, exit, sizing aur evaluation metrics state karo."},"p":{"en":"Backtests are simulations. Prevent look-ahead and survivorship bias, include realistic costs and validate out-of-sample before drawing conclusions.","hn":"Backtest simulation hai. Look-ahead aur survivorship bias roko, realistic costs include karo aur conclusions se pehle out-of-sample validate karo."},"think":{"en":"Why define a strategy hypothesis before testing?","hn":"Testing se pehle strategy hypothesis kyun define karein?"},"reveal":{"en":"To reduce result-driven rule changes","hn":"Result dekhkar rules badalne ko reduce karna"}},{"k":"info","t":{"en":"Look-ahead bias uses future information","hn":"Look-ahead bias future information use karta hai"},"hook":{"en":"What is look-ahead bias?","hn":"Look-ahead bias kya hai?"},"story":{"en":"A signal uses the day’s final high before that day’s close has occurred.","hn":"Signal din ka final high use karta hai jabki us din ka close abhi hua hi nahi."},"s":{"en":"A backtest has look-ahead bias when a signal uses information unavailable at that historical decision time.","hn":"Jab signal historical decision time par unavailable information use karta hai toh backtest mein look-ahead bias hota hai."},"p":{"en":"Backtests are simulations. Prevent look-ahead and survivorship bias, include realistic costs and validate out-of-sample before drawing conclusions.","hn":"Backtest simulation hai. Look-ahead aur survivorship bias roko, realistic costs include karo aur conclusions se pehle out-of-sample validate karo."},"think":{"en":"What is look-ahead bias?","hn":"Look-ahead bias kya hai?"},"reveal":{"en":"Using future/unavailable information in a historical decision","hn":"Historical decision mein future/unavailable information use karna"}},{"k":"info","t":{"en":"Survivorship bias omits failures","hn":"Survivorship bias failures omit karta hai"},"hook":{"en":"What causes survivorship bias?","hn":"Survivorship bias kis se hota hai?"},"story":{"en":"Testing today’s index members over the whole past ignores companies that were removed after poor outcomes.","hn":"Aaj ke index members ko poore past par test karna poor outcomes ke baad removed companies ignore karta hai."},"s":{"en":"A universe made only of current survivors may omit delisted or failed companies, overstating historical performance.","hn":"Sirf current surviving companies ka universe delisted ya failed companies omit kar sakta hai aur historical performance overstate hoti hai."},"p":{"en":"Backtests are simulations. Prevent look-ahead and survivorship bias, include realistic costs and validate out-of-sample before drawing conclusions.","hn":"Backtest simulation hai. Look-ahead aur survivorship bias roko, realistic costs include karo aur conclusions se pehle out-of-sample validate karo."},"think":{"en":"What causes survivorship bias?","hn":"Survivorship bias kis se hota hai?"},"reveal":{"en":"Omitting failed or delisted members from historical data","hn":"Historical data se failed/delisted members omit karna"}},{"k":"info","t":{"en":"Use out-of-sample validation","hn":"Out-of-sample validation use karo"},"hook":{"en":"What is the purpose of out-of-sample testing?","hn":"Out-of-sample testing ka purpose kya hai?"},"story":{"en":"A rule is tuned on one period and evaluated on a later unseen period.","hn":"Rule ek period par tune aur later unseen period par evaluate hota hai."},"s":{"en":"Separate data used to develop a strategy from data used to evaluate it. Out-of-sample performance can still fail in future regimes.","hn":"Strategy develop karne wale data ko evaluation data se separate karo. Out-of-sample performance future regimes mein phir bhi fail ho sakti hai."},"p":{"en":"Backtests are simulations. Prevent look-ahead and survivorship bias, include realistic costs and validate out-of-sample before drawing conclusions.","hn":"Backtest simulation hai. Look-ahead aur survivorship bias roko, realistic costs include karo aur conclusions se pehle out-of-sample validate karo."},"think":{"en":"What is the purpose of out-of-sample testing?","hn":"Out-of-sample testing ka purpose kya hai?"},"reveal":{"en":"Evaluate performance on data not used to tune the rule","hn":"Rule tune karne mein use na hue data par performance evaluate karna"}},{"k":"info","t":{"en":"Include costs and realistic fills","hn":"Costs aur realistic fills include karo"},"hook":{"en":"What can happen if backtest costs are omitted?","hn":"Backtest costs omit karne par kya ho sakta hai?"},"story":{"en":"A strategy’s gross edge disappears once realistic spread and fees are included.","hn":"Realistic spread aur fees include karne par strategy ka gross edge disappear ho jata hai."},"s":{"en":"Model spread, commissions, taxes where applicable, slippage, market impact, latency and partial/rejected fills as appropriate.","hn":"Appropriate ho toh spread, commission, applicable taxes, slippage, market impact, latency aur partial/rejected fills model karo."},"p":{"en":"Backtests are simulations. Prevent look-ahead and survivorship bias, include realistic costs and validate out-of-sample before drawing conclusions.","hn":"Backtest simulation hai. Look-ahead aur survivorship bias roko, realistic costs include karo aur conclusions se pehle out-of-sample validate karo."},"think":{"en":"What can happen if backtest costs are omitted?","hn":"Backtest costs omit karne par kya ho sakta hai?"},"reveal":{"en":"Performance may be overstated","hn":"Performance overstate ho sakti hai"}},{"k":"info","t":{"en":"Avoid overfitting parameter searches","hn":"Parameter searches se overfitting se bacho"},"hook":{"en":"What may signal overfitting?","hn":"Overfitting ka signal kya ho sakta hai?"},"story":{"en":"The best parameter set wins historically but small changes destroy its performance.","hn":"Best parameter set historical data par win karta hai par small changes performance destroy kar dete hain."},"s":{"en":"Trying many parameter combinations increases the chance of finding a pattern that fits noise. Prefer rationale, simplicity and robustness checks.","hn":"Bahut parameter combinations try karne se noise fit karne wala pattern milne ka chance badhta hai. Rationale, simplicity aur robustness checks prefer karo."},"p":{"en":"Backtests are simulations. Prevent look-ahead and survivorship bias, include realistic costs and validate out-of-sample before drawing conclusions.","hn":"Backtest simulation hai. Look-ahead aur survivorship bias roko, realistic costs include karo aur conclusions se pehle out-of-sample validate karo."},"think":{"en":"What may signal overfitting?","hn":"Overfitting ka signal kya ho sakta hai?"},"reveal":{"en":"Fragile performance that collapses with small parameter changes","hn":"Small parameter changes se collapse hoti fragile performance"}},{"k":"info","t":{"en":"Use metrics beyond total return","hn":"Total return ke alawa metrics use karo"},"hook":{"en":"Why look beyond cumulative return?","hn":"Cumulative return se aage kyun dekhein?"},"story":{"en":"Two systems earn similar returns but one has much deeper drawdowns and far higher turnover.","hn":"Do systems similar return kamate hain par ek ka drawdown zyada deep aur turnover higher hai."},"s":{"en":"Review drawdown, volatility, exposure, turnover, risk-adjusted measures, trade distribution and capacity, not only cumulative profit.","hn" . A backtest has look-ahead bias when a signal uses information unavailable at that historical decision time.","hn":"Dobara socho. Jab signal historical decision time par unavailable information use karta hai toh backtest mein look-ahead bias hota hai."}]],"a":0},{"k":"mc","q":{"en":"What causes survivorship bias?","hn":"Survivorship bias kis se hota hai?"},"o":[[{"en":"Using a training and test split","hn":"Training aur test split use karna"},{"en":"Not quite. A universe made only of current survivors may omit delisted or failed companies, overstating historical performance.","hn":"Dobara socho. Sirf current surviving companies ka universe delisted ya failed companies omit kar sakta hai aur historical performance overstate hoti hai."}],[{"en":"Recording transaction costs","hn":"Transaction costs record karna"},{"en":"Not quite. A universe made only of current survivors may omit delisted or failed companies, overstating historical performance.","hn":"Dobara socho. Sirf current surviving companies ka universe delisted ya failed companies omit kar sakta hai aur historical performance overstate hoti hai."}],[{"en":"Omitting failed or delisted members from historical data","hn":"Historical data se failed/delisted members omit karna"},{"en":"Correct. A universe made only of current survivors may omit delisted or failed companies, overstating historical performance.","hn":"Sahi. Sirf current surviving companies ka universe delisted ya failed companies omit kar sakta hai aur historical performance overstate hoti hai."}]],"a":2},{"k":"mc","q":{"en":"What is the purpose of out-of-sample testing?","hn":"Out-of-sample testing ka purpose kya hai?"},"o":[[{"en":"Guarantee the next year’s return","hn":"Next year ka return guarantee karna"},{"en":"Not quite. Separate data used to develop a strategy from data used to evaluate it. Out-of-sample performance can still fail in future regimes.","hn":"Dobara socho. Strategy develop karne wale data ko evaluation data se separate karo. Out-of-sample performance future regimes mein phir bhi fail ho sakti hai."}],[{"en":"Evaluate performance on data not used to tune the rule","hn":"Rule tune karne mein use na hue data par performance evaluate karna"},{"en":"Correct. Separate data used to develop a strategy from data used to evaluate it. Out-of-sample performance can still fail in future regimes.","hn":"Sahi. Strategy develop karne wale data ko evaluation data se separate karo. Out-of-sample performance future regimes mein phir bhi fail ho sakti hai."}],[{"en":"Choose the most complex strategy","hn":"Sabse complex strategy choose karna"},{"en":"Not quite. Separate data used to develop a strategy from data used to evaluate it. Out-of-sample performance can still fail in future regimes.","hn":"Dobara socho. Strategy develop karne wale data ko evaluation data se separate karo. Out-of-sample performance future regimes mein phir bhi fail ho sakti hai."}]],"a":1},{"k":"mc","q":{"en":"What can happen if backtest costs are omitted?","hn":"Backtest costs omit karne par kya ho sakta hai?"},"o":[[{"en":"The strategy becomes safer","hn":"Strategy safer ho jaati hai"},{"en":"Not quite. Model spread, commissions, taxes where applicable, slippage, market impact, latency and partial/rejected fills as appropriate.","hn":"Dobara socho. Appropriate ho toh spread, commission, applicable taxes, slippage, market impact, latency aur partial/rejected fills model karo."}],[{"en":"Future execution is guaranteed","hn":"Future execution guarantee hota hai"},{"en":"Not quite. Model spread, commissions, taxes where applicable, slippage, market impact, latency and partial/rejected fills as appropriate.","hn":"Dobara socho. Appropriate ho toh spread, commission, applicable taxes, slippage, market impact, latency aur partial/rejected fills model karo."}],[{"en":"Performance may be overstated","hn":"Performance overstate ho sakti hai"},{"en":"Correct. Model spread, commissions, taxes where applicable, slippage, market impact, latency an
