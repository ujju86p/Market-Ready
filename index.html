var UNIT=[];var UNITS={};UNITS.u2=[{"k":"info","t":{"en":"Margin is a risk buffer, not a safety net","hn":"Margin risk buffer hai, guarantee nahi"},"hook":{"en":"If a position is worth ₹1,00,000, does depositing ₹20,000 mean the maximum loss is ₹20,000?","hn":"Agar position ₹1,00,000 ki hai aur ₹20,000 deposit kiye, kya maximum loss ₹20,000 hi hai?"},"story":{"en":"Meera sees a margin requirement on her app and assumes the deposited amount caps her loss. A sharp move proves that assumption unsafe.","hn":"Meera app par margin requirement dekh kar samajhti hai ki loss deposit tak hi limited hai. Tez move se ye assumption unsafe sabit ho sakti hai."},"s":{"en":"Margin is money or eligible collateral required to support a position. It helps manage counterparty and market risk; it does not automatically cap the client’s loss at the margin amount. Actual obligations depend on the product, contract and applicable terms.","hn":"Margin position support karne ke liye required money ya eligible collateral hota hai. Ye risk manage karne mein help karta hai; client ka loss automatically margin amount tak limit nahi karta. Actual obligations product, contract aur applicable terms par depend karti hain."},"p":{"en":"Do not treat the margin figure shown in an app as the maximum possible loss.","hn":"App mein dikh rahe margin ko maximum possible loss mat samjho."},"think":{"en":"What does margin requirement mean—and what does it not mean?","hn":"Margin requirement ka matlab kya hai, aur kya matlab nahi hai?"},"reveal":{"en":"It is a required buffer/support for the position, not a profit guarantee or universal loss cap.","hn":"Ye position ke liye required buffer/support hai, profit guarantee ya universal loss cap nahi."}},{"k":"info","t":{"en":"Separate position value from your own capital","hn":"Position value aur apna capital alag rakho"},"hook":{"en":"A ₹1,00,000 position falls 4%. What is the price loss before charges?","hn":"₹1,00,000 ki position 4% girti hai. Charges se pehle price loss kitna hai?"},"story":{"en":"A trader supports ₹1,00,000 exposure with less of their own cash. A 4% fall still means ₹4,000 loss on the position, regardless of the smaller deposit.","hn":"Trader kam apne cash se ₹1,00,000 exposure leta hai. 4% girawat ka matlab position par ₹4,000 loss hai, chahe deposit chhota ho."},"s":{"en":"First calculate the move on the full position: ₹1,00,000 × 4% = ₹4,000. Then compare that loss with your own capital and add costs. Leverage can make the loss large relative to the amount you contributed.","hn":"Pehle full position par move calculate karo: ₹1,00,000 × 4% = ₹4,000. Phir loss ko apne capital se compare karo aur costs add karo. Leverage loss ko contribution ke comparison mein bada bana sakta hai."},"p":{"en":"This is a simplified illustration; actual margin, mark-to-market and settlement rules depend on the product.","hn":"Ye simplified example hai; actual margin, mark-to-market aur settlement rules product par depend karte hain."},"think":{"en":"Which value should you use to calculate the position’s price loss?","hn":"Position ka price loss nikalne ke liye kaunsi value use karoge?"},"reveal":{"en":"The full exposure/position value.","hn":"Full exposure/position value."}},{"k":"info","t":{"en":"Pledging means collateral—not a free loan","hn":"Pledge collateral hota hai, free loan nahi"},"hook":{"en":"If you pledge eligible shares, have you sold them and received their full market value as cash?","hn":"Eligible shares pledge karne ka matlab kya unhe bech diya aur full market value cash mil gaya?"},"story":{"en":"Arjun pledges eligible holdings to support a facility. He still owns the holdings subject to the facility terms, and their value can move.","hn":"Arjun facility support karne ke liye eligible holdings pledge karta hai. Facility terms ke subject to holdings uske paas rehti hain aur unki value badal sakti hai."},"s":{"en":"A pledge creates a security interest in eligible holdings under specified conditions. It is not the same as selling the shares. The usable collateral value may be lower than market value and the holdings may be subject to restrictions or enforcement if obligations are not met.","hn":"Pledge specified conditions ke under eligible holdings par security interest create karta hai. Ye shares bechne jaisa nahi. Usable collateral value market value se kam ho sakti hai aur obligations poori na hone par restrictions ya enforcement ho sakti hai."},"p":{"en":"Check pledge creation/release steps, charges, eligible securities and shortfall rules before relying on pledged holdings.","hn":"Pledged holdings par rely karne se pehle pledge/release process, charges, eligible securities aur shortfall rules check karo."},"think":{"en":"What is the key difference between pledging and selling?","hn":"Pledge aur sale mein main difference kya hai?"},"reveal":{"en":"A pledge uses holdings as collateral under terms; a sale transfers the shares in a transaction.","hn":"Pledge mein holdings terms ke under collateral banti hain; sale mein shares transaction ke through transfer hote hain."}},{"k":"info","t":{"en":"A haircut reduces recognised collateral value","hn":"Haircut recognised collateral value ghatata hai"},"hook":{"en":"Eligible holdings have a market value of ₹1,00,000 and a hypothetical 20% haircut. What value is recognised?","hn":"Eligible holdings ki market value ₹1,00,000 hai aur hypothetical 20% haircut hai. Kitni value recognise hogi?"},"story":{"en":"Neha has holdings worth ₹1,00,000. With a hypothetical 20% haircut, the facility recognises ₹80,000 as collateral value.","hn":"Neha ki holdings ₹1,00,000 ki hain. Hypothetical 20% haircut ke baad facility ₹80,000 collateral value recognise karti hai."},"s":{"en":"Recognised value = market value × (1 − haircut). Here: ₹1,00,000 × 80% = ₹80,000. The haircut is a risk-control reduction for collateral purposes; it is not a reduction in the quoted market price of the shares.","hn":"Recognised value = market value × (1 − haircut). Yahan ₹1,00,000 × 80% = ₹80,000. Haircut collateral ke liye risk-control reduction hai; shares ke quoted market price mein reduction nahi."},"p":{"en":"Actual haircuts can vary by security, volatility, broker/exchange rules and current requirements.","hn":"Actual haircut security, volatility, broker/exchange rules aur current requirements ke hisaab se badal sakta hai."},"think":{"en":"What is the recognised value after a 20% haircut on ₹1,00,000?","hn":"₹1,00,000 par 20% haircut ke baad recognised value kitni hai?"},"reveal":{"en":"₹80,000.","hn":"₹80,000."}},{"k":"info","t":{"en":"Collateral value can fall when markets fall","hn":"Market girne par collateral value bhi gir sakti hai"},"hook":{"en":"If pledged shares fall in price, can the collateral support available to you shrink?","hn":"Pledged shares ka price girne par available collateral support kam ho sakta hai?"},"story":{"en":"A market decline reduces the value of Vikram’s pledged shares. The facility may now have less recognised collateral than before.","hn":"Market girawat se Vikram ke pledged shares ki value kam hoti hai. Facility ke paas pehle se kam recognised collateral ho sakta hai."},"s":{"en":"Collateral is exposed to market movement. A price fall, a change in haircut or a change in required margin can create a shortfall even if the client has not placed a new trade.","hn":"Collateral market movement se affect hota hai. Price fall, haircut change ya required margin change se shortfall ho sakta hai, chahe client ne nayi trade na ki ho."},"p":{"en":"Do not assume yesterday’s collateral value or available limit will remain unchanged.","hn":"Ye assume mat karo ki kal ki collateral value ya available limit same rahegi."},"think":{"en":"Name two reasons a collateral shortfall may appear.","hn":"Collateral shortfall aane ke do reasons batao."},"reveal":{"en":"Collateral price may fall; the haircut or required margin may change.","hn":"Collateral ka price gir sakta hai; haircut ya required margin badal sakta hai."}},{"k":"info","t":{"en":"A shortfall is a request to act—not a prediction","hn":"Shortfall action ki requirement hai, prediction nahi"},"hook":{"en":"If a broker issues a shortfall notice, should you ignore it because you expect prices to recover?","hn":"Broker shortfall notice de toh kya ignore karna chahiye kyunki aapko recovery ki umeed hai?"},"story":{"en":"A shortfall notice reaches Neha during a volatile session. She checks the amount, deadline and facility terms instead of relying on a price forecast.","hn":"Volatile session mein Neha ko shortfall notice milta hai. Woh price forecast par depend karne ke bajay amount, deadline aur facility terms check karti hai."},"s":{"en":"Depending on the agreement, the client may need to add funds or eligible collateral, reduce exposure, or take another specified action. If requirements are not met, the broker may have rights to reduce or liquidate positions.","hn":"Agreement ke hisaab se client ko funds/eligible collateral add karna, exposure reduce karna ya specified action lena pad sakta hai. Requirements poori na hone par broker ko positions reduce ya liquidate karne ka right ho sakta hai."},"p":{"en":"Follow the actual notice and current facility terms; do not delay action based on hope.","hn":"Actual notice aur current facility terms follow karo; hope ke basis par action delay mat karo."},"think":{"en":"What is the first sensible step after a shortfall notice?","hn":"Shortfall notice ke baad pehla sensible step kya hai?"},"reveal":{"en":"Read the notice, amount, deadline and applicable terms promptly.","hn":"Notice, amount, deadline aur applicable terms ko turant padho."}},{"k":"info","t":{"en":"Know the costs and release conditions","hn":"Costs aur release conditions samjho"},"hook":{"en":"Before pledging securities, which details matter besides the collateral value?","hn":"Securities pledge karne se pehle collateral value ke alawa kya details matter karti hain?"},"story":{"en":"Arjun wants to release his pledged shares later. He discovers that the facility has specific conditions and charges that he had not checked.","hn":"Arjun baad mein pledged shares release karna chahta hai. Use pata chalta hai ki facility mein specific conditions aur charges hain jo usne check nahi kiye the."},"s":{"en":"Read the facility agreement and current broker disclosures for interest/charges where relevant, pledge and release steps, eligibility, shortfall handling, and any restrictions on using or selling the holdings.","hn":"Facility agreement aur current broker disclosures mein relevant interest/charges, pledge-release steps, eligibility, shortfall handling aur holdings use/sell karne ki restrictions padho."},"p":{"en":"Never assume all brokers or all securities have identical terms.","hn":"Ye assume mat karo ki sab brokers ya securities ke terms same hain."},"think":{"en":"Which source should you check for exact current terms?","hn":"Exact current terms ke liye kya check karna chahiye?"},"reveal":{"en":"The current broker/facility disclosures and applicable rules.","hn":"Current broker/facility disclosures aur applicable rules."}},{"k":"info","t":{"en":"Choose exposure by affordable loss, not available margin","hn":"Position affordable loss se choose karo, available margin se nahi"},"hook":{"en":"An app shows a larger position is possible. Does that mean it is suitable for your finances?","hn":"App badi position allow karta hai. Kya iska matlab woh aapki finances ke liye suitable hai?"},"story":{"en":"Meera estimates a plausible adverse move and asks whether she could absorb the loss plus costs without borrowing for essentials.","hn":"Meera plausible adverse move ka estimate karti hai aur sochti hai ki kya essentials ke liye udhaar liye bina loss aur costs afford kar sakti hai."},"s":{"en":"A sound process starts with risk capacity, time horizon, concentration, liquidity needs and a realistic exit plan. Available margin is a limit set by a facility, not a personal suitability recommendation.","hn":"Achha process risk capacity, time horizon, concentration, liquidity needs aur realistic exit plan se shuru hota hai. Available margin facility ki limit hai, personal suitability recommendation nahi."},"p":{"en":"Fast markets, gaps and illiquidity can make exits worse than planned.","hn":"Fast market, gap aur illiquidity ki wajah se exit planned price se kharab ho sakta hai."},"think":{"en":"What should determine your position size?","hn":"Position size kis basis par decide honi chahiye?"},"reveal":{"en":"Affordable risk and financial circumstances—not the maximum margin offered.","hn":"Affordable risk aur financial circumstances—not maximum offered margin."}},{"k":"mc","q":{"en":"A ₹1,00,000 position falls 4%. What is the price loss before costs?","hn":"₹1,00,000 ki position 4% girti hai. Costs se pehle price loss kitna hai?"},"o":[[{"en":"₹4,000","hn":"₹4,000"},{"en":"Correct: 4% of ₹1,00,000 is ₹4,000.","hn":"Sahi: ₹1,00,000 ka 4% ₹4,000 hai."}],[{"en":"₹400","hn":"₹400"},{"en":"Calculate 0.04 × ₹1,00,000.","hn":"0.04 × ₹1,00,000 calculate karo."}],[{"en":"₹20,000","hn":"₹20,000"},{"en":"₹20,000 is not 4% of ₹1,00,000.","hn":"₹20,000, ₹1,00,000 ka 4% nahi hai."}]],"a":0},{"k":"mc","q":{"en":"What does a margin requirement tell you?","hn":"Margin requirement kya batati hai?"},"o":[[{"en":"It is the maximum possible loss in every case","hn":"Har case mein maximum possible loss"},{"en":"Margin does not automatically cap losses.","hn":"Margin loss ko automatically cap nahi karta."}],[{"en":"The required support/buffer under the product and facility terms","hn":"Product aur facility terms ke under required support/buffer"},{"en":"Correct: it is required support; obligations and losses may exceed it depending on the product and terms.","hn":"Sahi: ye required support hai; product aur terms ke hisaab se obligations/losses isse zyada ho sakte hain."}],[{"en":"That the trade is guaranteed to be profitable","hn":"Trade profit guarantee hai"},{"en":"Margin is not a profit guarantee.","hn":"Margin profit guarantee nahi hai."}]],"a":1},{"k":"mc","q":{"en":"A hypothetical 20% haircut applies to ₹1,00,000 collateral. What is the recognised value?","hn":"₹1,00,000 collateral par hypothetical 20% haircut hai. Recognised value kitni hai?"},"o":[[{"en":"₹1,20,000","hn":"₹1,20,000"},{"en":"A haircut reduces recognised collateral value; it does not add 20%.","hn":"Haircut recognised collateral value ghatata hai; 20% add nahi karta."}],[{"en":"₹20,000","hn":"₹20,000"},{"en":"That is the reduction amount, not the recognised value.","hn":"Ye reduction amount hai, recognised value nahi."}],[{"en":"₹80,000","hn":"₹80,000"},{"en":"Correct: ₹1,00,000 × 80% = ₹80,000.","hn":"Sahi: ₹1,00,000 × 80% = ₹80,000."}]],"a":2},{"k":"mc","q":{"en":"What is pledging eligible shares most accurately?","hn":"Eligible shares pledge karna sabse accurately kya hai?"},"o":[[{"en":"Using holdings as collateral under specified terms","hn":"Specified terms ke under holdings ko collateral banana"},{"en":"Correct: pledge is collateral, not a sale or price protection.","hn":"Sahi: pledge collateral hai, sale ya price protection nahi."}],[{"en":"Selling shares at the current market price","hn":"Shares ko current market price par bechna"},{"en":"A pledge is not the same as selling the holding.","hn":"Pledge holding bechne jaisa nahi hai."}],[{"en":"A guarantee that the share price will not fall","hn":"Guarantee ki share price nahi girega"},{"en":"Collateral can still lose market value.","hn":"Collateral ki market value phir bhi gir sakti hai."}]],"a":0},{"k":"mc","q":{"en":"Which event can create a collateral shortfall?","hn":"Kaunsi situation collateral shortfall create kar sakti hai?"},"o":[[{"en":"Only when the client opens a new trade","hn":"Sirf nayi trade kholne par"},{"en":"A shortfall can occur without a new trade.","hn":"Nayi trade ke bina bhi shortfall ho sakta hai."}],[{"en":"A fall in collateral value or a change in requirements","hn":"Collateral value girna ya requirements badalna"},{"en":"Correct: lower collateral value or changed requirements can reduce the available buffer.","hn":"Sahi: collateral value kam hone ya requirements badalne se buffer ghat sakta hai."}],[{"en":"Only when the company declares a dividend","hn":"Sirf company dividend declare kare tab"},{"en":"Dividend declaration is not the only or defining trigger.","hn":"Dividend declaration defining trigger nahi hai."}]],"a":1},{"k":"mc","q":{"en":"A shortfall notice arrives. What is the best first response?","hn":"Shortfall notice aaye toh best first response kya hai?"},"o":[[{"en":"Ignore it until the price recovers","hn":"Price recover hone tak ignore karo"},{"en":"Ignoring a notice may worsen the situation.","hn":"Notice ignore karne se situation worse ho sakti hai."}],[{"en":"Add a new position to recover the loss","hn":"Loss recover karne ke liye nayi position lo"},{"en":"Adding risk to recover a loss is not a sound response to a notice.","hn":"Loss recover karne ke liye risk badhana sound response nahi."}],[{"en":"Check the notice, deadline and facility terms promptly","hn":"Notice, deadline aur facility terms turant check karo"},{"en":"Correct: understand the actual requirement and act within the applicable terms.","hn":"Sahi: actual requirement samjho aur applicable terms ke andar action lo."}]],"a":2},{"k":"mc","q":{"en":"Which statement about a haircut is correct?","hn":"Haircut ke baare mein kaunsa statement sahi hai?"},"o":[[{"en":"It reduces the quoted share price on the exchange","hn":"Exchange par quoted share price ghatata hai"},{"en":"A haircut does not itself change the market quote.","hn":"Haircut khud market quote nahi badalta."}],[{"en":"It reduces the value recognised for collateral purposes","hn":"Collateral purpose ke liye recognised value ghatata hai"},{"en":"Correct: it is a risk-control adjustment to collateral value.","hn":"Sahi: ye collateral value par risk-control adjustment hai."}],[{"en":"It removes market risk from the holding","hn":"Holding ka market risk khatam karta hai"},{"en":"The holding remains exposed to market risk.","hn":"Holding market risk se exposed rehti hai."}]],"a":1},{"k":"mc","q":{"en":"What should guide the size of a leveraged position?","hn":"Leveraged position ka size kis basis par hona chahiye?"},"o":[[{"en":"The maximum position the app permits","hn":"App ki maximum permitted position"},{"en":"The platform limit is not a personal suitability assessment.","hn":"Platform limit personal suitability assessment nahi."}],[{"en":"A guess that the price will recover","hn":"Guess ki price recover karega"},{"en":"A recovery is not guaranteed.","hn":"Recovery guaranteed nahi."}],[{"en":"Affordable risk, costs, liquidity needs and a realistic exit plan","hn":"Affordable risk, costs, liquidity needs aur realistic exit plan"},{"en":"Correct: size risk to your circumstances, not to the maximum available leverage.","hn":"Sahi: size apni circumstances ke hisaab se rakho, maximum leverage ke hisaab se nahi."}]],"a":2},{"k":"end"}];
UNITS.u1=[{"k":"info","t":{"en":"The bakery problem: can a small business become a big company?","hn":"Ek bakery ki kahani: chhota business badi company kaise banta hai?"},"hook":{"en":"Imagine you have ₹2 lakh and a brilliant bakery idea. Your cakes become famous—but you cannot afford a second shop. What would you do: grow slowly, borrow money, or bring in a partner?","hn":"Socho aapke paas ₹2 lakh hain aur bakery ka zabardast idea hai. Cakes famous ho gaye, lekin doosri shop kholne ke paise nahi. Kya karoge: dheere grow, loan, ya partner laoge?"},"story":{"en":"Meet Riya. She starts “Riya Bakes” with her savings. Customers love her cakes. She now wants a second oven, a bigger kitchen and two more staff members. Her business has an opportunity—but growth needs money. This is a real-world problem that companies face too.","hn":"Milte hain Riya se. Woh apni savings se “Riya Bakes” shuru karti hai. Customers ko cakes pasand aate hain. Ab use doosra oven, badi kitchen aur do naye staff chahiye. Business grow kar sakta hai, par growth ke liye paisa chahiye. Badi companies ko bhi aisi problem hoti hai."},"s":{"en":"A business sells goods or services. It earns revenue from sales and pays expenses such as ingredients, salaries, rent and electricity. Revenue is not the same as profit: profit is what remains after expenses. A company is a business organised under a legal structure, with defined ownership and responsibilities. Not every business is a listed company.","hn":"Business goods ya services bechta hai. Sales se revenue aata hai aur ingredients, salary, rent, electricity jaise expenses jaate hain. Revenue aur profit same nahi: expenses nikalne ke baad jo bache woh profit hai. Company ek legal structure ke andar organised business hoti hai, jiske ownership aur responsibilities defined hote hain. Har business stock exchange par listed company nahi hota."},"p":{"en":"Suppose Riya sells ₹50,000 of cakes in a month and spends ₹38,000 on ingredients, wages, rent and bills. Her profit before any other applicable items is ₹12,000—not ₹50,000. If she spends ₹60,000 while sales remain ₹50,000, she makes a loss.","hn":"Maan lo Riya ek mahine mein ₹50,000 ke cakes bechti hai aur ingredients, salary, rent aur bills par ₹38,000 kharch karti hai. Uska profit ₹12,000 hai, ₹50,000 nahi. Agar sales ₹50,000 rahein par kharch ₹60,000 ho, toh loss hoga."},"think":{"en":"Before moving on: in your own words, why can a business with high sales still make a loss?","hn":"Aage badhne se pehle: apne words mein batao, high sales wala business bhi loss mein kyun ja sakta hai?"},"reveal":{"en":"Because sales are revenue, not profit. If the cost of making and selling the products is greater than revenue, the business loses money.","hn":"Kyunki sales revenue hoti hai, profit nahi. Agar product banane aur bechne ka total kharch revenue se zyada hai, toh business loss karta hai."}},{"k":"info","t":{"en":"Riya needs money: three different routes","hn":"Riya ko paisa chahiye: teen alag raaste"},"hook":{"en":"Riya’s bakery is doing well. She needs ₹10 lakh to expand. Is a bank loan the only way to get money?","hn":"Riya ki bakery achha kar rahi hai. Expansion ke liye ₹10 lakh chahiye. Kya bank loan hi ek raasta hai?"},"story":{"en":"Riya considers three routes. First, she can use her own savings. Second, she can borrow money and agree to repay it under loan terms. Third, she can bring in an investor who provides money in exchange for part-ownership. Each route has different costs, obligations and risks.","hn":"Riya teen raaste sochti hai. Pehla, apni savings lagaye. Doosra, loan le aur terms ke mutabik wapas kare. Teesra, investor laaye jo paisa de aur badle mein ownership ka hissa le. Har raaste ki cost, responsibility aur risk alag hai."},"s":{"en":"A loan creates a repayment obligation; a share represents ownership. A shareholder is not simply lending money like a bank. The shareholder participates in the risks and possible rewards of owning the business. In a real company, the rights depend on the type of security and applicable legal documents.","hn":"Loan lene par repayment ki responsibility hoti hai; share ownership dikhata hai. Shareholder bank ki tarah sirf udhaar nahi de raha hota. Woh business ke owner hone ke risks aur possible rewards share karta hai. Real company mein rights share ke type aur legal documents par depend karte hain."},"p":{"en":"Memory hook: loan = money borrowed that must be repaid under its terms; share = ownership interest. A share does not promise a fixed return, and a company cannot promise that the market price will always rise.","hn":"Yaad rakhne ka shortcut: loan = udhaar jo terms ke hisaab se wapas karna hai; share = ownership ka hissa. Share fixed return ka promise nahi hai aur company guarantee nahi kar sakti ki market price hamesha badhega."},"think":{"en":"If an investor gets shares in return for money, are they automatically entitled to a fixed interest payment like a normal loan?","hn":"Agar investor paisa dekar shares leta hai, kya use normal loan ki tarah fixed interest milna pakka hai?"},"reveal":{"en":"No. Shares are ownership, not an ordinary loan. Dividends are not guaranteed, and share prices can fall.","hn":"Nahi. Share ownership hai, normal loan nahi. Dividend guaranteed nahi aur share price gir sakta hai."}},{"k":"info","t":{"en":"What exactly is a share? Think in ownership slices","hn":"Share asal mein kya hai? Ownership ke tukde socho"},"hook":{"en":"Riya agrees to divide the bakery’s ownership into 100 equal units. A friend invests for 20 units. What did the friend receive: a cake subscription, a loan, or ownership?","hn":"Riya bakery ki ownership ko 100 barabar units mein baantne ko taiyar hoti hai. Ek dost 20 units ke badle invest karta hai. Dost ko kya mila: cake subscription, loan, ya ownership?"},"story":{"en":"Imagine the 100 units as 100 equal slices on a chart—not literal pieces of the kitchen or ovens. Riya’s friend receives 20 units out of 100. The friend now owns 20% of those equal ownership units, while Riya and any other owners hold the rest. A share is one unit of share capital, subject to the company’s actual share structure and rights.","hn":"100 units ko chart par 100 barabar slices ki tarah socho—ye kitchen ya oven ke literal tukde nahi hain. Riya ke dost ko 100 mein se 20 units milte hain. Ab dost ke paas un equal ownership units ka 20% hai; baaki Riya aur doosre owners ke paas hai. Share, share capital ki ek unit hoti hai; actual rights company ke share structure par depend karte hain."},"s":{"en":"A share is a unit representing ownership in a company. If there are 100 equal shares and you own 5, you own 5% of those shares. It does not mean you can personally take 5% of the company’s cash, products or buildings. Shareholders may have specified voting rights and may receive dividends if declared; they also bear investment risk.","hn":"Share company mein ownership dikhane wali ek unit hai. Agar 100 equal shares hain aur aapke paas 5 hain, toh aap un shares ka 5% rakhte ho. Iska matlab yeh nahi ki aap company ka 5% cash, products ya building ghar le ja sakte ho. Shareholders ko kuch voting rights mil sakte hain aur dividend declare ho toh payout mil sakta hai; investment risk bhi hota hai."},"p":{"en":"Worked example: 5 ÷ 100 × 100 = 5%. If the company instead has 1,000 equal shares and you own 5, your percentage is 5 ÷ 1,000 × 100 = 0.5%. Always check the total shares and share class before interpreting an ownership percentage.","hn":"Solved example: 5 ÷ 100 × 100 = 5%. Agar company ke 1,000 equal shares hon aur aapke paas 5 hon, toh percentage 5 ÷ 1,000 × 100 = 0.5% hai. Ownership percentage samajhne se pehle total shares aur share class check karo."},"think":{"en":"Quick recall: you own 10 shares out of 200 equal shares. What percentage is that? Try calculating before revealing.","hn":"Quick recall: 200 equal shares mein aapke paas 10 hain. Kitna percent hua? Answer reveal karne se pehle khud calculate karo."},"reveal":{"en":"10 ÷ 200 × 100 = 5%. Divide your shares by the total shares, then multiply by 100.","hn":"10 ÷ 200 × 100 = 5%. Apne shares ko total shares se divide karo, phir 100 se multiply karo."}},{"k":"info","t":{"en":"How shares can help a company grow: issue and IPO","hn":"Shares se company kaise grow karti hai: issue aur IPO"},"hook":{"en":"Riya’s business is growing, but her savings are not enough. Could she invite many investors instead of just one friend?","hn":"Riya ka business grow kar raha hai, par savings kaafi nahi. Kya woh ek dost ki jagah bahut saare investors ko invite kar sakti hai?"},"story":{"en":"A company may raise money by issuing new shares to investors, subject to legal and regulatory requirements. A public offer such as an IPO is one route through which a company can offer securities to the public. Investors may apply, but allotment is not guaranteed. If shares are admitted to exchange trading, eligible investors may later buy and sell them in the market.","hn":"Company legal aur regulatory requirements follow karke naye shares issue kar investors se paisa raise kar sakti hai. IPO jaisa public offer company ko public ke saamne securities offer karne ka ek raasta deta hai. Investors apply kar sakte hain, lekin allotment guaranteed nahi. Shares exchange par trading ke liye admitted hon, toh eligible investors baad mein market mein unhe kharid-bech sakte hain."},"s":{"en":"Primary market: the company issues new securities and may receive the issue proceeds. Secondary market: investors trade existing listed securities with other investors through the exchange system. These are related but different. Buying a listed share from another investor generally sends your payment to the seller—not directly to the company.","hn":"Primary market: company naye securities issue karti hai aur issue se paisa company ko mil sakta hai. Secondary market: investors existing listed securities ko exchange system ke through doosre investors se trade karte hain. Dono related hain, par alag. Listed share kisi doosre investor se kharidne par aam taur par payment seller ko jaata hai—company ko directly nahi."},"p":{"en":"Memory hook: primary = company raising money through an issue; secondary = investors trading existing securities. A listed company must meet applicable listing requirements; not every company or share can automatically be traded on NSE or BSE.","hn":"Yaad rakho: primary = issue ke through company paisa raise kare; secondary = investors existing securities trade karein. Listed company ko applicable listing requirements poori karni hoti hain; har company ya share automatically NSE/BSE par trade nahi ho sakta."},"think":{"en":"If you buy an already-listed share from another investor on the exchange, who normally receives your payment?","hn":"Agar aap exchange par kisi investor se already-listed share kharidte ho, toh payment aam taur par kisko milta hai?"},"reveal":{"en":"The selling investor. The company generally received money when it issued the shares, not every time the shares trade between investors.","hn":"Selling investor ko. Company ko aam taur par shares issue karte waqt paisa mila tha, har secondary-market trade par nahi."}},{"k":"info","t":{"en":"Why the share price moves: a marketplace, not a magic number","hn":"Share ka price kyun badalta hai: bazaar, koi magic number nahi"},"hook":{"en":"Two people want to trade the same share. One will pay ₹99, while the other refuses to sell below ₹100. Do they have a deal yet?","hn":"Do log same share trade karna chahte hain. Ek ₹99 dena chahta hai, doosra ₹100 se kam par bechna nahi chahta. Kya deal ho gayi?"},"story":{"en":"In India, NSE and BSE are major stock exchanges. Think of an exchange as an organised electronic marketplace where eligible buy and sell orders can meet. A registered broker gives a retail investor access to this system. The exchange does not simply choose a fair price for every share; prices emerge as compatible orders match.","hn":"India mein NSE aur BSE bade stock exchanges hain. Exchange ko ek organised electronic marketplace samjho jahan eligible buy aur sell orders match ho sakte hain. Registered broker retail investor ko is system tak access deta hai. Exchange har share ka “sahi price” khud decide nahi karta; compatible orders match hone par prices bante hain."},"s":{"en":"The buyer’s bid is the price they are willing to pay. The seller’s ask or offer is the price they are willing to accept. If the best bid is ₹99 and the lowest ask is ₹100, the orders may not match. A buyer raising the bid to ₹100 could allow a trade, subject to available quantity and order priority.","hn":"Buyer ki bid woh price hai jo woh dene ko taiyar hai. Seller ka ask/offer woh price hai jise woh accept karna chahta hai. Best bid ₹99 aur lowest ask ₹100 ho toh orders match na hon. Buyer bid ₹100 kar de toh available quantity aur order priority ke hisaab se trade ho sakta hai."},"p":{"en":"Prices can change when new orders arrive and when expectations about profits, competition, interest rates, company results, news or the economy change. Volatility means how much and how quickly a price fluctuates; it describes the size/speed of moves, not whether the price must rise or fall. “There are more buyers” is not enough information by itself: price, quantity, urgency and available sell orders matter too.","hn":"Naye orders aane aur profits, competition, interest rates, company results, news ya economy ki expectations badalne par prices badal sakte hain. Volatility ka matlab price kitna aur kitni tezi se upar-neeche hota hai; ye movement ki size/speed batata hai, direction guarantee nahi karta. “Buyers zyada hain” apne aap mein kaafi information nahi: price, quantity, urgency aur available sell orders bhi matter karte hain."},"think":{"en":"At ₹99 bid and ₹100 ask, what would need to change for those two orders to match?","hn":"₹99 bid aur ₹100 ask par dono orders match karne ke liye kya badalna hoga?"},"reveal":{"en":"The buyer could raise the bid to ₹100, or the seller could lower the ask to ₹99. A trade still depends on order availability and priority.","hn":"Buyer bid ₹100 kar sakta hai ya seller ask ₹99 kar sakta hai. Trade phir bhi available orders aur priority par depend karega."}},{"k":"info","t":{"en":"Dividend: a possible payout, not a promise","hn":"Dividend: mumkin payout, pakka vaada nahi"},"hook":{"en":"Riya’s bakery makes a profit. Must she distribute every rupee of that profit to the owners?","hn":"Riya ki bakery profit kamati hai. Kya use profit ka har rupiya owners ko baantna hi padega?"},"story":{"en":"A company may need to reinvest profits in equipment, new products, debt repayment or future growth. If the company declares a dividend, eligible shareholders may receive a payout under the applicable terms. A profitable company can choose not to declare a dividend. A dividend is not guaranteed, and share prices can fall even when a company pays one.","hn":"Company ko profit equipment, naye products, debt repayment ya future growth mein dobara lagana pad sakta hai. Company dividend declare kare toh eligible shareholders ko applicable terms ke mutabik payout mil sakta hai. Profitable company dividend na dene ka decision bhi le sakti hai. Dividend guaranteed nahi, aur dividend dene wali company ka share price bhi gir sakta hai."},"s":{"en":"A dividend is a distribution declared by a company for eligible shareholders, subject to applicable rules and terms. It is different from guaranteed interest on a deposit or a loan. Do not assume the company distributes all profit or that a dividend automatically makes a share a good investment.","hn":"Dividend company ki taraf se eligible shareholders ke liye declare ki gayi distribution hai, applicable rules aur terms ke subject mein. Ye deposit ya loan par guaranteed interest se alag hai. Ye assume mat karo ki company saara profit baantti hai ya dividend dene se share automatically achha investment ban jaata hai."},"p":{"en":"Worked example: if 100 equal shares have a total declared dividend of ₹1,00,000 and you own 5 shares, your fraction is 5%. Your share of the declared payout is 5% × ₹1,00,000 = ₹5,000, assuming equal dividend rights.","hn":"Solved example: 100 equal shares par total declared dividend ₹1,00,000 hai aur aapke paas 5 shares hain, toh aapka fraction 5% hai. Declared payout mein aapka hissa 5% × ₹1,00,000 = ₹5,000 hoga, agar dividend rights equal hon."},"think":{"en":"Final recall: name one difference between a share and a loan, and one reason a share price can fall.","hn":"Final recall: share aur loan mein ek farq batao, aur ek reason batao jis se share price gir sakta hai."},"reveal":{"en":"A share is ownership; a loan creates a repayment obligation under its terms. A share price can fall if expectations worsen, results disappoint, interest rates change or sell orders outweigh bids at current prices.","hn":"Share ownership hai; loan mein terms ke mutabik repayment ki responsibility hoti hai. Expectations kharab hone, results disappoint karne, interest rates badalne ya current prices par sell orders ka pressure hone se share price gir sakta hai."}},{"k":"info","t":{"en":"Equity, debt and share capital","hn":"Equity, debt aur share capital"},"hook":{"en":"Riya has two offers: a lender asks for repayment with interest, while an investor asks for an ownership stake. Are these the same kind of money?","hn":"Riya ke paas do offers hain: lender interest ke saath repayment chahta hai, investor ownership ka hissa. Kya dono ek jaise hain?"},"story":{"en":"Equity capital is money raised by giving investors ownership interests such as shares. Debt capital is borrowed money that must be repaid under its terms; interest may apply. A company’s share capital is the capital represented by its issued shares. The choice affects control, repayment obligations and risk.","hn":"Equity capital mein company shares jaise ownership interests dekar paisa raise karti hai. Debt capital udhaar hota hai jise terms ke hisaab se repay karna hota hai; interest lag sakta hai. Share capital issued shares se represent hone wala capital hai. Dono choices control, repayment aur risk ko alag tareeke se affect karti hain."},"s":{"en":"Equity investor owner hota hai, lender creditor hota hai. Ordinary shareholders’ returns are not fixed or guaranteed; debt obligations generally do not disappear just because business profits fall. Real legal rights depend on the instrument and documents.","hn":"Equity investor owner hota hai, lender creditor hota hai. Ordinary shareholder ka return fixed ya guaranteed nahi. Business ka profit girne se debt repayment obligation automatically khatam nahi hoti. Actual rights instrument aur documents par depend karte hain."},"p":{"en":"Memory hook: equity = ownership; debt = borrowing. Riya raises ₹5 lakh by issuing shares: that is equity. She borrows ₹5 lakh under a loan agreement: that is debt.","hn":"Yaad rakho: equity = ownership; debt = udhaar. Riya shares issue karke ₹5 lakh raise kare toh equity. Loan agreement ke through ₹5 lakh borrow kare toh debt."},"think":{"en":"If Riya’s company borrows money, does the lender automatically become a shareholder?","hn":"Agar Riya ki company loan leti hai, kya lender automatically shareholder ban jaata hai?"},"reveal":{"en":"No. A lender is a creditor under the loan terms. A shareholder owns shares. One person can be both, but one role does not automatically create the other.","hn":"Nahi. Lender loan terms ke under creditor hota hai. Shareholder shares ka owner hota hai. Ek person dono ho sakta hai, par ek role se doosra automatically nahi milta."}},{"k":"info","t":{"en":"Face value, market price and market capitalisation","hn":"Face value, market price aur market capitalisation"},"hook":{"en":"A share has a face value of ₹10, but the exchange quote shows ₹240. Is one of these necessarily wrong?","hn":"Share ki face value ₹10 hai, lekin exchange par price ₹240 dikh raha hai. Kya inmein se ek galat hona zaroori hai?"},"story":{"en":"Face value is the nominal value assigned to a share in the company’s capital structure. Market price is the price at which market orders are currently trading or quoting the share. Market capitalisation (market cap) is commonly calculated as current share price × total outstanding equity shares.","hn":"Face value company ke capital structure mein share ki nominal value hai. Market price woh price hai jis par market mein share trade/quote ho raha hai. Market capitalisation (market cap) aam taur par current share price × total outstanding equity shares se calculate hota hai."},"s":{"en":"Face value and market price answer different questions. Market cap is an estimate of the market value of the company’s outstanding equity—not the company’s cash balance or guaranteed sale value.","hn":"Face value aur market price alag sawalon ka jawab hain. Market cap company ke outstanding equity shares ki market value ka estimate hai—company ke cash balance ya guaranteed sale value nahi."},"p":{"en":"If 10 lakh shares are outstanding and the share price is ₹240, illustrative market cap = 10,00,000 × ₹240 = ₹24 crore.","hn":"Agar 10 lakh shares outstanding hain aur share price ₹240 hai, toh illustrative market cap = 10,00,000 × ₹240 = ₹24 crore."},"think":{"en":"Does a ₹10 face value mean you can always buy the share for ₹10?","hn":"Kya ₹10 face value ka matlab hai ki share hamesha ₹10 mein kharid sakte ho?"},"reveal":{"en":"No. Face value is not the current market price. The market price can be above or below face value.","hn":"Nahi. Face value current market price nahi hai. Market price face value se upar ya neeche ho sakta hai."}},{"k":"info","t":{"en":"EPS and P/E: two terms you will meet often","hn":"EPS aur P/E: do common terms"},"hook":{"en":"Two companies have different share prices. Can you decide which one earns more per share just by comparing their prices?","hn":"Do companies ke share prices alag hain. Kya sirf price compare karke pata chalega kaun per share zyada earn karti hai?"},"story":{"en":"EPS means Earnings Per Share. A simplified basic formula is profit attributable to equity shareholders ÷ weighted-average equity shares. P/E means Price-to-Earnings ratio: share price ÷ EPS, when EPS is positive and comparable. These are analysis terms, not automatic buy/sell signals.","hn":"EPS ka matlab Earnings Per Share. Basic simplified formula: equity shareholders ko attributable profit ÷ weighted-average equity shares. P/E ka matlab Price-to-Earnings ratio: share price ÷ EPS, jab EPS positive aur comparable ho. Ye analysis terms hain, automatic buy/sell signal nahi."},"s":{"en":"EPS depends on earnings and the share count. P/E shows how the price compares with earnings per share, but interpretation depends on growth, risk, accounting, sector and whether figures are comparable.","hn":"EPS earnings aur shares ki ginti par depend karta hai. P/E price ko per-share earnings ke saath compare karta hai, lekin meaning growth, risk, accounting, sector aur comparable figures par depend karta hai."},"p":{"en":"If comparable annual earnings are ₹20 per share and price is ₹200, P/E = ₹200 ÷ ₹20 = 10. This alone does not prove the share is cheap.","hn":"Agar comparable annual earnings ₹20 per share aur price ₹200 hai, toh P/E = ₹200 ÷ ₹20 = 10. Sirf isse share cheap prove nahi hota."},"think":{"en":"If share price doubles but earnings stay unchanged, what happens to P/E, all else equal?","hn":"Agar earnings same rahein aur share price double ho jaaye, baaki sab same ho toh P/E ka kya hoga?"},"reveal":{"en":"P/E doubles, all else equal, because price doubles while EPS stays the same. Real analysis must check the period and quality of earnings.","hn":"Baaki sab same ho toh P/E double ho jaata hai, kyunki price double hua aur EPS same hai. Real analysis mein earnings ka period aur quality bhi check karni hoti hai."}},{"k":"mc","q":{"en":"A company has 100 equal shares and declares a total dividend of Rs 1,00,000. You own 5 shares. What dividend do you receive?","hn":"Ek company ke 100 barabar shares hain aur wo kul Rs 1,00,000 dividend declare karti hai. Aapke paas 5 shares hain. Aapko kitna dividend milega?"},"o":[[{"en":"Rs 5,000","hn":"Rs 5,000"},{"en":"Correct. You own 5% of the shares, so your share of the declared dividend is Rs 5,000. Companies do not automatically distribute all profits as dividends.","hn":"Sahi. Aapke paas 5% shares hain, isliye declared dividend me aapka hissa Rs 5,000 hai. Company apna saara profit dividend ke roop me dene ke liye majboor nahi hoti."}],[{"en":"Rs 1,00,000","hn":"Rs 1,00,000"},{"en":"That is the whole declared dividend. You own only 5% of the shares.","hn":"Ye poora declared dividend hai. Aapke paas shares ka sirf 5% hai."}],[{"en":"Rs 500","hn":"Rs 500"},{"en":"Check the share: 5% of 1,00,000, not 0.5%.","hn":"Hisaab dekho: 1,00,000 ka 5%, 0.5% nahi."}]],"a":0},{"k":"mc","q":{"en":"There are many buyers, but all are bidding Rs 95 while sellers want Rs 100. What can we conclude right now?","hn":"Bahut buyers hain, lekin sab Rs 95 bid kar rahe hain aur sellers Rs 100 maang rahe hain. Abhi kya keh sakte hain?"},"o":[[{"en":"A trade may not happen until bids and asks meet","hn":"Trade tab tak nahi ho sakta jab tak bid aur ask match na karein"},{"en":"Correct. A Rs 95 bid cannot automatically match a Rs 100 ask. A buyer may raise the bid or a seller may lower the ask.","hn":"Sahi. Rs 95 ki bid, Rs 100 ke ask se apne aap match nahi hoti. Buyer bid badha sakta hai ya seller ask kam kar sakta hai."}],[{"en":"The price must rise because buyers are more numerous","hn":"Price zaroor badhega kyunki buyers zyada hain"},{"en":"Buyer count alone does not set the price. The prices and quantities offered matter.","hn":"Sirf buyers ki ginti price fix nahi karti. Offered prices aur quantities matter karte hain."}],[{"en":"The exchange will set Rs 97.50","hn":"Exchange Rs 97.50 fix kar dega"},{"en":"The exchange matches eligible orders; it does not simply average the two prices.","hn":"Exchange eligible orders match karta hai; dono prices ka average seedha fix nahi karta."}]],"a":0},{"k":"mc","id":"w","ws":{"en":"Worked example: a company has 1,000 shares and net profit of Rs 2,00,000. Earnings per share (EPS) = net profit / shares = 2,00,000 / 1,000 = Rs 200.","hn":"Solved example: company ke 1,000 shares hain aur net profit Rs 2,00,000 hai. Earnings per share (EPS) = net profit / shares = 2,00,000 / 1,000 = Rs 200."},"q":{"en":"Your turn: 500 shares, profit Rs 1,00,000. Earnings per share?","hn":"Ab aapki baari: 500 shares, profit Rs 1,00,000. Per share kamai?"},"o":[[{"en":"Rs 200","hn":"Rs 200"},{"en":"Correct. 1,00,000 / 500 = 200.","hn":"Sahi. 1,00,000 / 500 = 200."}],[{"en":"Rs 500","hn":"Rs 500"},{"en":"That is the number of shares. Divide the profit by it.","hn":"Ye shares ki ginti hai. Profit ko isse divide karo."}],[{"en":"Rs 50","hn":"Rs 50"},{"en":"Recheck the division: 1,00,000 / 500.","hn":"Division dobara dekho: 1,00,000 / 500."}]],"a":0},{"k":"mc","id":"m","q":{"en":"True or false: if a share price rises today, the company must have earned more profit today.","hn":"Sahi ya galat: share ka price aaj badha, to company ne aaj zyada profit kamaya hoga."},"o":[[{"en":"False","hn":"Galat"},{"en":"Right. Price moves on what buyers expect and want, not only on today's profit.","hn":"Sahi. Price buyers ki ummeed aur demand se chalta hai, sirf aaj ke profit se nahi."}],[{"en":"True","hn":"Sahi"},{"en":"Not always. Hopes, news and demand move price even without new profit.","hn":"Hamesha nahi. Ummeed, khabar aur demand profit ke bina bhi price hilate hain."}]],"a":0},{"k":"mc","id":"t","q":{"en":"A company reports good results, yet its price falls that day as the whole market panics. Why?","hn":"Company ne achhe results diye, phir bhi us din price gira kyunki poore market me ghabrahat thi. Kyun?"},"o":[[{"en":"More people wanted to sell than buy","hn":"Bechne wale kharidne walon se zyada the"},{"en":"Exactly. Price follows buyers and sellers, so panic can beat good news for a day.","hn":"Bilkul. Price buyers aur sellers ke hisaab se chalta hai, to ghabrahat ek din ke liye achhi khabar par bhaari pad sakti hai."}],[{"en":"The exchange fixed a lower price","hn":"Exchange ne price kam tay kar diya"},{"en":"Exchanges do not set the price. Buyers and sellers do.","hn":"Exchange price tay nahi karta. Buyers aur sellers karte hain."}],[{"en":"The market may have expected even better results","hn":"Market ko shayad isse bhi behtar results ki umeed thi"},{"en":"Expectations matter. Even good results can disappoint relative to what prices already reflected.","hn":"Expectations matter karti hain. Achhe results bhi pehle se price mein shamil umeed se kam hon toh disappointment ho sakti hai."}]],"a":0},{"k":"mc","q":{"en":"A share has a face value of ₹10 and a market price of ₹240. Which statement is correct?","hn":"Share ki face value ₹10 aur market price ₹240 hai. Kaunsa statement sahi hai?"},"o":[[{"en":"Both can be correct; they measure different things.","hn":"Dono sahi ho sakte hain; dono alag cheez batate hain."},{"en":"Correct. Face value is nominal; market price is the current market quote/trade price.","hn":"Sahi. Face value nominal hai; market price current market quote/trade price hai."}],[{"en":"The share must be bought for ₹10.","hn":"Share ₹10 mein hi kharidna padega."},{"en":"Face value is not necessarily the current market price.","hn":"Face value zaroori nahi current market price ho."}],[{"en":"SEBI sets every share’s market price.","hn":"SEBI har share ka market price set karta hai."},{"en":"Market prices emerge through orders and trading, under market rules.","hn":"Market price orders aur trading se banta hai, market rules ke under."}]],"a":0},{"k":"mc","q":{"en":"A company has 10 lakh outstanding shares and a market price of ₹240 per share. What is its illustrative market capitalisation?","hn":"Company ke 10 lakh outstanding shares hain aur market price ₹240 per share hai. Illustrative market capitalisation kitni hai?"},"o":[[{"en":"₹24 crore","hn":"₹24 crore"},{"en":"10,00,000 × ₹240 = ₹24,00,00,000, or ₹24 crore.","hn":"10,00,000 × ₹240 = ₹24,00,00,000, yaani ₹24 crore."}],[{"en":"₹2.4 lakh","hn":"₹2.4 lakh"},{"en":"Multiply price by the number of outstanding shares.","hn":"Price ko outstanding shares ki quantity se multiply karo."}],[{"en":"₹240 crore","hn":"₹240 crore"},{"en":"The share count is 10 lakh, not 1 crore.","hn":"Shares ki quantity 10 lakh hai, 1 crore nahi."}]],"a":0},{"k":"mc","q":{"en":"Riya issues new shares to investors in a public offer. In the primary market, who may receive the issue proceeds?","hn":"Riya public offer mein naye shares issue karti hai. Primary market mein issue ka paisa kisko mil sakta hai?"},"o":[[{"en":"The company issuing the new shares","hn":"Naye shares issue karne wali company"},{"en":"Correct. In a new issue, the company may raise funds, subject to the offer terms and applicable rules.","hn":"Sahi. Naye issue mein company funds raise kar sakti hai, offer terms aur applicable rules ke subject to."}],[{"en":"Always the investor selling an existing share","hn":"Hamesha existing share bechne wala investor"},{"en":"That describes a normal secondary-market sale, not a new issue by the company.","hn":"Ye normal secondary-market sale ko describe karta hai, company ke naye issue ko nahi."}],[{"en":"The stock exchange as its own income","hn":"Stock exchange ko uski apni income ke roop mein"},{"en":"An exchange facilitates trading; it is not the issuer receiving the new-share proceeds.","hn":"Exchange trading facilitate karta hai; naye shares ka issuer proceeds receive karne wali company hoti hai."}]],"a":0},{"k":"mc","q":{"en":"Which statement best describes equity versus debt for a company?","hn":"Company ke liye equity aur debt ka sahi difference kya hai?"},"o":[[{"en":"Equity represents ownership; debt is borrowing with repayment terms","hn":"Equity ownership dikhati hai; debt udhaar hai jiske repayment terms hote hain"},{"en":"Correct. Equity holders bear ownership risk; debt creates obligations according to its terms.","hn":"Sahi. Equity holders ownership ka risk lete hain; debt apne terms ke mutabik obligations banata hai."}],[{"en":"Both always guarantee a fixed return to the investor","hn":"Dono investor ko hamesha fixed return guarantee karte hain"},{"en":"Equity returns are not guaranteed; debt payments depend on the instrument's terms and the issuer's ability to pay.","hn":"Equity return guaranteed nahi hota; debt payment instrument ke terms aur issuer ki pay karne ki capacity par depend karti hai."}],[{"en":"Equity must always be repaid on a fixed date like a loan","hn":"Equity ko hamesha loan ki tarah fixed date par wapas karna hota hai"},{"en":"Ordinary shares do not normally work like a loan with a fixed repayment date.","hn":"Ordinary shares aam taur par fixed repayment date wale loan ki tarah kaam nahi karte."}]],"a":0},{"k":"mc","q":{"en":"A share trades at ₹200 and its Earnings Per Share (EPS) is ₹10. What is its simple Price-to-Earnings (P/E) ratio?","hn":"Share ₹200 par trade karta hai aur Earnings Per Share (EPS) ₹10 hai. Simple Price-to-Earnings (P/E) ratio kitna hai?"},"o":[[{"en":"20 times","hn":"20 guna"},{"en":"Correct. P/E = market price per share ÷ EPS = ₹200 ÷ ₹10 = 20. This ratio alone is not a buy/sell signal.","hn":"Sahi. P/E = per-share market price ÷ EPS = ₹200 ÷ ₹10 = 20. Sirf ye ratio buy/sell signal nahi hai."}],[{"en":"2 times","hn":"2 guna"},{"en":"Divide the price by EPS, not EPS by the price.","hn":"Price ko EPS se divide karo, EPS ko price se nahi."}],[{"en":"₹190","hn":"₹190"},{"en":"P/E is expressed as a ratio or multiple, not the price-minus-EPS difference.","hn":"P/E ratio ya multiple hota hai, price-minus-EPS ka difference nahi."}]],"a":0},{"k":"mc","q":{"en":"Which statement about dividends is most accurate?","hn":"Dividend ke baare mein kaunsa statement sabse sahi hai?"},"o":[[{"en":"A dividend may be paid if declared; it is not guaranteed","hn":"Dividend declare ho toh mil sakta hai; guaranteed nahi hai"},{"en":"Correct. Companies do not automatically distribute all profits, and a dividend is not a guaranteed return.","hn":"Sahi. Company automatically saara profit distribute nahi karti, aur dividend guaranteed return nahi hai."}],[{"en":"Every profitable company must pay a dividend every year","hn":"Har profitable company ko har saal dividend dena hi hota hai"},{"en":"A company may retain earnings or choose not to declare a dividend, subject to applicable law and its circumstances.","hn":"Company earnings business mein rakh sakti hai ya dividend declare na karne ka decision le sakti hai, applicable law aur circumstances ke hisaab se."}],[{"en":"A dividend can never change after a company has paid one before","hn":"Ek baar dividend mil gaya toh future dividend kabhi change nahi ho sakta"},{"en":"Past dividends do not guarantee future dividends or amounts.","hn":"Past dividend future dividend ya uski amount guarantee nahi karta."}]],"a":0},{"k":"end"}];

var G={en:{1:"For a finance job: interviewers love candidates who can explain margin with a simple example like this.",2:"For investing: pledging lets you raise cash without selling long-term holdings, but it adds risk.",3:"For trading: margin is borrowed room, not profit. Size trades for the fall, not the rise."},hn:{1:"Finance job ke liye: interviewer ko aisa simple example dekar margin samjhane wale candidate pasand aate hain.",2:"Investing ke liye: pledge se long-term shares bechne bina cash mil sakta hai, par risk badhta hai.",3:"Trading ke liye: margin udhaar ki jagah hai, profit nahi. Trade ka size girne ke hisaab se rakho, badhne ke hisaab se nahi."}};
UNITS.u3=[{"k":"info","t":{"en":"An option is a right, not a duty","hn":"Option ek right hai, duty nahi"},"hook":{"en":"If you pay a small amount to keep the choice to buy something later, must you complete the purchase?","hn":"Agar baad mein kuch kharidne ka choice rakhne ke liye chhoti amount do, kya purchase karna compulsory hai?"},"story":{"en":"Asha pays a hypothetical option premium for a share-linked contract. Later, the market moves against her. As the buyer, she can choose not to exercise; the premium paid is still at risk.","hn":"Asha ek share-linked contract ke liye hypothetical option premium deti hai. Baad mein market uske against move karta hai. Buyer ke roop mein woh exercise na karne ka choice rakh sakti hai; paid premium phir bhi risk par hai."},"s":{"en":"An option gives its buyer a defined right under the contract. A call gives the right to buy; a put gives the right to sell. The buyer is not normally forced to exercise just because they bought the option.","hn":"Option buyer ko contract ke under defined right deta hai. Call buy karne ka right deta hai; put sell karne ka. Sirf option kharidne se buyer par normally exercise karna compulsory nahi hota."},"p":{"en":"The buyer can lose the premium paid; the seller/writer has obligations if assigned or exercised under the contract.","hn":"Buyer paid premium lose kar sakta hai; seller/writer par contract ke hisaab se exercise/assignment hone par obligations hoti hain."},"think":{"en":"What is the key difference between an option buyer and a seller?","hn":"Option buyer aur seller mein key difference kya hai?"},"reveal":{"en":"The buyer gets a right; the writer takes on an obligation under the contract.","hn":"Buyer ko right milta hai; writer contract ke under obligation leta hai."}},{"k":"info","t":{"en":"Call versus put: buy right versus sell right","hn":"Call vs put: buy karne ka right vs sell karne ka right"},"hook":{"en":"You think a share may rise. Which option right matches that view more directly: buying or selling at a set strike?","hn":"Aapko lagta hai share badh sakta hai. Kaunsa option right us view se directly match karta hai: fixed strike par buy ya sell?"},"story":{"en":"Kabir studies a hypothetical share at ₹100. He wants the right to buy at ₹105 if the price rises substantially, while Neha wants protection-like exposure to sell at ₹95 if the price falls.","hn":"Kabir hypothetical ₹100 share dekhta hai. Price kaafi badhe toh ₹105 par buy karne ka right chahta hai; Neha price girne par ₹95 par sell karne ka right chahti hai."},"s":{"en":"A call gives the buyer the right to buy the underlying at the strike price. A put gives the buyer the right to sell the underlying at the strike price, subject to the contract terms.","hn":"Call buyer ko strike price par underlying buy karne ka right deta hai. Put buyer ko strike price par underlying sell karne ka right deta hai, contract terms ke subject to."},"p":{"en":"A bullish view does not guarantee a profitable call; price, premium, time and volatility all matter.","hn":"Bullish view call ko profitable guarantee nahi karta; price, premium, time aur volatility sab matter karte hain."},"think":{"en":"Which right does a put buyer receive?","hn":"Put buyer ko kaunsa right milta hai?"},"reveal":{"en":"The right to sell the underlying at the strike, subject to contract terms.","hn":"Contract terms ke subject to strike par underlying sell karne ka right."}},{"k":"info","t":{"en":"Strike price and expiry define the contract","hn":"Strike price aur expiry contract define karte hain"},"hook":{"en":"Two options refer to the same share but have different strike prices or expiry dates. Are they identical contracts?","hn":"Do options same share par hain lekin strike ya expiry alag hai. Kya dono identical contracts hain?"},"story":{"en":"Asha compares a call with a ₹100 strike expiring this month to another call with a ₹110 strike expiring later. Even with the same underlying, the terms and values differ.","hn":"Asha is month expire hone wale ₹100 strike call ko later expiry wale ₹110 strike call se compare karti hai. Underlying same hone par bhi terms aur value alag hain."},"s":{"en":"The strike is the contract price used for the buy/sell right. Expiry is the contract’s end date, when the applicable exercise and settlement rules take effect. Strike, expiry, underlying and contract multiplier/size all matter.","hn":"Strike woh contract price hai jahan buy/sell right apply hota hai. Expiry contract ki end date hai, jab applicable exercise aur settlement rules apply hote hain. Strike, expiry, underlying aur contract multiplier/size sab matter karte hain."},"p":{"en":"Do not compare option premiums without matching the underlying, strike, expiry, contract size and relevant terms.","hn":"Underlying, strike, expiry, contract size aur relevant terms match kiye bina option premiums compare mat karo."},"think":{"en":"Which two terms identify the exercise price and the contract’s end date?","hn":"Exercise price aur contract ki end date ko kaunse do terms identify karte hain?"},"reveal":{"en":"Strike price and expiry.","hn":"Strike price aur expiry."}},{"k":"info","t":{"en":"Premium is the option price paid by the buyer","hn":"Premium buyer dwara pay kiya gaya option price hai"},"hook":{"en":"A call premium is ₹6 per unit. Does that mean the buyer’s break-even at expiry is simply the strike price?","hn":"Call premium ₹6 per unit hai. Kya expiry par buyer ka break-even sirf strike price hai?"},"story":{"en":"For a hypothetical call with strike ₹100 and premium ₹6 per unit, the buyer pays ₹6 per unit for the right. Ignore fees for the moment: the share needs to finish above ₹106 for a positive net payoff at expiry.","hn":"Hypothetical ₹100 strike call ka premium ₹6 per unit hai. Buyer right ke liye ₹6 per unit deta hai. Fees ko abhi ignore karein: expiry par positive net payoff ke liye share ₹106 se upar finish hona chahiye."},"s":{"en":"Premium is the price of the option. For a long call held to expiry, break-even is generally strike + premium; for a long put, break-even is generally strike − premium, before fees and subject to contract specifics.","hn":"Premium option ki price hai. Expiry tak hold kiye long call ka break-even generally strike + premium hota hai; long put ka strike − premium, fees se pehle aur contract specifics ke subject to."},"p":{"en":"Premiums can change before expiry. A position closed earlier may realise a different result from the simple expiry payoff.","hn":"Expiry se pehle premium badal sakta hai. Pehle close ki gayi position ka result simple expiry payoff se alag ho sakta hai."},"think":{"en":"For a long call with strike ₹100 and premium ₹6, what is the simple expiry break-even before fees?","hn":"₹100 strike aur ₹6 premium wale long call ka fees se pehle simple expiry break-even kya hai?"},"reveal":{"en":"₹106 per unit.","hn":"₹106 per unit."}},{"k":"info","t":{"en":"Intrinsic value: what the right is worth now","hn":"Intrinsic value: right ki abhi ki value"},"hook":{"en":"A call has strike ₹100 and the share is ₹112. At expiry, how much intrinsic value does the call have per unit?","hn":"Call ka strike ₹100 hai aur share ₹112 par hai. Expiry par call ki intrinsic value per unit kitni hai?"},"story":{"en":"Kabir’s call lets him buy at ₹100 while the hypothetical market price is ₹112. The right to buy at ₹100 is worth ₹12 per unit before considering the premium paid.","hn":"Kabir ka call use ₹100 par buy karne deta hai jab hypothetical market price ₹112 hai. ₹100 par buy karne ke right ki value premium paid se pehle ₹12 per unit hai."},"s":{"en":"At expiry, call intrinsic value is max(share price − strike, 0). Put intrinsic value is max(strike − share price, 0). Intrinsic value cannot be negative; a right with no value is not automatically exercised by the buyer.","hn":"Expiry par call intrinsic value max(share price − strike, 0) hoti hai. Put intrinsic value max(strike − share price, 0) hoti hai. Intrinsic value negative nahi hoti; zero-value right ko buyer automatically exercise nahi karta."},"p":{"en":"Intrinsic value is not the same as net profit: the premium and costs must still be accounted for.","hn":"Intrinsic value net profit ke barabar nahi hai: premium aur costs bhi account karne honge."},"think":{"en":"A put strike is ₹95 and the share finishes at ₹88. What is its intrinsic value at expiry?","hn":"Put strike ₹95 hai aur share ₹88 par finish hota hai. Expiry par intrinsic value kitni hai?"},"reveal":{"en":"₹7 per unit.","hn":"₹7 per unit."}},{"k":"info","t":{"en":"Time value and volatility affect the premium","hn":"Time value aur volatility premium ko affect karte hain"},"hook":{"en":"Two options have similar intrinsic value, but one has more time until expiry. Why might its premium be higher?","hn":"Do options ki intrinsic value similar hai, par ek mein expiry tak zyada time hai. Uska premium zyada kyun ho sakta hai?"},"story":{"en":"Neha sees more time remaining for one option. More time can give the underlying more opportunity to move favourably, though it does not guarantee a favourable move.","hn":"Neha dekhti hai ki ek option mein zyada time baaki hai. Zyada time underlying ko favourable move ka mauka de sakta hai, lekin favourable move guarantee nahi karta."},"s":{"en":"Option premium can reflect intrinsic value and time value, with volatility, interest rates, dividends, time and other inputs affecting valuation. Greater expected volatility often increases option premiums, all else equal, because a wider range of outcomes becomes more possible.","hn":"Option premium intrinsic value aur time value reflect kar sakta hai; volatility, interest rates, dividends, time aur doosre inputs valuation affect karte hain. Baaki sab same ho toh greater expected volatility aksar premium badhati hai, kyunki outcomes ka range wider ho sakta hai."},"p":{"en":"Volatility can raise both call and put premiums; it does not tell you the direction of the next price move.","hn":"Volatility call aur put dono premiums badha sakti hai; ye next price move ki direction nahi batati."},"think":{"en":"Does higher implied volatility by itself tell you whether the underlying will rise or fall?","hn":"Kya higher implied volatility apne aap batati hai ki underlying upar jayega ya neeche?"},"reveal":{"en":"No. It reflects expected magnitude/uncertainty, not a guaranteed direction.","hn":"Nahi. Ye expected magnitude/uncertainty reflect karti hai, guaranteed direction nahi."}},{"k":"info","t":{"en":"ITM, ATM and OTM describe the strike relative to price","hn":"ITM, ATM aur OTM strike ke comparison mein status batate hain"},"hook":{"en":"A share is ₹103. Which call is in the money: strike ₹95, ₹103 or ₹110?","hn":"Share ₹103 hai. Kaunsa call in the money hai: ₹95, ₹103 ya ₹110 strike?"},"story":{"en":"The ₹95 call has positive intrinsic value because it allows buying below the current hypothetical share price. The ₹110 call has no intrinsic value at that moment.","hn":"₹95 call ki intrinsic value positive hai kyunki ye current hypothetical share price se neeche buy karne deta hai. ₹110 call ki us moment par intrinsic value nahi hai."},"s":{"en":"A call is in the money when underlying price is above strike; a put is in the money when underlying price is below strike. At-the-money means price is around the strike; out-of-the-money means no intrinsic value at that moment. Exact conventions can vary slightly.","hn":"Call in-the-money hota hai jab underlying price strike se upar ho; put in-the-money jab underlying price strike se neeche ho. At-the-money ka matlab price strike ke aas-paas; out-of-the-money ka matlab us moment par intrinsic value nahi. Exact conventions thodi vary kar sakti hain."},"p":{"en":"ITM does not automatically mean profitable after premium; OTM does not mean the option has no time value before expiry.","hn":"ITM ka matlab premium ke baad automatic profit nahi; expiry se pehle OTM option mein time value ho sakti hai."},"think":{"en":"Share ₹103 par ho, toh ₹110 strike call ka status kya hoga?","hn":"Share ₹103 par ho toh ₹110 strike call ka status kya hoga?"},"reveal":{"en":"Out of the money (OTM) at that moment.","hn":"Us moment par out of the money (OTM)."}},{"k":"info","t":{"en":"Expiry payoff versus net profit","hn":"Expiry payoff aur net profit alag hain"},"hook":{"en":"A call strike is ₹100, premium ₹6, and the share expires at ₹104. Is the buyer profitable before fees?","hn":"Call strike ₹100, premium ₹6 hai aur share ₹104 par expire hota hai. Kya buyer fees se pehle profitable hai?"},"story":{"en":"The call’s intrinsic value is ₹4, but the buyer paid ₹6. The option has a positive payoff before premium, yet the net result is a ₹2 loss per unit before fees.","hn":"Call ki intrinsic value ₹4 hai, par buyer ne ₹6 pay kiye. Premium se pehle option ka payoff positive hai, phir bhi net result fees se pehle ₹2 per unit loss hai."},"s":{"en":"For a long call at expiry: net result per unit ≈ max(S − K, 0) − premium. For a long put: max(K − S, 0) − premium. Fees and contract multipliers affect the final result.","hn":"Expiry par long call ka net result per unit ≈ max(S − K, 0) − premium. Long put ke liye max(K − S, 0) − premium. Fees aur contract multipliers final result affect karte hain."},"p":{"en":"Option buyer’s maximum loss is generally the premium paid plus costs, if the option is bought outright and held under standard terms. A written option has a different and potentially much larger risk profile.","hn":"Outright option buying aur standard terms mein hold karne par buyer ka maximum loss generally paid premium plus costs hota hai. Written option ka risk profile alag aur potentially kaafi bada hota hai."},"think":{"en":"Call strike ₹100, premium ₹6, expiry price ₹104. What is the net result before fees?","hn":"Call strike ₹100, premium ₹6, expiry price ₹104. Fees se pehle net result kya hai?"},"reveal":{"en":"A loss of ₹2 per unit.","hn":"₹2 per unit ka loss."}},{"k":"info","t":{"en":"Buying and writing options have different risk profiles","hn":"Option buying aur writing ka risk alag hota hai"},"hook":{"en":"A trader receives a premium for writing a call. Is that premium free money?","hn":"Trader call write karke premium receive karta hai. Kya woh premium free money hai?"},"story":{"en":"Ravi writes a hypothetical call and receives premium. If the underlying rises sharply, the contract obligation can create losses that greatly exceed the premium received.","hn":"Ravi hypothetical call write karta hai aur premium leta hai. Underlying sharply rise kare toh contract obligation se aisa loss ho sakta hai jo received premium se kaafi zyada ho."},"s":{"en":"An option buyer pays premium for a right. An option writer receives premium but takes on contractual obligations. A short call can have theoretically unlimited loss; a short put can incur substantial loss if the underlying falls sharply.","hn":"Option buyer right ke liye premium deta hai. Option writer premium leta hai par contractual obligations leta hai. Short call ka theoretically unlimited loss ho sakta hai; underlying sharply gire toh short put mein substantial loss ho sakta hai."},"p":{"en":"Option writing may require margin and active risk controls. Premium received is compensation for risk, not a guarantee of profit.","hn":"Option writing mein margin aur active risk controls required ho sakte hain. Received premium risk ka compensation hai, profit guarantee nahi."},"think":{"en":"Why is premium received by an option writer not guaranteed profit?","hn":"Option writer ko mila premium guaranteed profit kyun nahi hai?"},"reveal":{"en":"Because the writer takes on an obligation and losses can exceed the premium.","hn":"Kyunki writer obligation leta hai aur loss premium se zyada ho sakta hai."}},{"k":"mc","q":{"en":"A call buyer has which right?","hn":"Call buyer ko kaunsa right milta hai?"},"o":[[{"en":"The right to buy the underlying at the strike, under contract terms","hn":"Contract terms ke under strike par underlying buy karne ka right"},{"en":"Correct: a call is the right to buy.","hn":"Sahi: call buy karne ka right hai."}],[{"en":"The obligation to buy at any market price","hn":"Kisi bhi market price par buy karne ki obligation"},{"en":"That confuses the buyer’s right with a forced obligation.","hn":"Ye buyer ke right ko forced obligation samajhta hai."}],[{"en":"The right to sell at the strike","hn":"Strike par sell karne ka right"},{"en":"The right to sell is associated with a put.","hn":"Sell karne ka right put se associated hai."}]],"a":0},{"k":"mc","q":{"en":"A put buyer receives the right to…","hn":"Put buyer ko kis cheez ka right milta hai?"},"o":[[{"en":"Buy the underlying at the strike","hn":"Strike par underlying buy karna"},{"en":"That is the basic call right.","hn":"Ye basic call right hai."}],[{"en":"Sell the underlying at the strike, subject to terms","hn":"Terms ke subject to strike par underlying sell karna"},{"en":"Correct: a put gives the right to sell.","hn":"Sahi: put sell karne ka right deta hai."}],[{"en":"Receive a guaranteed dividend","hn":"Guaranteed dividend receive karna"},{"en":"An option does not guarantee a dividend.","hn":"Option dividend guarantee nahi karta."}]],"a":1},{"k":"mc","q":{"en":"A call has strike ₹100 and premium ₹6. What is the simple break-even at expiry before fees?","hn":"Call ka strike ₹100 aur premium ₹6 hai. Fees se pehle expiry break-even kya hai?"},"o":[[{"en":"₹94","hn":"₹94"},{"en":"That subtracts the premium; for a long call, add it to strike.","hn":"Premium subtract kiya; long call mein strike mein add hota hai."}],[{"en":"₹100","hn":"₹100"},{"en":"The premium must be recovered for net break-even.","hn":"Net break-even ke liye premium recover karna hoga."}],[{"en":"₹106","hn":"₹106"},{"en":"Correct: strike ₹100 + premium ₹6 = ₹106.","hn":"Sahi: strike ₹100 + premium ₹6 = ₹106."}]],"a":2},{"k":"mc","q":{"en":"A put strike is ₹95 and expiry price is ₹88. What is intrinsic value at expiry?","hn":"Put strike ₹95 aur expiry price ₹88 hai. Expiry intrinsic value kya hai?"},"o":[[{"en":"₹7 per unit","hn":"₹7 per unit"},{"en":"Correct: max(₹95 − ₹88, 0) = ₹7.","hn":"Sahi: max(₹95 − ₹88, 0) = ₹7."}],[{"en":"₹0 per unit","hn":"₹0 per unit"},{"en":"The strike is above the underlying price, so the put has intrinsic value.","hn":"Strike underlying price se upar hai, isliye put ki intrinsic value hai."}],[{"en":"₹183 per unit","hn":"₹183 per unit"},{"en":"Do not add strike and price; use strike minus price for a put.","hn":"Strike aur price add nahi karte; put ke liye strike minus price use hota hai."}]],"a":0},{"k":"mc","q":{"en":"A share is ₹103. What is the status of a ₹110 strike call at that moment?","hn":"Share ₹103 hai. ₹110 strike call ka status kya hai?"},"o":[[{"en":"In the money","hn":"In the money"},{"en":"A call is ITM when share price is above strike.","hn":"Call ITM tab hota hai jab share price strike se upar ho."}],[{"en":"At the money exactly","hn":"Exactly at the money"},{"en":"The share price and strike are not equal here.","hn":"Yahan share price aur strike equal nahi hain."}],[{"en":"Out of the money","hn":"Out of the money"},{"en":"Correct: price is below the call strike, so intrinsic value is zero.","hn":"Sahi: price call strike se neeche hai, intrinsic value zero hai."}]],"a":2},{"k":"mc","q":{"en":"Which statement about premium and intrinsic value is correct?","hn":"Premium aur intrinsic value ke baare mein kaunsa statement sahi hai?"},"o":[[{"en":"They are always identical","hn":"Dono hamesha identical hote hain"},{"en":"Premium can include time value as well as intrinsic value.","hn":"Premium mein intrinsic value ke saath time value bhi ho sakti hai."}],[{"en":"Premium can include time value beyond intrinsic value","hn":"Premium intrinsic value ke alawa time value include kar sakta hai"},{"en":"Correct: premium reflects more than immediate exercise value.","hn":"Sahi: premium immediate exercise value se zyada cheezein reflect karta hai."}],[{"en":"An OTM option must have zero premium before expiry","hn":"Expiry se pehle OTM option ka premium zero hi hona chahiye"},{"en":"OTM options can have time value before expiry.","hn":"Expiry se pehle OTM options mein time value ho sakti hai."}]],"a":1},{"k":"mc","q":{"en":"A long call has strike ₹100, premium ₹6, and expiry price ₹104. Net result before fees is…","hn":"Long call strike ₹100, premium ₹6 aur expiry price ₹104 hai. Fees se pehle net result…"},"o":[[{"en":"₹4 profit per unit","hn":"₹4 per unit profit"},{"en":"₹4 is the intrinsic payoff before subtracting the premium.","hn":"Premium subtract karne se pehle ₹4 intrinsic payoff hai."}],[{"en":"₹2 loss per unit","hn":"₹2 per unit loss"},{"en":"Correct: ₹4 intrinsic value − ₹6 premium = −₹2.","hn":"Sahi: ₹4 intrinsic value − ₹6 premium = −₹2."}],[{"en":"₹6 profit per unit","hn":"₹6 per unit profit"},{"en":"The premium is the cost paid, not profit.","hn":"Premium paid cost hai, profit nahi."}]],"a":1},{"k":"mc","q":{"en":"What can higher implied volatility do, all else equal?","hn":"Baaki sab same ho toh higher implied volatility kya kar sakti hai?"},"o":[[{"en":"Often increase both call and put premiums","hn":"Aksar call aur put dono premium badha sakti hai"},{"en":"Correct: greater expected movement can raise option value, without predicting direction.","hn":"Sahi: greater expected movement option value badha sakta hai, direction predict nahi karta."}],[{"en":"Guarantee that the underlying rises","hn":"Underlying rise guarantee karna"},{"en":"Volatility does not specify direction.","hn":"Volatility direction specify nahi karti."}],[{"en":"Remove the buyer’s premium risk","hn":"Buyer ka premium risk khatam karna"},{"en":"The buyer can still lose the premium.","hn":"Buyer phir bhi premium lose kar sakta hai."}]],"a":0},{"k":"mc","q":{"en":"Why can option writing be riskier than buying an option outright?","hn":"Option write karna outright option buying se riskier kyun ho sakta hai?"},"o":[[{"en":"The writer always loses the premium","hn":"Writer hamesha premium lose karta hai"},{"en":"The writer receives the premium initially, but takes on obligations.","hn":"Writer initially premium receive karta hai, par obligations leta hai."}],[{"en":"The writer’s losses are always capped at the premium received","hn":"Writer ka loss hamesha received premium tak capped hai"},{"en":"Written-option losses can exceed premium received.","hn":"Written-option losses received premium se zyada ho sakte hain."}],[{"en":"The writer receives premium but accepts contractual obligations and potentially large losses","hn":"Writer premium leta hai par contractual obligations aur potentially large losses accept karta hai"},{"en":"Correct: premium is compensation for taking risk, not a guarantee.","hn":"Sahi: premium risk lene ka compensation hai, guarantee nahi."}]],"a":2},{"k":"mc","q":{"en":"What should be compared before comparing two option premiums?","hn":"Do option premiums compare karne se pehle kya match karna chahiye?"},"o":[[{"en":"Only the displayed premium","hn":"Sirf displayed premium"},{"en":"The premium alone hides different contract terms.","hn":"Sirf premium se contract terms ka difference nahi dikhta."}],[{"en":"Underlying, strike, expiry, contract size and relevant terms","hn":"Underlying, strike, expiry, contract size aur relevant terms"},{"en":"Correct: compare like-for-like contracts and check current specifications.","hn":"Sahi: like-for-like contracts compare karo aur current specifications check karo."}],[{"en":"Only the company name","hn":"Sirf company ka naam"},{"en":"The same underlying can have many different option contracts.","hn":"Same underlying par kai different option contracts ho sakte hain."}]],"a":1},{"k":"mc","q":{"en":"Which is the best interpretation of a positive call payoff at expiry?","hn":"Expiry par positive call payoff ka best interpretation kya hai?"},"o":[[{"en":"It guarantees net profit regardless of premium","hn":"Premium se independent net profit guarantee hai"},{"en":"Net result must account for the premium and costs.","hn":"Net result mein premium aur costs include karne honge."}],[{"en":"It means the option is automatically a good trade","hn":"Option automatically achhi trade hai"},{"en":"A payoff alone does not judge the trade’s total economics.","hn":"Sirf payoff trade ki total economics judge nahi karta."}],[{"en":"Subtract the premium and relevant costs to estimate the buyer’s net result","hn":"Buyer ka net result estimate karne ke liye premium aur relevant costs subtract karo"},{"en":"Correct: intrinsic payoff is not the same as net profit.","hn":"Sahi: intrinsic payoff net profit ke barabar nahi."}]],"a":2},{"k":"end"}];
