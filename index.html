. Cumulative profit ke alawa drawdown, volatility, exposure, turnover, risk-adjusted measures, trade distribution aur capacity review karo."}],[{"en":"It hides risk, drawdown and trading intensity","hn":"Ye risk, drawdown aur trading intensity hide karta hai"},{"en":"Correct. Review drawdown, volatility, exposure, turnover, risk-adjusted measures, trade distribution and capacity, not only cumulative profit.","hn":"Sahi. Cumulative profit ke alawa drawdown, volatility, exposure, turnover, risk-adjusted measures, trade distribution aur capacity review karo."}],[{"en":"It tells the exact future","hn":"Ye exact future batata hai"},{"en":"Not quite. Review drawdown, volatility, exposure, turnover, risk-adjusted measures, trade distribution and capacity, not only cumulative profit.","hn":"Dobara socho. Cumulative profit ke alawa drawdown, volatility, exposure, turnover, risk-adjusted measures, trade distribution aur capacity review karo."}]],"a":1},{"k":"mc","q":{"en":"What makes a backtest reproducible?","hn":"Backtest reproducible kya banata hai?"},"o":[[{"en":"A screenshot of the profit curve alone","hn":"Sirf profit curve ka screenshot"},{"en":"Not quite. Record data source/version, code version, assumptions, timestamps, parameters and exclusions so results can be reproduced and audited.","hn":"Dobara socho. Data source/version, code version, assumptions, timestamps, parameters aur exclusions record karo taaki result reproduce aur audit ho."}],[{"en":"A verbal description after the fact","hn":"Baad mein verbal description"},{"en":"Not quite. Record data source/version, code version, assumptions, timestamps, parameters and exclusions so results can be reproduced and audited.","hn":"Dobara socho. Data source/version, code version, assumptions, timestamps, parameters aur exclusions record karo taaki result reproduce aur audit ho."}],[{"en":"Saved data/version, code, parameters and assumptions","hn":"Saved data/version, code, parameters aur assumptions"},{"en":"Correct. Record data source/version, code version, assumptions, timestamps, parameters and exclusions so results can be reproduced and audited.","hn":"Sahi. Data source/version, code version, assumptions, timestamps, parameters aur exclusions record karo taaki result reproduce aur audit ho."}]],"a":2},{"k":"end"}];
UNITS.x32=[{"k":"info","t":{"en":"Define the exposure to hedge","hn":"Hedge karne wali exposure define karo"},"hook":{"en":"What should be defined before choosing a hedge?","hn":"Hedge choose karne se pehle kya define karna chahiye?"},"story":{"en":"An investor hedges broad equity exposure but still retains company-specific and basis risks.","hn":"Investor broad equity exposure hedge karta hai par company-specific aur basis risk reh sakta hai."},"s":{"en":"A hedge should target a named risk such as price, currency or rate exposure. A hedge can reduce one risk while creating another.","hn":"Hedge named risk target kare jaise price, currency ya rate exposure. Hedge ek risk reduce karke doosra create kar sakta hai."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"What should be defined before choosing a hedge?","hn":"Hedge choose karne se pehle kya define karna chahiye?"},"reveal":{"en":"The specific exposure and risk objective","hn":"Specific exposure aur risk objective"}},{"k":"info","t":{"en":"Basis risk is imperfect offset","hn":"Basis risk imperfect offset hai"},"hook":{"en":"What describes basis risk?","hn":"Basis risk kya describe karta hai?"},"story":{"en":"A portfolio and index future diverge because the holdings differ from the index composition.","hn":"Portfolio aur index future diverge karte hain kyunki holdings index composition se alag hain."},"s":{"en":"Basis risk arises when the hedge instrument and the exposure do not move perfectly together or their relationship changes.","hn":"Basis risk tab hota hai jab hedge instrument aur exposure perfectly saath move nahi karte ya relationship badalti hai."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"What describes basis risk?","hn":"Basis risk kya describe karta hai?"},"reveal":{"en":"The hedge and exposure do not track each other perfectly","hn":"Hedge aur exposure perfectly track nahi karte"}},{"k":"info","t":{"en":"A hedge has costs and trade-offs","hn":"Hedge ke costs aur trade-offs hote hain"},"hook":{"en":"What is a common trade-off of a hedge?","hn":"Hedge ka common trade-off kya hai?"},"story":{"en":"A protective put costs premium; protection is valuable but not free.","hn":"Protective put premium cost karta hai; protection valuable hai par free nahi."},"s":{"en":"Premiums, spreads, financing, margin, roll costs and imperfect protection can reduce returns. The hedge ratio may need review as exposure changes.","hn":"Premium, spread, financing, margin, roll costs aur imperfect protection returns reduce kar sakte hain. Exposure badle toh hedge ratio review karo."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"What is a common trade-off of a hedge?","hn":"Hedge ka common trade-off kya hai?"},"reveal":{"en":"Reduced exposure can come with cost and imperfect offset","hn":"Reduced exposure ke saath cost aur imperfect offset ho sakta hai"}},{"k":"info","t":{"en":"Size the hedge to the exposure","hn":"Hedge ko exposure ke size se match karo"},"hook":{"en":"What can an oversized hedge create?","hn":"Oversized hedge kya create kar sakta hai?"},"story":{"en":"Hedging an entire portfolio with a contract whose notional is larger can create an over-hedged position.","hn":"Portfolio ko larger notional wale contract se hedge karna over-hedged position create kar sakta hai."},"s":{"en":"Hedge sizing should consider notional value, sensitivity, contract multiplier, correlation and the desired hedge ratio.","hn":"Hedge sizing notional value, sensitivity, contract multiplier, correlation aur desired hedge ratio consider kare."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"What can an oversized hedge create?","hn":"Oversized hedge kya create kar sakta hai?"},"reveal":{"en":"A new unintended directional exposure","hn":"Nayi unintended directional exposure"}},{"k":"info","t":{"en":"Monitor hedge effectiveness over time","hn":"Hedge effectiveness time ke saath monitor karo"},"hook":{"en":"Why review a hedge after portfolio changes?","hn":"Portfolio change ke baad hedge kyun review karein?"},"story":{"en":"A portfolio composition changes but the hedge stays unchanged, leaving a mismatch.","hn":"Portfolio composition change hoti hai par hedge same rehta hai aur mismatch aa jata hai."},"s":{"en":"Exposure, correlations, contract maturity and market conditions change. Review the hedge rather than assuming its original ratio remains effective.","hn":"Exposure, correlation, contract maturity aur market conditions badalte hain. Hedge review karo; original ratio hamesha effective rahega assume mat karo."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"Why review a hedge after portfolio changes?","hn":"Portfolio change ke baad hedge kyun review karein?"},"reveal":{"en":"The original hedge ratio may no longer match exposure","hn":"Original hedge ratio exposure se match na kare"}},{"k":"info","t":{"en":"A kill switch must be tested","hn":"Kill switch test hona chahiye"},"hook":{"en":"What should a tested kill switch do?","hn":"Tested kill switch ko kya karna chahiye?"},"story":{"en":"An automation error repeats orders; the kill switch blocks new submissions and alerts an operator to reconcile open orders.","hn":"Automation error orders repeat karta hai; kill switch new submissions block karta hai aur operator ko open orders reconcile karne alert karta hai."},"s":{"en":"A kill switch should stop new actions and follow a documented safe procedure. Test it under failures; do not assume the button alone guarantees all orders are cancelled.","hn":"Kill switch new actions rokta aur documented safe procedure follow karta hai. Failures mein test karo; button akela sab orders cancel guarantee nahi karta."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"What should a tested kill switch do?","hn":"Tested kill switch ko kya karna chahiye?"},"reveal":{"en":"Stop new actions and trigger a safe, monitored response","hn":"New actions stop karke safe monitored response trigger karna"}},{"k":"info","t":{"en":"Compliance and broker rules are part of design","hn":"Compliance aur broker rules design ka part hain"},"hook":{"en":"What must be checked before deploying an automated trading system?","hn":"Automated trading system deploy karne se pehle kya check karein?"},"story":{"en":"A technically working order bot may still be unacceptable if it breaches broker or exchange conditions.","hn":"Technically working order bot bhi unacceptable ho sakta hai agar broker ya exchange conditions breach kare."},"s":{"en":"Automation must respect applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements and user consent.","hn":"Automation applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements aur user consent respect kare."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"What must be checked before deploying an automated trading system?","hn":"Automated trading system deploy karne se pehle kya check karein?"},"reveal":{"en":"Applicable compliance, exchange and broker requirements","hn":"Applicable compliance, exchange aur broker requirements"}},{"k":"info","t":{"en":"Use staged rollout and incident logs","hn":"Staged rollout aur incident logs use karo"},"hook":{"en":"What is the safer rollout sequence?","hn":"Safer rollout sequence kya hai?"},"story":{"en":"A staged rollout catches duplicate orders in paper mode before any live exposure.","hn":"Staged rollout live exposure se pehle paper mode mein duplicate orders catch karta hai."},"s":{"en":"Start with offline tests, then paper/sandbox, limited monitored deployment and clear rollback. Record incidents, order states and recovery actions without exposing secrets.","hn":"Offline tests, phir paper/sandbox, limited monitored deployment aur clear rollback se start karo. Secrets expose kiye bina incidents, order states aur recovery actions record karo."},"p":{"en":"Hedging reduces a specified exposure but introduces costs, basis risk and operational risks. Automated systems require compliance and a tested kill switch.","hn":"Hedging specified exposure reduce karta hai par costs, basis risk aur operational risks laata hai. Automated systems mein compliance aur tested kill switch zaroori hain."},"think":{"en":"What is the safer rollout sequence?","hn":"Safer rollout sequence kya hai?"},"reveal":{"en":"Offline tests, paper/sandbox, limited monitored rollout","hn":"Offline tests, paper/sandbox, limited monitored rollout"}},{"k":"mc","q":{"en":"What should be defined before choosing a hedge?","hn":"Hedge choose karne se pehle kya define karna chahiye?"},"o":[[{"en":"The maximum possible leverage","hn":"Maximum possible leverage"},{"en":"Not quite. A hedge should target a named risk such as price, currency or rate exposure. A hedge can reduce one risk while creating another.","hn":"Dobara socho. Hedge named risk target kare jaise price, currency ya rate exposure. Hedge ek risk reduce karke doosra create kar sakta hai."}],[{"en":"The specific exposure and risk objective","hn":"Specific exposure aur risk objective"},{"en":"Correct. A hedge should target a named risk such as price, currency or rate exposure. A hedge can reduce one risk while creating another.","hn":"Sahi. Hedge named risk target kare jaise price, currency ya rate exposure. Hedge ek risk reduce karke doosra create kar sakta hai."}],[{"en":"Only the desired premium","hn":"Sirf desired premium"},{"en":"Not quite. A hedge should target a named risk such as price, currency or rate exposure. A hedge can reduce one risk while creating another.","hn":"Dobara socho. Hedge named risk target kare jaise price, currency ya rate exposure. Hedge ek risk reduce karke doosra create kar sakta hai."}]],"a":1},{"k":"mc","q":{"en":"What describes basis risk?","hn":"Basis risk kya describe karta hai?"},"o":[[{"en":"The hedge and exposure do not track each other perfectly","hn":"Hedge aur exposure perfectly track nahi karte"},{"en":"Correct. Basis risk arises when the hedge instrument and the exposure do not move perfectly together or their relationship changes.","hn":"Sahi. Basis risk tab hota hai jab hedge instrument aur exposure perfectly saath move nahi karte ya relationship badalti hai."}],[{"en":"The hedge always removes every loss","hn":"Hedge har loss hata deta hai"},{"en":"Not quite. Basis risk arises when the hedge instrument and the exposure do not move perfectly together or their relationship changes.","hn":"Dobara socho. Basis risk tab hota hai jab hedge instrument aur exposure perfectly saath move nahi karte ya relationship badalti hai."}],[{"en":"The premium is always zero","hn":"Premium hamesha zero hai"},{"en":"Not quite. Basis risk arises when the hedge instrument and the exposure do not move perfectly together or their relationship changes.","hn":"Dobara socho. Basis risk tab hota hai jab hedge instrument aur exposure perfectly saath move nahi karte ya relationship badalti hai."}]],"a":0},{"k":"mc","q":{"en":"What is a common trade-off of a hedge?","hn":"Hedge ka common trade-off kya hai?"},"o":[[{"en":"A hedge guarantees higher returns","hn":"Hedge higher returns guarantee karta hai"},{"en":"Not quite. Premiums, spreads, financing, margin, roll costs and imperfect protection can reduce returns. The hedge ratio may need review as exposure changes.","hn":"Dobara socho. Premium, spread, financing, margin, roll costs aur imperfect protection returns reduce kar sakte hain. Exposure badle toh hedge ratio review karo."}],[{"en":"A hedge removes the need for monitoring","hn":"Hedge monitoring ki zaroorat hata deta hai"},{"en":"Not quite. Premiums, spreads, financing, margin, roll costs and imperfect protection can reduce returns. The hedge ratio may need review as exposure changes.","hn":"Dobara socho. Premium, spread, financing, margin, roll costs aur imperfect protection returns reduce kar sakte hain. Exposure badle toh hedge ratio review karo."}],[{"en":"Reduced exposure can come with cost and imperfect offset","hn":"Reduced exposure ke saath cost aur imperfect offset ho sakta hai"},{"en":"Correct. Premiums, spreads, financing, margin, roll costs and imperfect protection can reduce returns. The hedge ratio may need review as exposure changes.","hn":"Sahi. Premium, spread, financing, margin, roll costs aur imperfect protection returns reduce kar sakte hain. Exposure badle toh hedge ratio review karo."}]],"a":2},{"k":"mc","q":{"en":"What can an oversized hedge create?","hn":"Oversized hedge kya create kar sakta hai?"},"o":[[{"en":"Guaranteed full protection","hn":"Guaranteed full protection"},{"en":"Not quite. Hedge sizing should consider notional value, sensitivity, contract multiplier, correlation and the desired hedge ratio.","hn":"Dobara socho. Hedge sizing notional value, sensitivity, contract multiplier, correlation aur desired hedge ratio consider kare."}],[{"en":"A new unintended directional exposure","hn":"Nayi unintended directional exposure"},{"en":"Correct. Hedge sizing should consider notional value, sensitivity, contract multiplier, correlation and the desired hedge ratio.","hn":"Sahi. Hedge sizing notional value, sensitivity, contract multiplier, correlation aur desired hedge ratio consider kare."}],[{"en":"No margin requirement","hn":"No margin requirement"},{"en":"Not quite. Hedge sizing should consider notional value, sensitivity, contract multiplier, correlation and the desired hedge ratio.","hn":"Dobara socho. Hedge sizing notional value, sensitivity, contract multiplier, correlation aur desired hedge ratio consider kare."}]],"a":1},{"k":"mc","q":{"en":"Why review a hedge after portfolio changes?","hn":"Portfolio change ke baad hedge kyun review karein?"},"o":[[{"en":"Hedges cannot expire","hn":"Hedge expire nahi hote"},{"en":"Not quite. Exposure, correlations, contract maturity and market conditions change. Review the hedge rather than assuming its original ratio remains effective.","hn":"Dobara socho. Exposure, correlation, contract maturity aur market conditions badalte hain. Hedge review karo; original ratio hamesha effective rahega assume mat karo."}],[{"en":"Market correlations never change","hn":"Market correlation kabhi change nahi hoti"},{"en":"Not quite. Exposure, correlations, contract maturity and market conditions change. Review the hedge rather than assuming its original ratio remains effective.","hn":"Dobara socho. Exposure, correlation, contract maturity aur market conditions badalte hain. Hedge review karo; original ratio hamesha effective rahega assume mat karo."}],[{"en":"The original hedge ratio may no longer match exposure","hn":"Original hedge ratio exposure se match na kare"},{"en":"Correct. Exposure, correlations, contract maturity and market conditions change. Review the hedge rather than assuming its original ratio remains effective.","hn":"Sahi. Exposure, correlation, contract maturity aur market conditions badalte hain. Hedge review karo; original ratio hamesha effective rahega assume mat karo."}]],"a":2},{"k":"mc","q":{"en":"What should a tested kill switch do?","hn":"Tested kill switch ko kya karna chahiye?"},"o":[[{"en":"Stop new actions and trigger a safe, monitored response","hn":"New actions stop karke safe monitored response trigger karna"},{"en":"Correct. A kill switch should stop new actions and follow a documented safe procedure. Test it under failures; do not assume the button alone guarantees all orders are cancelled.","hn":"Sahi. Kill switch new actions rokta aur documented safe procedure follow karta hai. Failures mein test karo; button akela sab orders cancel guarantee nahi karta."}],[{"en":"Guarantee that every exchange order vanished","hn":"Har exchange order vanish hone ki guarantee"},{"en":"Not quite. A kill switch should stop new actions and follow a documented safe procedure. Test it under failures; do not assume the button alone guarantees all orders are cancelled.","hn":"Dobara socho. Kill switch new actions rokta aur documented safe procedure follow karta hai. Failures mein test karo; button akela sab orders cancel guarantee nahi karta."}],[{"en":"Disable all logging","hn":"Saari logging disable karna"},{"en":"Not quite. A kill switch should stop new actions and follow a documented safe procedure. Test it under failures; do not assume the button alone guarantees all orders are cancelled.","hn":"Dobara socho. Kill switch new actions rokta aur documented safe procedure follow karta hai. Failures mein test karo; button akela sab orders cancel guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"What must be checked before deploying an automated trading system?","hn":"Automated trading system deploy karne se pehle kya check karein?"},"o":[[{"en":"Only whether the code runs","hn":"Sirf code run hota hai ya nahi"},{"en":"Not quite. Automation must respect applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements and user consent.","hn":"Dobara socho. Automation applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements aur user consent respect kare."}],[{"en":"Applicable compliance, exchange and broker requirements","hn":"Applicable compliance, exchange aur broker requirements"},{"en":"Correct. Automation must respect applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements and user consent.","hn":"Sahi. Automation applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements aur user consent respect kare."}],[{"en":"Only the historical return","hn":"Sirf historical return"},{"en":"Not quite. Automation must respect applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements and user consent.","hn":"Dobara socho. Automation applicable laws, exchange rules, broker terms, permissions, rate limits, audit requirements aur user consent respect kare."}]],"a":1},{"k":"mc","q":{"en":"What is the safer rollout sequence?","hn":"Safer rollout sequence kya hai?"},"o":[[{"en":"Directly deploy full automation to all capital","hn":"Seedha full capital par deploy"},{"en":"Not quite. Start with offline tests, then paper/sandbox, limited monitored deployment and clear rollback. Record incidents, order states and recovery actions without exposing secrets.","hn":"Dobara socho. Offline tests, phir paper/sandbox, limited monitored deployment aur clear rollback se start karo. Secrets expose kiye bina incidents, order states aur recovery actions record karo."}],[{"en":"Skip rollback and incident logging","hn":"Rollback aur incident logging skip"},{"en":"Not quite. Start with offline tests, then paper/sandbox, limited monitored deployment and clear rollback. Record incidents, order states and recovery actions without exposing secrets.","hn":"Dobara socho. Offline tests, phir paper/sandbox, limited monitored deployment aur clear rollback se start karo. Secrets expose kiye bina incidents, order states aur recovery actions record karo."}],[{"en":"Offline tests, paper/sandbox, limited monitored rollout","hn":"Offline tests, paper/sandbox, limited monitored rollout"},{"en":"Correct. Start with offline tests, then paper/sandbox, limited monitored deployment and clear rollback. Record incidents, order states and recovery actions without exposing secrets.","hn":"Sahi. Offline tests, phir paper/sandbox, limited monitored deployment aur clear rollback se start karo. Secrets expose kiye bina incidents, order states aur recovery actions record karo."}]],"a":2},{"k":"end"}];
UNITS.x33=[{"k":"info","t":{"en":"IPO: buying at the company’s public issue","hn":"IPO: company ke public issue mein apply karna"},"hook":{"en":"A growing business wants to raise money from public investors. What does an investor actually buy during an IPO—and what is not guaranteed?","hn":"Ek growing business public investors se paisa raise karna chahta hai. IPO mein investor asal mein kya kharidta hai—aur kya guaranteed nahi hai?"},"story":{"en":"Riya sees a social post claiming that an upcoming IPO is “sure-shot listing profit”. Before trusting the claim, she learns what an IPO is and how the primary market works.","hn":"Riya social post dekhti hai jo upcoming IPO ko “sure-shot listing profit” bolta hai. Claim par bharosa karne se pehle woh IPO aur primary market samajhti hai."},"s":{"en":"An Initial Public Offering (IPO) is a public offer of a company’s shares. It is part of the primary market. An IPO can help a company raise capital, but applying does not guarantee allotment or profit.","hn":"Initial Public Offering (IPO) company ke shares ka public offer hota hai. Ye primary market ka hissa hai. IPO se company capital raise kar sakti hai, lekin apply karne se allotment ya profit guaranteed nahi hota."},"p":{"en":"Treat “sure-shot”, “guaranteed allotment” or “guaranteed listing gain” claims as warning signs. This lesson uses simplified examples, not a live IPO recommendation.","hn":"“Sure-shot”, “guaranteed allotment” ya “guaranteed listing gain” jaise claims ko warning sign samjho. Ye lesson simplified examples use karta hai, live IPO recommendation nahi."},"think":{"en":"If you apply for an IPO, are shares and a listing-day profit guaranteed?","hn":"IPO apply karne par shares aur listing-day profit guaranteed hain?"},"reveal":{"en":"No. Allotment depends on the issue process and demand; market price after listing can rise or fall.","hn":"Nahi. Allotment issue process aur demand par depend karta hai; listing ke baad market price upar ya neeche ja sakta hai."}},{"k":"info","t":{"en":"Primary market vs secondary market","hn":"Primary market vs secondary market"},"hook":{"en":"A company issues new shares, then later investors trade those shares with one another. Are these the same transaction?","hn":"Company naye shares issue karti hai, phir baad mein investors un shares ko aapas mein trade karte hain. Kya ye same transaction hai?"},"story":{"en":"Riya applies in the IPO. Months later, she buys another investor’s shares on an exchange. The two transactions happen in different markets.","hn":"Riya IPO mein apply karti hai. Kuch mahine baad woh exchange par kisi doosre investor ke shares kharidti hai. Dono transactions alag markets mein hoti hain."},"s":{"en":"In the primary market, securities are offered/issued by the company or selling shareholders under the issue structure. In the secondary market, investors trade already-listed securities with other investors through an exchange.","hn":"Primary market mein issue structure ke mutabik company ya selling shareholders securities offer karte hain. Secondary market mein investors exchange ke through pehle se listed securities aapas mein trade karte hain."},"p":{"en":"The issuer may receive proceeds from a fresh issue. In an offer for sale (OFS) by existing shareholders, the selling shareholders generally receive the sale proceeds instead.","hn":"Fresh issue se issuer ko proceeds mil sakte hain. Existing shareholders ke offer for sale (OFS) mein aam taur par sale proceeds bechne wale shareholders ko milte hain."},"think":{"en":"When you buy an already-listed share from another investor on an exchange, which market is that?","hn":"Exchange par doosre investor se already-listed share kharidna kis market ka hissa hai?"},"reveal":{"en":"The secondary market. The money from that trade goes through the market settlement process, not automatically to the company as new capital.","hn":"Secondary market. Us trade ka paisa market settlement process se jaata hai; company ko automatically naya capital nahi milta."}},{"k":"info","t":{"en":"Fresh issue vs offer for sale (OFS)","hn":"Fresh issue vs offer for sale (OFS)"},"hook":{"en":"An IPO includes both new shares and shares sold by an early investor. Does the company receive all the money raised in both parts?","hn":"IPO mein naye shares bhi hain aur ek purane investor ke beche shares bhi. Kya dono parts ka saara paisa company ko milta hai?"},"story":{"en":"The offer document shows a fresh issue and an OFS. Riya learns to check the issue structure instead of assuming that every rupee funds the company’s growth.","hn":"Offer document fresh issue aur OFS dikhata hai. Riya assume karne ke bajay issue structure check karna seekhti hai, taaki pata chale company ki growth ke liye kitna paisa raise ho raha hai."},"s":{"en":"A fresh issue creates and offers new shares; the issuer receives the proceeds, subject to issue expenses and disclosed terms. In an OFS, existing shareholders sell their shares and receive the sale proceeds, subject to the offer structure. An IPO may contain one or both components.","hn":"Fresh issue mein naye shares issue hote hain; issue expenses aur disclosed terms ke subject to proceeds issuer ko milte hain. OFS mein existing shareholders apne shares bechte hain aur offer structure ke mutabik sale proceeds unhe milte hain. IPO mein ek ya dono components ho sakte hain."},"p":{"en":"Read the “objects of the issue” and use-of-proceeds disclosures for a fresh issue, and the OFS details for the selling shareholders. Do not infer use of funds from the IPO headline alone.","hn":"Fresh issue ke liye “objects of the issue” aur use-of-proceeds disclosures padho; OFS ke liye selling shareholder details dekho. Sirf IPO headline se funds ka use assume mat karo."},"think":{"en":"In a pure OFS, who generally receives the sale proceeds?","hn":"Pure OFS mein sale proceeds aam taur par kisko milte hain?"},"reveal":{"en":"The existing shareholders who sell their shares—not the company as fresh capital. Check the actual offer document for the issue structure.","hn":"Apne shares bechne wale existing shareholders ko—not company ko fresh capital ke roop mein. Actual issue structure offer document mein check karo."}},{"k":"info","t":{"en":"Read the offer document—not just the headline","hn":"Offer document padho—sirf headline nahi"},"hook":{"en":"An IPO advertisement highlights growth and brand popularity. Where can you examine risks, financials, use of proceeds and the terms?","hn":"IPO advertisement growth aur brand popularity highlight karta hai. Risks, financials, funds ka use aur terms kahan examine karoge?"},"story":{"en":"Riya compares a social-media summary with the official offer document. The document may be long, so she starts with the sections that explain the business, risks, financials, issue structure and objects of the issue.","hn":"Riya social-media summary ko official offer document se compare karti hai. Document lamba ho sakta hai, isliye woh business, risks, financials, issue structure aur objects of issue wale sections se shuru karti hai."},"s":{"en":"The Draft Red Herring Prospectus (DRHP), Red Herring Prospectus (RHP) and final prospectus are issue documents used at different stages. The exact document available depends on the issue stage. Review the current official issue document and exchange/issuer disclosures.","hn":"Draft Red Herring Prospectus (DRHP), Red Herring Prospectus (RHP) aur final prospectus alag stages par use hone wale issue documents hain. Kaunsa document available hai, woh issue stage par depend karta hai. Current official issue document aur exchange/issuer disclosures review karo."},"p":{"en":"Look at business overview, risk factors, financial statements, litigation/material developments where disclosed, issue objects, promoter/selling shareholder details, price/lot information and use-of-proceeds disclosures. A document is a source for due diligence, not a guarantee of quality.","hn":"Business overview, risk factors, financial statements, disclosed litigation/material developments, issue objects, promoter/selling shareholder details, price/lot information aur use-of-proceeds disclosures dekho. Document due diligence ka source hai, quality ki guarantee nahi."},"think":{"en":"What is a safer basis for an IPO decision: a forwarded message or the official offer document?","hn":"IPO decision ke liye safer basis kya hai: forwarded message ya official offer document?"},"reveal":{"en":"Use the current official offer document and verify facts. A forwarded summary may omit risks or be outdated.","hn":"Current official offer document use karo aur facts verify karo. Forwarded summary risks chhod sakti hai ya outdated ho sakti hai."}},{"k":"info","t":{"en":"Fixed price, price band and book building","hn":"Fixed price, price band aur book building"},"hook":{"en":"An IPO shows a price band rather than one final price. What does the band tell an applicant?","hn":"IPO ek final price ke bajay price band dikhata hai. Ye band applicant ko kya batata hai?"},"story":{"en":"Riya sees a hypothetical issue with a band of ₹95–₹100. She learns that the band is an issue term—not a promise that the stock will trade in that range after listing.","hn":"Riya hypothetical issue mein ₹95–₹100 ka band dekhti hai. Woh samajhti hai ki band issue term hai—listing ke baad stock isi range mein trade karega, aisa promise nahi."},"s":{"en":"In a fixed-price issue, the offer price is specified. In a book-built issue, investors bid within the stated price band and the final issue price is determined under the book-building process and applicable rules. A cut-off option, where available to an eligible category, indicates willingness to apply at the discovered final price.","hn":"Fixed-price issue mein offer price specified hota hai. Book-built issue mein investors stated price band ke andar bid karte hain aur final issue price book-building process aur applicable rules ke mutabik determine hota hai. Eligible category ke liye cut-off option available ho toh iska matlab discovered final price par apply karne ki willingness hai."},"p":{"en":"Check the specific issue’s price band, bid options, lot size, eligible categories and application instructions. These details can differ between issues and may change; do not rely on a remembered number.","hn":"Specific issue ka price band, bid options, lot size, eligible categories aur application instructions check karo. Ye details issues ke beech alag ho sakti hain aur change bhi ho sakti hain; yaad kiye hue number par rely mat karo."},"think":{"en":"Does an IPO price band guarantee the post-listing trading price?","hn":"Kya IPO price band post-listing trading price guarantee karta hai?"},"reveal":{"en":"No. It describes the issue’s bidding/price terms. The market price after listing can be higher or lower.","hn":"Nahi. Ye issue ke bidding/price terms batata hai. Listing ke baad market price upar ya neeche ho sakta hai."}},{"k":"info","t":{"en":"Lot size and application amount","hn":"Lot size aur application amount"},"hook":{"en":"A hypothetical IPO has an upper price of ₹210 and a lot of 70 shares. How can an applicant estimate the amount for one lot at that price?","hn":"Hypothetical IPO ka upper price ₹210 aur lot 70 shares hai. Is price par ek lot ka amount kaise estimate karoge?"},"story":{"en":"Riya multiplies the stated bid price by the number of shares in one lot. She checks the issue’s current application rules instead of assuming every IPO has the same lot size or category limits.","hn":"Riya stated bid price ko ek lot ke shares ki sankhya se multiply karti hai. Woh current issue application rules check karti hai, ye assume nahi karti ki har IPO ka lot size ya category limits same hain."},"s":{"en":"At the upper price, one-lot illustration = ₹210 × 70 = ₹14,700 before considering any applicable process-specific details. This is hypothetical arithmetic, not a current IPO quote or universal minimum.","hn":"Upper price par one-lot illustration = ₹210 × 70 = ₹14,700, applicable process-specific details ko consider karne se pehle. Ye hypothetical calculation hai, current IPO quote ya universal minimum nahi."},"p":{"en":"For a real issue, use its current price band, lot size, investor category and application instructions. Amount and eligibility rules are issue-specific and can be revised by applicable regulations.","hn":"Real issue ke liye current price band, lot size, investor category aur application instructions use karo. Amount aur eligibility rules issue-specific hote hain aur applicable regulations ke saath change ho sakte hain."},"think":{"en":"At ₹210 per share and 70 shares per lot, what is the illustrative amount for one lot at the upper price?","hn":"₹210 per share aur 70 shares per lot par upper price pe ek lot ka illustrative amount kya hai?"},"reveal":{"en":"₹14,700, because 210 × 70 = 14,700. The numbers are hypothetical.","hn":"₹14,700, kyunki 210 × 70 = 14,700. Numbers hypothetical hain."}},{"k":"info","t":{"en":"ASBA and UPI: money is blocked, not sent to a stranger","hn":"ASBA aur UPI: paisa block hota hai, kisi stranger ko nahi bhejna"},"hook":{"en":"You apply for an IPO and receive a legitimate-looking payment request. What should happen to the application money in the official process?","hn":"Aap IPO apply karte ho aur ek legitimate-looking payment request aati hai. Official process mein application money ke saath kya hota hai?"},"story":{"en":"Asha applies through her broker and sees a bank mandate. She checks the name, amount and official application status rather than sending money to a person who messages her.","hn":"Asha broker ke through apply karti hai aur bank mandate dekhti hai. Woh kisi message bhejne wale person ko paisa bhejne ke bajay naam, amount aur official application status check karti hai."},"s":{"en":"In the ASBA process, the application amount is blocked in the bank account. In the supported UPI route, the applicant authorises a block mandate through the relevant payment flow. Funds are debited as applicable for allotted shares; non-allotment should follow the applicable unblock process.","hn":"ASBA process mein application amount bank account mein block hota hai. Supported UPI route mein applicant relevant payment flow se block mandate authorise karta hai. Allotted shares ke liye applicable amount debit hota hai; allotment na ho toh applicable unblock process follow hota hai."},"p":{"en":"Use only the official broker/intermediary and bank/UPI mandate flow described for that issue. Never share your UPI PIN, OTP or account credentials with a person claiming to “confirm” allotment. Verify pending blocks and mandates with your bank and official issue channels.","hn":"Sirf issue ke liye bataye gaye official broker/intermediary aur bank/UPI mandate flow ka use karo. Allotment “confirm” karne ka claim karne wale person ko UPI PIN, OTP ya account credentials kabhi mat do. Pending blocks aur mandates bank aur official issue channels se verify karo."},"think":{"en":"If no shares are allotted, does a normal ASBA application require you to pay a stranger to get your money back?","hn":"Agar shares allot nahi hue, toh normal ASBA application mein paisa wapas paane ke liye stranger ko pay karna padta hai?"},"reveal":{"en":"No. Funds are blocked/unblocked under the official process. Verify any delay through your bank, broker and official issue support; never pay an unofficial recovery agent.","hn":"Nahi. Official process ke mutabik funds block/unblock hote hain. Delay ho toh bank, broker aur official issue support se verify karo; unofficial recovery agent ko pay mat karo."}},{"k":"info","t":{"en":"Subscription and allotment are not the same","hn":"Subscription aur allotment same nahi hain"},"hook":{"en":"A retail IPO is subscribed many times over. Does every applicant get the number of shares requested?","hn":"Retail IPO kai guna subscribe hua hai. Kya har applicant ko requested shares milte hain?"},"story":{"en":"Riya applies for one lot, but demand in her category is much higher than the shares available. She learns that subscription numbers describe demand, not her personal allotment result.","hn":"Riya ek lot ke liye apply karti hai, lekin uski category mein demand available shares se kaafi zyada hai. Woh samajhti hai ki subscription numbers demand batate hain, uska personal allotment result nahi."},"s":{"en":"Subscription compares bids/applications with the shares available in a category or issue. Oversubscription means demand exceeds the shares offered in that measure. Allotment follows the applicable basis of allotment and category rules; it is not guaranteed for every applicant.","hn":"Subscription applications/bids ko category ya issue mein available shares se compare karta hai. Oversubscription ka matlab us measure mein demand offered shares se zyada hai. Allotment applicable basis of allotment aur category rules follow karta hai; har applicant ke liye guaranteed nahi."},"p":{"en":"Check the official allotment status and relevant registrar/exchange/issuer channel. Do not assume that applying multiple times through prohibited or duplicate applications improves odds; follow the issue instructions and applicable rules.","hn":"Official allotment status aur relevant registrar/exchange/issuer channel check karo. Ye assume mat karo ki prohibited ya duplicate applications se chances badhenge; issue instructions aur applicable rules follow karo."},"think":{"en":"An IPO category is subscribed 8 times. What does that tell you by itself?","hn":"IPO ki ek category 8 guna subscribe hui. Sirf isse kya pata chalta hai?"},"reveal":{"en":"Demand was eight times the shares available under that subscription measure; it does not guarantee allotment or a listing gain.","hn":"Us subscription measure ke hisaab se demand available shares se 8 guna thi; isse allotment ya listing gain guarantee nahi hota."}},{"k":"info","t":{"en":"Listing day: market price can go either way","hn":"Listing day: market price dono taraf ja sakta hai"},"hook":{"en":"An IPO issue price is ₹100. At listing, the first market trades happen at ₹92. Did the investor automatically make a profit?","hn":"IPO issue price ₹100 hai. Listing par first market trades ₹92 par hote hain. Kya investor ne automatically profit banaya?"},"story":{"en":"Riya learns that the issue price is the price determined under the offer process. The listing price is formed in the market after trading begins, based on supply and demand and other factors.","hn":"Riya samajhti hai ki issue price offer process ke mutabik determined price hai. Listing price trading shuru hone ke baad market mein supply-demand aur doosre factors ke basis par banta hai."},"s":{"en":"The stock can list above, at or below the issue price. Subscription level, brand popularity, social-media excitement or unofficial grey-market premiums do not guarantee the listing outcome.","hn":"Stock issue price se upar, barabar ya neeche list ho sakta hai. Subscription level, brand popularity, social-media excitement ya unofficial grey-market premium listing outcome guarantee nahi karte."},"p":{"en":"Example only: issue price ₹100 and a market price of ₹92 would mean a ₹8 per-share difference before transaction costs for an investor allotted at ₹100 and able to sell at ₹92. This is a hypothetical illustration, not a forecast.","hn":"Sirf example: issue price ₹100 aur market price ₹92 ho toh ₹100 par allotment paane aur ₹92 par sell kar paane wale investor ke liye transaction costs se pehle ₹8 per-share difference hoga. Ye hypothetical illustration hai, forecast nahi."},"think":{"en":"Can a popular IPO still list below its issue price?","hn":"Kya popular IPO bhi issue price se neeche list ho sakta hai?"},"reveal":{"en":"Yes. Popularity and demand signals do not guarantee market price or profit.","hn":"Haan. Popularity aur demand signals market price ya profit guarantee nahi karte."}},{"k":"info","t":{"en":"A beginner’s IPO checklist and regional-language support","hn":"Beginner IPO checklist aur regional-language support"},"hook":{"en":"Before deciding, can you explain the business, risks, use of proceeds, issue price/lot, application flow and what could go wrong—in the language you understand best?","hn":"Decision se pehle kya aap business, risks, funds ka use, issue price/lot, application flow aur possible loss ko us language mein explain kar sakte ho jo aapko sabse achhi samajh aati hai?"},"story":{"en":"Riya uses a short checklist and asks for unfamiliar terms to be explained in her preferred language. She does not confuse a fluent explanation with a recommendation to invest.","hn":"Riya short checklist use karti hai aur unfamiliar terms apni preferred language mein explain karne ko kehti hai. Woh fluent explanation ko investment recommendation nahi samajhti."},"s":{"en":"Before applying: verify the official issue document; understand fresh issue vs OFS; read risks and financial information; check price band, lot, category and dates; use official application/payment channels; understand that allotment and returns are uncertain.","hn":"Apply karne se pehle: official issue document verify karo; fresh issue vs OFS samjho; risks aur financial information padho; price band, lot, category aur dates check karo; official application/payment channels use karo; samjho ki allotment aur returns uncertain hain."},"p":{"en":"If an explanation in English/Hinglish is unclear, ask for a simpler example or a supported regional-language explanation. Tax treatment of a real transaction must be checked against current rules, including the Income-tax Act, 2025 and applicable transition provisions for the relevant tax year. A later Ask Master tutor can help explain concepts, but it must not invent live facts, promise returns or silently turn education into personalised advice.","hn":"English/Hinglish explanation clear na ho toh simpler example ya supported regional-language explanation maango. Real transaction ka tax treatment current rules, Income-tax Act, 2025 aur relevant tax year ke applicable transition provisions ke mutabik verify karo. Future Ask Master tutor concepts samjha sakta hai, lekin live facts invent nahi karna, returns promise nahi karna, ya education ko chupke se personalised advice mein badalna nahi chahiye."},"think":{"en":"What is the best next step if a key IPO term is unclear to you?","hn":"Agar IPO ka important term clear nahi hai toh best next step kya hai?"},"reveal":{"en":"Pause and get a verified explanation in your preferred language; do not apply just because of hype or pressure.","hn":"Ruko aur apni preferred language mein verified explanation lo; hype ya pressure ki wajah se apply mat karo."}},{"k":"mc","q":{"en":"Which statement best describes an IPO?","hn":"IPO ko sabse sahi kaunsa statement describe karta hai?"},"o":[[{"en":"A public offer of a company’s shares; allotment and profit are not guaranteed","hn":"Company ke shares ka public offer; allotment aur profit guaranteed nahi"},{"en":"Correct. It belongs to the primary market.","hn":"Sahi. Ye primary market ka hissa hai."}],[{"en":"A guaranteed way to buy shares below market price","hn":"Market se saste shares kharidne ka guaranteed tareeka"},{"en":"No. Issue and market prices differ, and there is no guaranteed profit.","hn":"Nahi. Issue aur market price alag ho sakte hain; guaranteed profit nahi."}],[{"en":"A loan that must pay a fixed interest rate","hn":"Aisa loan jo fixed interest rate zaroor deta hai"},{"en":"That describes some debt instruments, not an equity IPO.","hn":"Ye kuch debt instruments ko describe karta hai, equity IPO ko nahi."}]],"a":0},{"k":"mc","q":{"en":"Who generally receives proceeds from a fresh issue?","hn":"Fresh issue ka proceeds aam taur par kisko milta hai?"},"o":[[{"en":"The issuing company, subject to disclosed issue terms and expenses","hn":"Issuing company ko, disclosed issue terms aur expenses ke subject to"},{"en":"Correct. Check the stated objects and use of proceeds.","hn":"Sahi. Stated objects aur use of proceeds check karo."}],[{"en":"Only the exchange","hn":"Sirf exchange ko"},{"en":"No. The exchange facilitates trading/listing; it is not the issuer.","hn":"Nahi. Exchange trading/listing facilitate karta hai; woh issuer nahi."}],[{"en":"Always the existing selling shareholders","hn":"Hamesha existing selling shareholders ko"},{"en":"That is generally the OFS component, not a fresh issue.","hn":"Ye aam taur par OFS component hai, fresh issue nahi."}]],"a":0},{"k":"mc","q":{"en":"In a pure OFS, who generally receives the sale proceeds?","hn":"Pure OFS mein sale proceeds aam taur par kisko milte hain?"},"o":[[{"en":"The existing shareholders who sell their shares","hn":"Apne shares bechne wale existing shareholders"},{"en":"Correct. It is a sale of existing shares.","hn":"Sahi. Ye existing shares ki sale hai."}],[{"en":"The company as fresh capital","hn":"Company ko fresh capital ke roop mein"},{"en":"Not in a pure OFS; check the offer structure.","hn":"Pure OFS mein nahi; offer structure check karo."}],[{"en":"The applicant’s broker","hn":"Applicant ke broker ko"},{"en":"No. Broker/intermediary facilitates the application.","hn":"Nahi. Broker/intermediary application facilitate karta hai."}]],"a":0},{"k":"mc","q":{"en":"Which is the most reliable source for an IPO’s risks and issue terms?","hn":"IPO ke risks aur issue terms ka sabse reliable source kya hai?"},"o":[[{"en":"The current official offer document and official issue disclosures","hn":"Current official offer document aur official issue disclosures"},{"en":"Correct. Summaries can omit risks or be outdated.","hn":"Sahi. Summaries risks chhod sakti hain ya outdated ho sakti hain."}],[{"en":"A viral social-media post","hn":"Viral social-media post"},{"en":"It may be incomplete, biased or false.","hn":"Woh incomplete, biased ya false ho sakti hai."}],[{"en":"An unofficial grey-market premium alone","hn":"Sirf unofficial grey-market premium"},{"en":"It is not a guarantee or a substitute for due diligence.","hn":"Ye guarantee ya due diligence ka substitute nahi."}]],"a":0},{"k":"mc","q":{"en":"What does an IPO price band tell you?","hn":"IPO price band kya batata hai?"},"o":[[{"en":"The issue’s stated bidding/price range, not a guaranteed listing range","hn":"Issue ki stated bidding/price range, guaranteed listing range nahi"},{"en":"Correct. Post-listing prices can move outside the band.","hn":"Sahi. Listing ke baad prices band ke bahar ja sakte hain."}],[{"en":"The minimum and maximum price the stock can ever trade at","hn":"Stock ka hamesha ka minimum aur maximum price"},{"en":"No. The band relates to the issue process.","hn":"Nahi. Band issue process se related hai."}],[{"en":"The guaranteed profit percentage","hn":"Guaranteed profit percentage"},{"en":"No IPO price band guarantees profit.","hn":"Koi IPO price band profit guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"One hypothetical lot is 70 shares and the bid price is ₹210. What is the one-lot amount at that price?","hn":"Hypothetical lot 70 shares ka hai aur bid price ₹210 hai. Us price par one-lot amount kya hai?"},"o":[[{"en":"₹14,700","hn":"₹14,700"},{"en":"Correct: 70 × ₹210 = ₹14,700. The figures are illustrative.","hn":"Sahi: 70 × ₹210 = ₹14,700. Figures illustrative hain."}],[{"en":"₹280","hn":"₹280"},{"en":"That adds the two numbers instead of multiplying.","hn":"Isme multiply ke bajay add kiya gaya hai."}],[{"en":"₹1,470","hn":"₹1,470"},{"en":"Check the multiplication and place value.","hn":"Multiplication aur place value check karo."}]],"a":0},{"k":"mc","q":{"en":"What happens to application money under the usual ASBA block process?","hn":"Usual ASBA block process mein application money ka kya hota hai?"},"o":[[{"en":"It is blocked in the account and debited as applicable for allotted shares","hn":"Account mein block hota hai aur allotted shares ke liye applicable amount debit hota hai"},{"en":"Correct. Follow the official process and verify the mandate.","hn":"Sahi. Official process follow karo aur mandate verify karo."}],[{"en":"It must be sent to a person who promises allotment","hn":"Allotment ka promise karne wale person ko bhejna hota hai"},{"en":"No. Never pay unofficial agents or share credentials.","hn":"Nahi. Unofficial agents ko pay ya credentials share mat karo."}],[{"en":"It is always immediately transferred to the company when you apply","hn":"Apply karte hi hamesha company ko transfer ho jaata hai"},{"en":"No. ASBA blocks the amount pending the issue process.","hn":"Nahi. ASBA issue process ke dauran amount block karta hai."}]],"a":0},{"k":"mc","q":{"en":"An IPO is subscribed 8 times in one category. What does this mean?","hn":"IPO ek category mein 8 guna subscribe hua. Iska matlab kya hai?"},"o":[[{"en":"Demand is eight times the shares available under that measure; allotment is not guaranteed","hn":"Us measure ke mutabik demand available shares se 8 guna hai; allotment guaranteed nahi"},{"en":"Correct. Category rules and basis of allotment apply.","hn":"Sahi. Category rules aur basis of allotment apply hote hain."}],[{"en":"Every applicant receives eight lots","hn":"Har applicant ko 8 lots milte hain"},{"en":"No. Subscription does not mean individual allotment.","hn":"Nahi. Subscription individual allotment nahi batata."}],[{"en":"The listing price must rise eight times","hn":"Listing price 8 guna badhega"},{"en":"No. Subscription does not predict a guaranteed return.","hn":"Nahi. Subscription guaranteed return predict nahi karta."}]],"a":0},{"k":"mc","q":{"en":"A stock lists below its issue price. Which statement is correct?","hn":"Stock issue price se neeche list hota hai. Kaunsa statement sahi hai?"},"o":[[{"en":"An investor allotted at the issue price may face a loss if selling below it, before costs","hn":"Issue price par allotment paane wale investor ko usse neeche sell karne par costs se pehle loss ho sakta hai"},{"en":"Correct. Listing price can be below, at or above the issue price.","hn":"Sahi. Listing price issue price se neeche, barabar ya upar ho sakta hai."}],[{"en":"All IPO investors still make a profit","hn":"Sab IPO investors phir bhi profit banate hain"},{"en":"No. A lower market price can create a loss.","hn":"Nahi. Lower market price loss de sakta hai."}],[{"en":"SEBI reimburses the difference automatically","hn":"SEBI automatically difference reimburse karta hai"},{"en":"No such guarantee exists.","hn":"Aisi koi guarantee nahi hai."}]],"a":0},{"k":"mc","q":{"en":"A friend sends a message promising guaranteed IPO allotment for an extra fee. What should you do?","hn":"Friend ka message guaranteed IPO allotment ke liye extra fee promise karta hai. Kya karna chahiye?"},"o":[[{"en":"Do not pay; verify through official issue, broker and bank channels","hn":"Pay mat karo; official issue, broker aur bank channels se verify karo"},{"en":"Correct. Guaranteed-allotment claims and unofficial payment requests are warning signs.","hn":"Sahi. Guaranteed-allotment claims aur unofficial payment requests warning signs hain."}],[{"en":"Share your UPI PIN so they can verify your account","hn":"Account verify karne ke liye UPI PIN share karo"},{"en":"Never share your UPI PIN or OTP.","hn":"UPI PIN ya OTP kabhi share mat karo."}],[{"en":"Pay quickly before the offer closes","hn":"Offer close hone se pehle jaldi pay karo"},{"en":"Pressure is a reason to pause and verify.","hn":"Pressure ho toh ruk kar verify karna chahiye."}]],"a":0},{"k":"end"}];
UNITS.x34=[{"k":"info","t":{"en":"The app shows green—but what did you actually earn?","hn":"App green hai—but actual kamai kitni hui?"},"hook":{"en":"Riya sells a share and sees “+₹500” on the screen. Can she treat that number as final take-home profit without checking anything else?","hn":"Riya share bechti hai aur screen par “+₹500” dekhti hai. Kya bina kuch aur check kiye ise final profit maan sakti hai?"},"story":{"en":"A displayed gain may be a gross price difference or an estimate. Actual result depends on executed trades, charges and applicable tax treatment.","hn":"Displayed gain gross price difference ya estimate ho sakta hai. Actual result executed trades, charges aur applicable tax treatment par depend karta hai."},"s":{"en":"Gross profit/loss is calculated before relevant costs. Net result is what remains after the relevant costs are included; tax liability may require a separate calculation.","hn":"Gross profit/loss relevant costs se pehle calculate hota hai. Relevant costs include karne ke baad jo bache woh net result hai; tax liability ka alag calculation ho sakta hai."},"p":{"en":"If gross gain is ₹500 and assumed transaction costs are ₹65, the result after those costs is ₹435 before any separate tax liability. This is an illustration, not a quote.","hn":"Gross gain ₹500 aur assumed transaction costs ₹65 hon, toh un costs ke baad result ₹435 hai, kisi separate tax liability se pehle. Ye illustration hai, fee quote nahi."},"think":{"en":"Why should you avoid treating an app’s green number as final profit?","hn":"App ke green number ko final profit kyun nahi maanna chahiye?"},"reveal":{"en":"It may not include all applicable charges and tax treatment; reconcile records and use current rules.","hn":"Usmein saare applicable charges aur tax treatment shamil na hon; records reconcile karo aur current rules dekho."}},{"k":"info","t":{"en":"Gross result vs net result","hn":"Gross result aur net result"},"hook":{"en":"Riya wants a repeatable way to estimate her result. Which calculation should she do first?","hn":"Riya apna result calculate karne ka repeatable tareeka chahti hai. Sabse pehle kya calculate kare?"},"story":{"en":"For a simple buy-then-sell example, gross price result = (sell price − buy price) × quantity, before transaction costs and tax treatment.","hn":"Simple buy-then-sell example mein gross price result = (sell price − buy price) × quantity, transaction costs aur tax treatment se pehle."},"s":{"en":"A practical estimate then subtracts applicable costs, while actual taxable income/gain follows the rules for that instrument and transaction. Do not assume every charge applies in the same way to every product.","hn":"Practical estimate mein phir applicable costs subtract hote hain, jabki actual taxable income/gain instrument aur transaction ke rules follow karta hai. Har product par har charge same tarah lagta hai, aisa assume mat karo."},"p":{"en":"Buy 20 shares at ₹100 and sell at ₹108: gross result = ₹8 × 20 = ₹160 before costs. If assumed costs are ₹25, result after those costs is ₹135 before any separate tax calculation.","hn":"20 shares ₹100 par buy aur ₹108 par sell: gross result = ₹8 × 20 = ₹160 charges se pehle. Assumed costs ₹25 hon, toh unke baad result ₹135 hai, separate tax calculation se pehle."},"think":{"en":"Which amount is calculated before costs: gross or net?","hn":"Costs se pehle kaunsa amount hota hai: gross ya net?"},"reveal":{"en":"Gross is before costs; net includes the relevant costs accounted for.","hn":"Gross costs se pehle; net mein relevant costs account hote hain."}},{"k":"info","t":{"en":"Brokerage and broker tariff","hn":"Brokerage aur broker tariff"},"hook":{"en":"Two friends make similar trades but see different brokerage. Is one necessarily wrong?","hn":"Do friends similar trade karte hain par brokerage alag dikh rahi hai. Kya zaroori hai ki ek galat ho?"},"story":{"en":"Brokerage is the charge a broker applies under its tariff and applicable terms. The amount can depend on the broker, plan, product and transaction.","hn":"Brokerage broker apne tariff aur applicable terms ke hisaab se charge karta hai. Amount broker, plan, product aur transaction par depend kar sakta hai."},"s":{"en":"Check the current tariff and contract note rather than memorising one universal number. Brokerage may be per order, percentage-based or structured in another disclosed way, subject to applicable rules.","hn":"Ek universal number yaad karne ke bajay current tariff aur contract note check karo. Applicable rules ke adheen brokerage per-order, percentage-based ya disclosed structure mein ho sakti hai."},"p":{"en":"Illustration only: if a disclosed hypothetical fee were ₹20 per executed order and two separate orders executed, the illustrative brokerage would be ₹40 before any other charges.","hn":"Sirf example: agar hypothetical disclosed fee ₹20 per executed order ho aur do alag orders execute hon, toh doosre charges se pehle illustrative brokerage ₹40 hogi."},"think":{"en":"Where should you verify your broker’s actual charge?","hn":"Broker ka actual charge kahan verify karna chahiye?"},"reveal":{"en":"In the broker’s current tariff/disclosures and the trade’s contract note—not a generic remembered figure.","hn":"Broker ke current tariff/disclosures aur trade ke contract note mein—not kisi generic yaad kiye number mein."}},{"k":"info","t":{"en":"STT, stamp duty, exchange charges and GST","hn":"STT, stamp duty, exchange charges aur GST"},"hook":{"en":"Riya’s contract note has several line items. Are they all the same kind of charge?","hn":"Riya ke contract note mein kai line items hain. Kya sab ek hi type ke charge hain?"},"story":{"en":"Not necessarily. Depending on the transaction, line items may include Securities Transaction Tax (STT), exchange transaction charges, GST on applicable services/charges, stamp duty, SEBI fees and other applicable items.","hn":"Zaroori nahi. Transaction ke hisaab se line items mein STT, exchange transaction charges, applicable services/charges par GST, stamp duty, SEBI fees aur doosre applicable items ho sakte hain."},"s":{"en":"Applicability and calculation differ by instrument, side, turnover, product and current rules. DP charges may apply in relevant delivery-sale cases; do not assume they apply to every trade identically.","hn":"Applicability aur calculation instrument, side, turnover, product aur current rules par depend karte hain. Relevant delivery-sale cases mein DP charges lag sakte hain; har trade par same assume mat karo."},"p":{"en":"A contract note can show multiple separate charges. Learn each label and compare it against the current broker/exchange disclosures; this course does not hard-code a supposedly timeless rate.","hn":"Contract note mein alag charges ho sakte hain. Har label samjho aur current broker/exchange disclosures se compare karo; course kisi rate ko hamesha valid maan kar hard-code nahi karta."},"think":{"en":"Should you memorise a single STT or stamp-duty number for every trade?","hn":"Kya har trade ke liye ek hi STT ya stamp-duty number yaad karna chahiye?"},"reveal":{"en":"No. Verify current official rates and applicability for the instrument and transaction date.","hn":"Nahi. Instrument aur transaction date ke liye current official rates aur applicability verify karo."}},{"k":"info","t":{"en":"Worked example: estimate the result after assumed costs","hn":"Solved example: assumed costs ke baad result"},"hook":{"en":"Riya’s gross gain is ₹1,000. For practice, assume relevant transaction costs total ₹80. What remains after those assumed costs?","hn":"Riya ka gross gain ₹1,000 hai. Practice ke liye maan lo relevant transaction costs ₹80 hain. Un assumed costs ke baad kitna bachega?"},"story":{"en":"Use arithmetic to separate the concepts: gross result minus the assumed relevant costs gives a pre-tax estimate after those costs.","hn":"Concepts alag rakhne ke liye arithmetic use karo: gross result minus assumed relevant costs se un costs ke baad pre-tax estimate milta hai."},"s":{"en":"This does not calculate actual tax due. Tax treatment depends on the type of security, holding period, transaction type and current law.","hn":"Ye actual tax due calculate nahi karta. Tax treatment security type, holding period, transaction type aur current law par depend karta hai."},"p":{"en":"₹1,000 − ₹80 = ₹920 after the assumed transaction costs, before any separate tax calculation. ₹80 is only a hypothetical cost input.","hn":"₹1,000 − ₹80 = ₹920 assumed transaction costs ke baad, separate tax calculation se pehle. ₹80 sirf hypothetical cost input hai."},"think":{"en":"Is ₹920 automatically the final after-tax amount?","hn":"Kya ₹920 automatically final after-tax amount hai?"},"reveal":{"en":"No. It is only the result after the assumed costs; separate tax treatment may apply.","hn":"Nahi. Ye sirf assumed costs ke baad ka result hai; separate tax treatment apply ho sakta hai."}},{"k":"info","t":{"en":"Read the contract note","hn":"Contract note padhna seekho"},"hook":{"en":"Riya wants proof of what actually executed and which charges were recorded. Which document should she inspect?","hn":"Riya ko verify karna hai ki actually kya execute hua aur kaunse charges record hue. Kaunsa document dekhe?"},"story":{"en":"A contract note is a formal broker-provided record of executed trades and relevant transaction details/charges. It helps reconcile security, quantity, price and charges.","hn":"Contract note broker ka formal record hai jo executed trades aur relevant transaction details/charges dikhata hai. Security, quantity, price aur charges reconcile karne mein help karta hai."},"s":{"en":"Compare it with order/trade history and the broker ledger. If a discrepancy appears, preserve the record and contact the broker through its official channel.","hn":"Ise order/trade history aur broker ledger se compare karo. Discrepancy ho toh record sambhalo aur broker ke official channel se contact karo."},"p":{"en":"For example, if you requested 100 shares but only 60 executed, the contract note/trade details should be reconciled against the actual executed quantity—not just the original order request.","hn":"Example: 100 shares request kiye par sirf 60 execute hue, toh contract note/trade details actual executed quantity se reconcile karo—not sirf original order request se."},"think":{"en":"Does a contract note show a company’s entire financial performance?","hn":"Kya contract note company ki poori financial performance dikhata hai?"},"reveal":{"en":"No. It is a record of your broker-executed trades and related details, not the company’s financial statements.","hn":"Nahi. Ye aapke broker-executed trades aur related details ka record hai, company ke financial statements nahi."}},{"k":"info","t":{"en":"Contract note vs ledger vs demat statement","hn":"Contract note vs ledger vs demat statement"},"hook":{"en":"Riya sees a funds entry she does not recognise and a holding movement she did not expect. Should she check just one document?","hn":"Riya ko funds ki unknown entry aur unexpected holding movement dikhta hai. Kya sirf ek document check kare?"},"story":{"en":"These records answer different questions: contract note records executed trades and charges; broker ledger records funds-related entries with the broker; demat statement records securities holdings and movements. A CAS can summarise eligible holdings across relevant accounts.","hn":"In records ke kaam alag hain: contract note executed trades aur charges record karta hai; broker ledger funds-related entries dikhata hai; demat statement securities holdings aur movements dikhata hai. CAS relevant accounts ki eligible holdings ka summary de sakta hai."},"s":{"en":"Reconcile the order/trade history, contract note, ledger and demat statement as relevant. Save dates, timestamps, copies and complaint reference numbers.","hn":"Relevant hone par order/trade history, contract note, ledger aur demat statement reconcile karo. Dates, timestamps, copies aur complaint reference numbers sambhalo."},"p":{"en":"If the trade record shows a purchase but the expected holding is missing after the applicable settlement timeline, contact the broker/depository participant through official channels and preserve evidence.","hn":"Agar trade record purchase dikhata hai par applicable settlement timeline ke baad expected holding missing hai, toh official channel se broker/DP ko contact karo aur evidence sambhalo."},"think":{"en":"Which record mainly shows securities holdings and movements?","hn":"Kaunsa record mainly securities holdings aur movements dikhata hai?"},"reveal":{"en":"The demat statement; the contract note and ledger serve different purposes.","hn":"Demat statement; contract note aur ledger ke purposes alag hain."}},{"k":"info","t":{"en":"Tax treatment: do not guess from one rule","hn":"Tax treatment: ek rule se guess mat karo"},"hook":{"en":"A friend says every market gain is taxed at the same rate. Is that a safe assumption?","hn":"Dost kehta hai market ka har gain same rate se tax hota hai. Kya ye safe assumption hai?"},"story":{"en":"Tax treatment can differ by listed equity holding period, transaction type, security/instrument and current tax law. Intraday and derivatives transactions can have different classification and reporting considerations from delivery investments.","hn":"Tax treatment listed equity holding period, transaction type, security/instrument aur current tax law ke hisaab se alag ho sakta hai. Intraday aur derivatives transactions ki classification/reporting delivery investments se alag ho sakti hai."},"s":{"en":"This learning module explains the vocabulary, not personalised tax advice. For tax years beginning on or after 1 April 2026, the Income-tax Act, 2025 applies; earlier tax years and proceedings may remain governed by transitional provisions of the repealed Act. Verify current official Income Tax Department/CBDT guidance and consult a qualified tax professional for your circumstances.","hn":"Ye learning module terminology samjhata hai, personalised tax advice nahi. 1 April 2026 se shuru hone wale tax years ke liye Income-tax Act, 2025 apply hota hai; earlier tax years aur proceedings par repealed Act ke transitional provisions apply ho sakte hain. Current official Income Tax Department/CBDT guidance verify karo aur apni situation ke liye qualified tax professional se salah lo."},"p":{"en":"Never use an old screenshot or a remembered rate as the sole basis for calculating tax due in a current financial year.","hn":"Current financial year ka tax calculate karne ke liye purana screenshot ya yaad kiya rate hi sole basis mat banao."},"think":{"en":"What is the right next step if you need to calculate your actual tax liability?","hn":"Actual tax liability calculate karni ho toh sahi next step kya hai?"},"reveal":{"en":"Check current official tax guidance and seek qualified advice where needed.","hn":"Current official tax guidance check karo aur zaroorat par qualified advice lo."}},{"k":"info","t":{"en":"Investor safety and complaint records","hn":"Investor safety aur complaint records"},"hook":{"en":"A stranger promises to recover Riya’s losses if she shares her trading login and OTP. What should she do?","hn":"Koi stranger login aur OTP share karne par Riya ka loss recover karne ka promise karta hai. Use kya karna chahiye?"},"story":{"en":"Never share passwords, OTPs, TPIN or account credentials. Verify intermediaries through official sources and do not pay an unofficial recovery agent or transfer money because of a social-media promise.","hn":"Password, OTP, TPIN ya account credentials kabhi share mat karo. Intermediaries official sources se verify karo; unofficial recovery agent ko payment ya social-media promise par transfer mat karo."},"s":{"en":"For a discrepancy, preserve records and contact the concerned broker/entity first. If unresolved, follow the current applicable exchange/depository grievance route and SEBI SCORES process. These routes do not guarantee a particular outcome.","hn":"Discrepancy par records sambhalo aur pehle concerned broker/entity ko contact karo. Resolve na ho toh current applicable exchange/depository grievance route aur SEBI SCORES process follow karo. Ye routes kisi particular outcome ki guarantee nahi."},"p":{"en":"Useful records include contract notes, statements, order IDs, timestamps, complaint correspondence and reference numbers. Official starting points: https://investor.sebi.gov.in/Investor-charter.html and https://scores.sebi.gov.in/ .","hn":"Useful records: contract notes, statements, order IDs, timestamps, complaint correspondence aur reference numbers. Official starting points: https://investor.sebi.gov.in/Investor-charter.html aur https://scores.sebi.gov.in/ ."},"think":{"en":"What should you preserve when reporting a suspicious or unauthorised trade?","hn":"Suspicious ya unauthorised trade report karte waqt kya preserve karna chahiye?"},"reveal":{"en":"Trade/order records, timestamps, statements, messages and official complaint references; never share credentials.","hn":"Trade/order records, timestamps, statements, messages aur official complaint references; credentials kabhi share nahi."}},{"k":"info","t":{"en":"A repeatable reconciliation checklist","hn":"Repeatable reconciliation checklist"},"hook":{"en":"Before closing her trading day, Riya wants a process that does not depend on memory. What should she compare?","hn":"Trading day ke baad Riya aisa process chahti hai jo memory par depend na kare. Kya compare kare?"},"story":{"en":"Compare order and trade status, executed quantity, contract note, broker ledger and demat statement where relevant. Check the broker tariff and official current charge/tax guidance for calculations.","hn":"Order/trade status, executed quantity, contract note, broker ledger aur relevant hone par demat statement compare karo. Calculation ke liye broker tariff aur official current charge/tax guidance check karo."},"s":{"en":"Separate price movement from costs and tax treatment. Keep the assumptions used in any estimate, and do not present illustrative rates as actual current rates.","hn":"Price movement ko costs aur tax treatment se alag rakho. Estimate ke assumptions note karo aur illustrative rates ko actual current rates ki tarah present mat karo."},"p":{"en":"Checklist: (1) verify fills, (2) reconcile contract note, (3) reconcile funds ledger, (4) reconcile securities movement, (5) investigate differences through official channels.","hn":"Checklist: (1) fills verify karo, (2) contract note reconcile karo, (3) funds ledger check karo, (4) securities movement reconcile karo, (5) differences official channel se investigate karo."},"think":{"en":"Why use a checklist rather than rely only on memory?","hn":"Sirf memory par depend karne ke bajay checklist kyun use karein?"},"reveal":{"en":"It creates a repeatable evidence trail and helps catch mismatches early.","hn":"Repeatable evidence trail banta hai aur mismatches jaldi pakadne mein madad milti hai."}},{"k":"mc","q":{"en":"Which formula gives a simple gross buy-then-sell result before costs?","hn":"Costs se pehle simple gross buy-then-sell result ka formula kya hai?"},"o":[[{"en":"(Sell price − buy price) × quantity","hn":"(Sell price − buy price) × quantity"},{"en":"Correct. This is before relevant transaction costs and tax treatment.","hn":"Sahi. Ye relevant transaction costs aur tax treatment se pehle hai."}],[{"en":"Buy price + quantity","hn":"Buy price + quantity"},{"en":"That is not a profit calculation.","hn":"Ye profit calculation nahi."}],[{"en":"Charges × quantity only","hn":"Sirf charges × quantity"},{"en":"That does not calculate the price result.","hn":"Ye price result calculate nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Gross gain is ₹1,000 and assumed transaction costs are ₹80. What is the result after those assumed costs, before separate tax calculation?","hn":"Gross gain ₹1,000 aur assumed transaction costs ₹80 hain. Separate tax calculation se
