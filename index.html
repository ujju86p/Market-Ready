ay mein saare costs ya tax treatment na hon."}],[{"en":"It is always doubled after settlement","hn":"Settlement ke baad hamesha double hota hai"},{"en":"Settlement does not double profit.","hn":"Settlement profit double nahi karta."}]],"a":0},{"k":"mc","q":{"en":"What should you do if a contract note and your order history appear inconsistent?","hn":"Contract note aur order history inconsistent lage toh kya karein?"},"o":[[{"en":"Save the records and contact the broker through its official channel","hn":"Records save karo aur official channel se broker ko contact karo"},{"en":"Correct. Include order IDs and timestamps where available.","hn":"Sahi. Available ho toh order IDs aur timestamps include karo."}],[{"en":"Delete the records","hn":"Records delete karo"},{"en":"Keep evidence to investigate the issue.","hn":"Issue investigate karne ke liye evidence rakho."}],[{"en":"Share your OTP with a recovery agent","hn":"Recovery agent ko OTP do"},{"en":"Never share OTPs or credentials.","hn":"OTP ya credentials kabhi share mat karo."}]],"a":0},{"k":"mc","q":{"en":"What is the best source for current tax treatment on a real transaction?","hn":"Real transaction ke current tax treatment ke liye best source kya hai?"},"o":[[{"en":"Current official tax guidance and a qualified tax professional where needed","hn":"Current official tax guidance aur zaroorat par qualified tax professional"},{"en":"Correct. This module is educational, not personalised tax advice.","hn":"Sahi. Ye module educational hai, personalised tax advice nahi."}],[{"en":"An old screenshot","hn":"Purana screenshot"},{"en":"It may reflect outdated rules.","hn":"Woh outdated rules reflect kar sakta hai."}],[{"en":"A fixed rate memorised for every asset","hn":"Har asset ke liye ek fixed yaad kiya rate"},{"en":"Tax treatment can differ by instrument and transaction.","hn":"Tax treatment instrument aur transaction ke hisaab se alag ho sakta hai."}]],"a":0},{"k":"mc","q":{"en":"A stranger offers to recover a trading loss for your login and OTP. What should you do?","hn":"Koi login aur OTP ke badle trading loss recover karne ka promise kare toh kya karein?"},"o":[[{"en":"Refuse to share credentials and use official support/grievance channels","hn":"Credentials share mat karo aur official support/grievance channels use karo"},{"en":"Correct. Preserve records and verify any intermediary through official sources.","hn":"Sahi. Records sambhalo aur intermediary ko official sources se verify karo."}],[{"en":"Share them if they sound professional","hn":"Professional lage toh share karo"},{"en":"Credentials can be misused regardless of how someone sounds.","hn":"Koi kaisa bhi lage, credentials misuse ho sakte hain."}],[{"en":"Pay a personal account immediately","hn":"Turant personal account mein paisa bhejo"},{"en":"Unverified recovery offers may be scams.","hn":"Unverified recovery offers scam ho sakte hain."}]],"a":0},{"k":"mc","q":{"en":"Which statement about tax in this lesson is correct?","hn":"Is lesson mein tax ke baare mein kaunsa statement sahi hai?"},"o":[[{"en":"The lesson teaches concepts; actual tax treatment must be checked under current rules","hn":"Lesson concepts sikhata hai; actual tax treatment current rules ke mutabik check karna hoga"},{"en":"Correct. Instrument, holding period and transaction type can matter.","hn":"Sahi. Instrument, holding period aur transaction type matter kar sakte hain."}],[{"en":"Every market transaction has the same tax treatment","hn":"Har market transaction ka same tax treatment hota hai"},{"en":"Treatment can differ.","hn":"Treatment alag ho sakta hai."}],[{"en":"No need to verify tax rules once learned","hn":"Ek baar seekh liya toh tax rules verify nahi karne"},{"en":"Rules can change; verify current guidance.","hn":"Rules badal sakte hain; current guidance verify karo."}]],"a":0},{"k":"mc","q":{"en":"Why reconcile the contract note, broker ledger and demat statement?","hn":"Contract note, broker ledger aur demat statement reconcile kyun karein?"},"o":[[{"en":"They record different aspects of trades, funds and securities","hn":"Ye trades, funds aur securities ke alag aspects record karte hain"},{"en":"Correct. Comparing relevant records helps detect mismatches.","hn":"Sahi. Relevant records compare karne se mismatch pakad sakte hain."}],[{"en":"They are identical documents","hn":"Ye identical documents hain"},{"en":"They serve different purposes.","hn":"Inke purposes alag hain."}],[{"en":"Only one is ever needed for every issue","hn":"Har issue ke liye sirf ek hi chahiye"},{"en":"Different discrepancies may require different records.","hn":"Alag discrepancies ke liye alag records chahiye ho sakte hain."}]],"a":0},{"k":"end"}];

// Explicitly restore the Supabase session from an OAuth hash callback before checking the user.
// This avoids rendering the logged-out screen while the callback token is still in the URL.
const authCallbackReady = (async () => {
  try {
    const params = new URLSearchParams(window.location.hash.startsWith("#") ? window.location.hash.slice(1) : "");
    const access_token = params.get("access_token");
    const refresh_token = params.get("refresh_token");
    if (access_token && refresh_token) {
      const { error } = await supabase.auth.setSession({ access_token, refresh_token });
      if (error) {
        console.error("OAuth session restore failed:", error.message);
      } else {
        history.replaceState(null, "", window.location.pathname + window.location.search);
      }
    } else if (params.get("error_description") || params.get("error")) {
      console.error("OAuth callback error:", params.get("error_description") || params.get("error"));
    }
  } catch (error) {
    console.error("OAuth callback processing failed:", error?.message || error);
  }
})();
