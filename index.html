. Leverage, one-off items, equity base aur cash generation check karo."}},{"k":"info","t":{"en":"ROCE: return on capital employed","hn":"ROCE: capital employed par return"},"hook":{"en":"A capital-intensive company earns operating profit using debt and equity funding. Which metric can help examine returns on capital used in operations?","hn":"Capital-intensive company debt aur equity funding se operating profit earn karti hai. Operations mein use capital ka return dekhne ke liye kaunsa metric help kar sakta hai?"},"story":{"en":"Arjun uses ROCE as one lens on operating returns relative to capital employed, while checking the company’s stated formula.","hn":"Arjun ROCE ko operating returns vs capital employed dekhne ke ek lens ki tarah use karta hai, saath mein company ka stated formula check karta hai."},"s":{"en":"ROCE formulas vary. A common approach uses EBIT divided by capital employed, but numerator and denominator definitions must be consistent and suited to the analysis.","hn":"ROCE formulas vary karti hain. Common approach EBIT ÷ capital employed hai, lekin numerator aur denominator definitions consistent aur analysis ke liye suitable honi chahiye."},"p":{"en":"Compare ROCE across years and similar businesses; accounting policies, asset age and business models affect comparability.","hn":"ROCE ko years aur similar businesses mein compare karo; accounting policies, asset age aur business models comparability affect karte hain."},"think":{"en":"Should you compare ROCE across unrelated sectors without context?","hn":"Kya unrelated sectors ka ROCE bina context compare karna chahiye?"},"reveal":{"en":"Not blindly. Capital intensity and business models differ.","hn":"Blindly nahi. Capital intensity aur business models alag hote hain."}},{"k":"info","t":{"en":"P/E ratio: price relative to earnings","hn":"P/E ratio: price vs earnings"},"hook":{"en":"A share trades at ₹200 and its earnings per share are ₹10. What is the simple P/E ratio?","hn":"Share ₹200 par trade karta hai aur EPS ₹10 hai. Simple P/E ratio kya hai?"},"story":{"en":"Arjun compares the share price with earnings per share. P/E can reflect growth expectations, risk, rates, accounting and market sentiment.","hn":"Arjun share price ko earnings per share se compare karta hai. P/E growth expectations, risk, rates, accounting aur market sentiment reflect kar sakta hai."},"s":{"en":"P/E = share price ÷ earnings per share, using a clearly stated earnings period such as trailing or forecast earnings. If earnings are negative or unusually small, interpretation becomes limited or meaningless.","hn":"P/E = share price ÷ earnings per share, clearly stated trailing ya forecast earnings period ke saath. Earnings negative ya unusually small ho toh interpretation limited ya meaningless ho sakti hai."},"p":{"en":"Illustration: ₹200 ÷ ₹10 = 20 times. A P/E of 20 does not by itself say the share is cheap or expensive.","hn":"Illustration: ₹200 ÷ ₹10 = 20 times. P/E 20 akela nahi batata share cheap hai ya expensive."},"think":{"en":"Is the lower-P/E company always the better investment?","hn":"Kya lower-P/E company hamesha better investment hai?"},"reveal":{"en":"No. Growth, risk, earnings quality, sector and future expectations matter.","hn":"Nahi. Growth, risk, earnings quality, sector aur future expectations matter karte hain."}},{"k":"info","t":{"en":"EPS: profit per share needs context","hn":"EPS: per-share profit ka context"},"hook":{"en":"Net profit increases but the number of shares also rises. Could earnings per share rise less than total profit—or even fall?","hn":"Net profit badhta hai par shares ki sankhya bhi badhti hai. Kya EPS total profit se kam rate se badh sakta hai ya gir bhi sakta hai?"},"story":{"en":"Arjun checks earnings per share (EPS), which relates a relevant profit measure to the weighted average number of shares under applicable accounting rules.","hn":"Arjun earnings per share (EPS) check karta hai, jo applicable accounting rules ke mutabik relevant profit measure ko weighted average shares se relate karta hai."},"s":{"en":"Basic and diluted EPS can differ. New share issuance, options, convertibles and changes in profit affect per-share results. Read the reported definition and notes.","hn":"Basic aur diluted EPS differ kar sakte hain. New share issuance, options, convertibles aur profit changes per-share results affect karte hain. Reported definition aur notes padho."},"p":{"en":"Do not compare EPS across companies without checking share structure, accounting periods and one-off items.","hn":"Share structure, accounting periods aur one-off items check kiye bina companies ka EPS compare mat karo."},"think":{"en":"Can total profit rise while EPS falls?","hn":"Kya total profit badh sakta hai jab EPS gir jaye?"},"reveal":{"en":"Yes, for example if the share count rises enough or the relevant profit measure changes differently.","hn":"Haan, jaise share count enough badh jaye ya relevant profit measure alag tarah change ho."}},{"k":"info","t":{"en":"Ratios work best together","hn":"Ratios ko saath mein use karo"},"hook":{"en":"A company has a high ROE but also rising debt and weak cash conversion. Is one good ratio enough to conclude?","hn":"Company ka ROE high hai, lekin debt badh raha hai aur cash conversion weak hai. Kya ek good ratio conclusion ke liye enough hai?"},"story":{"en":"Arjun puts ratios side by side with business fundamentals, cash flow, disclosures, industry context and several years of results.","hn":"Arjun ratios ko business fundamentals, cash flow, disclosures, industry context aur multiple years ke results ke saath dekhta hai."},"s":{"en":"Ratios can be distorted by one-off items, accounting choices, leverage, seasonality or a small denominator. Definitions and data quality should be checked before comparing.","hn":"Ratios one-off items, accounting choices, leverage, seasonality ya small denominator se distort ho sakte hain. Compare karne se pehle definitions aur data quality check karo."},"p":{"en":"This lesson is educational. For real companies, use current official filings and read notes; do not treat ratios as personalised investment advice or a guaranteed signal.","hn":"Ye lesson educational hai. Real companies ke liye current official filings aur notes padho; ratios ko personalised investment advice ya guaranteed signal mat samjho."},"think":{"en":"What is the better approach: one ratio or a consistent set of measures with context?","hn":"Better approach kya hai: ek ratio ya context ke saath consistent measures ka set?"},"reveal":{"en":"Use several relevant ratios, cash-flow evidence, filings and industry context together.","hn":"Kai relevant ratios, cash-flow evidence, filings aur industry context ko saath use karo."}},{"k":"mc","q":{"en":"Current assets are ₹180 crore and current liabilities ₹120 crore. What is the current ratio?","hn":"Current assets ₹180 crore aur current liabilities ₹120 crore hain. Current ratio kya hai?"},"o":[[{"en":"1.5 times","hn":"1.5 times"},{"en":"Correct: 180 ÷ 120 = 1.5.","hn":"Sahi: 180 ÷ 120 = 1.5."}],[{"en":"0.67 times","hn":"0.67 times"},{"en":"That reverses the division.","hn":"Ismein division reverse hai."}],[{"en":"₹60 crore","hn":"₹60 crore"},{"en":"A ratio is expressed as a multiple here.","hn":"Yahan ratio multiple ke roop mein hai."}]],"a":0},{"k":"mc","q":{"en":"Debt is ₹40 crore and equity is ₹100 crore. What is the simple debt-to-equity ratio?","hn":"Debt ₹40 crore aur equity ₹100 crore hai. Simple debt-to-equity ratio kya hai?"},"o":[[{"en":"0.4 times","hn":"0.4 times"},{"en":"Correct: 40 ÷ 100 = 0.4.","hn":"Sahi: 40 ÷ 100 = 0.4."}],[{"en":"2.5 times","hn":"2.5 times"},{"en":"That is equity divided by debt.","hn":"Ye equity divided by debt hai."}],[{"en":"40% of revenue","hn":"Revenue ka 40%"},{"en":"This ratio compares debt with equity, not revenue.","hn":"Ye debt ko equity se compare karta hai, revenue se nahi."}]],"a":0},{"k":"mc","q":{"en":"Profit is ₹15 crore and average equity is ₹100 crore. Simplified ROE?","hn":"Profit ₹15 crore aur average equity ₹100 crore hai. Simplified ROE?"},"o":[[{"en":"15%","hn":"15%"},{"en":"Correct: 15 ÷ 100 × 100 = 15%.","hn":"Sahi: 15 ÷ 100 × 100 = 15%."}],[{"en":"6.7%","hn":"6.7%"},{"en":"That is not the stated calculation.","hn":"Ye stated calculation nahi."}],[{"en":"115%","hn":"115%"},{"en":"Profit is divided by equity, not added to it.","hn":"Profit ko equity se divide karte hain, add nahi."}]],"a":0},{"k":"mc","q":{"en":"Share price is ₹240 and EPS is ₹12. What is the simple P/E?","hn":"Share price ₹240 aur EPS ₹12 hai. Simple P/E kya hai?"},"o":[[{"en":"20 times","hn":"20 times"},{"en":"Correct: 240 ÷ 12 = 20.","hn":"Sahi: 240 ÷ 12 = 20."}],[{"en":"0.05 times","hn":"0.05 times"},{"en":"That reverses the ratio.","hn":"Ismein ratio reverse hai."}],[{"en":"₹228","hn":"₹228"},{"en":"P/E is a ratio, not a subtraction result.","hn":"P/E ratio hai, subtraction result nahi."}]],"a":0},{"k":"mc","q":{"en":"Which can make ROE look high without proving strong underlying operations?","hn":"Kya underlying operations strong prove kiye bina ROE high dikha sakta hai?"},"o":[[{"en":"High leverage or a small equity base","hn":"High leverage ya small equity base"},{"en":"Correct: interpret ROE with capital structure and context.","hn":"Sahi: ROE ko capital structure aur context ke saath interpret karo."}],[{"en":"Only a low share price","hn":"Sirf low share price"},{"en":"ROE uses profit and equity, not share price directly.","hn":"ROE profit aur equity use karta hai, share price directly nahi."}],[{"en":"Guaranteed future dividends","hn":"Guaranteed future dividends"},{"en":"ROE does not guarantee dividends.","hn":"ROE dividends guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Why must the earnings period be clear when comparing P/E ratios?","hn":"P/E compare karte waqt earnings period clear kyun hona chahiye?"},"o":[[{"en":"Trailing and forecast earnings can differ","hn":"Trailing aur forecast earnings alag ho sakte hain"},{"en":"Correct: the denominator basis matters.","hn":"Sahi: denominator ka basis matter karta hai."}],[{"en":"P/E never uses earnings","hn":"P/E kabhi earnings use nahi karta"},{"en":"EPS is the denominator in the simple ratio.","hn":"Simple ratio mein EPS denominator hai."}],[{"en":"The period has no effect on interpretation","hn":"Period ka interpretation par koi effect nahi"},{"en":"Different earnings bases can change the ratio.","hn":"Different earnings bases ratio badal sakte hain."}]],"a":0},{"k":"mc","q":{"en":"Can a current ratio above 1 still hide liquidity pressure?","hn":"Kya current ratio 1 se upar hone par bhi liquidity pressure hide ho sakta hai?"},"o":[[{"en":"Yes; inventory and receivables may not convert quickly to cash","hn":"Haan; inventory aur receivables jaldi cash mein convert nahi ho sakte"},{"en":"Correct: liquidity quality and timing matter.","hn":"Sahi: liquidity quality aur timing matter karti hai."}],[{"en":"No; it guarantees payment ability","hn":"Nahi; payment ability guarantee karta hai"},{"en":"No single ratio guarantees that.","hn":"Koi ratio guarantee nahi karta."}],[{"en":"Only when P/E is negative","hn":"Sirf P/E negative hone par"},{"en":"These are different concepts.","hn":"Ye alag concepts hain."}]],"a":0},{"k":"mc","q":{"en":"What should you do if two companies calculate a ratio differently?","hn":"Do companies ratio differently calculate karein toh kya karein?"},"o":[[{"en":"Check definitions, source data, period and accounting notes","hn":"Definitions, source data, period aur accounting notes check karo"},{"en":"Correct: compare consistent measures.","hn":"Sahi: consistent measures compare karo."}],[{"en":"Ignore the difference","hn":"Difference ignore karo"},{"en":"Definitions can change the meaning.","hn":"Definitions meaning badal sakti hain."}],[{"en":"Assume the higher ratio is always better","hn":"Higher ratio hamesha better maan lo"},{"en":"Direction depends on the metric and context.","hn":"Metric aur context par direction depend karti hai."}]],"a":0},{"k":"end"}];
UNITS.x10=[{"k":"info","t":{"en":"Valuation is an estimate, not a magic number","hn":"Valuation estimate hai, magic number nahi"},"hook":{"en":"Two people see the same company. One thinks ₹150 per share is fair; another estimates ₹190. Can both be using a valuation model?","hn":"Do log ek hi company dekhte hain. Ek ko ₹150 per share fair lagta hai, doosre ka estimate ₹190 hai. Kya dono valuation model use kar sakte hain?"},"story":{"en":"Asha and Kabir analyse an imaginary company called Northstar Tools. They agree on its reported numbers but use different assumptions about growth and risk. Their estimates differ—not necessarily because one made an arithmetic error, but because valuation includes judgement.","hn":"Asha aur Kabir “Northstar Tools” naam ki imaginary company analyse karte hain. Reported numbers same hain, par growth aur risk ke assumptions alag hain. Estimates alag aate hain—zaroori nahi ki kisi ne calculation galat ki ho; valuation mein judgement bhi hota hai."},"s":{"en":"Valuation estimates what an asset or business may be worth using a defined method and assumptions. Intrinsic value is an analyst’s estimate based on expected business economics; it is not directly observable and is not guaranteed to become the market price.","hn":"Valuation ek defined method aur assumptions se estimate karti hai ki asset ya business ki value kya ho sakti hai. Intrinsic value expected business economics par based analyst ka estimate hai; ye directly observable nahi aur market price banne ki guarantee nahi."},"p":{"en":"All numbers in this lesson are hypothetical and for learning only—not current market data, a target price, or a recommendation.","hn":"Is lesson ke saare numbers hypothetical aur sirf learning ke liye hain—current market data, target price ya recommendation nahi."},"think":{"en":"If your estimated value differs from market price, does that prove the market is wrong?","hn":"Agar aapka estimated value market price se alag hai, kya isse prove hota hai ki market galat hai?"},"reveal":{"en":"No. The estimate may be wrong, assumptions may differ, or the market may price risks and information differently.","hn":"Nahi. Estimate galat ho sakta hai, assumptions alag ho sakte hain, ya market risks aur information ko alag price kar raha ho."}},{"k":"info","t":{"en":"Two big families: relative value and present value","hn":"Do bade tareeke: relative value aur present value"},"hook":{"en":"Would you value a house by comparing similar houses nearby, or by estimating the future rent it may generate?","hn":"Ghar ki value aas-paas ke similar ghar compare karke nikaloge, ya future rent estimate karke?"},"story":{"en":"Asha uses two lenses. She compares Northstar with similar businesses, and separately estimates the present value of its future cash flows. The methods answer related but different questions.","hn":"Asha do nazariye use karti hai. Woh Northstar ko similar businesses se compare karti hai, aur alag se future cash flows ki aaj ki value estimate karti hai. Dono tareeke related hain, par sawal thode alag hain."},"s":{"en":"Relative valuation uses comparable assets or companies and multiples such as P/E or EV/EBITDA. Present-value models, including discounted cash flow (DCF), estimate today’s value of expected future cash flows. Asset-based methods use adjusted asset and liability values where appropriate.","hn":"Relative valuation comparable assets ya companies aur P/E ya EV/EBITDA jaise multiples use karti hai. Present-value models, jaise discounted cash flow (DCF), expected future cash flows ki aaj ki value estimate karte hain. Asset-based methods zaroorat ke mutabik adjusted assets aur liabilities ki values use karte hain."},"p":{"en":"No single method fits every company. Method choice depends on business type, data quality, cash-flow pattern and purpose of the analysis.","hn":"Ek method har company ke liye fit nahi hota. Method business type, data quality, cash-flow pattern aur analysis ke purpose par depend karta hai."},"think":{"en":"Which approach explicitly discounts future cash flows back to today?","hn":"Kaunsa approach future cash flows ko discount karke aaj ki value nikalta hai?"},"reveal":{"en":"A present-value model such as DCF. Comparable multiples instead value the company relative to a benchmark.","hn":"DCF jaisa present-value model. Comparable multiples company ko benchmark ke comparison mein value karte hain."}},{"k":"info","t":{"en":"Market price versus your estimated value","hn":"Market price aur aapka estimated value"},"hook":{"en":"A share trades at ₹120. Your careful model estimates ₹150. Is ₹30 a guaranteed profit?","hn":"Share ₹120 par trade ho raha hai. Aapka careful model ₹150 estimate karta hai. Kya ₹30 guaranteed profit hai?"},"story":{"en":"Kabir calls the difference a “valuation gap.” Before acting, Asha asks whether the estimate is reliable, what could invalidate it, and whether the price already reflects future growth.","hn":"Kabir is difference ko “valuation gap” kehta hai. Action lene se pehle Asha poochti hai: estimate kitna reliable hai, kya use galat sabit kar sakta hai, aur kya price future growth ko pehle se include karta hai?"},"s":{"en":"Market price is the current traded price; estimated value is a model output. A price below an estimate may look attractive only if the assumptions, business quality, risks and time horizon hold up.","hn":"Market price current traded price hai; estimated value model ka output hai. Estimate se neeche price tabhi attractive lag sakta hai jab assumptions, business quality, risks aur time horizon theek se evaluate kiye gaye hon."},"p":{"en":"A valuation gap can persist or widen. The market price can fall further, the business can deteriorate, or your estimate can be too optimistic.","hn":"Valuation gap lamba chal sakta hai ya badh sakta hai. Market price aur gir sakta hai, business kharab ho sakta hai, ya aapka estimate zyada optimistic ho sakta hai."},"think":{"en":"Does an estimated value above market price automatically mean “buy”?","hn":"Kya estimated value market price se upar hone ka matlab automatically “buy” hai?"},"reveal":{"en":"No. Check assumptions, downside risks, business quality and whether the method fits the company. A model is evidence to assess, not an automatic instruction.","hn":"Nahi. Assumptions, downside risks, business quality aur method ki suitability check karo. Model evaluate karne ka evidence hai, automatic instruction nahi."}},{"k":"info","t":{"en":"P/E valuation: earnings multiplied by a multiple","hn":"P/E valuation: earnings ko multiple se multiply karo"},"hook":{"en":"A company earns ₹10 per share. If a comparable, justified P/E multiple is 15, what rough price estimate follows?","hn":"Company ₹10 per share earn karti hai. Agar comparable aur justified P/E multiple 15 ho, toh rough price estimate kya hoga?"},"story":{"en":"Asha writes the simple relationship: estimated value per share ≈ earnings per share (EPS) × an appropriate P/E multiple. The difficult part is justifying the multiple, not multiplying two numbers.","hn":"Asha simple relationship likhti hai: estimated value per share ≈ earnings per share (EPS) × suitable P/E multiple. Mushkil part do numbers multiply karna nahi, balki multiple ko justify karna hai."},"s":{"en":"P/E compares share price with earnings per share. A simple relative estimate can use EPS × a benchmark P/E, but peers should have reasonably comparable growth, risk, profitability, accounting and capital structure.","hn":"P/E share price ko earnings per share se compare karta hai. Simple relative estimate EPS × benchmark P/E se ho sakta hai, lekin peers ki growth, risk, profitability, accounting aur capital structure reasonably comparable honi chahiye."},"p":{"en":"Illustration: EPS ₹10 × P/E 15 = ₹150 per share. This is a hypothetical calculation, not a live quote or target. If earnings are negative or unusually high/low, P/E may be unhelpful or misleading.","hn":"Illustration: EPS ₹10 × P/E 15 = ₹150 per share. Ye hypothetical calculation hai, live quote ya target nahi. Earnings negative ya unusual high/low hon, toh P/E bekaar ya misleading ho sakta hai."},"think":{"en":"If EPS is ₹8 and the chosen comparison multiple is 12, what is the simple estimate?","hn":"EPS ₹8 aur chosen comparison multiple 12 ho, toh simple estimate kya hai?"},"reveal":{"en":"₹96 per share: ₹8 × 12. The quality of the assumptions still matters.","hn":"₹96 per share: ₹8 × 12. Assumptions ki quality phir bhi important hai."}},{"k":"info","t":{"en":"Other multiples: P/B, P/S and EV/EBITDA","hn":"Doosre multiples: P/B, P/S aur EV/EBITDA"},"hook":{"en":"Would you compare a bank only with a software company because both have the same P/E?","hn":"Kya bank ko sirf isliye software company se compare karoge kyunki dono ka P/E same hai?"},"story":{"en":"Asha chooses a metric suited to the business. Book value may be more informative for some asset-heavy or financial businesses; sales can help describe a loss-making company, but says little about profitability on its own.","hn":"Asha business ke hisaab se metric chunti hai. Kuch asset-heavy ya financial businesses mein book value zyada informative ho sakti hai; sales loss-making company ko describe karne mein help karti hai, par akeli profitability nahi batati."},"s":{"en":"P/B compares market value of equity with book equity. P/S compares equity value with sales. EV/EBITDA compares enterprise value—a measure including equity and net debt concepts—with EBITDA. Definitions must be consistent.","hn":"P/B market value of equity ko book equity se compare karta hai. P/S equity value ko sales se compare karta hai. EV/EBITDA enterprise value—jisme equity aur net-debt concepts shamil hote hain—ko EBITDA se compare karta hai. Definitions consistent honi chahiye."},"p":{"en":"Peer multiples can be distorted by debt, cash, accounting choices, margins, one-off items and different business mixes. “Lower multiple” does not automatically mean “cheaper” or “better.”","hn":"Peer multiples debt, cash, accounting choices, margins, one-off items aur different business mix se distort ho sakte hain. “Lower multiple” ka matlab automatically “sasta” ya “better” nahi."},"think":{"en":"Why is comparing a bank and a software company using one multiple alone risky?","hn":"Sirf ek multiple se bank aur software company compare karna risky kyun hai?"},"reveal":{"en":"Their business models, balance sheets, growth and accounting economics differ; the same multiple may not mean the same thing.","hn":"Dono ke business models, balance sheets, growth aur accounting economics alag hain; same multiple ka meaning same nahi hota."}},{"k":"info","t":{"en":"DCF: future cash flows expressed in today’s money","hn":"DCF: future cash flow ko aaj ke paison mein samjho"},"hook":{"en":"Would you value ₹110 received one year from now exactly the same as ₹110 in your hand today?","hn":"Ek saal baad milne wale ₹110 ko aaj haath mein maujood ₹110 ke barabar value doge?"},"story":{"en":"Asha thinks about time and uncertainty. Money received later could have been invested today, and future cash flows may not arrive as expected. DCF accounts for this by discounting projected cash flows.","hn":"Asha time aur uncertainty ke baare mein sochti hai. Baad mein milne wala paisa aaj invest ho sakta tha, aur future cash flows expected tarah se na bhi aayein. DCF projected cash flows ko discount karke is baat ko account karta hai."},"s":{"en":"A simplified present-value formula for one future cash flow is PV = CF ÷ (1 + r)^t, where CF is the future cash flow, r is the discount rate per period, and t is the number of periods. Multi-period DCF adds the present values of expected cash flows and any justified terminal value.","hn":"Ek future cash flow ke liye simplified present-value formula hai PV = CF ÷ (1 + r)^t, jahan CF future cash flow, r per-period discount rate aur t periods ki sankhya hai. Multi-period DCF expected cash flows ki present values aur justified terminal value ko add karta hai."},"p":{"en":"Illustration: ₹110 one year later discounted at 10% gives ₹110 ÷ 1.10 = ₹100 today. Real DCF requires forecasts, a suitable discount rate, and careful terminal-value assumptions.","hn":"Illustration: ek saal baad ke ₹110 ko 10% se discount karein toh ₹110 ÷ 1.10 = aaj ke ₹100. Real DCF ke liye forecasts, suitable discount rate aur terminal-value assumptions ko carefully set karna hota hai."},"think":{"en":"If the future cash flow stays the same but the discount rate rises, what generally happens to its present value?","hn":"Future cash flow same rahe par discount rate badhe, toh generally present value ka kya hota hai?"},"reveal":{"en":"It falls. A higher discount rate reduces the present value of the same future cash flow.","hn":"Present value girti hai. Higher discount rate same future cash flow ki aaj ki value kam karta hai."}},{"k":"info","t":{"en":"Growth and risk assumptions can change the answer","hn":"Growth aur risk ke assumptions answer badal sakte hain"},"hook":{"en":"Your DCF estimate is ₹200. What happens if expected growth is lower or the required return is higher?","hn":"Aapka DCF estimate ₹200 hai. Expected growth kam ho ya required return badhe toh kya hoga?"},"story":{"en":"Asha creates a base case, a cautious case and an optimistic case instead of pretending one forecast is certain. She checks which assumptions drive the result most.","hn":"Asha ek forecast ko certain maan kar nahi chalti. Woh base case, cautious case aur optimistic case banati hai. Phir check karti hai ki kaunse assumptions result ko sabse zyada drive karte hain."},"s":{"en":"DCF outputs are sensitive to cash-flow forecasts, discount rates and terminal growth. A small change in a long-run assumption can materially change estimated value, especially when much of the estimate comes from terminal value.","hn":"DCF output cash-flow forecasts, discount rates aur terminal growth ke liye sensitive hota hai. Long-run assumption mein chhota change estimated value ko kaafi badal sakta hai, khaaskar jab estimate ka bada hissa terminal value se aata ho."},"p":{"en":"A sensible analysis shows a range or scenarios, documents assumptions, avoids unrealistic perpetual growth, and checks whether results make economic sense. No model removes uncertainty.","hn":"Sensible analysis range ya scenarios dikhata hai, assumptions document karta hai, unrealistic perpetual growth se bachta hai aur check karta hai ki result economic sense banata hai ya nahi. Koi model uncertainty khatam nahi karta."},"think":{"en":"What is more honest: one precise-looking estimate or a range with clear assumptions?","hn":"Kya zyada honest hai: ek bahut precise dikhne wala estimate ya clear assumptions ke saath range?"},"reveal":{"en":"A range with transparent assumptions usually communicates uncertainty better than false precision.","hn":"Transparent assumptions ke saath range aam taur par uncertainty ko false precision se behtar dikhati hai."}},{"k":"info","t":{"en":"Dividend and asset-based models: know when they fit","hn":"Dividend aur asset-based models: kab use karna hai"},"hook":{"en":"A stable company pays regular dividends. A different company owns valuable assets but has uneven earnings. Should one model be forced onto both?","hn":"Ek stable company regular dividend deti hai. Doosri company ke valuable assets hain par earnings uneven hain. Kya dono par ek hi model force karna chahiye?"},"story":{"en":"Asha considers a dividend discount model for a business whose dividends can be reasonably forecast. For an asset-heavy business, she also asks whether asset values and liabilities tell an important part of the story.","hn":"Asha dividend discount model tab consider karti hai jab business ke dividends reasonably forecast ho sakte hain. Asset-heavy business ke liye woh ye bhi dekhti hai ki asset values aur liabilities kahani ka important hissa batate hain ya nahi."},"s":{"en":"Dividend discount models value expected dividends; constant-growth versions require restrictive assumptions such as a stable perpetual growth rate below the required return. Asset-based valuation estimates adjusted assets less liabilities and may suit some holding, property or financial situations, but book values are not automatically sale values.","hn":"Dividend discount models expected dividends ko value karte hain; constant-growth version mein restrictive assumptions hoti hain, jaise stable perpetual growth required return se kam ho. Asset-based valuation adjusted assets mein se liabilities subtract karti hai aur kuch holding, property ya financial situations mein fit ho sakti hai, lekin book value automatically sale value nahi."},"p":{"en":"For a stable-growth dividend model, a simplified formula is next expected dividend ÷ (required return − growth), only when the assumptions fit and required return exceeds growth. For complex groups, sum-of-the-parts can value business segments separately before adjustments.","hn":"Stable-growth dividend model ka simplified formula hai next expected dividend ÷ (required return − growth), sirf tab jab assumptions fit hon aur required return growth se zyada ho. Complex groups ke liye sum-of-the-parts mein business segments ko separately value karke adjustments kiye ja sakte hain."},"think":{"en":"Why can a dividend model be unsuitable for a company with no predictable dividend policy?","hn":"Jis company ki predictable dividend policy nahi hai, uske liye dividend model unsuitable kyun ho sakta hai?"},"reveal":{"en":"The future dividends may not be forecast reliably. Another model, such as a suitable cash-flow or relative model, may fit better.","hn":"Future dividends reliably forecast nahi ho sakte. Suitable cash-flow ya relative model behtar fit ho sakta hai."}},{"k":"info","t":{"en":"A beginner’s valuation checklist","hn":"Beginner valuation checklist"},"hook":{"en":"Before trusting a valuation spreadsheet, what would you verify first: source data, assumptions, or the colour of the final cell?","hn":"Valuation spreadsheet par trust karne se pehle kya check karoge: source data, assumptions, ya final cell ka colour?"},"story":{"en":"Asha checks the latest company filings, reconciles periods and definitions, compares like with like, and writes down what would make her conclusion wrong. She never treats a spreadsheet as a substitute for thinking.","hn":"Asha latest company filings check karti hai, periods aur definitions reconcile karti hai, like-for-like comparison karti hai, aur likhti hai ki kya uske conclusion ko galat sabit karega. Woh spreadsheet ko thinking ka substitute nahi maanti."},"s":{"en":"Use current official filings and notes, verify the period and units, understand debt and cash, test more than one scenario, compare suitable peers, and keep facts separate from assumptions. Valuation is one input to decision-making, not a standalone buy/sell signal.","hn":"Current official filings aur notes use karo, period aur units verify karo, debt aur cash samjho, ek se zyada scenarios test karo, suitable peers compare karo aur facts ko assumptions se alag rakho. Valuation decision-making ka ek input hai, akela buy/sell signal nahi."},"p":{"en":"This lesson is educational. Examples are hypothetical; actual company values change with data and assumptions. Do not treat the lesson or Ask Master as personalised investment, legal or tax advice.","hn":"Ye lesson educational hai. Examples hypothetical hain; actual company value data aur assumptions ke saath badalti hai. Lesson ya Ask Master ko personalised investment, legal ya tax advice mat samjho."},"think":{"en":"What is the strongest habit when using a valuation model?","hn":"Valuation model use karte waqt sabse achhi habit kya hai?"},"reveal":{"en":"Check source data, disclose assumptions, test sensitivity and treat the output as an estimate—not certainty.","hn":"Source data check karo, assumptions clear rakho, sensitivity test karo aur output ko estimate samjho—certainty nahi."}},{"k":"mc","q":{"en":"EPS is ₹10 and an illustrative P/E multiple is 15. What is the simple estimated value per share?","hn":"EPS ₹10 hai aur illustrative P/E multiple 15 hai. Simple estimated value per share kya hai?"},"o":[[{"en":"₹150","hn":"₹150"},{"en":"Correct: ₹10 × 15 = ₹150. It is a hypothetical estimate, not a target guarantee.","hn":"Sahi: ₹10 × 15 = ₹150. Ye hypothetical estimate hai, target guarantee nahi."}],[{"en":"₹25","hn":"₹25"},{"en":"That adds EPS and the multiple instead of multiplying.","hn":"Ismein EPS aur multiple add kiye gaye hain, multiply nahi."}],[{"en":"₹1.50","hn":"₹1.50"},{"en":"The simple estimate multiplies EPS by the multiple.","hn":"Simple estimate mein EPS ko multiple se multiply karte hain."}]],"a":0},{"k":"mc","q":{"en":"Which model discounts expected future cash flows to their present value?","hn":"Kaunsa model expected future cash flows ko discount karke present value nikalta hai?"},"o":[[{"en":"Discounted cash flow (DCF)","hn":"Discounted cash flow (DCF)"},{"en":"Correct: DCF discounts projected cash flows and may include a terminal value.","hn":"Sahi: DCF projected cash flows discount karta hai aur terminal value include kar sakta hai."}],[{"en":"P/E alone","hn":"Sirf P/E"},{"en":"P/E is a relative multiple, not a cash-flow discounting model.","hn":"P/E relative multiple hai, cash-flow discounting model nahi."}],[{"en":"Market capitalisation only","hn":"Sirf market capitalisation"},{"en":"Market capitalisation is market price times shares, not a DCF model.","hn":"Market capitalisation market price × shares hai, DCF model nahi."}]],"a":0},{"k":"mc","q":{"en":"A stock’s estimated value is above its market price. What does this prove?","hn":"Stock ki estimated value market price se upar hai. Isse kya prove hota hai?"},"o":[[{"en":"Nothing by itself; assumptions and risks still need checking","hn":"Apne aap kuch prove nahi; assumptions aur risks check karne honge"},{"en":"Correct: estimates can be wrong and price can fall further.","hn":"Sahi: estimates galat ho sakte hain aur price aur gir sakta hai."}],[{"en":"A guaranteed profit","hn":"Guaranteed profit"},{"en":"Valuation estimates do not guarantee future returns.","hn":"Valuation estimates future return guarantee nahi karte."}],[{"en":"That the market price must rise tomorrow","hn":"Market price kal zaroor badhega"},{"en":"Models do not predict a guaranteed next-day move.","hn":"Models agle din ka guaranteed move nahi batate."}]],"a":0},{"k":"mc","q":{"en":"Why should a P/E comparison use reasonably similar companies?","hn":"P/E comparison mein reasonably similar companies kyun honi chahiye?"},"o":[[{"en":"Growth, risk, profitability and accounting differences affect the multiple","hn":"Growth, risk, profitability aur accounting differences multiple ko affect karte hain"},{"en":"Correct: peers should be comparable and definitions consistent.","hn":"Sahi: peers comparable aur definitions consistent honi chahiye."}],[{"en":"Every company must have the same share price","hn":"Har company ka share price same hona chahiye"},{"en":"Nominal share price alone does not make companies comparable.","hn":"Nominal share price se companies comparable nahi ban jaati."}],[{"en":"A lower P/E always means better quality","hn":"Lower P/E ka matlab hamesha better quality"},{"en":"A low multiple may reflect real risks or weak prospects.","hn":"Low multiple real risks ya weak prospects dikhata ho sakta hai."}]],"a":0},{"k":"mc","q":{"en":"EPS is ₹8 and an illustrative comparison P/E is 12. What is the simple estimate?","hn":"EPS ₹8 aur illustrative comparison P/E 12 hai. Simple estimate kya hai?"},"o":[[{"en":"₹96","hn":"₹96"},{"en":"Correct: ₹8 × 12 = ₹96 per share, before judging assumptions.","hn":"Sahi: ₹8 × 12 = ₹96 per share; assumptions phir bhi judge karne honge."}],[{"en":"₹20","hn":"₹20"},{"en":"This adds the numbers rather than multiplying.","hn":"Ismein numbers multiply nahi, add kiye gaye hain."}],[{"en":"₹1.5","hn":"₹1.5"},{"en":"That divides the P/E by EPS; it is not the formula.","hn":"Ismein P/E ko EPS se divide kiya; ye formula nahi."}]],"a":0},{"k":"mc","q":{"en":"If a future cash flow is unchanged but the discount rate increases, what usually happens to present value?","hn":"Future cash flow same ho lekin discount rate badhe, toh present value ka kya hota hai?"},"o":[[{"en":"It decreases","hn":"Kam hoti hai"},{"en":"Correct: a higher discount rate reduces present value.","hn":"Sahi: higher discount rate present value kam karta hai."}],[{"en":"It always doubles","hn":"Hamesha double hoti hai"},{"en":"That is not how discounting works.","hn":"Discounting aise kaam nahi karta."}],[{"en":"It must stay identical","hn":"Bilkul same rehni chahiye"},{"en":"The discount rate is a key input to present value.","hn":"Discount rate present value ka key input hai."}]],"a":0},{"k":"mc","q":{"en":"Which is a major weakness of a DCF estimate?","hn":"DCF estimate ki ek major weakness kya hai?"},"o":[[{"en":"It can be very sensitive to forecasts and discount-rate assumptions","hn":"Forecasts aur discount-rate assumptions se kaafi sensitive ho sakta hai"},{"en":"Correct: scenario and sensitivity analysis help reveal this uncertainty.","hn":"Sahi: scenario aur sensitivity analysis uncertainty dikhane mein help karte hain."}],[{"en":"It never uses future estimates","hn":"Ye future estimates kabhi use nahi karta"},{"en":"DCF explicitly relies on projected cash flows.","hn":"DCF projected cash flows use karta hai."}],[{"en":"It guarantees intrinsic value exactly","hn":"Ye intrinsic value exact guarantee karta hai"},{"en":"No valuation model guarantees an exact value.","hn":"Koi valuation model exact value guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Which multiple compares enterprise value with EBITDA?","hn":"Kaunsa multiple enterprise value ko EBITDA se compare karta hai?"},"o":[[{"en":"EV/EBITDA","hn":"EV/EBITDA"},{"en":"Correct: definitions and capital-structure context still matter.","hn":"Sahi: definitions aur capital-structure context phir bhi matter karte hain."}],[{"en":"P/E","hn":"P/E"},{"en":"P/E compares price with earnings per share.","hn":"P/E price ko earnings per share se compare karta hai."}],[{"en":"Current ratio","hn":"Current ratio"},{"en":"Current ratio compares current assets with current liabilities.","hn":"Current ratio current assets ko current liabilities se compare karta hai."}]],"a":0},{"k":"mc","q":{"en":"When can a constant-growth dividend model be appropriate?","hn":"Constant-growth dividend model kab appropriate ho sakta hai?"},"o":[[{"en":"When dividends and growth can reasonably be modelled as stable, with required return above growth","hn":"Jab dividends aur growth reasonably stable model ho sakein aur required return growth se zyada ho"},{"en":"Correct: the formula relies on those restrictive assumptions.","hn":"Sahi: formula in restrictive assumptions par depend karta hai."}],[{"en":"For every company, including those with no predictable dividends","hn":"Har company ke liye, bina predictable dividends wali bhi"},{"en":"A model must fit the company’s dividend pattern.","hn":"Model company ke dividend pattern ke fit hona chahiye."}],[{"en":"Whenever the share price has risen for a week","hn":"Jab share price ek hafte se badha ho"},{"en":"Recent price movement does not justify the model assumptions.","hn":"Recent price movement model assumptions justify nahi karta."}]],"a":0},{"k":"mc","q":{"en":"What should you do before trusting a valuation output?","hn":"Valuation output par trust karne se pehle kya karna chahiye?"},"o":[[{"en":"Verify official data, assumptions, peer fit and sensitivity","hn":"Official data, assumptions, peer fit aur sensitivity verify karo"},{"en":"Correct: valuation is an estimate that must be challenged.","hn":"Sahi: valuation ek estimate hai jise challenge karna chahiye."}],[{"en":"Assume the spreadsheet is objective because it has formulas","hn":"Formula hone se spreadsheet ko objective maan lo"},{"en":"Formulas can still contain poor data or assumptions.","hn":"Formula mein poor data ya assumptions ho sakte hain."}],[{"en":"Treat it as a guaranteed buy/sell signal","hn":"Guaranteed buy/sell signal samjho"},{"en":"A valuation model alone is not a personalised recommendation.","hn":"Valuation model akela personalised recommendation nahi."}]],"a":0},{"k":"end"}];
UNITS.x11=[{"k":"info","t":{"en":"A candle is a summary, not a prediction","hn":"Candlestick ek summary hai, prediction nahi"},"hook":{"en":"A candle opens at ₹100, trades between ₹96 and ₹110, and closes at ₹108. What can one candle tell you?","hn":"Candle ₹100 par khuli, ₹96 se ₹110 ke beech trade hui aur ₹108 par band hui. Ek candle kya bata sakti hai?"},"story":{"en":"Asha studies one candle from an imaginary stock. She records the open, high, low and close before guessing what traders felt.","hn":"Asha ek imaginary stock ki candle dekhti hai. Traders kya soch rahe the ye guess karne se pehle woh open, high, low aur close note karti hai."},"s":{"en":"A candlestick summarises price action for one chosen time interval. It does not reveal every trade, every reason, or the next price move.","hn":"Candlestick ek chosen time interval ka price action summarise karti hai. Ye har trade, har reason ya next price move nahi batati."},"p":{"en":"All prices here are hypothetical learning examples, not live quotes or trade recommendations.","hn":"Yahan saare prices hypothetical learning examples hain, live quotes ya trade recommendations nahi."},"think":{"en":"Which four prices define a standard candle?","hn":"Standard candle ko kaun se chaar prices define karte hain?"},"reveal":{"en":"Open, high, low and close (OHLC).","hn":"Open, high, low aur close (OHLC)."}},{"k":"info","t":{"en":"Read the body: open and close","hn":"Body padho: open aur close"},"hook":{"en":"If a candle closes above its open, what does the body show for that interval?","hn":"Agar candle apne open se upar close ho, toh body us interval ke baare mein kya dikhati hai?"},"story":{"en":"Kabir marks the open at ₹100 and close at ₹108. The body stretches between those two prices; the colour depends on the chart settings.","hn":"Kabir open ₹100 aur close ₹108 mark karta hai. Body in dono prices ke beech hoti hai; colour chart settings par depend kar sakta hai."},"s":{"en":"The body shows the relationship between open and close. A close above open is commonly called bullish; a close below open bearish. This describes that interval only.","hn":"Body open aur close ka relation dikhati hai. Open se upar close ko aam taur par bullish aur neeche close ko bearish kehte hain. Ye sirf us interval ka description hai."},"p":{"en":"Green/red conventions can vary; use the price values and legend rather than relying only on colour.","hn":"Green/red convention badal sakti hai; sirf colour par depend na karke price values aur legend dekho."},"think":{"en":"Open ₹50, close ₹47. What is the candle commonly called?","hn":"Open ₹50 aur close ₹47. Candle ko aam taur par kya kehte hain?"},"reveal":{"en":"Bearish, because close is below open.","hn":"Bearish, kyunki close open se neeche hai."}},{"k":"info","t":{"en":"Wicks show the range beyond the body","hn":"Wicks body ke bahar ka range dikhati hain"},"hook":{"en":"A candle body runs from ₹100 to ₹105, while the high is ₹112 and low is ₹96. What do the wicks add?","hn":"Body ₹100 se ₹105 tak hai, high ₹112 aur low ₹96 hai. Wicks kya extra batati hain?"},"story":{"en":"The upper wick reaches the interval high; the lower wick reaches the interval low. Price visited those levels but did not finish the interval there.","hn":"Upper wick interval ke high tak aur lower wick low tak jaati hai. Price un levels tak gayi, par interval wahi finish nahi hua."},"s":{"en":"The full high-low range gives the interval’s extremes. A long wick may reflect rejection or volatility, but context and follow-through matter.","hn":"High-low range interval ke extremes dikhata hai. Long wick rejection ya volatility ka hint ho sakti hai, par context aur follow-through zaroori hain."},"p":{"en":"A wick alone is not proof of reversal and should not be used as a stand-alone signal.","hn":"Sirf wick reversal ka proof nahi; ise akela signal mat banao."},"think":{"en":"High ₹112, close ₹105. Where does the upper wick end?","hn":"High ₹112 aur close ₹105. Upper wick kahan tak hoti hai?"},"reveal":{"en":"At the high of ₹112.","hn":"₹112 ke high tak."}},{"k":"info","t":{"en":"Timeframe changes the story","hn":"Timeframe badalne se story badalti hai"},"hook":{"en":"A 5-minute candle and a daily candle look different. Why?","hn":"5-minute candle aur daily candle alag kyun dikh sakti hain?"},"story":{"en":"One candle compresses all trades inside its chosen interval. Several 5-minute candles can sit inside one daily candle.","hn":"Ek candle apne interval ke saare trades ko compress karti hai. Kai 5-minute candles ek daily candle ke andar aa sakti hain."},"s":{"en":"Candles depend on timeframe, session boundaries, data source and chart settings. A pattern on one timeframe may look different on another.","hn":"Candles timeframe, session boundaries, data source aur chart settings par depend karti hain. Ek timeframe ka pattern doosre par alag dikh sakta hai."},"p":{"en":"Choose the timeframe before interpreting the pattern and avoid mixing timeframes without a plan.","hn":"Pattern interpret karne se pehle timeframe choose karo; bina plan ke timeframes mix mat karo."},"think":{"en":"A daily candle represents which period?","hn":"Daily candle ka period kya hota hai?"},"reveal":{"en":"The trading day/session defined by that chart’s data settings.","hn":"Chart ki data settings ke hisaab se trading day/session."}},{"k":"info","t":{"en":"Doji and small bodies: indecision, not certainty","hn":"Doji aur small body: indecision, certainty nahi"},"hook":{"en":"Open and close are nearly equal, with wicks on both sides. What is one possible reading?","hn":"Open aur close lagbhag equal hain, dono taraf wicks hain. Ek possible reading kya hai?"},"story":{"en":"Asha calls it a doji-like candle. Buyers and sellers moved price, but neither side kept much advantage by the close.","hn":"Asha ise doji jaisi candle kehti hai. Buyers aur sellers ne price move kiya, par close tak kisi side ka advantage zyada nahi raha."},"s":{"en":"A doji or small body can indicate indecision within that interval. Its meaning depends on trend, location, volume and subsequent price action.","hn":"Doji ya small body us interval ki indecision dikha sakti hai. Meaning trend, location, volume aur baad ke price action par depend karta hai."},"p":{"en":"A doji does not automatically mean a reversal; in sideways markets it may be common noise.","hn":"Doji ka matlab automatic reversal nahi; sideways market mein ye normal noise bhi ho sakti hai."},"think":{"en":"What makes a doji more informative?","hn":"Doji ko zyada informative kya banata hai?"},"reveal":{"en":"Its context and what price does afterward.","hn":"Uska context aur baad mein price kya karta hai."}},{"k":"info","t":{"en":"Hammer-like and shooting-star-like shapes need context","hn":"Hammer aur shooting-star jaisi shapes ko context chahiye"},"hook":{"en":"A small body sits near one end of a long wick. Is the shape enough to trade?","hn":"Small body lambi wick ke ek end ke paas hai. Kya shape trade ke liye enough hai?"},"story":{"en":"A hammer-like candle after a decline may suggest rejection of lower prices. A shooting-star-like candle after a rise may suggest rejection of higher prices.","hn":"Decline ke baad hammer jaisi candle lower prices ka rejection suggest kar sakti hai. Rise ke baad shooting-star jaisi candle higher prices ka rejection suggest kar sakti hai."},"s":{"en":"Names describe shapes, not guaranteed outcomes. Prior trend, support/resistance, volume, candle close and confirmation matter.","hn":"Names shapes describe karte hain, guaranteed outcome nahi. Prior trend, support/resistance, volume, close aur confirmation matter karte hain."},"p":{"en":"Avoid memorising shape names as automatic buy/sell rules.","hn":"Shape names ko automatic buy/sell rules ki tarah yaad mat karo."},"think":{"en":"A hammer-like candle appears in the middle of a range. What is missing?","hn":"Range ke beech hammer jaisi candle bani. Kya missing hai?"},"reveal":{"en":"Useful context and confirmation; the shape alone is insufficient.","hn":"Useful context aur confirmation; shape akeli kaafi nahi."}},{"k":"info","t":{"en":"Engulfing patterns are clues, not commands","hn":"Engulfing patterns clue hain, command nahi"},"hook":{"en":"A candle body fully covers the prior candle’s body. Does that guarantee a trend change?","hn":"Ek candle ki body pichhli candle ki body ko poora cover karti hai. Kya trend change guaranteed hai?"},"story":{"en":"Asha sees a bullish engulfing-like pattern near a level. She notes the location and waits to see whether price follows through.","hn":"Asha ek level ke paas bullish engulfing jaisa pattern dekhti hai. Woh location note karke follow-through dekhti hai."},"s":{"en":"Engulfing patterns compare consecutive candle bodies. Their reliability varies; gaps, market structure and the selected timeframe affect interpretation.","hn":"Engulfing patterns consecutive candle bodies compare karte hain. Reliability vary karti hai; gaps, market structure aur timeframe interpretation ko affect karte hain."},"p":{"en":"Patterns can fail. Define invalidation and risk before any real trade; this lesson is not a trading signal service.","hn":"Patterns fail ho sakte hain. Real trade se pehle invalidation aur risk define karo; ye lesson trading signal service nahi hai."},"think":{"en":"What should follow a pattern label?","hn":"Pattern label ke baad kya dekhna chahiye?"},"reveal":{"en":"Context, confirmation, invalidation and risk—not blind action.","hn":"Context, confirmation, invalidation aur risk—not blind action."}},{"k":"info","t":{"en":"Build a candle-reading routine","hn":"Candle padhne ka routine banao"},"hook":{"en":"Before naming a pattern, what should you check first?","hn":"Pattern ka naam dene se pehle kya check karna chahiye?"},"story":{"en":"Kabir records timeframe, trend, nearby levels, OHLC and volume. Only then does he consider a candle pattern.","hn":"Kabir timeframe, trend, nearby levels, OHLC aur volume note karta hai. Uske baad candle pattern consider karta hai."},"s":{"en":"A repeatable routine reduces impulsive pattern-matching: timeframe → trend/location → candle structure → volume/context → confirmation → risk plan.","hn":"Repeatable routine impulsive pattern-matching kam karta hai: timeframe → trend/location → candle structure → volume/context → confirmation → risk plan."},"p":{"en":"No candle pattern guarantees direction or profit. Practice first with historical charts and paper trading.","hn":"Koi candle pattern direction ya profit guarantee nahi karta. Pehle historical charts aur paper trading par practice karo."},"think":{"en":"What is the safest way to learn patterns?","hn":"Patterns seekhne ka safer tareeka kya hai?"},"reveal":{"en":"Study many examples, record failures too, and paper-test a defined rule.","hn":"Kai examples study karo, failures bhi record karo aur defined rule ko paper-test karo."}},{"k":"mc","q":{"en":"A candle opens at ₹100 and closes at ₹108. What does this usually indicate for that interval?","hn":"Candle ₹100 par open aur ₹108 par close hui. Interval ke liye aam taur par kya indicate hota hai?"},"o":[[{"en":"Bullish candle","hn":"Bullish candle"},{"en":"Close is above open.","hn":"Close open se upar hai."}],[{"en":"Bearish candle","hn":"Bearish candle"},{"en":"Bearish usually means close below open.","hn":"Bearish mein close aam taur par open se neeche hota hai."}],[{"en":"A guaranteed rise tomorrow","hn":"Kal guaranteed rise"},{"en":"One candle cannot guarantee tomorrow’s move.","hn":"Ek candle kal ka move guarantee nahi karti."}]],"a":0},{"k":"mc","q":{"en":"Which values define a standard candlestick?","hn":"Standard candlestick ko kaun se values define karte hain?"},"o":[[{"en":"Open, high, low, close","hn":"Open, high, low, close"},{"en":"These four values summarise the interval.","hn":"Ye chaar values interval summarise karti hain."}],[{"en":"Only volume and price change","hn":"Sirf volume aur price change"},{"en":"Those do not define the candle body and range.","hn":"Ye body aur range define nahi karte."}],[{"en":"Only closing price","hn":"Sirf closing price"},{"en":"Close alone is not a full candle.","hn":"Close akela full candle nahi hai."}]],"a":0},{"k":"mc","q":{"en":"What does a long upper wick show?","hn":"Long upper wick kya dikhati hai?"},"o":[[{"en":"Price reached a higher level but closed below that high","hn":"Price upar gayi par high se neeche close hui"},{"en":"The wick extends from the body toward the interval high.","hn":"Wick body se interval high ki taraf hoti hai."}],[{"en":"Price must rise next","hn":"Price ab zaroor badhegi"},{"en":"A wick does not predict the next move with certainty.","hn":"Wick next move certainty se predict nahi karti."}],[{"en":"The stock has no volatility","hn":"Stock mein volatility nahi"},{"en":"A long wick reflects a wider excursion.","hn":"Long wick wider price excursion dikhati hai."}]],"a":0},{"k":"mc","q":{"en":"Why specify a candle timeframe?","hn":"Candle timeframe specify kyun karna chahiye?"},"o":[[{"en":"Candle meaning depends on the interval and chart settings","hn":"Candle ka meaning interval aur chart settings par depend karta hai"},{"en":"A 5-minute candle and daily candle summarise different periods.","hn":"5-minute aur daily candle alag periods summarise karti hain."}],[{"en":"Timeframe never matters","hn":"Timeframe kabhi matter nahi karta"},{"en":"Timeframe changes the data being summarised.","hn":"Timeframe summarised data badal deta hai."}],[{"en":"It guarantees pattern success","hn":"Ye pattern success guarantee karta hai"},{"en":"No timeframe guarantees a pattern outcome.","hn":"Koi timeframe pattern outcome guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"A doji-like candle appears. What is the best interpretation?","hn":"Doji jaisi candle bani. Best interpretation kya hai?"},"o":[[{"en":"Possible indecision; check context and follow-through","hn":"Possible indecision; context aur follow-through dekho"},{"en":"Near-equal open and close can show a balance during that interval.","hn":"Open-close near equal hone se interval mein balance dikh sakta hai."}],[{"en":"Guaranteed reversal","hn":"Guaranteed reversal"},{"en":"A doji is not a guaranteed reversal.","hn":"Doji guaranteed reversal nahi."}],[{"en":"Guaranteed continuation","hn":"Guaranteed continuation"},{"en":"The shape alone cannot prove continuation.","hn":"Shape akeli continuation prove nahi karti."}]],"a":0},{"k":"mc","q":{"en":"A hammer-like shape appears after a long decline. What should you do with that information?","hn":"Long decline ke baad hammer jaisi shape bani. Is information ka kya karna chahiye?"},"o":[[{"en":"Treat it as a clue and seek context/confirmation","hn":"Clue samjho aur context/confirmation dekho"},{"en":"Location and follow-through affect interpretation.","hn":"Location aur follow-through interpretation affect karte hain."}],[{"en":"Buy automatically","hn":"Automatically buy"},{"en":"A shape alone is not a trading rule.","hn":"Shape akeli trading rule nahi."}],[{"en":"Assume downside risk is zero","hn":"Downside risk zero maan lo"},{"en":"Price can continue falling.","hn":"Price aur gir sakti hai."}]],"a":0},{"k":"mc","q":{"en":"What does an engulfing pattern compare?","hn":"Engulfing pattern kya compare karta hai?"},"o":[[{"en":"Consecutive candle bodies","hn":"Consecutive candle bodies"},{"en":"The newer body covers the prior body under the pattern definition.","hn":"Nayi body pattern definition ke mutabik pichhli body cover karti hai."}],[{"en":"A company’s earnings","hn":"Company ki earnings"},{"en":"That is fundamental analysis, not a candle pattern.","hn":"Ye fundamental analysis hai, candle pattern nahi."}],[{"en":"Only trading fees","hn":"Sirf trading fees"},{"en":"Fees do not define the pattern.","hn":"Fees pattern define nahi karti."}]],"a":0},{"k":"mc","q":{"en":"What is a good routine before interpreting a candle pattern?","hn":"Candle pattern interpret karne se pehle achha routine kya hai?"},"o":[[{"en":"Check timeframe, trend, location, context and risk","hn":"Timeframe, trend, location, context aur risk check karo"},{"en":"A repeatable routine reduces impulsive decisions.","hn":"Repeatable routine impulsive decisions kam karta hai."}],[{"en":"Ignore all prior price action","hn":"Pichhla price action ignore karo"},{"en":"Prior context can change the meaning of a shape.","hn":"Prior context shape ka meaning badal sakta hai."}],[{"en":"Use only the pattern name","hn":"Sirf pattern name use karo"},{"en":"Pattern names are not guarantees.","hn":"Pattern names guarantee nahi hain."}]],"a":0},{"k":"end"}];
UNITS.x12=[{"k":"info","t":{"en":"Trend is structure, not one candle","hn":"Trend structure hai, ek candle nahi"},"hook":{"en":"Price makes successive higher highs and higher lows. What does that often suggest?","hn":"Price successive higher highs aur higher lows bana raha hai. Aam taur par kya suggest hota hai?"},"story":{"en":"Asha marks swing highs and lows across a chart rather than judging from one green candle.","hn":"Asha ek green candle se judge karne ke bajay chart ke swing highs aur lows mark karti hai."},"s":{"en":"An uptrend often has higher highs and higher lows; a downtrend often has lower highs and lower lows. Sideways structure lacks a clear sequence.","hn":"Uptrend mein aksar higher highs aur higher lows; downtrend mein lower highs aur lower lows hote hain. Sideways structure mein clear sequence nahi hota."},"p":{"en":"Trends are descriptive and can change. Define the timeframe and swing points consistently.","hn":"Trend descriptive hai aur change ho sakta hai. Timeframe aur swing points consistently define karo."},"think":{"en":"What structure commonly describes a downtrend?","hn":"Downtrend ko commonly kaunsa structure describe karta hai?"},"reveal":{"en":"Lower highs and lower lows.","hn":"Lower highs aur lower lows."}},{"k":"info","t":{"en":"Use swing points, not every tiny wiggle","hn":"Swing points use karo, har chhota wiggle nahi"},"hook":{"en":"If every tiny move is labelled a new trend, what goes wrong?","hn":"Agar har chhote move ko naya trend bol dein, toh kya problem hogi?"},"story":{"en":"Kabir zooms out and chooses meaningful turning points that fit his stated timeframe.","hn":"Kabir zoom out karke apne chosen timeframe ke meaningful turning points select karta hai."},"s":{"en":"Swing identification involves judgement. A consistent method helps avoid changing the rules to fit a desired conclusion.","hn":"Swing identify karne mein judgement hota hai. Consistent method desired conclusion ke hisaab se rules badalne se bachata hai."},"p":{"en":"Different reasonable analysts may mark slightly different swings; document your rule rather than claiming perfect objectivity.","hn":"Reasonable analysts swings thode alag mark kar sakte hain; perfect objectivity claim karne ke bajay apna rule document karo."},"think":{"en":"What improves swing analysis?","hn":"Swing analysis ko kya improve karta hai?"},"reveal":{"en":"A consistent timeframe and repeatable swing rule.","hn":"Consistent timeframe aur repeatable swing rule."}},{"k":"info","t":{"en":"Support is a zone where demand may appear","hn":"Support ek zone hai jahan demand aa sakti hai"},"hook":{"en":"Price has bounced near ₹200 several times. Is ₹200 a guaranteed floor?","hn":"Price kai baar ₹200 ke paas bounce hui. Kya ₹200 guaranteed floor hai?"},"story":{"en":"Asha shades an area around repeated reactions instead of drawing a magical exact line.","hn":"Asha repeated reactions ke around area shade karti hai, magical exact line nahi."},"s":{"en":"Support is an area where buying interest has previously appeared or may emerge. It can fail; a level is not a promise.","hn":"Support aisa area hai jahan pehle buying interest dikha ho ya phir aa sakta hai. Ye fail ho sakta hai; level promise nahi."},"p":{"en":"Use zones and scenarios; a break may accelerate a move, but false breaks occur too.","hn":"Zones aur scenarios use karo; break move ko accelerate kar sakta hai, par false breaks bhi hote hain."},"think":{"en":"Does support guarantee price cannot fall below it?","hn":"Kya support guarantee karta hai ki price neeche nahi jaayegi?"},"reveal":{"en":"No. Support can break or fail.","hn":"Nahi. Support break ya fail ho sakta hai."}},{"k":"info","t":{"en":"Resistance is a zone where supply may appear","hn":"Resistance ek zone hai jahan supply aa sakti hai"},"hook":{"en":"Price repeatedly struggles near ₹250. What might that area represent?","hn":"Price baar-baar ₹250 ke paas struggle karti hai. Ye area kya represent kar sakta hai?"},"story":{"en":"Sellers or profit-taking may have appeared near that zone previously.","hn":"Pehle us zone ke paas sellers ya profit-taking aaye ho sakte hain."},"s":{"en":"Resistance is an area where selling pressure has previously appeared or may emerge. Strong demand can break through it.","hn":"Resistance aisa area hai jahan selling pressure pehle dikha ho ya aa sakta hai. Strong demand ise break kar sakti hai."},"p":{"en":"Do not assume every touch causes a fall. Plan what would invalidate the idea.","hn":"Har touch par fall assume mat karo. Idea invalid kab hoga, pehle plan karo."},"think":{"en":"What can happen when price reaches resistance?","hn":"Price resistance par aaye toh kya ho sakta hai?"},"reveal":{"en":"It may reject or break through; neither outcome is guaranteed.","hn":"Reject ho sakti hai ya break kar sakti hai; koi outcome guaranteed nahi."}},{"k":"info","t":{"en":"Zones are usually more honest than exact lines","hn":"Zones exact lines se zyada realistic ho sakte hain"},"hook":{"en":"Different charts show reactions at ₹198, ₹201 and ₹204. Must one exact price be “the” support?","hn":"Alag charts ₹198, ₹201 aur ₹204 par reactions dikhate hain. Kya ek exact price hi support hona chahiye?"},"story":{"en":"Asha marks a support zone rather than pretending the market respects one rupee precisely.","hn":"Asha ek support zone mark karti hai, ye pretend nahi karti ki market ek rupee ko precisely respect karta hai."},"s":{"en":"Price levels can be areas due to noise, liquidity, rounding and different market participants. Zones communicate uncertainty better than false precision.","hn":"Noise, liquidity, rounding aur different participants ki wajah se levels area ho sakte hain. Zones false precision se better uncertainty communicate karte hain."},"p":{"en":"Define the zone width before reviewing outcomes to reduce hindsight bias.","hn":"Outcomes dekhne se pehle zone width define karo taaki hindsight bias kam ho."},"think":{"en":"Why might a zone be more useful than a single line?","hn":"Single line ke bajay zone useful kyun ho sakta hai?"},"reveal":{"en":"It acknowledges that reactions can occur across a range.","hn":"Ye maanta hai ki reaction ek range mein ho sakti hai."}},{"k":"info","t":{"en":"Breakout and breakdown need confirmation","hn":"Breakout aur breakdown ko confirmation chahiye"},"hook":{"en":"Price closes above resistance briefly and then falls back into the range. What risk does this show?","hn":"Price resistance ke upar thodi der close hui aur phir range mein aa gayi. Kaunsa risk dikh raha hai?"},"story":{"en":"Kabir labels it a possible false breakout. He checks close, volume, timeframe and whether price holds the zone.","hn":"Kabir ise possible false breakout label karta hai. Woh close, volume, timeframe aur zone hold ho raha hai ya nahi check karta hai."},"s":{"en":"A breakout moves beyond resistance; a breakdown moves below support. Follow-through and retests may help assessment, but no confirmation method is perfect.","hn":"Breakout resistance ke upar aur breakdown support ke neeche move hai. Follow-through aur retest assessment mein help kar sakte hain, par koi method perfect nahi."},"p":{"en":"Avoid entering only because price briefly crosses a line; account for false moves, costs and risk.","hn":"Sirf line briefly cross hone par enter mat karo; false moves, costs aur risk account karo."},"think":{"en":"What is a false breakout?","hn":"False breakout kya hai?"},"reveal":{"en":"A move beyond a level that fails to hold and returns inside the range.","hn":"Level ke bahar move jo hold nahi hota aur range mein laut aata hai."}},{"k":"info","t":{"en":"Role reversal can happen, not always","hn":"Role reversal ho sakta hai, hamesha nahi"},"hook":{"en":"After a breakout, price retests the old resistance area and holds. What is one interpretation?","hn":"Breakout ke baad price purane resistance area ko retest karke hold karti hai. Ek interpretation kya hai?"},"story":{"en":"The old resistance zone may act as support, if buyers defend it.","hn":"Purana resistance zone support ki tarah act kar sakta hai agar buyers defend karein."},"s":{"en":"After a convincing move, a prior resistance area can become support, or prior support can become resistance. This is a hypothesis to test, not a rule.","hn":"Convincing move ke baad purana resistance support ya purana support resistance ban sakta hai. Ye test karne wali hypothesis hai, fixed rule nahi."},"p":{"en":"Retests can fail; use invalidation levels and position-risk rules.","hn":"Retest fail ho sakta hai; invalidation levels aur position-risk rules use karo."},"think":{"en":"Does role reversal always work?","hn":"Kya role reversal hamesha work karta hai?"},"reveal":{"en":"No. It is a possible market behaviour, not a guarantee.","hn":"Nahi. Ye possible behaviour hai, guarantee nahi."}},{"k":"info","t":{"en":"Combine trend and levels into scenarios","hn":"Trend aur levels ko scenarios mein combine karo"},"hook":{"en":"An uptrend approaches resistance. What is more useful than predicting one outcome?","hn":"Uptrend resistance ke paas aa raha hai. Ek outcome predict karne se zyada useful kya hai?"},"story":{"en":"Asha writes two scenarios: rejection toward support, or a confirmed break with follow-through. She states what would invalidate each.","hn":"Asha do scenarios likhti hai: support ki taraf rejection, ya follow-through ke saath confirmed break. Har scenario ka invalidation define karti hai."},"s":{"en":"A structured chart plan identifies trend, nearby zones, possible paths, invalidation and risk. It does not need a confident prediction.","hn":"Structured chart plan trend, nearby zones, possible paths, invalidation aur risk identify karta hai. Confident prediction zaroori nahi."},"p":{"en":"Keep a record of both successful and failed scenarios to evaluate whether the method has value.","hn":"Successful aur failed dono scenarios record karo taaki method ki value evaluate ho."},"think":{"en":"What should a useful chart scenario include?","hn":"Useful chart scenario mein kya hona chahiye?"},"reveal":{"en":"Context, alternative paths, invalidation and risk.","hn":"Context, alternative paths, invalidation aur risk."}},{"k":"mc","q":{"en":"Higher highs and higher lows most often describe which structure?","hn":"Higher highs aur higher lows aksar kaunsa structure describe karte hain?"},"o":[[{"en":"Uptrend","hn":"Uptrend"},{"en":"Both peaks and pullback lows are rising.","hn":"Peaks aur pullback lows dono rise kar rahe hain."}],[{"en":"Downtrend","hn":"Downtrend"},{"en":"Downtrends often show lower highs and lower lows.","hn":"Downtrend mein lower highs aur lower lows hote hain."}],[{"en":"Guaranteed breakout","hn":"Guaranteed breakout"},{"en":"Trend structure does not guarantee a breakout.","hn":"Trend structure breakout guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"What is support in technical analysis?","hn":"Technical analysis mein support kya hai?"},"o":[[{"en":"A zone where buying interest may appear","hn":"Aisa zone jahan buying interest aa sakta hai"},{"en":"It is an area of potential demand, not a guaranteed floor.","hn":"Potential demand ka area hai, guaranteed floor nahi."}],[{"en":"A guaranteed minimum price","hn":"Guaranteed minimum price"},{"en":"Prices can break support.","hn":"Price support tod sakti hai."}],[{"en":"A broker fee","hn":"Broker fee"},{"en":"Fees are unrelated to support zones.","hn":"Fees support zones se unrelated hain."}]],"a":0},{"k":"mc","q":{"en":"What is resistance?","hn":"Resistance kya hai?"},"o":[[{"en":"A zone where selling pressure may appear","hn":"Aisa zone jahan selling pressure aa sakta hai"},{"en":"It may reject price, but can also break.","hn":"Price reject ho sakti hai, par break bhi kar sakti hai."}],[{"en":"A guaranteed ceiling","hn":"Guaranteed ceiling"},{"en":"Resistance is not a hard ceiling.","hn":"Resistance hard ceiling nahi."}],[{"en":"A company’s face value","hn":"Company ki face value"},{"en":"Face value is a separate fundamental/issuance concept.","hn":"Face value alag concept hai."}]],"a":0},{"k":"mc","q":{"en":"Why use zones rather than an exact support line?","hn":"Exact support line ke bajay zones kyun use karein?"},"o":[[{"en":"Price reactions can occur across a range","hn":"Price reactions ek range mein ho sakti hain"},{"en":"Zones acknowledge noise and imperfect precision.","hn":"Zones noise aur imperfect precision accept karte hain."}],[{"en":"Price always respects zones","hn":"Price hamesha zones respect karti hai"},{"en":"Zones can fail too.","hn":"Zones bhi fail ho sakte hain."}],[{"en":"It removes all risk","hn":"Saara risk khatam ho jata hai"},{"en":"No chart tool removes risk.","hn":"Koi chart tool risk khatam nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Price briefly breaks above resistance and then falls back. What is this an example of?","hn":"Price resistance ke upar briefly jaakar wapas girti hai. Ye kya example hai?"},"o":[[{"en":"A possible false breakout","hn":"Possible false breakout"},{"en":"The move failed to hold above the zone.","hn":"Move zone ke upar hold nahi hua."}],[{"en":"Guaranteed trend continuation","hn":"Guaranteed trend continuation"},{"en":"A failed break does not guarantee continuation.","hn":"Failed break continuation guarantee nahi karta."}],[{"en":"A dividend payment","hn":"Dividend payment"},{"en":"That is unrelated to chart structure.","hn":"Ye chart structure se unrelated hai."}]],"a":0},{"k":"mc","q":{"en":"What can a retest after breakout suggest?","hn":"Breakout ke baad retest kya suggest kar sakta hai?"},"o":[[{"en":"Old resistance may act as support if it holds","hn":"Purana resistance support ban sakta hai agar hold kare"},{"en":"This is a possible role reversal, not a certainty.","hn":"Possible role reversal hai, certainty nahi."}],[{"en":"The price can never return below it","hn":"Price kabhi neeche nahi aa sakti"},{"en":"Retests can fail.","hn":"Retest fail ho sakta hai."}],[{"en":"A guaranteed buy signal","hn":"Guaranteed buy signal"},{"en":"No level guarantees a profitable trade.","hn":"Koi level profitable trade guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Why identify timeframe before drawing trendlines or zones?","hn":"Trendline ya zones draw karne se pehle timeframe kyun identify karein?"},"o":[[{"en":"Swing structure and level relevance depend on timeframe","hn":"Swing structure aur level relevance timeframe par depend karte hain"},{"en":"Different intervals can show different structures.","hn":"Alag intervals alag structures dikha sakte hain."}],[{"en":"Timeframe changes nothing","hn":"Timeframe kuch nahi badalta"},{"en":"The chart aggregates different price data.","hn":"Chart different price data aggregate karta hai."}],[{"en":"It guarantees fewer losses","hn":"Losses kam hona guaranteed hai"},{"en":"Timeframe alone does not remove risk.","hn":"Timeframe akela risk remove nahi karta."}]],"a":0},{"k":"mc","q":{"en":"What should a chart plan include beyond a trend prediction?","hn":"Trend prediction ke alawa chart plan mein kya hona chahiye?"},"o":[[{"en":"Alternative scenarios, invalidation and risk","hn":"Alternative scenarios, invalidation aur risk"},{"en":"Plans should explain what would make the idea wrong.","hn":"Plan mein idea galat kab hoga, ye hona chahiye."}],[{"en":"Only a target price","hn":"Sirf target price"},{"en":"A target without risk or invalidation is incomplete.","hn":"Risk/invalidation ke bina target incomplete hai."}],[{"en":"A guarantee","hn":"Guarantee"},{"en":"Markets do not provide guaranteed outcomes.","hn":"Market guaranteed outcomes nahi deta."}]],"a":0},{"k":"end"}];
UNITS.x13=[{"k":"info","t":{"en":"Volume adds participation context","hn":"Volume participation ka context deta hai"},"hook":{"en":"Price rises sharply on unusually high volume. What extra information does volume provide?","hn":"Price unusually high volume par sharply rise karti hai. Volume kya extra information deta hai?"},"story":{"en":"Asha compares the price move with how much traded, then checks the stock’s usual volume and news context.","hn":"Asha price move ko traded quantity se compare karti hai, phir usual volume aur news context check karti hai."},"s":{"en":"Volume measures traded quantity for a period, subject to the instrument and data source. Higher volume may show greater participation, but not whether every participant agrees.","hn":"Volume ek period ki traded quantity measure karta hai, instrument aur data source ke mutabik. Higher volume greater participation dikha sakta hai, par har participant agree karta hai ye nahi."},"p":{"en":"Compare volume with a relevant baseline and check liquidity, session effects and corporate/news events.","hn":"Volume ko relevant baseline se compare karo aur liquidity, session effects aur news events check karo."},"think":{"en":"Does high volume alone prove price will keep rising?","hn":"Kya high volume akela prove karta hai price badhti rahegi?"},"reveal":{"en":"No. Volume adds context but does not guarantee direction.","hn":"Nahi. Volume context deta hai, direction guarantee nahi karta."}},{"k":"info","t":{"en":"Relative volume matters more than a raw number","hn":"Raw number se zyada relative volume matter kar sakta hai"},"hook":{"en":"Today volume is 2 million shares. Is that high?","hn":"Aaj volume 2 million shares hai. Kya ye high hai?"},"story":{"en":"Without the stock’s normal volume, price, float and session context, the number alone tells little.","hn":"Stock ka normal volume, price, float aur session context jaane bina number akela zyada nahi batata."},"s":{"en":"Compare volume with a consistent average or similar time-of-day baseline. Thinly traded stocks can show noisy spikes.","hn":"Volume ko consistent average ya similar time-of-day baseline se compare karo. Thinly traded stocks mein noisy spikes ho sakte hain."},"p":{"en":"Do not compare raw volume across unrelated securities without considering shares outstanding, price and liquidity.","hn":"Shares outstanding, price aur liquidity consider kiye bina unrelated securities ka raw volume compare mat karo."},"think":{"en":"What makes a volume number meaningful?","hn":"Volume number ko meaningful kya banata hai?"},"reveal":{"en":"A suitable baseline and instrument context.","hn":"Suitable baseline aur instrument context."}},{"k":"info","t":{"en":"Moving averages smooth price data","hn":"Moving average price data smooth karta hai"},"hook":{"en":"Price jumps around but remains above a rising 50-day moving average. What does that suggest—not prove?","hn":"Price idhar-udhar move karti hai par rising 50-day moving average ke upar rehti hai. Ye kya suggest karti hai, prove nahi?"},"story":{"en":"Kabir uses the average to view the broader direction while remembering it is calculated from past prices.","hn":"Kabir average se broader direction dekhta hai aur yaad rakhta hai ki ye past prices se calculate hota hai."},"s":{"en":"A moving average smooths prices over a chosen lookback. It is lagging and can be less useful in sideways markets.","hn":"Moving average chosen lookback ki prices smooth karta hai. Ye lagging hai aur sideways market mein kam useful ho sakta hai."},"p":{"en":"A cross or price-above-average rule can whipsaw. Test the rule with costs and different market conditions.","hn":"Cross ya price-above-average rule whipsaw kar sakta hai. Costs aur different market conditions ke saath test karo."},"think":{"en":"Why is a moving average called lagging?","hn":"Moving average ko lagging kyun kehte hain?"},"reveal":{"en":"It is calculated from past prices and reacts after prices change.","hn":"Ye past prices se calculate hota hai aur price change ke baad react karta hai."}},{"k":"info","t":{"en":"RSI measures recent momentum, not certainty","hn":"RSI recent momentum measure karta hai, certainty nahi"},"hook":{"en":"RSI reads 75. Does that force the price to fall?","hn":"RSI 75 hai. Kya price ka girna compulsory hai?"},"story":{"en":"Asha sees a high RSI and asks whether momentum is strong, whether price is trending, and whether the reading persists.","hn":"Asha high RSI dekhkar poochti hai momentum strong hai kya, price trend kar rahi hai kya, aur reading persist karti hai kya."},"s":{"en":"RSI is a bounded momentum oscillator, commonly scaled 0–100. Levels such as 70 and 30 are conventions, not universal reversal commands.","hn":"RSI bounded momentum oscillator hai, commonly 0–100 scale par. 70 aur 30 jaise levels conventions hain, universal reversal commands nahi."},"p":{"en":"In strong trends RSI can remain high or low for extended periods. Interpret with trend and the chosen settings.","hn":"Strong trend mein RSI lambi der high ya low reh sakta hai. Trend aur chosen settings ke saath interpret karo."},"think":{"en":"Does RSI above 70 guarantee a sell signal?","hn":"RSI 70 se upar hona guaranteed sell signal hai?"},"reveal":{"en":"No. It can indicate strong momentum; context is essential.","hn":"Nahi. Strong momentum indicate ho sakta hai; context zaroori hai."}},{"k":"info","t":{"en":"MACD compares moving averages","hn":"MACD moving averages compare karta hai"},"hook":{"en":"MACD line crosses its signal line. Is that a guaranteed entry?","hn":"MACD line signal line cross karti hai. Kya ye guaranteed entry hai?"},"story":{"en":"Kabir treats a crossover as a condition to investigate, not an order. He checks whether the market is trending or choppy.","hn":"Kabir crossover ko investigate karne ki condition maanta hai, order nahi. Woh check karta hai market trending hai ya choppy."},"s":{"en":"MACD is built from moving-average relationships and often includes a signal line and histog
