UNITS.n3=[{"k":"info","t":{"en":"A futures contract is an agreement with specifications","hn":"Futures contract specifications wala agreement hai"},"hook":{"en":"Does a futures contract simply mean buying a share today and paying its full value upfront?","hn":"Kya futures contract ka matlab share aaj kharidna aur full value upfront pay karna hi hai?"},"story":{"en":"A trader enters a standardised futures contract with an underlying, lot size, expiry and settlement terms. The margin deposit is not the same as the contract’s full notional value.","hn":"Trader underlying, lot size, expiry aur settlement terms wale standardised futures contract mein enter karta hai. Margin deposit contract ki full notional value jaisa nahi."},"s":{"en":"A futures contract is a derivative with exchange-defined specifications. Its value moves with the underlying, and margin supports obligations. Contract details, expiry and settlement method matter.","hn":"Futures exchange-defined specifications wala derivative hai. Iski value underlying ke saath move karti hai aur margin obligations support karta hai. Contract details, expiry aur settlement method matter karte hain."},"p":{"en":"Always confirm the exact contract specification and current exchange/broker requirements.","hn":"Exact contract specification aur current exchange/broker requirements confirm karo."},"think":{"en":"What should you identify before calculating a futures position?","hn":"Futures position calculate karne se pehle kya identify karna chahiye?"},"reveal":{"en":"Underlying, contract/lot size, expiry and the relevant price.","hn":"Underlying, contract/lot size, expiry aur relevant price."}},{"k":"info","t":{"en":"Notional value is exposure—not the margin deposit","hn":"Notional value exposure hai, margin deposit nahi"},"hook":{"en":"A contract represents 50 units at ₹2,000 per unit. What is its notional value?","hn":"Contract mein ₹2,000 per unit par 50 units hain. Notional value kitni hai?"},"story":{"en":"A trader posts margin to support a contract worth ₹1,00,000. A price move applies to the contract exposure, not just to the cash margin posted.","hn":"Trader ₹1,00,000 ke contract ko support karne ke liye margin deta hai. Price move contract exposure par apply hota hai, sirf posted margin par nahi."},"s":{"en":"Notional value = futures price × contract quantity. Here, ₹2,000 × 50 = ₹1,00,000. Margin is a required deposit/buffer and is not the same as notional value.","hn":"Notional value = futures price × contract quantity. Yahan ₹2,000 × 50 = ₹1,00,000. Margin required deposit/buffer hai aur notional value se alag hai."},"p":{"en":"The example is hypothetical; lot sizes, prices and margin rates vary by contract and time.","hn":"Example hypothetical hai; lot sizes, prices aur margin rates contract aur time ke hisaab se badalte hain."},"think":{"en":"What is the notional value in this example?","hn":"Is example mein notional value kitni hai?"},"reveal":{"en":"₹1,00,000.","hn":"₹1,00,000."}},{"k":"info","t":{"en":"Long and short positions have opposite exposure","hn":"Long aur short ka exposure opposite hota hai"},"hook":{"en":"All else equal, if futures price rises, what happens to a long position’s price P/L?","hn":"Baaki sab same ho toh futures price badhne par long position ke price P/L ka kya hota hai?"},"story":{"en":"A long futures position benefits from a price rise and loses from a price fall, before costs and contract-specific adjustments.","hn":"Long futures position price rise se benefit aur fall se loss karti hai, costs aur contract-specific adjustments se pehle."},"s":{"en":"A long position has positive exposure to price changes; a short position has the opposite exposure. This describes direction of price P/L, not the probability of either move.","hn":"Long position price changes ke saath positive exposure rakhti hai; short ka exposure opposite hota hai. Ye price P/L ki direction batata hai, move ki probability nahi."},"p":{"en":"A directional view can be wrong; losses can grow quickly when leverage is involved.","hn":"Directional view galat ho sakta hai; leverage ke saath loss tezi se badh sakta hai."},"think":{"en":"What is the basic exposure of a short futures position?","hn":"Short futures position ka basic exposure kya hai?"},"reveal":{"en":"It generally gains from a price fall and loses from a price rise, before costs/adjustments.","hn":"Generally price fall se gain aur rise se loss, costs/adjustments se pehle."}},{"k":"info","t":{"en":"Calculate P/L using price change and quantity","hn":"Price change aur quantity se P/L calculate karo"},"hook":{"en":"A long futures position of 50 units moves from ₹2,000 to ₹2,020. What is the simplified price P/L?","hn":"50 units ki long futures position ₹2,000 se ₹2,020 hoti hai. Simplified price P/L kitna hai?"},"story":{"en":"The price rises by ₹20 per unit. Across 50 units, the simplified gain is ₹1,000 before costs and contract mechanics.","hn":"Price per unit ₹20 badhta hai. 50 units par simplified gain ₹1,000 hai, costs aur contract mechanics se pehle."},"s":{"en":"For a simple linear illustration: P/L = (exit price − entry price) × quantity for a long position; reverse the price difference for a short. Actual contract settlement and charges may add details.","hn":"Simple linear example mein long P/L = (exit price − entry price) × quantity; short ke liye price difference reverse hota hai. Actual contract settlement aur charges extra details add kar sakte hain."},"p":{"en":"This calculation is educational; check the contract multiplier, lot size, mark-to-market and settlement rules for the real instrument.","hn":"Ye educational calculation hai; real instrument ke liye contract multiplier, lot size, mark-to-market aur settlement rules check karo."},"think":{"en":"What is the simplified P/L: ₹20 move × 50 units?","hn":"Simplified P/L kya hai: ₹20 move × 50 units?"},"reveal":{"en":"₹1,000 gain for the long position.","hn":"Long position ke liye ₹1,000 gain."}},{"k":"info","t":{"en":"A small price move can mean a large percentage on margin","hn":"Chhota price move margin par bada percentage ho sakta hai"},"hook":{"en":"If a ₹1,00,000 notional position loses ₹2,000, is the loss necessarily only 2% of the trader’s own margin deposit?","hn":"₹1,00,000 notional position ₹2,000 lose karti hai. Kya loss zaroor trader ke margin deposit ka sirf 2% hai?"},"story":{"en":"The price loss is 2% of notional value, but it may be a much larger percentage of the smaller margin amount posted.","hn":"Price loss notional value ka 2% hai, lekin posted chhote margin amount ka kaafi bada percentage ho sakta hai."},"s":{"en":"Always distinguish P/L as a percentage of notional exposure from P/L as a percentage of the margin/capital posted. Leverage changes the relationship between the two.","hn":"P/L ko notional exposure ke percentage aur posted margin/capital ke percentage mein alag samjho. Leverage dono ke relationship ko badalta hai."},"p":{"en":"Do not infer the maximum loss from the initial margin amount.","hn":"Initial margin amount se maximum loss infer mat karo."},"think":{"en":"Which two denominators should you keep separate when reviewing futures risk?","hn":"Futures risk review karte waqt kaun se do denominators alag rakhne chahiye?"},"reveal":{"en":"Notional exposure and your own posted margin/capital.","hn":"Notional exposure aur apna posted margin/capital."}},{"k":"info","t":{"en":"Futures pricing can differ from the spot price","hn":"Futures price spot price se alag ho sakta hai"},"hook":{"en":"Why might a futures contract trade at a different price from the spot market?","hn":"Futures contract spot market se different price par kyun trade kar sakta hai?"},"story":{"en":"A futures price reflects the contract’s time to expiry and market pricing conditions, not just a copy of the spot quote.","hn":"Futures price contract ki expiry tak ka time aur market pricing conditions reflect karti hai; ye spot quote ki simple copy nahi."},"s":{"en":"A simplified fair-value estimate starts with the spot price and adjusts for financing/carry over time, with relevant income such as dividends considered where applicable. For illustration only, ₹1,000 × (1.08)^0.25 is about ₹1,019.43 for a 3-month period at an 8% annual rate before other adjustments. Actual futures pricing depends on contract details, rates, income, costs and market conditions.","hn":"Simplified fair-value estimate spot price se shuru hota hai aur time ke hisaab se financing/carry adjust karta hai; applicable ho toh dividends jaise income bhi consider hoti hai. Sirf illustration ke liye, 8% annual rate par 3 months ka ₹1,000 × (1.08)^0.25 lagbhag ₹1,019.43 hota hai, other adjustments se pehle. Actual futures pricing contract details, rates, income, costs aur market conditions par depend karti hai."},"p":{"en":"Do not assume a premium or discount by itself predicts the next price move.","hn":"Sirf premium ya discount dekh kar next price move predict mat karo."},"think":{"en":"Name one reason futures and spot prices can differ.","hn":"Futures aur spot prices differ hone ka ek reason batao."},"reveal":{"en":"Carry/financing costs, expected income, time to expiry or market conditions.","hn":"Carry/financing costs, expected income, expiry tak ka time ya market conditions."}},{"k":"info","t":{"en":"Expiry and settlement rules matter","hn":"Expiry aur settlement rules matter karte hain"},"hook":{"en":"Can you assume every futures contract is settled in the same way on expiry?","hn":"Kya assume kar sakte ho ki har futures contract expiry par same tarah settle hota hai?"},"story":{"en":"A trader checks the contract specification instead of assuming the settlement method from a different instrument.","hn":"Trader kisi doosre instrument ka settlement method assume karne ke bajay contract specification check karta hai."},"s":{"en":"Contracts have defined expiry and settlement rules. The method, dates, final settlement calculation and obligations depend on the specific contract and current rules.","hn":"Contracts ke defined expiry aur settlement rules hote hain. Method, dates, final settlement calculation aur obligations specific contract aur current rules par depend karte hain."},"p":{"en":"Verify current specifications before trading or holding a contract close to expiry.","hn":"Expiry ke paas trade ya hold karne se pehle current specifications verify karo."},"think":{"en":"Where should you verify how a specific futures contract settles?","hn":"Specific futures contract ka settlement kaise hota hai, kahan verify karoge?"},"reveal":{"en":"The current exchange contract specifications and broker disclosures.","hn":"Current exchange contract specifications aur broker disclosures."}},{"k":"info","t":{"en":"Margin can change and losses are not capped at margin","hn":"Margin badal sakta hai; loss margin par capped nahi hota"},"hook":{"en":"If volatility rises, can required margin change while a position is open?","hn":"Volatility badhe toh open position par required margin change ho sakta hai?"},"story":{"en":"A trader assumes the initial margin will remain fixed. Market conditions change and the trader receives an updated requirement.","hn":"Trader assume karta hai initial margin fixed rahega. Market conditions badalti hain aur updated requirement milti hai."},"s":{"en":"Margin requirements can change with contract rules and risk conditions. Futures may also involve mark-to-market cash flows and settlement obligations. A trader must plan for additional funds or position reduction.","hn":"Contract rules aur risk conditions ke saath margin requirements change ho sakti hain. Futures mein mark-to-market cash flows aur settlement obligations bhi ho sakte hain. Trader ko extra funds ya position reduction ke liye plan karna chahiye."},"p":{"en":"A stop order or intended exit does not guarantee execution at the planned price, especially in fast markets.","hn":"Stop order ya intended exit planned price par execution guarantee nahi karta, especially fast market mein."},"think":{"en":"What should a futures risk plan include beyond the entry margin?","hn":"Entry margin ke alawa futures risk plan mein kya hona chahiye?"},"reveal":{"en":"Possible margin changes, adverse P/L, settlement cash needs and exit risks.","hn":"Possible margin changes, adverse P/L, settlement cash needs aur exit risks."}},{"k":"info","t":{"en":"Use a payoff scenario before entering","hn":"Entry se pehle payoff scenario banao"},"hook":{"en":"Before placing a futures trade, what should you calculate for more than one price scenario?","hn":"Futures trade se pehle ek se zyada price scenarios ke liye kya calculate karna chahiye?"},"story":{"en":"A trader writes down P/L for a favourable move, a modest adverse move and a sharp adverse move, then checks whether the loss is affordable.","hn":"Trader favourable move, modest adverse move aur sharp adverse move ke liye P/L likhta hai, phir check karta hai ki loss affordable hai ya nahi."},"s":{"en":"A scenario table makes the linear price exposure visible. Include contract quantity, possible price moves, costs, margin requirements and the cash you could need if the market moves against you.","hn":"Scenario table linear price exposure clear karti hai. Contract quantity, possible price moves, costs, margin requirements aur market against jaane par required cash include karo."},"p":{"en":"Scenario analysis is not a prediction and does not capture every gap, liquidity or execution risk.","hn":"Scenario analysis prediction nahi hai aur har gap, liquidity ya execution risk capture nahi karti."},"think":{"en":"What is the purpose of calculating multiple payoff scenarios?","hn":"Multiple payoff scenarios calculate karne ka purpose kya hai?"},"reveal":{"en":"To understand potential gains/losses and cash needs before taking exposure.","hn":"Exposure lene se pehle potential gains/losses aur cash needs samajhna."}},{"k":"mc","q":{"en":"A futures contract represents 50 units at ₹2,000 per unit. What is the notional value?","hn":"Futures contract mein ₹2,000 per unit par 50 units hain. Notional value kitni hai?"},"o":[[{"en":"₹1,00,000","hn":"₹1,00,000"},{"en":"Correct: 50 × ₹2,000 = ₹1,00,000.","hn":"Sahi: 50 × ₹2,000 = ₹1,00,000."}],[{"en":"₹40,000","hn":"₹40,000"},{"en":"Multiply price by contract quantity.","hn":"Price ko contract quantity se multiply karo."}],[{"en":"₹2,000","hn":"₹2,000"},{"en":"₹2,000 is the price per unit, not total exposure.","hn":"₹2,000 per-unit price hai, total exposure nahi."}]],"a":0},{"k":"mc","q":{"en":"A long position of 50 units moves from ₹2,000 to ₹2,020. Simplified price P/L before costs?","hn":"50 units ki long position ₹2,000 se ₹2,020 hoti hai. Costs se pehle simplified price P/L?"},"o":[[{"en":"₹100 gain","hn":"₹100 gain"},{"en":"The move is ₹20 per unit; multiply by 50 units.","hn":"Move ₹20 per unit hai; 50 units se multiply karo."}],[{"en":"₹1,000 gain","hn":"₹1,000 gain"},{"en":"Correct: ₹20 × 50 = ₹1,000 gain before costs.","hn":"Sahi: ₹20 × 50 = costs se pehle ₹1,000 gain."}],[{"en":"₹1,000 loss","hn":"₹1,000 loss"},{"en":"A long position gains from a price rise in this simplified example.","hn":"Is simplified example mein long position price rise se gain karti hai."}]],"a":1},{"k":"mc","q":{"en":"All else equal, a short futures position generally benefits from which move?","hn":"Baaki sab same ho toh short futures position generally kis move se benefit karti hai?"},"o":[[{"en":"A price rise","hn":"Price rise"},{"en":"A price rise generally hurts a short position before costs.","hn":"Price rise generally short position ko hurt karti hai, costs se pehle."}],[{"en":"A price fall","hn":"Price fall"},{"en":"Correct: short exposure is opposite to long exposure.","hn":"Sahi: short exposure long ke opposite hota hai."}],[{"en":"No price movement is always profitable","hn":"Price movement na hona hamesha profitable hai"},{"en":"No movement does not guarantee profit; costs and contract terms matter.","hn":"No movement profit guarantee nahi karta; costs aur terms matter karte hain."}]],"a":1},{"k":"mc","q":{"en":"What is the main difference between margin and notional value?","hn":"Margin aur notional value ka main difference kya hai?"},"o":[[{"en":"They always refer to the same amount","hn":"Dono hamesha same amount hote hain"},{"en":"They are different measures.","hn":"Dono alag measures hain."}],[{"en":"Margin is the required support; notional value is the contract exposure value","hn":"Margin required support hai; notional value contract exposure value hai"},{"en":"Correct: do not confuse the deposit/buffer with the full exposure.","hn":"Sahi: deposit/buffer ko full exposure se confuse mat karo."}],[{"en":"Notional value is the maximum loss in every case","hn":"Notional value har case mein maximum loss hai"},{"en":"Notional value is not a universal maximum-loss figure.","hn":"Notional value universal maximum-loss figure nahi."}]],"a":1},{"k":"mc","q":{"en":"Why can futures price differ from spot price?","hn":"Futures price spot price se different kyun ho sakta hai?"},"o":[[{"en":"Because futures prices are always set randomly","hn":"Kyunki futures prices hamesha randomly set hote hain"},{"en":"Futures prices are formed in the market under contract rules, not simply randomly.","hn":"Futures prices market mein contract rules ke under form hote hain, randomly nahi."}],[{"en":"Because a futures contract has no expiry","hn":"Kyunki futures contract ki expiry nahi hoti"},{"en":"Futures contracts have specified expiry terms.","hn":"Futures contracts ki specified expiry terms hoti hain."}],[{"en":"Carry costs, time to expiry and market conditions can affect the relationship","hn":"Carry costs, expiry tak ka time aur market conditions relationship affect karte hain"},{"en":"Correct: several pricing factors can create a spot-futures difference.","hn":"Sahi: kai pricing factors spot-futures difference create kar sakte hain."}]],"a":2},{"k":"mc","q":{"en":"What should you verify before holding a specific futures contract near expiry?","hn":"Specific futures contract ko expiry ke paas hold karne se pehle kya verify karna chahiye?"},"o":[[{"en":"The current contract specifications and settlement rules","hn":"Current contract specifications aur settlement rules"},{"en":"Correct: confirm expiry, settlement method and current obligations.","hn":"Sahi: expiry, settlement method aur current obligations confirm karo."}],[{"en":"Only yesterday’s closing price","hn":"Sirf kal ka closing price"},{"en":"Yesterday’s price does not explain settlement obligations.","hn":"Kal ka price settlement obligations nahi batata."}],[{"en":"That settlement rules are identical for all contracts","hn":"Ki sab contracts ke settlement rules same hain"},{"en":"Settlement rules can differ by contract.","hn":"Settlement rules contract ke hisaab se differ kar sakte hain."}]],"a":0},{"k":"mc","q":{"en":"If required futures margin increases, what may the trader need to do?","hn":"Required futures margin badhe toh trader ko kya karna pad sakta hai?"},"o":[[{"en":"Nothing; margin can never change","hn":"Kuch nahi; margin kabhi change nahi hota"},{"en":"Margin requirements can change under applicable rules.","hn":"Applicable rules ke under margin requirements change ho sakti hain."}],[{"en":"Meet the updated requirement or reduce exposure under applicable terms","hn":"Updated requirement meet karna ya applicable terms ke under exposure reduce karna"},{"en":"Correct: plan for cash needs and the possibility of reducing the position.","hn":"Sahi: cash needs aur position reduce karne ki possibility ke liye plan karo."}],[{"en":"Assume the exchange cancels any loss","hn":"Assume karo exchange loss cancel kar dega"},{"en":"Margin changes do not cancel losses.","hn":"Margin changes losses cancel nahi karte."}]],"a":1},{"k":"mc","q":{"en":"Which statement about futures margin is safest and most accurate?","hn":"Futures margin ke baare mein safest aur accurate statement kya hai?"},"o":[[{"en":"The initial margin always caps the total loss","hn":"Initial margin hamesha total loss cap karta hai"},{"en":"Initial margin is not a universal maximum-loss limit.","hn":"Initial margin universal maximum-loss limit nahi hai."}],[{"en":"A futures trade is guaranteed if margin is paid","hn":"Margin pay karne se futures trade guaranteed hai"},{"en":"Margin does not guarantee a favourable outcome.","hn":"Margin favourable outcome guarantee nahi karta."}],[{"en":"Margin supports obligations; losses and cash requirements can exceed initial margin","hn":"Margin obligations support karta hai; losses aur cash requirements initial margin se zyada ho sakti hain"},{"en":"Correct: understand leverage, settlement and possible margin changes.","hn":"Sahi: leverage, settlement aur possible margin changes samjho."}]],"a":2},{"k":"mc","q":{"en":"Why prepare several futures payoff scenarios before entering?","hn":"Entry se pehle multiple futures payoff scenarios kyun prepare karne chahiye?"},"o":[[{"en":"To guarantee the next price move","hn":"Next price move guarantee karne ke liye"},{"en":"Scenario analysis does not predict or guarantee the market.","hn":"Scenario analysis market predict ya guarantee nahi karti."}],[{"en":"To estimate possible gains/losses and cash needs across outcomes","hn":"Different outcomes mein possible gains/losses aur cash needs estimate karne ke liye"},{"en":"Correct: scenarios help make exposure and potential obligations visible.","hn":"Sahi: scenarios exposure aur potential obligations clear karti hain."}],[{"en":"To remove all liquidity risk","hn":"Saara liquidity risk remove karne ke liye"},{"en":"Scenario analysis cannot remove all execution or liquidity risks.","hn":"Scenario analysis saare execution ya liquidity risks remove nahi karti."}]],"a":1},{"k":"end"}];
UNITS.x1=[{"k":"info","t":{"en":"Exchange, broker, SEBI","hn":"Exchange, broker, SEBI"},"hook":{"en":"Imagine three people: one runs the marketplace, one takes your order, and one keeps the electronic record of your shares. Why do we need separate roles?","hn":"Socho teen log hain: ek marketplace chalata hai, doosra aapka order leta hai, teesra shares ka electronic record rakhta hai. Alag roles kyun chahiye?"},"story":{"en":"Riya wants to buy her first share. Her broker app is the interface she sees, but an exchange, clearing corporation and depository system perform different jobs behind the scenes. SEBI provides regulatory oversight under the law.","hn":"Riya pehli baar share kharidna chahti hai. Broker app usse dikhta hai, lekin exchange, clearing corporation aur depository system parde ke peeche alag kaam karte hain. SEBI kanoon ke tahat regulatory oversight deta hai."},"s":{"en":"Think of three different jobs. NSE and BSE are stock exchanges: organised electronic marketplaces that match eligible buy and sell orders. A stockbroker is the registered intermediary whose platform or app lets you place an order and routes it to the exchange. SEBI (Securities and Exchange Board of India) is the securities-market regulator: it makes and enforces rules for market participants and works to protect investors. These are not interchangeable roles.","hn":"Mandi socho. Exchange (NSE, BSE) wo mandi hai jahan sauda hota hai. Broker wo agent hai jo aapka order lagata hai. SEBI mandi board hai jo rules banata hai aur kharidar ko bachata hai."},"p":{"en":"Other participants include retail investors, domestic and foreign institutions, mutual funds, insurance companies, listed companies, depositories and clearing corporations. Exchanges provide trading infrastructure; clearing corporations manage clearing and settlement processes; depositories hold securities electronically through demat accounts. Each has a different role, with rules and oversight intended to support orderly markets.","hn":"Aur participants mein retail investors, domestic aur foreign institutions, mutual funds, insurance companies, listed companies, depositories aur clearing corporations shamil hain. Exchanges trading infrastructure dete hain; clearing corporations clearing aur settlement process sambhalte hain; depositories demat accounts ke through securities electronically rakhte hain. Har participant ka alag role hai aur rules ka maksad market ko orderly rakhna hai."},"think":{"en":"Name the three main roles introduced here: marketplace, order intermediary and regulator.","hn":"Yahan introduce hue teen main roles batao: marketplace, order intermediary aur regulator."},"reveal":{"en":"Exchange = marketplace; broker = registered intermediary through which the client places orders; SEBI = securities-market regulator.","hn":"Exchange = marketplace; broker = registered intermediary jiske through client order lagata hai; SEBI = securities-market regulator."}},{"k":"info","t":{"en":"A stock exchange is a marketplace, not a shopkeeper","hn":"Stock exchange mandi hai, dukaan ka malik nahi"},"s":{"en":"A stock exchange provides a regulated electronic system where eligible buy and sell orders in listed securities can meet. It publishes market information and operates under applicable laws, regulations and exchange rules. It does not promise that an investor will make money, and it does not simply choose a fair price for every share.","hn":"Stock exchange ek regulated electronic system deta hai jahan listed securities ke eligible buy aur sell orders match ho sakte hain. Ye market information publish karta hai aur applicable laws, regulations aur exchange rules ke under kaam karta hai. Ye profit ki guarantee nahi deta aur har share ka “sahi price” khud se fix nahi karta."},"p":{"en":"NSE and BSE are separate exchanges. A company’s security may be available for trading on one or both, subject to listing and trading arrangements. The same security can show slightly different live quotes across venues because orders and liquidity can differ.","hn":"NSE aur BSE alag exchanges hain. Company ka share listing/trading arrangements ke hisaab se ek ya dono par trade ho sakta hai. Orders aur liquidity alag hone se same share ke live quotes mein halka farq ho sakta hai."},"hook":{"en":"Two investors disagree about a share price. Does the exchange decide what the company is worth?","hn":"Do investors share ke price par disagree karte hain. Kya exchange decide karta hai ki company ki value kya honi chahiye?"},"story":{"en":"An exchange runs the trading system and publishes market information. Buyers and sellers submit orders; compatible orders can match. The exchange is not a shopkeeper that owns every share or promises a fair value.","hn":"Exchange trading system chalata hai aur market information publish karta hai. Buyers aur sellers orders dete hain; compatible orders match ho sakte hain. Exchange dukaan ka malik nahi jo har share own karta ho ya fair value ki guarantee de."},"think":{"en":"If the market price falls, does that alone prove the exchange made a mistake?","hn":"Agar market price girta hai, kya sirf isse prove hota hai ki exchange ne galti ki?"},"reveal":{"en":"No. Prices change as orders and expectations change. A falling price alone does not show the exchange has made an error.","hn":"Nahi. Orders aur expectations badalne par prices badalte hain. Sirf price girna exchange ki galti prove nahi karta."}},{"k":"info","t":{"en":"SEBI’s role—and what it cannot promise","hn":"SEBI ka role—aur woh kya guarantee nahi karta"},"s":{"en":"SEBI stands for Securities and Exchange Board of India. It is the securities-market regulator. It frames and enforces rules for relevant market participants, supervises regulated entities and works to protect investors and support orderly market development. A regulator reduces misconduct risk; it cannot remove all investment risk or guarantee returns.","hn":"SEBI ka full form Securities and Exchange Board of India hai. Ye securities market ka regulator hai. Ye relevant market participants ke liye rules banata aur enforce karta hai, regulated entities ki supervision karta hai aur investors ki protection aur orderly market development par kaam karta hai. Regulator galat kaam ka risk kam kar sakta hai, par har investment risk khatam ya return guarantee nahi kar sakta."},"p":{"en":"Always verify a person’s registration and the current rules on official SEBI/exchange sources. A screenshot, social-media badge or “SEBI approved strategy” claim is not enough by itself. Registration is not a guarantee of performance.","hn":"Kisi person ka registration aur current rules official SEBI/exchange sources par verify karo. Screenshot, social-media badge ya “SEBI approved strategy” ka claim akela kaafi nahi. Registration performance ki guarantee nahi hota."},"hook":{"en":"A friend says, “SEBI regulates the market, so I cannot lose money.” What is wrong with that statement?","hn":"Dost kehta hai, “SEBI market regulate karta hai, toh mera paisa doob hi nahi sakta.” Is baat mein kya galat hai?"},"story":{"en":"SEBI sets and enforces rules for relevant securities-market participants and supervises regulated entities. Regulation supports fair processes and investor protection; it does not eliminate business, liquidity, volatility or investment risk.","hn":"SEBI securities-market participants ke liye relevant rules banata/enforce karta hai aur regulated entities par oversight rakhta hai. Regulation fair processes aur investor protection support karta hai; business, liquidity, volatility ya investment risk ko khatam nahi karta."},"think":{"en":"Name one risk that regulation cannot remove completely.","hn":"Ek aisa risk batao jise regulation poori tarah khatam nahi kar sakta."},"reveal":{"en":"Market risk: a security’s price can fall, and an investor can lose money.","hn":"Market risk: security ka price gir sakta hai aur investor ko loss ho sakta hai."}},{"k":"info","t":{"en":"The broker connects you to the market","hn":"Broker aapko market se jodta hai"},"s":{"en":"A retail investor normally places an exchange-traded order through a registered stockbroker. The broker provides the account and trading interface, routes orders, gives contract notes and statements, and applies applicable processes and charges. The broker is not the exchange and is not SEBI.","hn":"Retail investor aam taur par registered stockbroker ke through exchange-traded order lagata hai. Broker account aur trading interface deta hai, order route karta hai, contract note aur statements deta hai aur applicable processes/charges apply karta hai. Broker na exchange hai aur na SEBI."},"p":{"en":"Before choosing a broker, read its tariff/charges, service terms and risk disclosures. Do not share passwords, OTPs or remote-access control with someone claiming they will trade safely for you.","hn":"Broker chunne se pehle uske charges, service terms aur risk disclosures padho. Kisi aise vyakti ko password, OTP ya remote-access control mat do jo tumhare liye safe trading ka vaada kare."},"hook":{"en":"Riya taps Buy in an app. Is the app necessarily the exchange or the regulator?","hn":"Riya app mein Buy dabati hai. Kya app hi exchange ya regulator hota hai?"},"story":{"en":"The broker provides the client-facing account and order interface and routes orders under applicable exchange processes. Investors should verify the broker through official sources and read its tariff, disclosures and account terms.","hn":"Broker client ko account/order interface deta hai aur applicable exchange process ke tahat orders route karta hai. Investor ko official sources par broker verify karna chahiye aur charges, disclosures aur account terms padhne chahiye."},"think":{"en":"Which official source should you use to verify registration instead of trusting an app screenshot?","hn":"App ke screenshot par bharosa karne ke bajay registration kahan verify karoge?"},"reveal":{"en":"Use the relevant regulator or exchange’s official registration/member directory and confirm the exact legal name.","hn":"Relevant regulator ya exchange ki official registration/member directory use karo aur exact legal name verify karo."}},{"k":"info","t":{"en":"Who does what: exchange, broker, depository and DP","hn":"Kaun kya karta hai: exchange, broker, depository aur DP"},"hook":{"en":"If a trading app disappears from your phone, does that mean your demat shares are stored inside the app and disappear too?","hn":"Agar trading app phone se gayab ho jaaye, kya demat shares bhi app ke andar store hone ki wajah se gayab ho jaate hain?"},"story":{"en":"A stock exchange such as NSE or BSE provides the trading marketplace. A stockbroker is the intermediary through which clients place orders. A depository holds securities electronically; India’s two depositories are NSDL and CDSL. A Depository Participant (DP) provides depository services to investors as the depository’s agent. Clearing corporations support clearing and settlement.","hn":"NSE/BSE jaise stock exchange trading marketplace dete hain. Stockbroker woh intermediary hai jiske through client orders place karta hai. Depository securities ko electronic form mein hold karti hai; India mein NSDL aur CDSL do depositories hain. Depository Participant (DP), depository ke agent ke roop mein investors ko services deta hai. Clearing corporation clearing aur settlement mein madad karti hai."},"s":{"en":"The app is an interface, not the legal storage location of your shares. Verify the broker/DP and keep statements. Each institution has a distinct role; a broker is not the same as an exchange or depository.","hn":"App ek interface hai, shares ka legal storage location nahi. Broker/DP verify karo aur statements sambhal kar rakho. Har institution ka role alag hai; broker, exchange aur depository ek cheez nahi."},"p":{"en":"Example chain: you place an order through your broker → exchange matches eligible orders → clearing/settlement processes the trade → securities are reflected electronically through the depository/DP system. Exact workflows depend on product and market rules.","hn":"Example chain: aap broker ke through order dete ho → exchange eligible orders match karta hai → clearing/settlement trade process karta hai → securities depository/DP system mein electronically reflect hoti hain. Exact workflow product aur market rules par depend karta hai."},"think":{"en":"Which institution maintains securities in electronic form through the depository system?","hn":"Depository system ke through securities electronic form mein kaun hold karta hai?"},"reveal":{"en":"The depository maintains securities electronically; the DP is the investor-facing participant that provides depository services.","hn":"Depository securities electronically hold karti hai; DP investor ko depository services provide karne wala participant hai."}},{"k":"info","t":{"en":"SEBI, regulation and what investor protection really means","hn":"SEBI, regulation aur investor protection ka asli matlab"},"hook":{"en":"If SEBI regulates the securities market, does that mean SEBI guarantees every investment will make money?","hn":"Agar SEBI securities market regulate karta hai, kya SEBI har investment par profit guarantee karta hai?"},"story":{"en":"SEBI stands for Securities and Exchange Board of India. It regulates the securities market under applicable law, supervises regulated entities and works to protect investors and promote orderly market development. Exchanges and intermediaries also have rulebooks and obligations. Regulation reduces certain risks; it cannot remove market risk or guarantee returns.","hn":"SEBI ka full form Securities and Exchange Board of India hai. Ye applicable law ke under securities market regulate karta hai, regulated entities par oversight rakhta hai aur investor protection aur orderly market development ke liye kaam karta hai. Exchanges aur intermediaries ke bhi rules aur obligations hote hain. Regulation kuch risks ko address karta hai; market risk khatam ya returns guarantee nahi karta."},"s":{"en":"Investor protection includes fair processes, disclosures, grievance mechanisms and oversight—not a promise that every company is safe or every price is fair. Learn to verify registration, read documents and understand risk.","hn":"Investor protection mein fair processes, disclosures, complaint mechanisms aur oversight aate hain—ye promise nahi ki har company safe ya har price fair hai. Registration verify karna, documents padhna aur risk samajhna seekho."},"p":{"en":"If an unregistered social-media account promises “fixed 5% every week”, the promise itself is a warning sign. Do not send money or credentials based only on a post.","hn":"Agar unregistered social-media account “har week fixed 5%” ka promise kare, toh ye warning sign hai. Sirf post dekhkar paisa ya credentials mat bhejo."},"think":{"en":"Name one thing SEBI regulation cannot guarantee.","hn":"Ek cheez batao jo SEBI regulation guarantee nahi kar sakta."},"reveal":{"en":"It cannot guarantee that a share price will rise or that an investor will never lose money.","hn":"SEBI ye guarantee nahi kar sakta ki share price badhega ya investor ko kabhi loss nahi hoga."}},{"k":"info","t":{"en":"Investor rights, records and the complaint path","hn":"Investor rights, records aur complaint ka raasta"},"hook":{"en":"You see an unauthorised trade in your account. Should you delete the message and hope it goes away?","hn":"Account mein unauthorised trade dikh raha hai. Kya message delete karke bhool jaana chahiye?"},"story":{"en":"Keep evidence: order/trade details, contract notes, ledger, emails/SMS alerts and complaint references. First contact the concerned broker/company through official channels. If unresolved, use the relevant exchange/depository grievance process and, where applicable, SEBI’s SCORES platform. Current procedures can change, so check official investor resources.","hn":"Evidence sambhal kar rakho: order/trade details, contract notes, ledger, emails/SMS alerts aur complaint references. Pehle concerned broker/company ko official channel se contact karo. Resolve na ho toh relevant exchange/depository grievance process aur applicable case mein SEBI ke SCORES platform ka use karo. Current process badal sakta hai, isliye official investor resources check karo."},"s":{"en":"SCORES is a grievance-redressal facilitation platform for complaints within its scope; it is not a stock-tip service and not every disagreement about market price qualifies as a complaint. Never share passwords, OTPs or your Demat Delivery Instruction Slip credentials.","hn":"SCORES apne scope ke andar complaints ke liye grievance-redressal platform hai; ye stock-tip service nahi aur market price se har disagreement complaint nahi hota. Password, OTP ya Demat Delivery Instruction Slip credentials kabhi share mat karo."},"p":{"en":"Official reference: SEBI Investor Charter — https://investor.sebi.gov.in/Investor-charter.html ; SCORES — https://scores.sebi.gov.in/ . Save complaint IDs and copies of documents.","hn":"Official reference: SEBI Investor Charter — https://investor.sebi.gov.in/Investor-charter.html ; SCORES — https://scores.sebi.gov.in/ . Complaint ID aur documents ki copies sambhal kar rakho."},"think":{"en":"What should you do first when you notice an unauthorised trade?","hn":"Unauthorised trade dikhe toh sabse pehle kya karna chahiye?"},"reveal":{"en":"Secure the account, preserve evidence and contact the broker through its official support/grievance channel promptly; follow current official escalation steps if unresolved.","hn":"Account secure karo, evidence save karo aur broker ke official support/grievance channel ko jaldi contact karo; resolve na ho toh current official escalation process follow karo."}},{"k":"info","t":{"en":"Clearing corporation: the trade’s back-office organiser","hn":"Clearing corporation: trade ke back-office ka organiser"},"hook":{"en":"A buyer and seller have matched. Is the job finished the instant the screen says “traded”?","hn":"Buyer aur seller ke orders match ho gaye. Kya screen par “traded” aate hi saara kaam khatam?"},"story":{"en":"Riya buys shares. After execution, the market still needs a reliable process to determine each side’s obligations and coordinate delivery of securities and funds. This is where clearing and settlement infrastructure matters.","hn":"Riya shares kharidti hai. Execution ke baad bhi system ko dono sides ki obligations determine karni aur securities/funds ki delivery coordinate karni hoti hai. Yahin clearing aur settlement infrastructure important hai."},"s":{"en":"A clearing corporation supports clearing and settlement according to the applicable framework. Clearing determines obligations; settlement completes the exchange of funds and securities. The exchange, clearing corporation, broker and depository are related but distinct entities/roles.","hn":"Clearing corporation applicable framework ke hisaab se clearing aur settlement support karti hai. Clearing obligations determine karta hai; settlement funds aur securities ka exchange complete karta hai. Exchange, clearing corporation, broker aur depository connected hain, lekin roles alag hain."},"p":{"en":"Trade journey (simplified): investor instruction → broker routes order → exchange matches eligible orders → clearing process determines obligations → settlement delivers funds/securities → depository records holdings. Exact operational steps depend on the product and current market arrangements.","hn":"Trade journey (simple): investor instruction → broker order route karta hai → exchange eligible orders match karta hai → clearing obligations determine karta hai → settlement funds/securities deliver karta hai → depository holdings record karta hai. Exact steps product aur current market arrangements par depend karte hain."},"think":{"en":"Which stage determines the obligations after a trade is matched: clearing or market-price discovery?","hn":"Trade match hone ke baad obligations kaun determine karta hai: clearing ya market-price discovery?"},"reveal":{"en":"Clearing determines the obligations; settlement is the process that completes delivery of funds and securities.","hn":"Clearing obligations determine karta hai; settlement funds aur securities ki delivery complete karta hai."}},{"k":"info","t":{"en":"Market participants: who is doing what?","hn":"Market participants: kaun kya kaam karta hai?"},"hook":{"en":"A company issues shares, an investor buys them, a mutual fund manages pooled money, and an insurer invests premiums. Are they all doing the same job?","hn":"Company shares issue karti hai, investor kharidta hai, mutual fund pooled money manage karta hai aur insurer premiums invest karta hai. Kya sab ek hi kaam kar rahe hain?"},"story":{"en":"Markets bring together issuers seeking capital, investors allocating money, intermediaries connecting participants, and market infrastructure institutions supporting trading and settlement. Their incentives, duties and risks differ.","hn":"Market mein capital raise karne wale issuers, paisa allocate karne wale investors, participants ko connect karne wale intermediaries aur trading/settlement support karne wale infrastructure institutions hote hain. Inke incentives, duties aur risks alag hain."},"s":{"en":"An issuer raises capital by issuing securities. Retail investors invest or trade for their own accounts. Institutional investors—such as mutual funds, insurers and other eligible institutions—manage or deploy money under their mandates. Brokers, DPs and other registered intermediaries provide specific services. Exchanges, clearing corporations and depositories are market infrastructure institutions with distinct responsibilities.","hn":"Issuer securities issue karke capital raise karta hai. Retail investors apne account ke liye invest/trade karte hain. Institutional investors—jaise mutual funds, insurers aur doosri eligible institutions—apne mandate ke tahat money manage/deploy karte hain. Brokers, DPs aur doosre registered intermediaries specific services dete hain. Exchanges, clearing corporations aur depositories market infrastructure institutions hain, jinki responsibilities alag hain."},"p":{"en":"Role match: company = issuer; you = investor; broker = order intermediary; exchange = trading venue; clearing corporation = clearing/settlement support; depository = electronic securities records; DP = depository service provider to investor; SEBI = regulator.","hn":"Role match: company = issuer; aap = investor; broker = order intermediary; exchange = trading venue; clearing corporation = clearing/settlement support; depository = electronic securities records; DP = investor ko depository service dene wala; SEBI = regulator."},"think":{"en":"Which participant typically issues new shares to raise capital: an issuer or a depository?","hn":"Capital raise karne ke liye naye shares kaun issue karta hai: issuer ya depository?"},"reveal":{"en":"The issuer issues securities. A depository maintains electronic securities records; it does not issue a company’s shares merely by holding them.","hn":"Issuer securities issue karta hai. Depository electronic securities records maintain karta hai; sirf hold karne se woh company ke shares issue nahi karta."}},{"k":"mc","q":{"en":"Rohan wants to buy shares. Whom does he place the order through?","hn":"Rohan ko shares kharidne hain. Wo order kiske through lagata hai?"},"o":[[{"en":"A broker","hn":"Broker ke through"},{"en":"Yes. Retail investors reach the exchange through a registered broker.","hn":"Sahi. Retail investor registered broker ke through exchange tak pahunchta hai."}],[{"en":"Directly on the exchange","hn":"Seedha exchange par"},{"en":"Exchanges deal with their members, the brokers, not with individual investors.","hn":"Exchange apne members yaani brokers se deal karta hai, individual investor se nahi."}],[{"en":"The company itself","hn":"Company se hi"},{"en":"Companies list their shares once. Daily buying and selling happens on the exchange.","hn":"Company shares ek baar list karti hai. Roz ki khareed-bikri exchange par hoti hai."}]],"a":0},{"k":"mc","q":{"en":"Who makes the rules and protects investors in the Indian market?","hn":"Indian market me rules kaun banata hai aur investors ko kaun bachata hai?"},"o":[[{"en":"SEBI","hn":"SEBI"},{"en":"Right. SEBI is the market regulator.","hn":"Sahi. SEBI market regulator hai."}],[{"en":"Your broker","hn":"Aapka broker"},{"en":"Brokers must follow rules, they do not make them.","hn":"Broker ko rules follow karne padte hain, wo banata nahi."}],[{"en":"The company","hn":"Company"},{"en":"A company is one participant, not the regulator.","hn":"Company ek participant hai, regulator nahi."}]],"a":0},{"k":"mc","id":"w","ws":{"en":"Worked example: suppose a broker charges 0.03%. On a Rs 1,00,000 trade the fee is 1,00,000 x 0.03 / 100 = Rs 30.","hn":"Solved example: maan lo broker 0.03% leta hai. Rs 1,00,000 ke trade par fee = 1,00,000 x 0.03 / 100 = Rs 30."},"q":{"en":"Your turn: a broker charges 0.05%. Fee on a Rs 2,00,000 trade?","hn":"Ab aapki baari: broker 0.05% leta hai. Rs 2,00,000 ke trade par fee?"},"o":[[{"en":"Rs 100","hn":"Rs 100"},{"en":"Correct. 0.05% of 2,00,000 = 100.","hn":"Sahi. 2,00,000 ka 0.05% = 100."}],[{"en":"Rs 1,000","hn":"Rs 1,000"},{"en":"That is 0.5%. Check the decimal.","hn":"Ye 0.5% hai. Decimal dekho."}],[{"en":"Rs 10","hn":"Rs 10"},{"en":"That is 0.005%.","hn":"Ye 0.005% hai."}]],"a":0},{"k":"mc","id":"m","q":{"en":"True or false: NSE and BSE are the regulators of the market.","hn":"Sahi ya galat: NSE aur BSE market ke regulator hain."},"o":[[{"en":"False","hn":"Galat"},{"en":"Right. They are exchanges. SEBI is the regulator.","hn":"Sahi. Wo exchanges hain. Regulator SEBI hai."}],[{"en":"True","hn":"Sahi"},{"en":"No. Exchanges run the marketplace, SEBI regulates it.","hn":"Nahi. Exchange bazaar chalate hain, SEBI regulate karta hai."}]],"a":0},{"k":"mc","id":"t","q":{"en":"A WhatsApp group promises guaranteed returns. Where can you check if an adviser is registered?","hn":"Ek WhatsApp group guaranteed returns ka vaada karta hai. Adviser registered hai ya nahi, kahan check karoge?"},"o":[[{"en":"With SEBI","hn":"SEBI se"},{"en":"Yes. Check registration on SEBI’s official website. Registration does not guarantee returns, and guaranteed-return claims are a warning sign.","hn":"Haan. SEBI ki official website par registration check karo. Registration returns ki guarantee nahi hai; guaranteed-return ke vaade warning sign hain."}],[{"en":"Ask the group admin","hn":"Group admin se pucho"},{"en":"The admin has every reason to say yes. Check the regulator.","hn":"Admin to haan hi bolega. Regulator se check karo."}],[{"en":"Trust a certificate image posted in the group","hn":"Group mein share ki gayi certificate image par bharosa karo"},{"en":"A screenshot or certificate image can be misleading. Verify the registration directly through the regulator’s official records.","hn":"Screenshot ya certificate image misleading ho sakti hai. Registration ko regulator ke official records se directly verify karo."}]],"a":0},{"k":"mc","q":{"en":"Which pairing is correct?","hn":"Kaunsi pairing sahi hai?"},"o":[[{"en":"NSE/BSE = exchanges; SEBI = regulator","hn":"NSE/BSE = exchanges; SEBI = regulator"},{"en":"Correct. Exchanges provide trading infrastructure; SEBI regulates the securities market.","hn":"Sahi. Exchanges trading infrastructure dete hain; SEBI securities market regulate karta hai."}],[{"en":"NSE/BSE = regulators; SEBI = broker","hn":"NSE/BSE = regulators; SEBI = broker"},{"en":"These roles are different.","hn":"Inke roles alag hain."}],[{"en":"CDSL/NSDL = stockbrokers","hn":"CDSL/NSDL = stockbrokers"},{"en":"They are depositories, not stockbrokers.","hn":"Ye depositories hain, stockbrokers nahi."}]],"a":0},{"k":"mc","q":{"en":"A stranger promises guaranteed weekly returns and asks for your OTP. What is the safest response?","hn":"Ajnabi guaranteed weekly returns ka promise karta hai aur OTP maangta hai. Safe response kya hai?"},"o":[[{"en":"Do not share it; stop and verify through official channels.","hn":"OTP share mat karo; rukkar official channels se verify karo."},{"en":"Correct. Never share OTPs or credentials; guaranteed-return claims are a warning sign.","hn":"Sahi. OTP/credentials kabhi share mat karo; guaranteed-return claims warning sign hain."}],[{"en":"Share the OTP if they show a certificate.","hn":"Certificate dikhaye toh OTP de do."},{"en":"A certificate image does not make credential sharing safe.","hn":"Certificate ki image se credentials share karna safe nahi hota."}],[{"en":"Send a small payment to test them.","hn":"Test karne ke liye thoda paisa bhejo."},{"en":"Do not send money based on an unverified promise.","hn":"Unverified promise par paisa mat bhejo."}]],"a":0},{"k":"mc","q":{"en":"Which institution provides the electronic marketplace where eligible buy and sell orders can match?","hn":"Eligible buy aur sell orders ko match karne wala electronic marketplace kaun deta hai?"},"o":[[{"en":"A stock exchange such as NSE or BSE","hn":"NSE ya BSE jaisa stock exchange"},{"en":"Correct. Exchanges provide the trading venue and systems.","hn":"Sahi. Exchange trading venue aur systems provide karta hai."}],[{"en":"The investor’s depository","hn":"Investor ka depository"},{"en":"A depository maintains securities records; it is not the exchange trading venue.","hn":"Depository securities records maintain karta hai; exchange trading venue nahi."}],[{"en":"SEBI as the buyer of every share","hn":"SEBI jo har share kharidta hai"},{"en":"SEBI is the regulator, not the buyer in each trade.","hn":"SEBI regulator hai, har trade ka buyer nahi."}]],"a":0},{"k":"mc","q":{"en":"What is the key difference between a depository and a Depository Participant (DP)?","hn":"Depository aur Depository Participant (DP) mein main difference kya hai?"},"o":[[{"en":"The depository maintains electronic securities records; the DP provides services to investors","hn":"Depository electronic securities records maintain karta hai; DP investors ko services deta hai"},{"en":"Correct. NSDL/CDSL are depositories; a DP interfaces with investors for depository services.","hn":"Sahi. NSDL/CDSL depositories hain; DP investor ko depository services deta hai."}],[{"en":"They are two names for a stockbroker","hn":"Stockbroker ke do naam hain"},{"en":"A DP and a stockbroker are distinct roles, even where one business group offers both services.","hn":"DP aur stockbroker alag roles hain, chahe ek business group dono services de."}],[{"en":"The DP regulates all Indian exchanges","hn":"DP India ke saare exchanges regulate karta hai"},{"en":"Market regulation is not the DP’s role.","hn":"Market regulate karna DP ka role nahi."}]],"a":0},{"k":"mc","q":{"en":"After a trade is matched, which function helps determine obligations and coordinate completion of the trade?","hn":"Trade match hone ke baad obligations determine aur trade complete karne mein kaunsa function help karta hai?"},"o":[[{"en":"Clearing and settlement infrastructure","hn":"Clearing aur settlement infrastructure"},{"en":"Correct. Clearing determines obligations; settlement completes delivery of funds and securities.","hn":"Sahi. Clearing obligations determine karta hai; settlement funds aur securities ki delivery complete karta hai."}],[{"en":"The company’s marketing department","hn":"Company ka marketing department"},{"en":"Marketing does not process exchange-traded settlement obligations.","hn":"Marketing exchange-traded settlement obligations process nahi karta."}],[{"en":"The share’s face value","hn":"Share ki face value"},{"en":"Face value is a nominal share value, not a settlement function.","hn":"Face value nominal value hai, settlement function nahi."}]],"a":0},{"k":"mc","q":{"en":"You have raised an issue with your broker but it remains unresolved. What is the sensible next step?","hn":"Broker ko issue bataya par solve nahi hua. Sensible next step kya hai?"},"o":[[{"en":"Keep records and follow the relevant exchange/depository grievance route; use SCORES where applicable","hn":"Records sambhalo aur relevant exchange/depository grievance route follow karo; applicable ho toh SCORES use karo"},{"en":"Correct. Preserve evidence and follow the current official grievance process for the relevant entity and issue.","hn":"Sahi. Evidence sambhalo aur relevant entity/issue ke liye current official grievance process follow karo."}],[{"en":"Post account passwords publicly to get attention","hn":"Attention ke liye account password publicly post karo"},{"en":"Never disclose passwords, OTPs or account credentials.","hn":"Password, OTP ya account credentials kabhi disclose mat karo."}],[{"en":"Assume SEBI guarantees reimbursement for every market loss","hn":"Maan lo SEBI har market loss reimburse karega"},{"en":"Regulation and grievance mechanisms do not guarantee reimbursement for investment losses.","hn":"Regulation aur grievance mechanism investment loss reimbursement guarantee nahi karte."}]],"a":0},{"k":"end"}];
UNITS.x2=[{"k":"info","t":{"en":"Riya’s first share purchase: what happens next?","hn":"Riya ka pehla share purchase: ab aage kya hota hai?"},"hook":{"en":"Riya presses Buy in her trading app. The screen says “Order placed”. Has she definitely bought the share—and where will it be held?","hn":"Riya trading app mein Buy dabati hai. Screen par “Order placed” likha aata hai. Kya share pakka kharid liya gaya—and woh rakha kahan jayega?"},"story":{"en":"Riya has money in her bank account, uses a broker’s app to place an order, and expects the shares to appear in her holdings. Three different systems are involved; the app is only the visible front door.","hn":"Riya ke bank account mein paisa hai, broker ki app se order place karti hai, aur expect karti hai ki shares holdings mein dikhne lagenge. Teen alag systems ka role hai; app sirf saamne dikhne wala darwaza hai."},"s":{"en":"A bank account holds or transfers money. A trading account lets you place market orders through a broker. A demat account records your securities in electronic form. “Order placed”, “trade executed” and “settled/credited” describe different stages.","hn":"Bank account paisa rakhta ya transfer karta hai. Trading account broker ke through market orders place karne deta hai. Demat account securities ko electronic form mein record karta hai. “Order placed”, “trade executed” aur “settled/credited” teen alag stages hain."},"p":{"en":"Think of buying a book online: clicking “Place order” is not the same as delivery. In a share trade too, order placement, execution and settlement are separate steps.","hn":"Online book kharidne jaisa socho: “Place order” dabana aur book deliver hona same nahi. Share trade mein bhi order placement, execution aur settlement alag steps hain."},"think":{"en":"If the app says “Order placed”, can you assume the shares are already credited to your demat account?","hn":"Agar app “Order placed” dikhaye, kya maan sakte ho ki shares demat mein credit ho gaye?"},"reveal":{"en":"No. First the order must execute, and then the trade must complete the applicable clearing and settlement process before holdings are reflected as settled.","hn":"Nahi. Pehle order execute hona chahiye, phir applicable clearing aur settlement process complete hoga; uske baad settled holdings reflect hoti hain."}},{"k":"info","t":{"en":"Three accounts, three different jobs","hn":"Teen accounts, teen alag kaam"},"hook":{"en":"Riya has ₹25,000 in her bank account. She places an order for shares worth ₹8,000. Where does the money sit, where does she place the order, and where are her settled shares recorded?","hn":"Riya ke bank account mein ₹25,000 hain. Woh ₹8,000 ke shares ka order deti hai. Paisa kahan hota hai, order kahan place hota hai aur settled shares kahan record hote hain?"},"story":{"en":"A beginner may call all of this “my trading account”. In reality, bank, broker/trading and demat services perform different functions, even when an app presents them together.","hn":"Beginner in sabko “mera trading account” bol sakta hai. Reality mein bank, broker/trading aur demat services alag kaam karti hain, chahe app unhe ek saath dikhaye."},"s":{"en":"Bank account: funds. Trading account: order access through the broker. Demat account: electronic securities holdings. A broker may offer linked or integrated services, but the underlying functions remain distinct.","hn":"Bank account: paisa. Trading account: broker ke through order access. Demat account: electronic securities holdings. Broker linked ya integrated services de sakta hai, par underlying functions alag rehte hain."},"p":{"en":"Memory hook: BANK = money; TRADING = instructions/orders; DEMAT = securities records. Actual fund movement and access depend on the product, broker and applicable process.","hn":"Yaad rakhne ka shortcut: BANK = paisa; TRADING = instructions/orders; DEMAT = securities records. Actual fund movement product, broker aur applicable process par depend karta hai."},"think":{"en":"Which account primarily records your settled listed shares in electronic form?","hn":"Settled listed shares ko electronic form mein primarily kaunsa account record karta hai?"},"reveal":{"en":"The demat account. The bank account records money; the trading account provides access to place orders through the broker.","hn":"Demat account. Bank account paisa record karta hai; trading account broker ke through order place karne ka access deta hai."}},{"k":"info","t":{"en":"Depository vs DP: who keeps the electronic record?","hn":"Depository vs DP: electronic record kaun rakhta hai?"},"hook":{"en":"Riya’s shares are held electronically. She contacts a service provider to open and manage her demat account. Is that service provider the same thing as the depository itself?","hn":"Riya ke shares electronic form mein hain. Woh demat account kholne aur manage karne ke liye ek service provider se contact karti hai. Kya service provider aur depository ek hi cheez hain?"},"story":{"en":"India’s depository system uses depositories and their agents, called Depository Participants (DPs). The investor generally interacts with a DP for demat services rather than directly operating the depository’s central system.","hn":"India ke depository system mein depositories aur unke agents hote hain, jinhe Depository Participants (DPs) kehte hain. Investor aam taur par demat services ke liye DP se interact karta hai, central depository system ko directly operate nahi karta."},"s":{"en":"NSDL and CDSL are the two recognised securities depositories in India. A DP—such as an eligible bank, broker or other authorised participant—provides services to the investor under the applicable framework. Verify a provider’s status through official sources.","hn":"NSDL aur CDSL India ki do recognised securities depositories hain. DP—jaise eligible bank, broker ya authorised participant—applicable framework ke tahat investor ko services deta hai. Provider ka status official sources se verify karo."},"p":{"en":"Analogy: the depository is like the central electronic record system; the DP is the service channel through which you access demat services. This is an analogy, not a full description of the legal structure.","hn":"Analogy: depository central electronic record system jaisa hai; DP woh service channel hai jiske through aap demat services lete ho. Ye analogy hai, poori legal structure ka description nahi."},"think":{"en":"What does DP stand for, and how is it different from a depository?","hn":"DP ka full form kya hai aur depository se kaise alag hai?"},"reveal":{"en":"DP means Depository Participant. It provides depository services to investors; the depository operates the central securities-holding system.","hn":"DP ka matlab Depository Participant hai. Ye investors ko depository services deta hai; depository central securities-holding system operate karti hai."}},{"k":"info","t":{"en":"Order, execution and trade confirmation","hn":"Order, execution aur trade confirmation"},"hook":{"en":"Riya places a limit order to buy 10 shares at ₹100 or less. The order appears as “Open”. Has a purchase happened yet?","hn":"Riya ₹100 ya usse kam par 10 shares kharidne ka limit order deti hai. Status “Open” dikh raha hai. Kya purchase ho chuka hai?"},"story":{"en":"The market may not yet have a compatible seller at her limit price, or the order may be waiting behind other orders. The order can remain open, be partly filled, expire or be cancelled, depending on its status and rules.","hn":"Market mein abhi uske limit price par compatible seller na ho, ya order doosre orders ke peeche wait kar raha ho. Status aur rules ke hisaab se order open, partly filled, expired ya cancelled reh sakta hai."},"s":{"en":"An order is an instruction. Execution occurs when compatible buy and sell orders match. A trade confirmation reports the executed transaction. An order can be partially executed, so always check filled quantity and average price.","hn":"Order ek instruction hai. Compatible buy aur sell orders match hon toh execution hota hai. Trade confirmation executed transaction batata hai. Order partly execute ho sakta hai, isliye filled quantity aur average price check karo."},"p":{"en":"If 10 shares were requested but only 4 were filled, the executed quantity is 4—not 10. The remaining 6 may still be open or may be cancelled/expired, depending on the order.","hn":"Agar 10 shares maange par sirf 4 fill hue, toh executed quantity 4 hai—10 nahi. Baaki 6 open reh sakte hain ya order ke hisaab se cancel/expire ho sakte hain."},"think":{"en":"An “Open” order status means the entire order has definitely been bought. True or false?","hn":"“Open” order status ka matlab poora order pakka buy ho gaya. Sahi ya galat?"},"reveal":{"en":"False. Open generally means the order is still pending in the market; check the actual order and trade status in the broker’s official records.","hn":"Galat. Open ka matlab aam taur par order abhi pending hai; broker ke official records mein actual order aur trade status check karo."}},{"k":"info","t":{"en":"Clearing: working out who owes what","hn":"Clearing: kiski kitni obligation hai"},"hook":{"en":"At the end of trading, many buyers and sellers have traded different quantities. How does the system work out the securities and money each participant must deliver?","hn":"Trading ke dauran bahut se buyers aur sellers alag quantities trade karte hain. System kaise calculate karta hai ki har participant ko kitni securities aur paisa deliver karna hai?"},"story":{"en":"Riya does not have to call the seller personally to arrange delivery. The market infrastructure processes trades under defined rules and calculates the relevant obligations.","hn":"Riya ko seller ko personally call karke delivery arrange nahi karni padti. Market infrastructure defined rules ke under trades process karti hai aur relevant obligations calculate karti hai."},"s":{"en":"Clearing determines and manages obligations arising from executed trades. Clearing corporations perform central functions in the process, including risk-management mechanisms under applicable rules. Clearing is not the same as final settlement.","hn":"Clearing executed trades se bani obligations ko determine aur manage karta hai. Clearing corporations process mein central functions perform karti hain, including applicable rules ke tahat risk-management mechanisms. Clearing final settlement ke same nahi hai."},"p":{"en":"Memory hook: EXECUTION = a trade is made; CLEARING = obligations are worked out; SETTLEMENT = delivery of funds/securities completes under the applicable cycle.","hn":"Yaad rakho: EXECUTION = trade hua; CLEARING = obligations calculate hui; SETTLEMENT = applicable cycle ke tahat funds/securities delivery complete hui."},"think":{"en":"Which stage primarily works out obligations after trades are executed?","hn":"Trades execute hone ke baad obligations work out karne ka kaam primarily kis stage mein hota hai?"},"reveal":{"en":"Clearing. Settlement is the subsequent process through which the required funds and securities are delivered.","hn":"Clearing. Settlement uske baad ka process hai jisme required funds aur securities deliver hote hain."}},{"k":"info","t":{"en":"Settlement: when funds and securities are delivered","hn":"Settlement: jab paisa aur securities deliver hote hain"},"hook":{"en":"Riya’s buy trade executes. The trade is real, but her account still has to go through the applicable settlement process. What does settlement complete?","hn":"Riya ka buy trade execute ho gaya. Trade ho chuka hai, lekin account ko applicable settlement process se guzarna hai. Settlement kya complete karta hai?"},"story":{"en":"For a normal eligible delivery trade, settlement is the process through which the relevant funds and securities are delivered according to the market’s settlement framework. Exact operational steps can vary by product and arrangement.","hn":"Normal eligible delivery trade mein settlement woh process hai jisme relevant funds aur securities market ke settlement framework ke mutabik deliver hote hain. Exact operational steps product aur arrangement ke hisaab se vary kar sakte hain."},"s":{"en":"Pay-in refers to funds/securities being delivered into the settlement process; payout refers to funds/securities being delivered to the entitled participants. Do not assume every app status is a final depository credit—check the broker and depository records.","hn":"Pay-in ka matlab funds/securities ka settlement process mein deliver hona; payout ka matlab entitled participants ko funds/securities milna. Har app status ko final depository credit mat samjho—broker aur depository records check karo."},"p":{"en":"If a delivery purchase executes today, the trade is not the same thing as a cash withdrawal or demat credit happening at the exact moment the button is pressed.","hn":"Aaj delivery purchase execute ho, toh trade aur button dabate hi cash withdrawal ya demat credit hona same baat nahi hai."},"think":{"en":"What is the difference between clearing and settlement?","hn":"Clearing aur settlement mein kya farq hai?"},"reveal":{"en":"Clearing works out/manages obligations; settlement completes the required delivery of funds and securities under the applicable cycle.","hn":"Clearing obligations calculate/manage karta hai; settlement applicable cycle ke tahat funds aur securities ki required delivery complete karta hai."}},{"k":"info","t":{"en":"T+1 and optional T+0: read the calendar correctly","hn":"T+1 aur optional T+0: calendar sahi samjho"},"hook":{"en":"Riya trades on a Monday and there is no market holiday on Tuesday. In a regular T+1 settlement example, what does T+1 mean?","hn":"Riya Monday ko trade karti hai aur Tuesday market holiday nahi hai. Regular T+1 settlement example mein T+1 ka matlab kya hai?"},"story":{"en":"T is the trade date. T+1 means the next settlement business day—not necessarily the next calendar day if a weekend or market holiday intervenes.","hn":"T trade date hai. T+1 ka matlab next settlement business day—not zaroori ki next calendar day ho, kyunki weekend ya market holiday beech mein aa sakta hai."},"s":{"en":"India’s equity cash market uses T+1 as the standard settlement cycle, while an optional T+0 cycle exists for eligible securities and participating arrangements. T+0 is not automatically available for every share, broker, client or trade. Always check current exchange/broker eligibility and operational rules.","hn":"India ke equity cash market mein T+1 standard settlement cycle hai, jabki eligible securities aur participating arrangements ke liye optional T+0 cycle bhi hai. T+0 har share, broker, client ya trade ke liye automatically available nahi. Current exchange/broker eligibility aur operational rules check karo."},"p":{"en":"Illustration: Monday trade + no Tuesday holiday → next business day is Tuesday under T+1. If Tuesday is a market holiday, use the applicable published settlement calendar—not a blind “tomorrow” assumption.","hn":"Example: Monday trade + Tuesday holiday nahi → T+1 ke tahat next business day Tuesday hai. Agar Tuesday market holiday ho, toh published settlement calendar follow karo—blindly “kal” assume mat karo."},"think":{"en":"Does T+1 always mean the next calendar day?","hn":"Kya T+1 ka matlab hamesha next calendar day hota hai?"},"reveal":{"en":"No. It means the next settlement business day, taking the applicable market holiday calendar into account.","hn":"Nahi. Iska matlab next settlement business day hai, applicable market holiday calendar ko dhyan mein rakhkar."}},{"k":"info","t":{"en":"Delivery vs intraday: know which product you selected","hn":"Delivery vs intraday: kaunsa product select kiya hai?"},"hook":{"en":"Riya buys shares to hold for several months. Her friend opens an intraday position intending to close it the same trading day. Are they necessarily using the same trading product?","hn":"Riya shares ko kai mahine hold karne ke liye kharidti hai. Uska dost intraday position kholta hai aur same trading day close karna chahta hai. Kya dono necessarily same trading product use kar rahe hain?"},"story":{"en":"A delivery-oriented purchase is intended to result in securities being held after settlement, subject to successful settlement and applicable rules. Intraday trading aims to open and close a position within the same session/day; broker product rules, square-off times and risks matter.","hn":"Delivery-oriented purchase ka intent settlement ke baad securities hold karna hota hai, successful settlement aur applicable rules ke subject mein. Intraday trading mein position same session/day mein open aur close karne ka aim hota hai; broker product rules, square-off timings aur risks matter karte hain."},"s":{"en":"Do not assume every “Buy” button means long-term delivery. Check the selected product, order type, margin, charges and broker’s current rules before submitting. Intraday positions can incur losses and may be squared off under applicable broker rules.","hn":"Har “Buy” button ko long-term delivery mat samjho. Submit karne se pehle selected product, order type, margin, charges aur broker ke current rules check karo. Intraday positions mein loss ho sakta hai aur applicable broker rules ke tahat square-off ho sakta hai."},"p":{"en":"Before placing an order, ask: am I buying for delivery or opening an intraday position? What happens if I do not close it as planned?","hn":"Order place karne se pehle poochho: delivery ke liye buy kar raha hoon ya intraday position khol raha hoon? Agar plan ke mutabik close na kiya toh kya hoga?"},"think":{"en":"Is intraday automatically the same as buying shares for long-term holding?","hn":"Kya intraday automatically long-term holding ke liye shares kharidne jaisa hai?"},"reveal":{"en":"No. Product type, position handling, margin and settlement implications differ. Check the broker’s current product rules before trading.","hn":"Nahi. Product type, position handling, margin aur settlement implications alag hote hain. Trade se pehle broker ke current product rules check karo."}},{"k":"info","t":{"en":"The final check: verify your order and holding","hn":"Final check: order aur holding verify karo"},"hook":{"en":"Riya sees the order as executed, but she wants to know whether the correct quantity and securities were eventually credited. Which records should she check?","hn":"Riya ko order executed dikh raha hai, lekin woh verify karna chahti hai ki sahi quantity aur securities aakhir credit hui ya nahi. Kaunse records check kare?"},"story":{"en":"A good investor does not rely on a single green tick. Order/trade history tells what was ordered and executed; broker statements and the demat statement help reconcile the resulting funds and securities movements.","hn":"Achha investor sirf ek green tick par depend nahi karta. Order/trade history batati hai kya order hua aur execute hua; broker statements aur demat statement funds aur securities movements reconcile karne mein madad karte hain."},"s":{"en":"Check order status and executed quantity in the broker’s official records, then compare relevant contract note/ledger and demat statement or CAS as applicable. Keep records and report discrepancies through official channels. Never share passwords, OTPs or TPINs with a person claiming to fix an issue.","hn":"Broker ke official records mein order status aur executed quantity check karo; phir relevant contract note/ledger aur applicable demat statement ya CAS se compare karo. Records sambhalo aur discrepancy official channels se report karo. Problem fix karne ka claim karne wale ko password, OTP ya TPIN mat do."},"p":{"en":"Riya ordered 10 shares; 8 executed; the settlement process completes for those 8. Her check should focus on the executed quantity and the resulting credited holding—not the original requested quantity alone.","hn":"Riya ne 10 shares order kiye; 8 execute hue; un 8 ka settlement complete hua. Use executed quantity aur resulting credited holding verify karni chahiye—not sirf original requested quantity."},"think":{"en":"If an order was placed for 10 shares but only 8 were executed, what quantity should you reconcile against the trade and settlement records?","hn":"Agar 10 shares ka order tha par sirf 8 execute hue, toh trade aur settlement records mein kis quantity ko reconcile karoge?"},"reveal":{"en":"Start with the executed quantity of 8, then verify the resulting settlement and holding records. The unfilled remainder may have a separate status.","hn":"Executed quantity 8 se shuru karo, phir resulting settlement aur holding records verify karo. Unfilled remainder ka status alag ho sakta hai."}},{"k":"mc","q":{"en":"Which account primarily records settled securities in electronic form?","hn":"Settled securities ko electronic form mein primarily kaunsa account record karta hai?"},"o":[[{"en":"Demat account","hn":"Demat account"},{"en":"Correct. It records electronic securities holdings.","hn":"Sahi. Ye electronic securities holdings record karta hai."}],[{"en":"Bank account","hn":"Bank account"},{"en":"A bank account primarily records money, not demat holdings.","hn":"Bank account primarily paisa record karta hai, demat holdings nahi."}],[{"en":"Trading account alone","hn":"Sirf trading account"},{"en":"The trading account provides order access; it is not the demat holding record.","hn":"Trading account order access deta hai; demat holding record nahi hai."}]],"a":0},{"k":"mc","q":{"en":"Riya’s order says “Open”. What does that usually mean?","hn":"Riya ke order par “Open” likha hai. Aam taur par iska kya matlab hai?"},"o":[[{"en":"It is still pending and may not have executed","hn":"Order abhi pending hai aur execute nahi hua ho sakta"},{"en":"Correct. Check the filled quantity and order status.","hn":"Sahi. Filled quantity aur order status check karo."}],[{"en":"All shares are already settled","hn":"Saare shares settle ho gaye"},{"en":"Open status does not mean settlement is complete.","hn":"Open status ka matlab settlement complete nahi."}],[{"en":"The company has paid a dividend","hn":"Company ne dividend pay kiya"},{"en":"Order status is unrelated to dividend payment.","hn":"Order status dividend payment se related nahi."}]],"a":0},{"k":"mc","q":{"en":"What is the main role of a Depository Participant (DP)?","hn":"Depository Participant (DP) ka main role kya hai?"},"o":[[{"en":"Provide depository services to investors","hn":"Investors ko depository services dena"},{"en":"Correct. A DP is the service participant through which investors access demat services.","hn":"Sahi. DP woh service participant hai jiske through investors demat services lete hain."}],[{"en":"Guarantee every investment return","hn":"Har investment return guarantee karna"},{"en":"No intermediary can guarantee market returns.","hn":"Koi intermediary market returns guarantee nahi kar sakta."}],[{"en":"Set every share’s market price","hn":"Har share ka market price set karna"},{"en":"Prices emerge through market trading; a DP does not set them.","hn":"Prices market trading se emerge hote hain; DP unhe set nahi karta."}]],"a":0},{"k":"mc","q":{"en":"A limit order is placed but no compatible order matches. What may happen?","hn":"Limit order place hua par compatible order match nahi hua. Kya ho sakta hai?"},"o":[[{"en":"It may remain unfilled/open or later expire/cancel","hn":"Woh unfilled/open reh sakta hai ya baad mein expire/cancel ho sakta hai"},{"en":"Correct. Order placement does not guarantee execution.","hn":"Sahi. Order place hone se execution guarantee nahi hota."}],[{"en":"It is automatically a completed trade","hn":"Woh automatically completed trade hai"},{"en":"No. A match is needed for execution.","hn":"Nahi. Execution ke liye match hona zaroori hai."}],[{"en":"It immediately credits shares to demat","hn":"Shares turant demat mein credit ho jaate hain"},{"en":"A pending order does not create a settled holding.","hn":"Pending order se settled holding nahi banti."}]],"a":0},{"k":"mc","q":{"en":"Which statement best describes clearing?
