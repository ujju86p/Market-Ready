it"},{"en":"SIP does not guarantee profit.","hn":"SIP profit guarantee nahi karti."}],[{"en":"That losses are impossible","hn":"Loss impossible hain"},{"en":"Market risk remains.","hn":"Market risk rehta hai."}]],"a":0},{"k":"mc","q":{"en":"Why compare the current TER of mutual fund plans?","hn":"Mutual fund plans ka current TER compare kyun karein?"},"o":[[{"en":"Expenses affect NAV and investor outcomes over time","hn":"Expenses NAV aur time ke saath investor outcome affect karte hain"},{"en":"Correct. Use current official disclosures; TER can change.","hn":"Sahi. Current official disclosures use karo; TER badal sakta hai."}],[{"en":"TER guarantees future performance","hn":"TER future performance guarantee karta hai"},{"en":"Costs do not guarantee performance.","hn":"Costs performance guarantee nahi karte."}],[{"en":"TER is always identical for every plan","hn":"Har plan ka TER hamesha same hai"},{"en":"Plan expense structures can differ.","hn":"Plan expense structures alag ho sakte hain."}]],"a":0},{"k":"mc","q":{"en":"What does a Riskometer tell you?","hn":"Riskometer kya batata hai?"},"o":[[{"en":"A scheme-level risk indicator, not a personal guarantee","hn":"Scheme-level risk indicator, personal guarantee nahi"},{"en":"Correct. Suitability also depends on personal circumstances.","hn":"Sahi. Suitability personal circumstances par bhi depend karti hai."}],[{"en":"That you cannot lose money","hn":"Aap paisa lose nahi kar sakte"},{"en":"Riskometer does not eliminate risk.","hn":"Riskometer risk eliminate nahi karta."}],[{"en":"A guaranteed future return","hn":"Guaranteed future return"},{"en":"It does not predict or guarantee returns.","hn":"Ye return predict ya guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Does diversification eliminate every risk?","hn":"Kya diversification har risk eliminate karti hai?"},"o":[[{"en":"No; it can reduce some concentration risks but not all risks","hn":"Nahi; kuch concentration risks reduce kar sakti hai, saare risks nahi"},{"en":"Correct. Broad market and other risks remain.","hn":"Sahi. Broad market aur doosre risks rehte hain."}],[{"en":"Yes, if a fund owns more than ten securities","hn":"Haan, agar fund ten se zyada securities own kare"},{"en":"A number alone does not guarantee diversification.","hn":"Sirf count diversification guarantee nahi karta."}],[{"en":"It guarantees positive returns","hn":"Positive returns guarantee karti hai"},{"en":"Returns are not guaranteed.","hn":"Returns guaranteed nahi."}]],"a":0},{"k":"mc","q":{"en":"A real redemption needs a tax answer. What is the safest next step?","hn":"Real redemption ke tax answer ke liye safest next step kya hai?"},"o":[[{"en":"Check current official tax guidance for the relevant tax year and seek qualified advice if needed","hn":"Relevant tax year ki current official tax guidance check karo aur zaroorat par qualified advice lo"},{"en":"Correct. Rules and transitional treatment can depend on the tax year and transaction.","hn":"Sahi. Rules aur transitional treatment tax year aur transaction par depend kar sakte hain."}],[{"en":"Use a tax rate from an old social-media post","hn":"Purane social-media post ka tax rate use karo"},{"en":"It may be outdated or incomplete.","hn":"Woh outdated ya incomplete ho sakta hai."}],[{"en":"Assume all mutual funds have the same tax treatment","hn":"Saare mutual funds ka tax same assume karo"},{"en":"Tax treatment can vary by fund type and applicable law.","hn":"Tax fund type aur applicable law ke hisaab se alag ho sakta hai."}]],"a":0},{"k":"end"}];
UNITS.x6=[{"k":"info","t":{"en":"Commodity, metal and security are different things","hn":"Commodity, metal aur security alag cheezein hain"},"hook":{"en":"A learner sees gold, a gold ETF and a gold futures contract in different apps. Do all three represent the same legal and economic exposure?","hn":"Learner ko alag apps mein physical gold, gold ETF aur gold futures contract dikhta hai. Kya teeno same legal aur economic exposure represent karte hain?"},"story":{"en":"A commodity is a raw material or primary product such as gold, silver, crude oil or certain agricultural goods. Physical ownership, a fund unit linked to gold, and an exchange-traded derivative are different products with different rights and risks.","hn":"Commodity raw material ya primary product hai, jaise gold, silver, crude oil ya kuch agricultural goods. Physical ownership, gold-linked fund unit aur exchange-traded derivative alag products hain—rights aur risks bhi alag."},"s":{"en":"Before comparing, identify what you actually own: a physical item, a fund unit, or a contract whose value depends on an underlying commodity.","hn":"Compare karne se pehle identify karo ki actually own kya kar rahe ho: physical item, fund unit, ya underlying commodity par depend karne wala contract."},"p":{"en":"A gold price headline does not tell you the price, fees, risks or rights of every gold-related product.","hn":"Gold price headline har gold-related product ka price, fees, risks ya rights nahi batata."},"think":{"en":"Does buying a gold futures contract mean you immediately own physical gold?","hn":"Gold futures contract kharidne ka matlab kya turant physical gold own karna hai?"},"reveal":{"en":"No. A futures contract creates contractual obligations under its terms; physical delivery, where relevant, depends on contract and exchange rules.","hn":"Nahi. Futures contract terms ke under contractual obligations create karta hai; jahan physical delivery relevant ho, woh contract aur exchange rules par depend karti hai."}},{"k":"info","t":{"en":"Physical gold: familiar, but not cost-free","hn":"Physical gold familiar hai, par cost-free nahi"},"hook":{"en":"A family buys jewellery for a wedding and calls it an “investment”. Which costs or differences should they remember?","hn":"Ek family wedding ke liye jewellery kharidti hai aur use “investment” kehti hai. Kaunse costs ya differences yaad rakhne chahiye?"},"story":{"en":"Physical gold may involve making charges, buy/sell spreads, purity verification, storage, insurance and resale conditions. Jewellery’s resale value may not equal the total retail price paid.","hn":"Physical gold mein making charges, buy/sell spreads, purity verification, storage, insurance aur resale conditions ho sakti hain. Jewellery ki resale value total retail price ke equal nahi ho sakti."},"s":{"en":"Gold prices can rise or fall. Local prices can also reflect purity, taxes/levies, currency and local market conditions. A gold purchase does not guarantee a profit or protect every portfolio in every scenario.","hn":"Gold price upar ya neeche ho sakta hai. Local price purity, taxes/levies, currency aur local market conditions bhi reflect kar sakta hai. Gold purchase profit guarantee nahi karti aur har situation mein portfolio protect nahi karti."},"p":{"en":"Illustration only: if the resale offer is below the original jewellery bill, the difference may include making charges and the bid/ask spread as well as market-price movement. Actual terms vary by seller and product.","hn":"Sirf illustration: agar resale offer original jewellery bill se kam ho, toh difference mein making charges aur bid/ask spread ke saath market-price movement bhi ho sakta hai. Actual terms seller aur product ke hisaab se vary karte hain."},"think":{"en":"Does the gold price going up by 5% guarantee that jewellery resale proceeds rise by exactly 5%?","hn":"Gold price 5% badhne se kya jewellery resale proceeds exactly 5% badhna guarantee hai?"},"reveal":{"en":"No. Purity, charges, spreads and resale terms can affect the amount received.","hn":"Nahi. Purity, charges, spreads aur resale terms received amount affect kar sakte hain."}},{"k":"info","t":{"en":"Gold ETF and fund units","hn":"Gold ETF aur fund units"},"hook":{"en":"Someone wants gold-price exposure but does not want to store jewellery at home. What should they understand about a gold ETF or related fund?","hn":"Koi gold-price exposure chahta hai lekin ghar par jewellery store nahi karna chahta. Gold ETF ya related fund ke baare mein kya samajhna chahiye?"},"story":{"en":"A gold ETF is a securities-market product designed to provide exposure linked to gold under its stated mandate. It is a fund unit, not the same as taking home jewellery or bars. Related fund structures can have their own costs and risks.","hn":"Gold ETF securities-market product hai jo stated mandate ke mutabik gold-linked exposure dene ke liye designed hota hai. Ye fund unit hai, ghar jewellery ya bars lana nahi. Related fund structures ke apne costs aur risks ho sakte hain."},"s":{"en":"Check the scheme mandate, underlying exposure, tracking difference, expense ratio, liquidity, bid–ask spread, demat/trading requirements and the current official scheme documents. Price may not match the retail jewellery price.","hn":"Scheme mandate, underlying exposure, tracking difference, expense ratio, liquidity, bid–ask spread, demat/trading requirements aur current official scheme documents check karo. Price retail jewellery price se match nahi bhi kar sakta."},"p":{"en":"A gold ETF’s market price can move during trading and may differ from indicative/net asset value. Fees and market risks remain.","hn":"Gold ETF ka market price trading ke dauran move kar sakta hai aur indicative/net asset value se differ kar sakta hai. Fees aur market risks rehte hain."},"think":{"en":"Does a gold ETF unit give the same ownership rights as physical jewellery?","hn":"Kya gold ETF unit physical jewellery jaisi ownership rights deti hai?"},"reveal":{"en":"No. It is a security/fund unit governed by its scheme documents, not a piece of jewellery held by you.","hn":"Nahi. Ye scheme documents ke under security/fund unit hai, aapke paas rakhi jewellery nahi."}},{"k":"info","t":{"en":"Futures are contracts, not a small gold purchase","hn":"Futures contract hai, chhoti gold purchase nahi"},"hook":{"en":"A gold futures contract shows a small margin amount compared with the contract value. Does that mean the economic exposure is small?","hn":"Gold futures contract mein contract value ke comparison mein margin amount chhota dikh raha hai. Kya economic exposure bhi chhota hai?"},"story":{"en":"A futures contract is an agreement with defined terms such as underlying, contract size, expiry, price quotation, tick size and settlement method. Margin is collateral/performance security under exchange and broker rules, not the maximum possible loss.","hn":"Futures contract ek agreement hai jisme underlying, contract size, expiry, price quotation, tick size aur settlement method jaise defined terms hote hain. Margin exchange/broker rules ke under collateral/performance security hai, maximum possible loss nahi."},"s":{"en":"Leverage means a relatively small margin supports a larger exposure. Price changes can therefore create losses large relative to the margin, and additional funds may be required under applicable rules.","hn":"Leverage ka matlab relatively chhota margin larger exposure support karta hai. Isliye price changes margin ke comparison mein bade losses create kar sakte hain aur applicable rules ke mutabik additional funds chahiye ho sakte hain."},"p":{"en":"Do not infer the lot size, margin, expiry or delivery rules from an old screenshot. Check the exact current contract specification and broker risk disclosures before any real transaction.","hn":"Old screenshot se lot size, margin, expiry ya delivery rules infer mat karo. Real transaction se pehle exact current contract specification aur broker risk disclosures check karo."},"think":{"en":"Is margin the maximum amount you can lose on a futures position?","hn":"Kya margin futures position par maximum loss hai?"},"reveal":{"en":"No. Losses can exceed the initial margin; obligations depend on the contract and applicable rules.","hn":"Nahi. Loss initial margin se zyada ho sakta hai; obligations contract aur applicable rules par depend karte hain."}},{"k":"info","t":{"en":"Expiry and settlement must be checked","hn":"Expiry aur settlement verify karna zaroori hai"},"hook":{"en":"A trader keeps a commodity futures position open near expiry without reading the contract. What could go wrong?","hn":"Trader contract padhe bina expiry ke paas commodity futures position open rakhta hai. Kya problem ho sakti hai?"},"story":{"en":"Commodity contracts differ. Their expiry dates, trading hours, delivery/settlement process, quality/grade, delivery location, lot size and obligations are defined in current exchange contract specifications. Some contracts can involve delivery obligations.","hn":"Commodity contracts alag hote hain. Expiry dates, trading hours, delivery/settlement process, quality/grade, delivery location, lot size aur obligations current exchange contract specifications mein defined hote hain. Kuch contracts mein delivery obligations ho sakti hain."},"s":{"en":"A trader must understand whether a contract is cash-settled or deliverable and what actions are required before expiry. Broker square-off practices and exchange rules may matter, but do not assume a broker will always close a position for you.","hn":"Trader ko samajhna chahiye contract cash-settled hai ya deliverable aur expiry se pehle kya action required hai. Broker square-off practices aur exchange rules matter kar sakte hain, lekin assume mat karo ki broker hamesha position close kar dega."},"p":{"en":"Contract specifications and delivery calendars can change. Verify the exact current contract and notices from the relevant recognised exchange.","hn":"Contract specifications aur delivery calendars badal sakte hain. Relevant recognised exchange ke exact current contract aur notices verify karo."},"think":{"en":"What should you verify before holding a commodity derivative near expiry?","hn":"Commodity derivative expiry ke paas hold karne se pehle kya verify karna chahiye?"},"reveal":{"en":"Contract size, expiry, settlement/delivery type, quality/location obligations and current exchange/broker rules.","hn":"Contract size, expiry, settlement/delivery type, quality/location obligations aur current exchange/broker rules."}},{"k":"info","t":{"en":"Mark-to-market and margin calls","hn":"Mark-to-market aur margin calls"},"hook":{"en":"A futures position moves against a trader after the market closes. Why might the account need more funds?","hn":"Market close ke baad futures position trader ke against move karti hai. Account mein aur funds kyun chahiye ho sakte hain?"},"story":{"en":"Exchange-traded derivatives use margining and settlement processes under applicable rules. Daily or periodic mark-to-market can reflect losses, and a broker/exchange may require additional margin or funds.","hn":"Exchange-traded derivatives applicable rules ke under margining aur settlement processes use karte hain. Daily ya periodic mark-to-market losses reflect kar sakta hai, aur broker/exchange additional margin ya funds maang sakta hai."},"s":{"en":"If funds are insufficient, positions may be reduced or closed under applicable rules, and further obligations may remain. Exact timing and process depend on the product, exchange and broker.","hn":"Funds insufficient hon toh applicable rules ke under positions reduce ya close ho sakti hain, aur further obligations remain kar sakti hain. Exact timing/process product, exchange aur broker par depend karta hai."},"p":{"en":"Hypothetical illustration: a ₹1,00,000 exposure can lose value even if initial margin is only a fraction of that exposure. The margin percentage and loss are not fixed by this example.","hn":"Hypothetical illustration: ₹1,00,000 exposure ki value gir sakti hai, chahe initial margin uska sirf ek fraction ho. Is example se margin percentage ya loss fixed nahi hota."},"think":{"en":"Does a smaller margin mean the contract is safer?","hn":"Kya chhota margin contract ko safer banata hai?"},"reveal":{"en":"No. Margin size is not a measure of maximum loss; leverage can magnify losses relative to funds posted.","hn":"Nahi. Margin size maximum loss ka measure nahi; leverage posted funds ke comparison mein losses magnify kar sakta hai."}},{"k":"info","t":{"en":"Gold and commodity prices have multiple drivers","hn":"Gold aur commodity prices ke multiple drivers hote hain"},"hook":{"en":"A gold price rises one day and falls the next. Can one headline reliably explain every move?","hn":"Gold price ek din badhta hai aur agle din girta hai. Kya ek headline har move reliably explain kar sakti hai?"},"story":{"en":"Commodity prices can be influenced by supply and demand, inventories, production, weather for agricultural goods, geopolitical events, currency movements, interest rates and global market conditions. Different commodities respond to different factors.","hn":"Commodity prices supply-demand, inventories, production, agricultural goods ke liye weather, geopolitical events, currency movements, interest rates aur global market conditions se affect ho sakte hain. Alag commodities alag factors par react karti hain."},"s":{"en":"Gold can respond to real interest rates, currency movements, investor demand and uncertainty, among other factors. These are influences, not deterministic signals or a guarantee of future direction.","hn":"Gold real interest rates, currency movements, investor demand aur uncertainty jaise factors par react kar sakta hai. Ye influences hain, deterministic signals ya future direction ki guarantee nahi."},"p":{"en":"A price chart or headline alone is not enough to decide whether an instrument is suitable. Learn the product’s risks and verify the data timestamp and source.","hn":"Price chart ya headline akela decide karne ke liye enough nahi ki instrument suitable hai. Product risks samjho aur data ka timestamp/source verify karo."},"think":{"en":"Can a single economic headline guarantee where gold will trade next?","hn":"Kya ek economic headline guarantee kar sakti hai ki gold next kahan trade karega?"},"reveal":{"en":"No. Prices reflect multiple changing factors and can move unpredictably.","hn":"Nahi. Prices multiple changing factors reflect karte hain aur unpredictable move kar sakte hain."}},{"k":"info","t":{"en":"Hedging and speculation are different goals","hn":"Hedging aur speculation alag goals hain"},"hook":{"en":"A jeweller worries that gold prices may rise before replenishing stock. Another person trades gold only to profit from price movement. Are their goals the same?","hn":"Jeweller ko stock refill karne se pehle gold price badhne ki chinta hai. Doosra person sirf price movement se profit ke liye trade karta hai. Kya dono ke goals same hain?"},"story":{"en":"Hedging uses a position to reduce an existing or anticipated business/portfolio risk. Speculation takes exposure in expectation of a price move. A hedge can reduce one risk while introducing basis, liquidity, margin or other risks.","hn":"Hedging existing ya anticipated business/portfolio risk reduce karne ke liye position use karti hai. Speculation price move ki expectation mein exposure leti hai. Hedge ek risk reduce karke basis, liquidity, margin ya doosre risks introduce kar sakta hai."},"s":{"en":"A derivative is not automatically a hedge. The exposure, contract, quantity, timing and risk reduction must be assessed. An imperfect hedge can lose money or fail to offset the underlying exposure exactly.","hn":"Derivative automatically hedge nahi hota. Exposure, contract, quantity, timing aur risk reduction assess karna hota hai. Imperfect hedge loss de sakta hai ya underlying exposure ko exactly offset nahi kar sakta."},"p":{"en":"For a beginner, the important lesson is to identify the purpose and maximum plausible obligations before considering any derivative; this is not a trade recommendation.","hn":"Beginner ke liye important hai purpose aur possible obligations samajhna before any derivative consider karna; ye trade recommendation nahi hai."},"think":{"en":"Does using a derivative automatically make a position a hedge?","hn":"Kya derivative use karne se position automatically hedge ban jaati hai?"},"reveal":{"en":"No. It is a hedge only to the extent it actually reduces a defined exposure; other risks remain.","hn":"Nahi. Defined exposure ko jitna actually reduce kare utne extent tak hedge hai; doosre risks rehte hain."}},{"k":"info","t":{"en":"Commodity derivatives are high-risk products","hn":"Commodity derivatives high-risk products hain"},"hook":{"en":"A social-media post shows a large profit from a commodity trade but omits the loss and margin details. What information is missing?","hn":"Social-media post commodity trade ka bada profit dikhata hai lekin loss aur margin details omit karta hai. Kya missing hai?"},"story":{"en":"A complete risk view includes contract size, price movement, leverage, margin calls, liquidity, transaction costs, expiry, settlement/delivery obligations and the possibility of losing substantial money.","hn":"Complete risk view mein contract size, price movement, leverage, margin calls, liquidity, transaction costs, expiry, settlement/delivery obligations aur substantial money lose karne ki possibility shamil hai."},"s":{"en":"Do not trade on guaranteed-return claims, unverified groups or screenshots. Verify intermediaries and product rules through official sources. Never borrow or use emergency funds just because margin appears small.","hn":"Guaranteed-return claims, unverified groups ya screenshots par trade mat karo. Official sources se intermediaries aur product rules verify karo. Sirf margin chhota dikhne ki wajah se borrow ya emergency funds use mat karo."},"p":{"en":"SEBI and recognised exchanges publish investor-awareness and product material. Use current official materials and understand the exact product before making any decision.","hn":"SEBI aur recognised exchanges investor-awareness aur product material publish karte hain. Current official materials use karo aur decision se pehle exact product samjho."},"think":{"en":"What is the safest response to a claim that commodity derivatives guarantee quick profits?","hn":"Commodity derivatives quick profit guarantee karte hain—aisi claim par safest response kya hai?"},"reveal":{"en":"Treat it as a red flag; verify the product and intermediary, and remember that derivatives can cause substantial losses.","hn":"Red flag samjho; product aur intermediary verify karo, aur yaad rakho derivatives substantial loss de sakte hain."}},{"k":"info","t":{"en":"Tax treatment depends on the exact product and tax year","hn":"Tax exact product aur tax year par depend karta hai"},"hook":{"en":"Someone asks whether physical gold, a gold ETF and commodity futures all have the same tax treatment. Should you give one universal rate?","hn":"Koi poochta hai physical gold, gold ETF aur commodity futures ka tax same hai kya. Kya ek universal rate dena chahiye?"},"story":{"en":"Tax treatment can differ by the legal form of the asset, transaction type, holding period, taxpayer circumstances and the law applicable to the relevant tax year. This lesson intentionally does not provide a universal rate.","hn":"Tax treatment asset ke legal form, transaction type, holding period, taxpayer circumstances aur relevant tax year ke law par depend karke alag ho sakta hai. Ye lesson jaan-boojhkar universal rate nahi deta."},"s":{"en":"India’s Income-tax Act, 2025 came into force on 1 April 2026. Transitional rules preserve treatment for earlier tax years and proceedings, so the relevant year matters. For real transactions, check current official Income Tax Department/CBDT material and obtain qualified tax advice when needed.","hn":"India ka Income-tax Act, 2025 1 April 2026 se effective hua. Transitional rules earlier tax years aur proceedings ka treatment preserve karte hain, isliye relevant year matter karta hai. Real transaction ke liye current official Income Tax Department/CBDT material check karo aur zaroorat par qualified tax advice lo."},"p":{"en":"All numerical price/margin examples in this lesson are hypothetical and conceptual unless an official source and date are expressly stated. Do not use them as current quotes, margin requirements or tax advice.","hn":"Is lesson ke saare numerical price/margin examples hypothetical aur conceptual hain jab tak official source aur date explicitly na di ho. Inhe current quotes, margin requirements ya tax advice ki tarah use mat karo."},"think":{"en":"Before acting on a tax question, what should you identify first?","hn":"Tax question par action lene se pehle sabse pehle kya identify karna chahiye?"},"reveal":{"en":"Identify the exact product, transaction, dates and relevant tax year, then verify current official guidance or consult a qualified professional.","hn":"Exact product, transaction, dates aur relevant tax year identify karo, phir current official guidance verify karo ya qualified professional se consult karo."}},{"k":"mc","q":{"en":"Which statement about a commodity futures contract is correct?","hn":"Commodity futures contract ke baare mein kaunsa statement sahi hai?"},"o":[[{"en":"It is a contract with specified terms, not immediate ownership of physical goods in every case","hn":"Ye specified terms wala contract hai, har case mein physical goods ki immediate ownership nahi"},{"en":"Correct. Settlement and delivery depend on the contract rules.","hn":"Sahi. Settlement aur delivery contract rules par depend karte hain."}],[{"en":"It always gives you jewellery or bullion immediately","hn":"Ye hamesha turant jewellery ya bullion deta hai"},{"en":"A futures position is not the same as buying physical gold.","hn":"Futures position physical gold kharidne jaisi nahi."}],[{"en":"Its margin is the maximum possible loss","hn":"Iska margin maximum possible loss hai"},{"en":"Losses can exceed initial margin.","hn":"Loss initial margin se zyada ho sakta hai."}]],"a":0},{"k":"mc","q":{"en":"What can make jewellery resale proceeds differ from the gold price change?","hn":"Jewellery resale proceeds gold price change se alag kyun ho sakte hain?"},"o":[[{"en":"Purity, making charges, spreads and resale terms","hn":"Purity, making charges, spreads aur resale terms"},{"en":"Correct. Retail purchase and resale values are not identical concepts.","hn":"Sahi. Retail purchase aur resale value same concept nahi."}],[{"en":"Gold prices never change","hn":"Gold prices kabhi change nahi hote"},{"en":"Gold prices can rise or fall.","hn":"Gold prices upar ya neeche ho sakte hain."}],[{"en":"The original bill is always repaid in full","hn":"Original bill hamesha full repay hota hai"},{"en":"Resale value is not guaranteed to equal the bill.","hn":"Resale value bill ke equal guaranteed nahi."}]],"a":0},{"k":"mc","q":{"en":"Which statement about a gold ETF is best?","hn":"Gold ETF ke baare mein kaunsa statement best hai?"},"o":[[{"en":"It is a fund/security unit, not the same as physical jewellery","hn":"Ye fund/security unit hai, physical jewellery jaisa nahi"},{"en":"Correct. Read the mandate, costs, liquidity and current scheme documents.","hn":"Sahi. Mandate, costs, liquidity aur current scheme documents padho."}],[{"en":"It has no market risk or costs","hn":"Isme market risk ya cost nahi"},{"en":"Costs and market risk may apply.","hn":"Costs aur market risk apply ho sakte hain."}],[{"en":"It always trades exactly at NAV","hn":"Ye hamesha exactly NAV par trade hota hai"},{"en":"Exchange price can differ from NAV.","hn":"Exchange price NAV se differ kar sakta hai."}]],"a":0},{"k":"mc","q":{"en":"Does initial margin cap the loss on a futures position?","hn":"Kya initial margin futures position ka loss cap karti hai?"},"o":[[{"en":"No; losses can exceed the margin posted","hn":"Nahi; loss posted margin se zyada ho sakta hai"},{"en":"Correct. Margin is not the maximum possible loss.","hn":"Sahi. Margin maximum possible loss nahi."}],[{"en":"Yes; loss can never exceed it","hn":"Haan; loss kabhi usse zyada nahi ho sakta"},{"en":"That is incorrect.","hn":"Ye galat hai."}],[{"en":"Only if the market is volatile","hn":"Sirf market volatile ho toh"},{"en":"Leverage risk exists even when markets seem calm.","hn":"Market calm lage tab bhi leverage risk hota hai."}]],"a":0},{"k":"mc","q":{"en":"What must be checked before holding a commodity contract near expiry?","hn":"Commodity contract expiry ke paas hold karne se pehle kya check karna chahiye?"},"o":[[{"en":"Current contract size, expiry, settlement/delivery and exchange rules","hn":"Current contract size, expiry, settlement/delivery aur exchange rules"},{"en":"Correct. Delivery obligations can apply to some contracts.","hn":"Sahi. Kuch contracts mein delivery obligations apply ho sakti hain."}],[{"en":"Only the last traded price","hn":"Sirf last traded price"},{"en":"Price alone does not show the contract obligations.","hn":"Price contract obligations nahi batata."}],[{"en":"Assume the broker will always close it automatically","hn":"Assume karo broker hamesha automatically close karega"},{"en":"Do not assume; verify current broker and exchange rules.","hn":"Assume mat karo; current broker aur exchange rules verify karo."}]],"a":0},{"k":"mc","q":{"en":"Why can a broker ask for additional funds after a futures position moves against you?","hn":"Futures position against move kare toh broker additional funds kyun maang sakta hai?"},"o":[[{"en":"Margining and mark-to-market processes can reflect losses and obligations","hn":"Margining aur mark-to-market processes losses aur obligations reflect kar sakte hain"},{"en":"Correct. Exact processes depend on current rules and the contract.","hn":"Sahi. Exact process current rules aur contract par depend karta hai."}],[{"en":"Because losses are impossible","hn":"Kyunki loss impossible hai"},{"en":"Losses can occur and funds may be required.","hn":"Loss ho sakta hai aur funds required ho sakte hain."}],[{"en":"Because margin guarantees profit","hn":"Kyunki margin profit guarantee karta hai"},{"en":"Margin is risk collateral, not a profit promise.","hn":"Margin risk collateral hai, profit promise nahi."}]],"a":0},{"k":"mc","q":{"en":"Which is a reasonable statement about gold price drivers?","hn":"Gold price drivers ke baare mein kaunsa statement reasonable hai?"},"o":[[{"en":"Several factors can influence prices; no single headline guarantees direction","hn":"Kai factors prices ko influence karte hain; ek headline direction guarantee nahi karti"},{"en":"Correct. Currency, rates, demand and uncertainty can all matter.","hn":"Sahi. Currency, rates, demand aur uncertainty matter kar sakte hain."}],[{"en":"One news headline always predicts tomorrow’s price","hn":"Ek news headline hamesha kal ka price predict karti hai"},{"en":"Prices can move unpredictably.","hn":"Prices unpredictable move kar sakte hain."}],[{"en":"Gold can never fall in price","hn":"Gold price kabhi gir nahi sakta"},{"en":"Gold prices can fall as well as rise.","hn":"Gold price gir bhi sakta hai aur badh bhi."}]],"a":0},{"k":"mc","q":{"en":"When is a derivative being used as a hedge?","hn":"Derivative kab hedge ke roop mein use ho raha hai?"},"o":[[{"en":"When it actually reduces a defined existing or anticipated exposure, while other risks remain","hn":"Jab woh defined existing ya anticipated exposure ko actually reduce kare, baaki risks ke saath"},{"en":"Correct. A derivative is not automatically a hedge.","hn":"Sahi. Derivative automatically hedge nahi hota."}],[{"en":"Whenever someone buys a contract","hn":"Jab bhi koi contract kharide"},{"en":"Purpose and exposure matter.","hn":"Purpose aur exposure matter karte hain."}],[{"en":"When it guarantees profit","hn":"Jab profit guarantee kare"},{"en":"A hedge does not guarantee profit.","hn":"Hedge profit guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"A social-media group promises guaranteed profits from commodity derivatives. What should you do?","hn":"Social-media group commodity derivatives se guaranteed profit promise karta hai. Kya karein?"},"o":[[{"en":"Treat it as a red flag and verify through official sources","hn":"Red flag samjho aur official sources se verify karo"},{"en":"Correct. Derivatives can cause substantial losses.","hn":"Sahi. Derivatives substantial losses cause kar sakte hain."}],[{"en":"Share your broker password with the group","hn":"Group ko broker password do"},{"en":"Never share credentials.","hn":"Credentials kabhi share mat karo."}],[{"en":"Borrow money because margin is small","hn":"Margin chhota hai isliye borrow karo"},{"en":"Small margin can support large exposure and losses.","hn":"Chhota margin large exposure aur loss support kar sakta hai."}]],"a":0},{"k":"mc","q":{"en":"What is the correct approach to tax on physical gold, gold ETFs and commodity derivatives?","hn":"Physical gold, gold ETF aur commodity derivatives ke tax par correct approach kya hai?"},"o":[[{"en":"Check exact product, transaction dates, relevant tax year and current official guidance","hn":"Exact product, transaction dates, relevant tax year aur current official guidance check karo"},{"en":"Correct. One universal rate should not be assumed.","hn":"Sahi. Ek universal rate assume nahi karna chahiye."}],[{"en":"Assume all three have identical treatment","hn":"Teeno ka tax same assume karo"},{"en":"Treatment may differ by product and applicable law.","hn":"Treatment product aur applicable law se differ ho sakta hai."}],[{"en":"Use an undated online screenshot","hn":"Bina date ka online screenshot use karo"},{"en":"Verify current official sources and seek qualified advice when needed.","hn":"Current official sources verify karo aur zaroorat par qualified advice lo."}]],"a":0},{"k":"end"}];
UNITS.x7=[{"k":"info","t":{"en":"Meet the balance sheet","hn":"Balance sheet se milo"},"hook":{"en":"A shop owns equipment worth ₹8 lakh, has stock worth ₹2 lakh, and owes suppliers ₹3 lakh. Is the shop worth ₹10 lakh to its owners?","hn":"Ek shop ke equipment ₹8 lakh ke hain, stock ₹2 lakh ka hai aur suppliers ko ₹3 lakh dene hain. Kya owners ki net value ₹10 lakh hai?"},"story":{"en":"Neha looks at an imaginary company at one specific date. The balance sheet is a snapshot: it lists resources, obligations and the residual interest of owners.","hn":"Neha ek imaginary company ko ek specific date par dekhti hai. Balance sheet ek snapshot hai: resources, obligations aur owners ka bacha hua interest dikhati hai."},"s":{"en":"A balance sheet presents assets, liabilities and equity at a reporting date. It is not the same as a cash-flow statement and does not directly show how much cash moved during the whole year.","hn":"Balance sheet reporting date par assets, liabilities aur equity dikhati hai. Ye cash-flow statement jaisi nahi aur poore saal cash kitna move hua woh directly nahi batati."},"p":{"en":"Illustrative example only: values are hypothetical and are not data from a real company or a current investment recommendation.","hn":"Sirf illustrative example: values hypothetical hain, kisi real company ka data ya current investment recommendation nahi."},"think":{"en":"What makes a balance sheet a snapshot?","hn":"Balance sheet snapshot kyun hoti hai?"},"reveal":{"en":"It describes financial position at a particular date, not every movement over a period.","hn":"Ye ek particular date ki financial position dikhati hai, poore period ke har movement ko nahi."}},{"k":"info","t":{"en":"Assets: what the company controls","hn":"Assets: company ke paas kya hai"},"hook":{"en":"A business has cash, customer receivables, inventory and machines. Which of these might appear as assets?","hn":"Business ke paas cash, customer se milne wala paisa, inventory aur machines hain. Inmein se kya assets ho sakte hain?"},"story":{"en":"Neha separates resources that the company controls from amounts it owes. Cash and inventory may be assets; so can equipment and amounts receivable, subject to accounting recognition rules.","hn":"Neha company ke controlled resources ko owed amounts se alag karti hai. Cash aur inventory assets ho sakte hain; equipment aur receivables bhi, accounting recognition rules ke subject mein."},"s":{"en":"Assets may include current assets, such as cash, eligible receivables and inventory, and non-current assets, such as property, plant and equipment. Classification depends on applicable accounting standards and circumstances.","hn":"Assets mein current assets—jaise cash, eligible receivables aur inventory—aur non-current assets—jaise property, plant aur equipment—ho sakte hain. Classification applicable accounting standards aur circumstances par depend karti hai."},"p":{"en":"An asset is not automatically worth the amount someone hopes to sell it for. Carrying value and market value can differ.","hn":"Asset ki value automatically utni nahi hoti jitne mein koi bechne ki umeed karta hai. Carrying value aur market value alag ho sakti hain."},"think":{"en":"Is every asset recorded at the exact price it could fetch today?","hn":"Kya har asset aaj milne wale exact sale price par record hota hai?"},"reveal":{"en":"No. Measurement depends on the applicable accounting rules; book value and current sale value can differ.","hn":"Nahi. Measurement applicable accounting rules par depend karta hai; book value aur aaj ki sale value alag ho sakti hai."}},{"k":"info","t":{"en":"Liabilities: what the company owes","hn":"Liabilities: company ko kya dena hai"},"hook":{"en":"The company has a bank loan, unpaid supplier invoices and employee dues. Are these assets or obligations?","hn":"Company par bank loan, unpaid supplier invoices aur employee dues hain. Ye assets hain ya obligations?"},"story":{"en":"Neha lists amounts the business is obliged to pay. Borrowings, trade payables and certain accrued expenses may be liabilities. The exact classification follows the statements and notes.","hn":"Neha business ki payment obligations list karti hai. Borrowings, trade payables aur kuch accrued expenses liabilities ho sakte hain. Exact classification statements aur notes follow karti hai."},"s":{"en":"Liabilities can be current or non-current depending on the expected settlement and accounting requirements. A large liability is not automatically bad if the business can service it; context and cash flows matter.","hn":"Liabilities current ya non-current ho sakti hain, expected settlement aur accounting requirements ke hisaab se. Badi liability automatically buri nahi agar business use service kar sake; context aur cash flows matter karte hain."},"p":{"en":"Check maturity, interest costs, covenants, repayment schedule and notes rather than judging debt from one headline number.","hn":"Sirf ek headline number se debt judge na karo; maturity, interest cost, covenants, repayment schedule aur notes check karo."},"think":{"en":"Does a liability always mean the company is financially unhealthy?","hn":"Kya liability ka matlab hamesha company financially unhealthy hai?"},"reveal":{"en":"No. Size, terms, ability to pay and the business context all matter.","hn":"Nahi. Size, terms, payment capacity aur business context sab matter karte hain."}},{"k":"info","t":{"en":"Equity is the residual","hn":"Equity bacha hua hissa hai"},"hook":{"en":"Assets total ₹100 crore and liabilities total ₹65 crore. What is the accounting residual?","hn":"Assets total ₹100 crore aur liabilities ₹65 crore hain. Accounting residual kitna hai?"},"story":{"en":"Neha subtracts liabilities from assets. The residual is equity, sometimes described as shareholders’ funds in a company’s statements.","hn":"Neha assets mein se liabilities subtract karti hai. Jo residual bachta hai woh equity hai, company statements mein ise shareholders’ funds bhi kaha ja sakta hai."},"s":{"en":"The basic accounting relationship is Assets = Liabilities + Equity. Rearranged, Equity = Assets − Liabilities. This is a book-accounting relationship, not a guarantee of the company’s stock-market value.","hn":"Basic accounting relationship: Assets = Liabilities + Equity. Isko rearrange karein toh Equity = Assets − Liabilities. Ye book-accounting relationship hai, stock-market value ki guarantee nahi."},"p":{"en":"Worked illustration: ₹100 crore − ₹65 crore = ₹35 crore equity. It does not mean shareholders could immediately receive ₹35 crore in cash.","hn":"Solved illustration: ₹100 crore − ₹65 crore = ₹35 crore equity. Iska matlab nahi ki shareholders ko turant ₹35 crore cash mil sakta hai."},"think":{"en":"If assets are ₹80 crore and liabilities ₹50 crore, what is equity?","hn":"Assets ₹80 crore aur liabilities ₹50 crore hain, equity kitni?"},"reveal":{"en":"₹30 crore: assets minus liabilities.","hn":"₹30 crore: assets minus liabilities."}},{"k":"info","t":{"en":"Current assets and current liabilities","hn":"Current assets aur current liabilities"},"hook":{"en":"A company has bills due next month and cash plus receivables expected soon. Which comparison can help assess short-term liquidity?","hn":"Company ke bills agle mahine due hain aur cash plus jaldi expected receivables hain. Short-term liquidity assess karne ke liye kya compare kar sakte hain?"},"story":{"en":"Neha checks current assets against current liabilities. The comparison can provide a first clue about short-term obligations, but it is not a full cash-flow forecast.","hn":"Neha current assets ko current liabilities se compare karti hai. Ye short-term obligations ka initial clue de sakta hai, lekin full cash-flow forecast nahi."},"s":{"en":"Current assets and liabilities are defined under accounting rules. Inventory may take time to sell and receivables may be collected late, so not every current asset is as liquid as cash.","hn":"Current assets aur liabilities accounting rules ke mutabik define hote hain. Inventory bechne mein time lag sakta hai aur receivables late mil sakte hain; har current asset cash jitna liquid nahi."},"p":{"en":"Look at cash, receivable quality, inventory movement and upcoming payments together.","hn":"Cash, receivables ki quality, inventory movement aur upcoming payments ko saath mein dekho."},"think":{"en":"Can a company have more current assets than current liabilities and still face a cash crunch?","hn":"Kya current assets current liabilities se zyada hone par bhi company cash crunch face kar sakti hai?"},"reveal":{"en":"Yes. Assets may be slow to convert into cash or collections may be delayed.","hn":"Haan. Assets ko cash mein convert hone mein time lag sakta hai ya collections delay ho sakte hain."}},{"k":"info","t":{"en":"Debt needs context","hn":"Debt ko context mein samjho"},"hook":{"en":"Two companies both owe ₹200 crore. One has steady cash generation; the other struggles to collect from customers. Are they equally safe?","hn":"Do companies dono ₹200 crore owe karti hain. Ek steady cash generate karti hai; doosri customers se collection mein struggle karti hai. Kya dono equally safe hain?"},"story":{"en":"Neha avoids judging debt from its absolute amount alone. Business size, repayment timing, interest burden, cash generation and contingent obligations change the picture.","hn":"Neha sirf absolute amount se debt judge nahi karti. Business size, repayment timing, interest burden, cash generation aur contingent obligations picture badal dete hain."},"s":{"en":"Read borrowings, maturity profile, interest coverage and notes alongside the balance sheet. Compare like-for-like companies and multiple periods.","hn":"Balance sheet ke saath borrowings, maturity profile, interest coverage aur notes padho. Similar companies aur multiple periods compare karo."},"p":{"en":"An increase in debt can fund productive expansion or signal pressure; the reason and repayment capacity matter.","hn":"Debt badhna productive expansion fund kar sakta hai ya pressure signal kar sakta hai; reason aur repayment capacity matter karte hain."},"think":{"en":"Is rising debt alone enough to conclude “buy” or “avoid”?","hn":"Sirf rising debt dekh kar “buy” ya “avoid” decide kar sakte hain?"},"reveal":{"en":"No. Analyse the purpose, terms, cash flows, profitability and risks before reaching a view.","hn":"Nahi. View banane se pehle purpose, terms, cash flows, profitability aur risks analyse karo."}},{"k":"info","t":{"en":"Read notes, not just headline totals","hn":"Sirf headline totals nahi, notes bhi padho"},"hook":{"en":"The balance sheet shows a large receivables number. What would you want to know before feeling comfortable?","hn":"Balance sheet mein receivables ka bada number hai. Comfortable hone se pehle kya jaan-na chahoge?"},"story":{"en":"Notes can explain accounting policies, ageing, related-party balances, commitments, contingent liabilities and other details that headline totals hide.","hn":"Notes accounting policies, ageing, related-party balances, commitments, contingent liabilities aur doosri details explain kar sakte hain jo headline totals mein nahi dikhti."},"s":{"en":"Financial statements should be read as a set: balance sheet, profit and loss statement, cash-flow statement, notes and auditor report. One statement alone can give an incomplete picture.","hn":"Financial statements ko set ki tarah padho: balance sheet, P&L, cash-flow statement, notes aur auditor report. Ek statement akela incomplete picture de sakta hai."},"p":{"en":"Use the company’s official filings and check the reporting period, consolidated versus standalone figures, qualifications and restatements.","hn":"Company ki official filings use karo aur reporting period, consolidated vs standalone figures, qualifications aur restatements check karo."},"think":{"en":"Should you rely only on the first summary table on a finance website?","hn":"Kya finance website ki first summary table par hi rely karna chahiye?"},"reveal":{"en":"No. Verify the official filings and read notes and auditor comments where relevant.","hn":"Nahi. Official filings verify karo aur relevant notes aur auditor comments padho."}},{"k":"info","t":{"en":"A simple balance-sheet checklist","hn":"Simple balance-sheet checklist"},"hook":{"en":"You have ten minutes to review a company. What is a sensible starting checklist?","hn":"Company review karne ke liye ten minutes hain. Sensible starting checklist kya hai?"},"story":{"en":"Neha checks asset quality, debt and repayment timing, liquidity, equity changes, related-party items and auditor remarks, then compares several reporting periods.","hn":"Neha asset quality, debt aur repayment timing, liquidity, equity changes, related-party items aur auditor remarks check karti hai, phir multiple reporting periods compare karti hai."},"s":{"en":"No single balance-sheet metric is enough. Compare the business model, sector, accounting policies, notes and cash-flow evidence. This is an educational checklist, not a personalised investment recommendation.","hn":"Koi ek balance-sheet metric enough nahi. Business model, sector, accounting policies, notes aur cash-flow evidence compare karo. Ye educational checklist hai, personalised investment recommendation nahi."},"p":{"en":"Conceptual examples in this lesson use hypothetical values. For a real company, check the latest official filings and reporting-period notes.","hn":"Is lesson ke conceptual examples hypothetical values use karte hain. Real company ke liye latest official filings aur reporting-period notes check karo."},"think":{"en":"What is the safest way to use this checklist?","hn":"Is checklist ko use karne ka safest tareeka kya hai?"},"reveal":{"en":"Use it as a starting point, verify official documents and combine it with other analysis rather than treating it as a buy/sell signal.","hn":"Isse starting point ki tarah use karo, official documents verify karo aur doosri analysis ke saath combine karo; buy/sell signal mat samjho."}},{"k":"mc","q":{"en":"Assets are ₹120 crore and liabilities are ₹75 crore. What is equity?","hn":"Assets ₹120 crore aur liabilities ₹75 crore hain. Equity kitni?"},"o":[[{"en":"₹45 crore","hn":"₹45 crore"},{"en":"Correct: equity = assets − liabilities.","hn":"Sahi: equity = assets − liabilities."}],[{"en":"₹195 crore","hn":"₹195 crore"},{"en":"Liabilities are subtracted, not added.","hn":"Liabilities add nahi, subtract hoti hain."}],[{"en":"₹75 crore","hn":"₹75 crore"},{"en":"That is the liabilities figure.","hn":"Ye liabilities figure hai."}]],"a":0},{"k":"mc","q":{"en":"Which statement best describes a balance sheet?","hn":"Balance sheet ko best kaise describe karenge?"},"o":[[{"en":"A snapshot of financial position at a reporting date","hn":"Reporting date par financial position ka snapshot"},{"en":"Correct: it shows assets, liabilities and equity at a date.","hn":"Sahi: ye ek date par assets, liabilities aur equity dikhati hai."}],[{"en":"A list of every cash movement during the year","hn":"Poore saal ke har cash movement ki list"},{"en":"That is closer to cash-flow reporting.","hn":"Ye cash-flow reporting ke zyada kareeb hai."}],[{"en":"A guarantee of the market value of shares","hn":"Shares ki market value ki guarantee"},{"en":"Book equity and market value can differ.","hn":"Book equity aur market value alag ho sakti hain."}]],"a":0},{"k":"mc","q":{"en":"Which item is most likely an asset?","hn":"Kaunsa item asset hone ki sabse zyada sambhavna hai?"},"o":[[{"en":"Inventory held for sale, subject to accounting rules","hn":"Sale ke liye rakhi inventory, accounting rules ke subject mein"},{"en":"Correct: inventory may be a current asset.","hn":"Sahi: inventory current asset ho sakti hai."}],[{"en":"An unpaid supplier invoice","hn":"Unpaid supplier invoice"},{"en":"That is generally a payable liability.","hn":"Ye generally payable liability hai."}],[{"en":"A bank loan owed","hn":"Bank loan jo dena hai"},{"en":"That is a borrowing liability.","hn":"Ye borrowing liability hai."}]],"a":0},{"k":"mc","q":{"en":"A credit rating on a company’s debt means:","hn":"Company ke debt par credit rating ka matlab hai:"},"o":[[{"en":"An opinion under a rating framework, not a repayment guarantee","hn":"Rating framework ke under opinion, repayment guarantee nahi"},{"en":"Correct: default risk is not eliminated.","hn":"Sahi: default risk khatam nahi hota."}],[{"en":"Every payment is guaranteed","hn":"Har payment guaranteed hai"},{"en":"A rating cannot guarantee payment.","hn":"Rating payment guarantee nahi kar sakti."}],[{"en":"The company has no liabilities","hn":"Company par koi liabilities nahi"},{"en":"Ratings do not mean that.","hn":"Rating ka ye matlab nahi."}]],"a":0},{"k":"mc","q":{"en":"Why read balance-sheet notes?","hn":"Balance-sheet notes kyun padhein?"},"o":[[{"en":"They add context on accounting policies, commitments and other details","hn":"Accounting policies, commitments aur details ka context dete hain"},{"en":"Correct: headline totals can hide important details.","hn":"Sahi: headline totals important details hide kar sakte hain."}],[{"en":"They always replace the financial statements","hn":"Ye financial statements ko hamesha replace karte hain"},{"en":"Notes complement the statements.","hn":"Notes statements ko complement karte hain."}],[{"en":"They guarantee future profits","hn":"Future profit guarantee karte hain"},{"en":"No statement guarantees future profit.","hn":"Koi statement future profit guarantee nahi karti."}]],"a":0},{"k":"mc","q":{"en":"Can receivables be less liquid than cash?","hn":"Kya receivables cash se kam liquid ho sakte hain?"},"o":[[{"en":"Yes; collection can be delayed or uncertain","hn":"Haan; collection delay ya uncertain ho sakta hai"},{"en":"Correct: liquidity depends on conversion to cash.","hn":"Sahi: liquidity cash mein conversion par depend karti hai."}],[{"en":"No, receivables are always cash","hn":"Nahi, receivables hamesha cash hain"},{"en":"They still need to be collected.","hn":"Unhe collect karna hota hai."}],[{"en":"Only if the company is listed","hn":"Sirf listed company mein"},{"en":"Listing does not ensure collection.","hn":"Listing collection ensure nahi karti."}]],"a":0},{"k":"mc","q":{"en":"Which relationship is correct?","hn":"Kaunsa relationship correct hai?"},"o":[[{"en":"Assets = Liabilities + Equity","hn":"Assets = Liabilities + Equity"},{"en":"Correct: this is the basic accounting equation.","hn":"Sahi: ye basic accounting equation hai."}],[{"en":"Assets = Revenue − Expenses","hn":"Assets = Revenue − Expenses"},{"en":"That is not the balance-sheet equation.","hn":"Ye balance-sheet equation nahi hai."}],[{"en":"Equity = Assets + Liabilities","hn":"Equity = Assets + Liabilities"},{"en":"Equity is assets minus liabilities.","hn":"Equity assets minus liabilities hai."}]],"a":0},{"k":"mc","q":{"en":"What should you do before using real-company figures?","hn":"Real company figures use karne se pehle kya karein?"},"o":[[{"en":"Verify latest official filings, reporting period and notes","hn":"Latest official filings, reporting period aur notes verify karo"},{"en":"Correct: examples here are conceptual, not live company data.","hn":"Sahi: yahan examples conceptual hain, live company data nahi."}],[{"en":"Assume every website summary is current","hn":"Har website summary ko current maan lo"},{"en":"Summaries can be delayed or incomplete.","hn":"Summaries delayed ya incomplete ho sakti hain."}],[{"en":"Treat book equity as guaranteed sale proceeds","hn":"Book equity ko guaranteed sale proceeds samjho"},{"en":"Book value is not guaranteed cash.","hn":"Book value guaranteed cash nahi."}]],"a":0},{"k":"end"}];
UNITS.x8=[{"k":"info","t":{"en":"What the profit and loss statement tells you","hn":"P&L statement kya batati hai"},"hook":{"en":"A café sells ₹10 lakh of food in a quarter. Does that mean the café earned ₹10 lakh of profit?","hn":"Ek café quarter mein ₹10 lakh ka food bechta hai. Kya iska matlab ₹10 lakh profit hua?"},"story":{"en":"Arjun reads the income statement to see revenue, expenses and profit or loss over a period. Unlike the balance sheet, it covers activity during a period rather than a single date.","hn":"Arjun income statement mein period ke revenue, expenses aur profit/loss dekhta hai. Balance sheet se alag, ye ek date ke bajaye period ki activity cover karti hai."},"s":{"en":"Revenue is not profit. Costs such as materials, staff, rent, depreciation, interest and tax may reduce the amount that remains. Exact presentation depends on the reporting framework.","hn":"Revenue profit nahi hai. Materials, staff, rent, depreciation, interest aur tax jaise costs bachi hui amount ko reduce kar sakte hain. Exact presentation reporting framework par depend karti hai."},"p":{"en":"Illustrative only: the example uses hypothetical figures and is not a current company result or forecast.","hn":"Sirf illustration: example hypothetical figures use karta hai; current company result ya forecast nahi."},"think":{"en":"What does a P&L statement cover?","hn":"P&L statement kya cover karti hai?"},"reveal":{"en":"Revenue, expenses and the resulting profit or loss over a period.","hn":"Ek period ke revenue, expenses aur resulting profit/loss."}},{"k":"info","t":{"en":"Revenue: follow the business model","hn":"Revenue: business model samjho"},"hook":{"en":"A company’s sales rise. What should you ask before calling it a strong result?","hn":"Company ki sales badhti hain. Strong result bolne se pehle kya poochna chahiye?"},"story":{"en":"Arjun checks what the company sells, how revenue is recognised, whether sales are recurring, and whether reported growth comes from volume, pricing, acquisitions or one-off events.","hn":"Arjun dekhta hai company kya bechti hai, revenue kaise recognise hota hai, sales recurring hain ya nahi, aur growth volume, pricing, acquisition ya one-off event se aayi hai."},"s":{"en":"Revenue recognition follows applicable accounting standards and contract facts. Revenue growth by itself does not establish cash collection, profitability or business quality.","hn":"Revenue recognition applicable accounting standards aur contract facts follow karta hai. Sirf revenue growth cash collection, profitability ya business quality prove nahi karti."},"p":{"en":"Compare growth with receivables, cash flow, margins and the company’s own disclosures.","hn":"Growth ko receivables, cash flow, margins aur company disclosures ke saath compare karo."},"think":{"en":"Can reported revenue increase while cash collection weakens?","hn":"Kya reported revenue badh sakta hai jab cash collection weak ho?"},"reveal":{"en":"Yes. Sales may be recognised before cash is collected, subject to the accounting rules and facts.","hn":"Haan. Accounting rules aur facts ke subject mein cash collect hone se pehle sales recognise ho sakti hain."}},{"k":"info","t":{"en":"Costs and gross profit","hn":"Costs aur gross profit"},"hook":{"en":"A product sells for ₹500 and its direct production cost is ₹300. Before other operating expenses, what remains per unit?","hn":"Product ₹500 mein bikta hai aur direct production cost ₹300 hai. Baaki operating expenses se pehle per unit kitna bachta hai?"},"story":{"en":"Arjun starts with revenue and the cost of goods sold. The difference is gross profit, which helps show the economics of the product before other operating expenses.","hn":"Arjun revenue aur cost of goods sold se shuru karta hai. Difference gross profit hai, jo other operating expenses se pehle product economics dikhata hai."},"s":{"en":"Gross profit is typically revenue minus cost of goods sold under the company’s presentation. It does not subtract every expense such as all selling, administration, finance costs and tax.","hn":"Gross profit generally company presentation ke mutabik revenue minus cost of goods sold hai. Ismein har expense—jaise all selling, administration, finance cost aur tax—subtract nahi hota."},"p":{"en":"Illustration: ₹500 − ₹300 = ₹200 gross profit per unit before other expenses.","hn":"Illustration: ₹500 − ₹300 = ₹200 gross profit per unit, other expenses se pehle."},"think":{"en":"Does gross profit equal the final profit available to owners?","hn":"Kya gross profit final owners’ profit ke barabar hai?"},"reveal":{"en":"No. Other operating expenses, finance costs, tax and other items may still need to be accounted for.","hn":"Nahi. Other operating expenses, finance cost, tax aur doosre items abhi account karne hote hain."}},{"k":"info","t":{"en":"Operating expenses and operating profit","hn":"Operating expenses aur operating profit"},"hook":{"en":"Sales rise but staff, rent, advertising and logistics costs rise even faster. What could happen to operating profit?","hn":"Sales badhti hain par staff, rent, advertising aur logistics costs aur tez badhte hain. Operating profit ka kya ho sakta hai?"},"story":{"en":"Arjun separates the costs needed to run the business from the direct cost of goods sold. Operating profit helps assess operating performance before certain financing and tax items.","hn":"Arjun business chalane ke costs ko direct cost of goods sold se alag karta hai. Operating profit financing aur tax ke kuch items se pehle operating performance assess karne mein help karta hai."},"s":{"en":"Company presentations differ, so check the stated definition of operating profit or EBIT and how exceptional items are treated. Do not assume every company calculates a non-GAAP measure identically.","hn":"Company presentations differ karti hain, isliye operating profit ya EBIT ki stated definition aur exceptional items ka treatment check karo. Har company non-GAAP measure same calculate karti hai, assume mat karo."},"p":{"en":"Compare operating margin across periods and similar businesses, while checking whether costs or one-off items changed.","hn":"Periods aur similar businesses ke operating margin compare karo; costs ya one-off items badle hain ya nahi check karo."},"think":{"en":"Can higher sales still accompany lower operating profit?","hn":"Kya higher sales ke saath operating profit kam ho sakta hai?"},"reveal":{"en":"Yes, if operating costs rise faster than revenue or margins weaken.","hn":"Haan, agar operating costs revenue se tez badhein ya margins weaken hon."}},{"k":"info","t":{"en":"Depreciation is a cost, not the same as cash paid today","hn":"Depreciation cost hai, aaj ke cash payment jaisi nahi"},"hook":{"en":"A factory uses a machine for several years. Should the entire machine cost necessarily appear as one year’s operating expense?","hn":"Factory machine ko kai saal use karti hai. Kya poori machine cost ek hi saal ka operating expense honi chahiye?"},"story":{"en":"Arjun learns that qualifying long-lived assets are often depreciated over their useful lives under applicable accounting rules. Depreciation allocates cost over time; it is not itself the same as a current-period cash payment.","hn":"Arjun seekhta hai ki qualifying long-lived assets ko applicable accounting rules ke mutabik useful life mein depreciate kiya ja sakta hai. Depreciation cost ko time mein allocate karti hai; ye khud current-period cash payment ke same nahi."},"s":{"en":"Depreciation estimates, methods, useful lives and impairment can affect reported profit. Accounting treatment depends on the asset and applicable standards.","hn":"Depreciation estimates, methods, useful lives aur impairment reported profit ko affect kar sakte hain. Treatment asset aur applicable standards par depend karta hai."},"p":{"en":"EBITDA excludes interest, tax, depreciation and amortisation by its usual definition, but it is not cash flow and may not be defined identically in every presentation.","hn":"EBITDA ki usual definition interest, tax, depreciation aur amortisation exclude karti hai, lekin ye cash flow nahi aur har presentation mein definition identical ho, zaroori nahi."},"think":{"en":"Does EBITDA automatically tell you how much cash the company generated?","hn":"Kya EBITDA automatically batata hai company ne kitna cash generate kiya?"},"reveal":{"en":"No. Working capital, capital expenditure, interest, tax and other cash items still matter.","hn":"Nahi. Working capital, capital expenditure, interest, tax aur doosre cash items matter karte hain."}},{"k":"info","t":{"en":"Interest, tax and net profit","hn":"Interest, tax aur net profit"},"hook":{"en":"A company has operating profit but also pays interest on debt and tax. Which profit figure is closer to the bottom line?","hn":"Company ka operating profit hai, lekin debt par interest aur tax bhi pay karti hai. Bottom line ke kareeb kaunsa profit figure hai?"},"story":{"en":"Arjun follows the statement from operating result through finance costs, tax and any other reported items to profit for the period. The exact line names and ordering depend on the statement format.","hn":"Arjun statement ko operating result se finance costs, tax aur other reported items tak follow karta hai, phir period ka profit dekhta hai. Exact line names aur order statement format par depend karta hai."},"s":{"en":"Net profit is an accounting result after the items included under the statement’s applicable presentation. It is not automatically equal to cash generated or cash available for dividends.","hn":"Net profit statement ke applicable presentation ke mutabik included items ke baad accounting result hai. Ye automatically generated cash ya dividends ke liye available cash ke barabar nahi."},"p":{"en":"Check whether profit includes exceptional, discontinued or non-recurring items and read the notes before comparing periods.","hn":"Profit mein exceptional, discontinued ya non-recurring items hain ya nahi check karo; periods compare karne se pehle notes padho."},"think":{"en":"Can a profitable company face cash-flow pressure?","hn":"Kya profitable company cash-flow pressure face kar sakti hai?"},"reveal":{"en":"Yes. Profit and cash flow measure different things; collections, working capital and investment spending matter.","hn":"Haan. Profit aur cash flow alag cheezein measure karte hain; collections, working capital aur investment spending matter karte hain."}},{"k":"info","t":{"en":"Margins help compare scale","hn":"Margins scale compare karne mein help karte hain"},"hook":{"en":"Company A earns ₹20 profit on ₹100 revenue. Company B earns ₹30 profit on ₹300 revenue. Which has the higher profit margin?","hn":"Company A ₹100 revenue par ₹20 profit earn karti hai. Company B ₹300 par ₹30. Kiski profit margin zyada hai?"},"story":{"en":"Arjun converts profit into a percentage of revenue so he can compare businesses of different sizes.","hn":"Arjun profit ko revenue ke percentage mein convert karta hai taaki different-size businesses compare kar sake."},"s":{"en":"Profit margin = the selected profit measure ÷ revenue × 100. Be clear whether you are using gross, operating or net profit margin; each answers a different question.","hn":"Profit margin = selected profit measure ÷ revenue × 100. Clear raho ki gross, operating ya net margin use kar rahe ho; har ek alag question ka answer deta hai."},"p":{"en":"Illustration: A has 20/100 = 20%; B has 30/300 = 10%. B has more absolute profit, while A has the higher margin in this simplified example.","hn":"Illustration: A ka 20/100 = 20%; B ka 30/300 = 10%. B ka absolute profit zyada hai, jabki is simplified example mein A ka margin zyada hai."},"think":{"en":"Does the company with the larger rupee profit always have the higher margin?","hn":"Kya jiska rupee profit zyada hai uska margin hamesha zyada hota hai?"},"reveal":{"en":"No. Margin compares profit relative to revenue, not just the absolute profit amount.","hn":"Nahi. Margin profit ko revenue ke relative compare karta hai, sirf absolute amount nahi."}},{"k":"info","t":{"en":"Compare periods and quality of earnings","hn":"Periods aur earnings quality compare karo"},"hook":{"en":"Profit jumps sharply in one year. What should you check before assuming the business has permanently improved?","hn":"Ek saal profit sharply jump karta hai. Business permanently improve hua maan-ne se pehle kya check karna chahiye?"},"story":{"en":"Arjun checks several years of results, revenue growth, margins, cash from operations, receivables, one-off gains and auditor comments. One unusually strong year may not describe the underlying trend.","hn":"Arjun kai saalon ke results, revenue growth, margins, operating cash, receivables, one-off gains aur auditor comments check karta hai. Ek unusually strong year underlying trend ko represent nahi kar sakta."},"s":{"en":"Accounting estimates and non-recurring events can affect reported results. Compare consistent definitions and reporting periods; check consolidated versus standalone statements.","hn":"Accounting estimates aur non-recurring events reported results affect kar sakte hain. Consistent definitions aur reporting periods compare karo; consolidated vs standalone statements check karo."},"p":{"en":"Use official company filings. All figures in this lesson are hypothetical and educational, not live data or personalised investment advice.","hn":"Official company filings use karo. Is lesson ke saare figures hypothetical aur educational hain, live data ya personalised investment advice nahi."},"think":{"en":"What is a sensible first response to a sudden profit spike?","hn":"Sudden profit spike dekhkar sensible first response kya hai?"},"reveal":{"en":"Investigate drivers, cash conversion, one-offs and notes before drawing a conclusion.","hn":"Conclusion se pehle drivers, cash conversion, one-offs aur notes investigate karo."}},{"k":"mc","q":{"en":"Revenue is ₹500 and total expenses included in this simplified example are ₹430. What is the resulting profit?","hn":"Revenue ₹500 aur is simplified example mein included total expenses ₹430 hain. Profit kitna?"},"o":[[{"en":"₹70","hn":"₹70"},{"en":"Correct: ₹500 − ₹430 = ₹70.","hn":"Sahi: ₹500 − ₹430 = ₹70."}],[{"en":"₹930","hn":"₹930"},{"en":"Expenses are subtracted from revenue.","hn":"Expenses revenue se subtract hote hain."}],[{"en":"₹430","hn":"₹430"},{"en":"That is the expense amount.","hn":"Ye expense amount hai."}]],"a":0},{"k":"mc","q":{"en":"What does gross profit usually compare?","hn":"Gross profit usually kya compare karta hai?"},"o":[[{"en":"Revenue with cost of goods sold","hn":"Revenue ko cost of goods sold ke saath"},{"en":"Correct: other expenses may still remain.","hn":"Sahi: doosre expenses abhi baaki ho sakte hain."}],[{"en":"Cash balance with total debt","hn":"Cash balance ko total debt ke saath"},{"en":"That is not gross profit.","hn":"Ye gross profit nahi."}],[{"en":"Share price with earnings per share","hn":"Share price ko EPS ke saath"},{"en":"That is the P/E ratio relationship.","hn":"Ye P/E ratio relationship hai."}]],"a":0},{"k":"mc","q":{"en":"Operating costs rise faster than revenue. What may happen?","hn":"Operating costs revenue se tez badhein toh kya ho sakta hai?"},"o":[[{"en":"Operating margin may decline","hn":"Operating margin gir sakta hai"},{"en":"Correct: costs can pressure margins.","hn":"Sahi: costs margin par pressure daal sakte hain."}],[{"en":"Profit is guaranteed to rise","hn":"Profit badhna guaranteed hai"},{"en":"Higher costs may reduce profit.","hn":"Higher costs profit reduce kar sakte hain."}],[{"en":"Revenue becomes cash automatically","hn":"Revenue automatically cash ban jata hai"},{"en":"Collection timing can differ.","hn":"Collection timing alag ho sakti hai."}]],"a":0},{"k":"mc","q":{"en":"Why is depreciation not identical to cash paid today?","hn":"Depreciation aaj ke cash payment ke identical kyun nahi?"},"o":[[{"en":"It allocates an asset’s cost over its useful life under applicable rules","hn":"Applicable rules ke mutabik asset cost ko useful life mein allocate karti hai"},{"en":"Correct: cash may have been spent when the asset was acquired.","hn":"Sahi: cash asset acquire karte waqt spend hua ho sakta hai."}],[{"en":"It always creates new cash","hn":"Ye hamesha naya cash banati hai"},{"en":"Depreciation itself does not create cash.","hn":"Depreciation khud cash create nahi karti."}],[{"en":"It is the company’s sales figure","hn":"Ye company ki sales figure hai"},{"en":"Sales are revenue.","hn":"Sales revenue hoti hai."}]],"a":0},{"k":"mc","q":{"en":"Which statement about EBITDA is correct?","hn":"EBITDA ke baare mein kaunsa statement sahi hai?"},"o":[[{"en":"It is not the same as cash flow","hn":"Ye cash flow ke same nahi hai"},{"en":"Correct: working capital and capital spending matter.","hn":"Sahi: working capital aur capital spending matter karte hain."}],[{"en":"It guarantees cash available for dividends","hn":"Dividend ke liye cash guarantee karta hai"},{"en":"It does not guarantee available cash.","hn":"Available cash guarantee nahi karta."}],[{"en":"It includes every expense and tax by definition","hn":"Definition ke mutabik har expense aur tax include karta hai"},{"en":"The usual measure excludes several items.","hn":"Usual measure kai items exclude karta hai."}]],"a":0},{"k":"mc","q":{"en":"Company A has ₹20 profit on ₹100 revenue; B has ₹30 on ₹300. Which has the higher margin?","hn":"A ka ₹100 revenue par ₹20 profit; B ka ₹300 par ₹30. Kiski margin higher?"},"o":[[{"en":"Company A: 20%","hn":"Company A: 20%"},{"en":"Correct: B is 10% in this simplified example.","hn":"Sahi: is simplified example mein B 10% hai."}],[{"en":"Company B: 30%","hn":"Company B: 30%"},{"en":"Margin is profit divided by revenue, not profit alone.","hn":"Margin profit divided by revenue hai, sirf profit nahi."}],[{"en":"Both are 10%","hn":"Dono 10% hain"},{"en":"A is 20%; B is 10%.","hn":"A 20%; B 10% hai."}]],"a":0},{"k":"mc","q":{"en":"Can profit rise while operating cash flow weakens?","hn":"Kya profit badh sakta hai jab operating cash flow weak ho?"},"o":[[{"en":"Yes; collections, working capital and non-cash items can differ","hn":"Haan; collections, working capital aur non-cash items differ kar sakte hain"},{"en":"Correct: profit and cash flow are different measures.","hn":"Sahi: profit aur cash flow alag measures hain."}],[{"en":"No; they are always equal","hn":"Nahi; dono hamesha equal hain"},{"en":"They are not necessarily equal.","hn":"Dono necessarily equal nahi."}],[{"en":"Only for unlisted companies","hn":"Sirf unlisted companies mein"},{"en":"This can occur in different types of businesses.","hn":"Ye different businesses mein ho sakta hai."}]],"a":0},{"k":"mc","q":{"en":"What should you inspect after a sudden one-year profit spike?","hn":"Ek saal ke sudden profit spike ke baad kya inspect karein?"},"o":[[{"en":"Cash conversion, one-offs, notes and several periods","hn":"Cash conversion, one-offs, notes aur multiple periods"},{"en":"Correct: investigate before assuming a durable trend.","hn":"Sahi: durable trend maan-ne se pehle investigate karo."}],[{"en":"Only the headline percentage","hn":"Sirf headline percentage"},{"en":"A single figure can be misleading.","hn":"Ek figure misleading ho sakta hai."}],[{"en":"A social-media prediction","hn":"Social-media prediction"},{"en":"Use official statements and evidence.","hn":"Official statements aur evidence use karo."}]],"a":0},{"k":"mc","q":{"en":"What is the best source for a real company’s reported figures?","hn":"Real company ke reported figures ka best source kya hai?"},"o":[[{"en":"Latest official filings with reporting-period and notes checked","hn":"Latest official filings, reporting period aur notes ke saath"},{"en":"Correct: examples here are hypothetical, not live data.","hn":"Sahi: yahan examples hypothetical hain, live data nahi."}],[{"en":"An undated screenshot","hn":"Bina date ka screenshot"},{"en":"It may be outdated or incomplete.","hn":"Woh outdated ya incomplete ho sakta hai."}],[{"en":"A guarantee of future returns","hn":"Future returns ki guarantee"},{"en":"Financial statements do not guarantee returns.","hn":"Financial statements returns guarantee nahi karti."}]],"a":0},{"k":"end"}];
UNITS.x9=[{"k":"info","t":{"en":"Ratios are questions, not verdicts","hn":"Ratios questions hain, verdict nahi"},"hook":{"en":"Two companies have different sizes. How can you compare them without relying only on rupee totals?","hn":"Do companies ka size alag hai. Sirf rupee totals par depend kiye bina compare kaise karoge?"},"story":{"en":"Arjun uses ratios to relate one financial figure to another. Ratios can help compare scale, profitability, liquidity and leverage, but they need context.","hn":"Arjun ratios use karta hai ek financial figure ko doosre se relate karne ke liye. Ratios scale, profitability, liquidity aur leverage compare karne mein help karte hain, lekin context zaroori hai."},"s":{"en":"Ratio definitions can vary. Confirm the numerator, denominator, period and whether figures are consolidated or standalone before comparing.","hn":"Ratio definitions vary kar sakti hain. Compare karne se pehle numerator, denominator, period aur consolidated ya standalone figures confirm karo."},"p":{"en":"All figures in this lesson are hypothetical. Ratios are educational signals, not standalone buy/sell instructions.","hn":"Is lesson ke saare figures hypothetical hain. Ratios educational signals hain, standalone buy/sell instructions nahi."},"think":{"en":"Can one ratio alone prove a company is a good investment?","hn":"Kya ek ratio akela prove kar sakta hai ki company good investment hai?"},"reveal":{"en":"No. Use multiple measures, company context, filings and risks.","hn":"Nahi. Multiple measures, company context, filings aur risks use karo."}},{"k":"info","t":{"en":"Current ratio: short-term cushion","hn":"Current ratio: short-term cushion"},"hook":{"en":"A company has current assets of ₹150 crore and current liabilities of ₹100 crore. What is its current ratio?","hn":"Company ke current assets ₹150 crore aur current liabilities ₹100 crore hain. Current ratio kya hai?"},"story":{"en":"Arjun divides current assets by current liabilities to get a first-pass liquidity measure.","hn":"Arjun first-pass liquidity measure ke liye current assets ko current liabilities se divide karta hai."},"s":{"en":"Current ratio = current assets ÷ current liabilities. A higher figure is not automatically better: inventory quality, receivables, business seasonality and sector norms matter.","hn":"Current ratio = current assets ÷ current liabilities. Higher figure automatically better nahi: inventory quality, receivables, business seasonality aur sector norms matter karte hain."},"p":{"en":"Illustration: ₹150 crore ÷ ₹100 crore = 1.5 times. It is not a universal safety threshold.","hn":"Illustration: ₹150 crore ÷ ₹100 crore = 1.5 times. Ye universal safety threshold nahi hai."},"think":{"en":"Does a current ratio above 1 guarantee there will be no cash crunch?","hn":"Kya current ratio 1 se above hone par cash crunch nahi hoga, guarantee hai?"},"reveal":{"en":"No. The quality and timing of current assets and liabilities matter.","hn":"Nahi. Current assets aur liabilities ki quality aur timing matter karti hai."}},{"k":"info","t":{"en":"Debt-to-equity: leverage context","hn":"Debt-to-equity: leverage ka context"},"hook":{"en":"Company A has debt of ₹60 crore and equity of ₹100 crore. What is the simple debt-to-equity ratio?","hn":"Company A ka debt ₹60 crore aur equity ₹100 crore hai. Simple debt-to-equity ratio kya hai?"},"story":{"en":"Arjun compares debt with the equity base to understand one aspect of leverage.","hn":"Arjun leverage ka ek aspect samajhne ke liye debt ko equity base se compare karta hai."},"s":{"en":"Debt-to-equity = the selected debt measure ÷ equity. Companies may define debt differently; include lease liabilities or other items consistently where relevant.","hn":"Debt-to-equity = selected debt measure ÷ equity. Companies debt ko differently define kar sakti hain; relevant ho toh lease liabilities ya other items consistently include karo."},"p":{"en":"Illustration: ₹60 crore ÷ ₹100 crore = 0.6 times. The ratio alone does not show interest cost, maturity or repayment capacity.","hn":"Illustration: ₹60 crore ÷ ₹100 crore = 0.6 times. Ratio akela interest cost, maturity ya repayment capacity nahi dikhata."},"think":{"en":"Can the same debt-to-equity ratio mean different risk in different industries?","hn":"Kya same debt-to-equity ratio different industries mein different risk mean kar sakta hai?"},"reveal":{"en":"Yes. Cash-flow stability, assets, business model, rates and industry norms matter.","hn":"Haan. Cash-flow stability, assets, business model, rates aur industry norms matter karte hain."}},{"k":"info","t":{"en":"ROE: return on owners’ equity","hn":"ROE: owners’ equity par return"},"hook":{"en":"Net profit is ₹12 crore and average equity is ₹80 crore. What is the simplified ROE?","hn":"Net profit ₹12 crore aur average equity ₹80 crore hai. Simplified ROE kya hai?"},"story":{"en":"Arjun measures profit relative to the shareholders’ equity base, using average equity where appropriate for the period.","hn":"Arjun shareholders’ equity base ke relative profit measure karta hai, period ke liye jahan appropriate ho average equity use karke."},"s":{"en":"ROE = profit measure ÷ average shareholders’ equity × 100. Definitions and use of average or closing equity should be consistent. High ROE can be affected by leverage, buybacks, unusual profits or a small equity base.","hn":"ROE = profit measure ÷ average shareholders’ equity × 100. Average ya closing equity ka use consistent hona chahiye. High ROE leverage, buybacks, unusual profits ya small equity base se affect ho sakta hai."},"p":{"en":"Illustration: ₹12 crore ÷ ₹80 crore × 100 = 15%. This is not a forecast of future ROE.","hn":"Illustration: ₹12 crore ÷ ₹80 crore × 100 = 15%. Ye future ROE ka forecast nahi."},"think":{"en":"Is a high ROE automatically proof of a strong business?","hn":"Kya high ROE automatically strong business ka proof hai?"},"reveal":{"en":"No. Check leverage, one-off items, equity base and cash generation.","hn":"Nahi
