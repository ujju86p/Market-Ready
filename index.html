ram. It is lagging and may produce false signals.","hn":"MACD moving-average relationships se banta hai aur ismein signal line aur histogram hote hain. Ye lagging hai aur false signals de sakta hai."},"p":{"en":"Indicator settings differ. Learn the calculation and test one clear rule rather than stacking indicators until they agree.","hn":"Indicator settings alag ho sakti hain. Calculation samjho aur ek clear rule test karo; indicators tab tak add mat karo jab tak sab agree na kar dein."},"think":{"en":"What is a common MACD limitation?","hn":"MACD ki common limitation kya hai?"},"reveal":{"en":"It can lag and produce false crossovers, especially in choppy markets.","hn":"Ye lag kar sakta hai aur choppy markets mein false crossovers de sakta hai."}},{"k":"info","t":{"en":"Bollinger Bands show relative volatility","hn":"Bollinger Bands relative volatility dikhate hain"},"hook":{"en":"Bands widen during a volatile period. What is the cautious interpretation?","hn":"Volatile period mein bands widen hote hain. Cautious interpretation kya hai?"},"story":{"en":"Asha sees the bands expand and records that price dispersion has increased under that indicator’s calculation.","hn":"Asha bands expand hote dekhti hai aur record karti hai ki indicator calculation ke hisaab se price dispersion badhi hai."},"s":{"en":"Bollinger Bands commonly place bands around a moving average using a volatility measure. Narrow bands indicate lower recent volatility, not a guaranteed breakout direction.","hn":"Bollinger Bands commonly moving average ke around volatility measure se bands banate hain. Narrow bands lower recent volatility indicate karte hain, guaranteed breakout direction nahi."},"p":{"en":"Band touches do not automatically mean overbought or oversold; price can walk along a band during a trend.","hn":"Band touch ka matlab automatically overbought/oversold nahi; trend mein price band ke saath chal sakti hai."},"think":{"en":"What does band expansion most directly reflect?","hn":"Band expansion sabse directly kya reflect karta hai?"},"reveal":{"en":"Higher measured volatility under the band calculation.","hn":"Band calculation ke hisaab se higher measured volatility."}},{"k":"info","t":{"en":"Divergence is a warning to investigate","hn":"Divergence investigate karne ka warning clue hai"},"hook":{"en":"Price makes a new high but an oscillator does not. Is reversal certain?","hn":"Price new high banati hai par oscillator nahi. Kya reversal certain hai?"},"story":{"en":"Kabir notes possible bearish divergence but waits for price structure and risk conditions instead of predicting a top.","hn":"Kabir possible bearish divergence note karta hai, par top predict karne ke bajay price structure aur risk conditions dekhta hai."},"s":{"en":"Divergence describes a mismatch between price swings and an indicator. It can warn that momentum differs, but timing is uncertain and divergence can persist.","hn":"Divergence price swings aur indicator ke beech mismatch hai. Momentum difference ka warning ho sakta hai, par timing uncertain hai aur divergence persist kar sakti hai."},"p":{"en":"Use divergence as context, not a standalone forecast or reason to ignore stop/risk rules.","hn":"Divergence ko context samjho, standalone forecast ya risk rules ignore karne ka reason nahi."},"think":{"en":"What does divergence guarantee?","hn":"Divergence kya guarantee karti hai?"},"reveal":{"en":"Nothing; it is a clue that needs context and confirmation.","hn":"Kuch nahi; context aur confirmation chahiye."}},{"k":"info","t":{"en":"Build a simple indicator checklist","hn":"Simple indicator checklist banao"},"hook":{"en":"Three indicators all say “buy.” Is that three independent pieces of evidence?","hn":"Teen indicators “buy” bol rahe hain. Kya ye teen independent evidence hain?"},"story":{"en":"Two indicators may use similar price inputs, so they can repeat the same information. Asha writes down one reason and one risk.","hn":"Do indicators similar price inputs use kar sakte hain, isliye same information repeat ho sakti hai. Asha ek reason aur ek risk likhti hai."},"s":{"en":"Start with price structure, then choose an indicator for a specific question: trend, momentum or volatility. Avoid redundant indicators and hindsight tuning.","hn":"Price structure se start karo, phir specific sawal ke liye indicator choose karo: trend, momentum ya volatility. Redundant indicators aur hindsight tuning se bacho."},"p":{"en":"Backtest with transaction costs and out-of-sample periods; an indicator is not a complete strategy without entry, exit and risk rules.","hn":"Transaction costs aur out-of-sample periods ke saath backtest karo; entry, exit aur risk rules ke bina indicator complete strategy nahi."},"think":{"en":"What is a sensible way to use indicators?","hn":"Indicators use karne ka sensible tareeka kya hai?"},"reveal":{"en":"Use each for a defined question, then test the full rule including risk and costs.","hn":"Har indicator ko defined question ke liye use karo, phir risk aur costs ke saath full rule test karo."}},{"k":"mc","q":{"en":"What does volume measure in a trading chart?","hn":"Trading chart mein volume kya measure karta hai?"},"o":[[{"en":"Traded quantity over a period","hn":"Ek period mein traded quantity"},{"en":"It measures participation quantity, subject to the instrument/data definition.","hn":"Instrument/data definition ke hisaab se participation quantity measure karta hai."}],[{"en":"Guaranteed future demand","hn":"Guaranteed future demand"},{"en":"Volume does not guarantee future direction.","hn":"Volume future direction guarantee nahi karta."}],[{"en":"Only the closing price","hn":"Sirf closing price"},{"en":"Closing price and volume are different data fields.","hn":"Closing price aur volume alag data fields hain."}]],"a":0},{"k":"mc","q":{"en":"Why compare current volume with a baseline?","hn":"Current volume ko baseline se compare kyun karein?"},"o":[[{"en":"The raw number needs instrument and normal-activity context","hn":"Raw number ko instrument aur normal-activity context chahiye"},{"en":"Relative volume helps judge whether activity is unusual.","hn":"Relative volume unusual activity judge karne mein help karta hai."}],[{"en":"Every security has identical normal volume","hn":"Har security ka normal volume same hota hai"},{"en":"Liquidity and size vary widely.","hn":"Liquidity aur size bahut vary karte hain."}],[{"en":"It guarantees the trend","hn":"Trend guarantee hota hai"},{"en":"Volume comparison cannot guarantee trend.","hn":"Volume comparison trend guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"Why is a moving average called lagging?","hn":"Moving average ko lagging kyun kehte hain?"},"o":[[{"en":"It is calculated from past prices","hn":"Ye past prices se calculate hota hai"},{"en":"It smooths historical data and responds after changes.","hn":"Ye historical data smooth karta hai aur changes ke baad respond karta hai."}],[{"en":"It knows tomorrow’s price","hn":"Kal ka price jaanta hai"},{"en":"It has no future knowledge.","hn":"Isse future knowledge nahi hoti."}],[{"en":"It removes every false signal","hn":"Har false signal remove karta hai"},{"en":"Moving averages can whipsaw.","hn":"Moving averages whipsaw kar sakte hain."}]],"a":0},{"k":"mc","q":{"en":"RSI is high. What is the best next step?","hn":"RSI high hai. Best next step kya hai?"},"o":[[{"en":"Check trend and context; high RSI does not force a reversal","hn":"Trend aur context dekho; high RSI reversal force nahi karta"},{"en":"Strong trends can keep RSI elevated.","hn":"Strong trends RSI ko elevated rakh sakte hain."}],[{"en":"Sell automatically","hn":"Automatically sell"},{"en":"An oscillator threshold is not a guaranteed signal.","hn":"Oscillator threshold guaranteed signal nahi."}],[{"en":"Ignore price entirely","hn":"Price ko poora ignore karo"},{"en":"Price structure remains important context.","hn":"Price structure important context hai."}]],"a":0},{"k":"mc","q":{"en":"What is one limitation of MACD crossovers?","hn":"MACD crossover ki ek limitation kya hai?"},"o":[[{"en":"They can lag or produce false signals in choppy markets","hn":"Choppy market mein lag ya false signals de sakte hain"},{"en":"MACD is based on moving averages and reacts to past prices.","hn":"MACD moving averages par based hai aur past prices par react karta hai."}],[{"en":"They guarantee a profitable trade","hn":"Profitable trade guarantee karte hain"},{"en":"No indicator guarantees profit.","hn":"Koi indicator profit guarantee nahi karta."}],[{"en":"They do not use price data","hn":"Price data use nahi karte"},{"en":"MACD is calculated from price-based moving averages.","hn":"MACD price-based moving averages se calculate hota hai."}]],"a":0},{"k":"mc","q":{"en":"Bollinger Bands widen. What does this commonly reflect?","hn":"Bollinger Bands widen hote hain. Aam taur par kya reflect hota hai?"},"o":[[{"en":"Higher measured volatility","hn":"Higher measured volatility"},{"en":"The band width expands with the chosen volatility calculation.","hn":"Chosen volatility calculation ke saath band width expand hoti hai."}],[{"en":"A guaranteed upward breakout","hn":"Guaranteed upward breakout"},{"en":"Band width does not specify direction.","hn":"Band width direction specify nahi karti."}],[{"en":"No price movement","hn":"Price movement nahi"},{"en":"Wider bands usually reflect greater measured dispersion.","hn":"Wider bands greater measured dispersion reflect karte hain."}]],"a":0},{"k":"mc","q":{"en":"Price makes a higher high while RSI does not. What is the cautious reading?","hn":"Price higher high banati hai par RSI nahi. Cautious reading kya hai?"},"o":[[{"en":"Possible divergence; investigate context and confirmation","hn":"Possible divergence; context aur confirmation dekho"},{"en":"Divergence can persist and does not guarantee a reversal.","hn":"Divergence persist kar sakti hai aur reversal guarantee nahi."}],[{"en":"A reversal is certain","hn":"Reversal certain hai"},{"en":"Timing and outcome are uncertain.","hn":"Timing aur outcome uncertain hain."}],[{"en":"The indicator is always wrong","hn":"Indicator hamesha galat hai"},{"en":"It is a clue, not a complete conclusion.","hn":"Ye clue hai, complete conclusion nahi."}]],"a":0},{"k":"mc","q":{"en":"Why can multiple indicators give misleading confidence?","hn":"Multiple indicators misleading confidence kyun de sakte hain?"},"o":[[{"en":"They may use similar price inputs and repeat the same information","hn":"Similar price inputs use karke same information repeat kar sakte hain"},{"en":"Indicators are not necessarily independent evidence.","hn":"Indicators necessarily independent evidence nahi."}],[{"en":"More indicators guarantee accuracy","hn":"Zyada indicators accuracy guarantee karte hain"},{"en":"More tools can also add noise and overfit.","hn":"Zyada tools noise aur overfit bhi add kar sakte hain."}],[{"en":"Indicators remove transaction costs","hn":"Indicators transaction costs hata dete hain"},{"en":"Costs remain part of a strategy.","hn":"Costs strategy ka part rehte hain."}]],"a":0},{"k":"end"}];
UNITS.x14=[{"k":"info","t":{"en":"A chart pattern is a story, not a promise","hn":"Chart pattern ek story hai, promise nahi"},"hook":{"en":"A price chart makes a shape that looks familiar. Does the shape tell you what must happen next?","hn":"Price chart par familiar shape banti hai. Kya shape batati hai ki ab aage kya zaroor hoga?"},"story":{"en":"Meera spots a shape in a hypothetical chart. Before naming it, she checks the prior trend, important levels and what price does after the shape.","hn":"Meera hypothetical chart mein ek shape dekhti hai. Naam dene se pehle woh prior trend, important levels aur shape ke baad price ka behaviour check karti hai."},"s":{"en":"Chart patterns summarise recurring price structures. They describe possible scenarios, not certain forecasts. The same shape can behave differently across instruments, timeframes and market conditions.","hn":"Chart patterns baar-baar dikhne wali price structures ko summarise karte hain. Ye possible scenarios batate hain, certain forecast nahi. Wahi shape alag instruments, timeframes aur market conditions mein alag behave kar sakti hai."},"p":{"en":"All examples in this lesson are conceptual and hypothetical—not live market data, guaranteed signals or trade recommendations.","hn":"Is lesson ke saare examples conceptual aur hypothetical hain—live market data, guaranteed signals ya trade recommendations nahi."},"think":{"en":"What should a pattern give you: certainty or a scenario to test?","hn":"Pattern aapko kya dena chahiye: certainty ya test karne layak scenario?"},"reveal":{"en":"A scenario to test using context, confirmation, invalidation and risk.","hn":"Context, confirmation, invalidation aur risk se test karne layak scenario."}},{"k":"info","t":{"en":"Support and resistance can shape patterns","hn":"Support-resistance patterns ko shape de sakte hain"},"hook":{"en":"Price approaches a level where it turned before. Is the level an exact wall?","hn":"Price us level ke paas aati hai jahan pehle turn hui thi. Kya level ek exact deewar hai?"},"story":{"en":"Arjun draws a zone around repeated reactions rather than one perfect line. Price briefly crosses it, then returns inside.","hn":"Arjun repeated reactions ke around zone draw karta hai, ek perfect line nahi. Price thodi der zone cross karti hai, phir wapas andar aa jaati hai."},"s":{"en":"Support and resistance are often better treated as zones. A break can fail; a close, retest, volume and broader structure may add context but still do not guarantee follow-through.","hn":"Support-resistance ko aksar zones ki tarah dekhna behtar hai. Break fail ho sakta hai; close, retest, volume aur broader structure context de sakte hain par follow-through guarantee nahi."},"p":{"en":"Avoid moving a zone after every candle just to fit your preferred prediction.","hn":"Har candle ke baad zone ko sirf apni prediction fit karne ke liye mat badlo."},"think":{"en":"Why use a zone instead of a perfectly precise line?","hn":"Perfect line ke bajay zone kyun use karein?"},"reveal":{"en":"Market reactions are not always identical to one exact price.","hn":"Market reactions hamesha ek exact price par same nahi hoti."}},{"k":"info","t":{"en":"Double top and double bottom: possible turning points","hn":"Double top aur double bottom: possible turning points"},"hook":{"en":"Price tests a high twice but does not move through it decisively. Is a reversal already confirmed?","hn":"Price ek high ko do baar test karti hai par decisively cross nahi karti. Kya reversal confirm ho gaya?"},"story":{"en":"Nisha sees two peaks near a similar area. She marks the low between them—the neckline area—and waits to see whether price breaks and holds below it.","hn":"Nisha similar area ke paas do peaks dekhti hai. Beech ka low—neckline area—mark karke dekhti hai ki price uske neeche break karke tikti hai ya nahi."},"s":{"en":"A double top can suggest weakening upward momentum if the intervening support breaks; a double bottom is the inverse idea. Similar highs/lows alone are not enough, and pattern definitions vary.","hn":"Double top upward momentum kam hone ka hint de sakta hai agar beech ka support break ho; double bottom iska ulta idea hai. Sirf similar highs/lows kaafi nahi, definitions bhi vary karti hain."},"p":{"en":"A neckline break can fail or reverse. Define the level that invalidates the idea and account for gaps and execution risk.","hn":"Neckline break fail ya reverse ho sakta hai. Idea ko invalid karne wala level define karo aur gaps/execution risk dhyan mein rakho."},"think":{"en":"What additional evidence is commonly watched in a double top?","hn":"Double top mein kaunsa additional evidence dekha jata hai?"},"reveal":{"en":"A meaningful break below the intervening support/neckline, with follow-through assessed in context.","hn":"Beech ke support/neckline ke neeche meaningful break, aur context mein follow-through ka assessment."}},{"k":"info","t":{"en":"Head and shoulders: structure before the label","hn":"Head and shoulders: label se pehle structure"},"hook":{"en":"Three peaks appear, with the middle peak highest. Is that enough to act?","hn":"Teen peaks dikhte hain aur beech wala sabse uncha hai. Kya action ke liye itna kaafi hai?"},"story":{"en":"Kabir sketches a left shoulder, a higher head and a right shoulder. He marks the neckline but does not assume a breakdown must happen.","hn":"Kabir left shoulder, uncha head aur right shoulder draw karta hai. Neckline mark karta hai par breakdown zaroor hoga aisa nahi maanta."},"s":{"en":"A head-and-shoulders structure is often interpreted as a potential bearish reversal after an uptrend. A neckline break is commonly used as confirmation, but false breaks occur and symmetry is rarely perfect.","hn":"Head-and-shoulders ko uptrend ke baad potential bearish reversal maana jata hai. Neckline break ko commonly confirmation ke liye use karte hain, par false breaks hote hain aur perfect symmetry rare hai."},"p":{"en":"Inverse head and shoulders is the upside-down version, often interpreted as a possible bullish reversal after a decline—not a guarantee.","hn":"Inverse head-and-shoulders iska ulta version hai, decline ke baad possible bullish reversal maana ja sakta hai—guarantee nahi."},"think":{"en":"What is more useful than simply recognising three peaks?","hn":"Sirf teen peaks pehchanne se zyada useful kya hai?"},"reveal":{"en":"Trend context, neckline behaviour, invalidation and what happens after the break.","hn":"Trend context, neckline behaviour, invalidation aur break ke baad price ka behaviour."}},{"k":"info","t":{"en":"Triangles: compression can break either way","hn":"Triangles: price compression dono taraf break ho sakti hai"},"hook":{"en":"Price swings get smaller inside converging trendlines. Does the triangle tell you the breakout direction?","hn":"Converging trendlines ke andar price swings chhote ho rahe hain. Kya triangle breakout ki direction batata hai?"},"story":{"en":"Meera draws a symmetrical triangle. She prepares for an upside break, a downside break or no clean break at all.","hn":"Meera symmetrical triangle draw karti hai. Woh upside break, downside break ya clean break na hone—teeno possibilities ke liye ready rehti hai."},"s":{"en":"Ascending, descending and symmetrical triangles describe different boundary shapes. Breakout direction is not guaranteed by the shape alone; timeframe, context and price acceptance beyond the boundary matter.","hn":"Ascending, descending aur symmetrical triangles boundary ke alag shapes describe karte hain. Sirf shape breakout direction guarantee nahi karti; timeframe, context aur boundary ke bahar price ka tikna matter karta hai."},"p":{"en":"Repeatedly redrawing trendlines to fit later price action creates hindsight bias. Keep the rule consistent.","hn":"Baad ke price action ko fit karne ke liye trendlines baar-baar redraw karna hindsight bias hai. Rule consistent rakho."},"think":{"en":"What can happen after a triangle forms?","hn":"Triangle banne ke baad kya ho sakta hai?"},"reveal":{"en":"Either-direction breakout, a false break, or continued consolidation.","hn":"Kisi bhi direction mein breakout, false break ya consolidation continue."}},{"k":"info","t":{"en":"Flags and pennants: pauses within a move","hn":"Flags aur pennants: move ke beech pause"},"hook":{"en":"A sharp move is followed by a small sloping channel. Does that mean the original move must resume?","hn":"Sharp move ke baad chhota sloping channel banta hai. Kya original move zaroor resume hoga?"},"story":{"en":"Arjun labels a possible flag after a strong advance, then checks whether the pause is orderly and whether price actually breaks the boundary.","hn":"Arjun strong advance ke baad possible flag mark karta hai, phir dekhta hai pause orderly hai aur price boundary actually break karti hai ya nahi."},"s":{"en":"Flags and pennants are commonly described as continuation patterns. They can fail, and identifying the prior “pole” or impulse is partly subjective. A breakout needs a plan, not blind belief.","hn":"Flags aur pennants ko commonly continuation patterns kaha jata hai. Ye fail ho sakte hain, aur prior “pole” ya impulse identify karna partly subjective hai. Breakout ke liye plan chahiye, blind belief nahi."},"p":{"en":"A pattern after an extended move may have poor reward-to-risk if entry is late. Check where the idea is invalidated before estimating a target.","hn":"Extended move ke baad pattern mein late entry ka reward-to-risk poor ho sakta hai. Target estimate karne se pehle idea invalid kahan hoga check karo."},"think":{"en":"What makes a flag different from a double top?","hn":"Flag double top se kaise alag hai?"},"reveal":{"en":"A flag is generally read as a pause within a prior move; a double top can suggest a possible reversal if support breaks.","hn":"Flag ko aam taur par prior move ke beech pause maana jata hai; double top support break hone par possible reversal suggest kar sakta hai."}},{"k":"info","t":{"en":"Breakout, retest and false breakout","hn":"Breakout, retest aur false breakout"},"hook":{"en":"Price briefly moves above resistance and then falls back into the range. What might that be?","hn":"Price resistance ke upar thodi der jaakar wapas range mein aa jaati hai. Ye kya ho sakta hai?"},"story":{"en":"Nisha waits for a candle close beyond a zone and watches whether price holds outside it. A quick return inside warns that the break may have failed.","hn":"Nisha zone ke bahar candle close ka wait karti hai aur dekhti hai price bahar tikti hai ya nahi. Jaldi wapas andar aana failed break ka warning ho sakta hai."},"s":{"en":"A breakout is movement beyond a defined boundary; a retest is a return toward that boundary. Neither is a guarantee. Gaps, liquidity, spread and timeframe affect the interpretation and possible execution.","hn":"Breakout defined boundary ke paar movement hai; retest us boundary ki taraf return hai. Dono guarantee nahi. Gaps, liquidity, spread aur timeframe interpretation aur execution ko affect karte hain."},"p":{"en":"Do not assume a stop order will fill at the exact trigger or that every retest will hold.","hn":"Ye assume mat karo ki stop order exact trigger par fill hoga ya har retest hold karega."},"think":{"en":"What is one clue that a breakout may have failed?","hn":"Breakout fail hone ka ek clue kya hai?"},"reveal":{"en":"Price returns inside the prior range and cannot hold beyond the boundary.","hn":"Price purani range ke andar laut aaye aur boundary ke bahar tik na paaye."}},{"k":"info","t":{"en":"Targets are estimates; risk comes first","hn":"Targets estimate hain; risk pehle"},"hook":{"en":"A measured-move method projects a distance from a pattern. Is that distance a promise?","hn":"Measured-move method pattern se distance project karta hai. Kya woh distance promise hai?"},"story":{"en":"Kabir measures a hypothetical range of ₹10 and projects ₹10 beyond a breakout. He labels it a planning estimate, not a destination guaranteed by the market.","hn":"Kabir hypothetical ₹10 range measure karke breakout ke aage ₹10 project karta hai. Woh ise planning estimate label karta hai, market ki guaranteed destination nahi."},"s":{"en":"Some traders project the height of a range or pattern to estimate a target. Actual prices can stop short, overshoot or reverse. The method is a convention, not a law.","hn":"Kuch traders range/pattern ki height project karke target estimate karte hain. Actual price pehle ruk sakti hai, aage nikal sakti hai ya reverse ho sakti hai. Ye convention hai, law nahi."},"p":{"en":"A target is not a risk plan. Define invalidation, position size, likely costs and the possibility of gaps or slippage.","hn":"Target risk plan nahi hai. Invalidation, position size, likely costs aur gaps/slippage ka risk define karo."},"think":{"en":"If a pattern target is ₹120, what else must a plan specify?","hn":"Pattern target ₹120 ho, toh plan mein aur kya specify hona chahiye?"},"reveal":{"en":"An invalidation/exit rule, position size, costs and risk—plus recognition that the target may not be reached.","hn":"Invalidation/exit rule, position size, costs aur risk—saath hi ye samajhna ki target hit hona zaroori nahi."}},{"k":"info","t":{"en":"Build a repeatable pattern checklist","hn":"Repeatable pattern checklist banao"},"hook":{"en":"Before acting on a chart pattern, what should be written down?","hn":"Chart pattern par action se pehle kya likhna chahiye?"},"story":{"en":"Meera writes the timeframe, prior trend, boundary, confirmation rule, invalidation level, position size and the reason she would skip the trade.","hn":"Meera timeframe, prior trend, boundary, confirmation rule, invalidation level, position size aur trade skip karne ki wajah likhti hai."},"s":{"en":"A useful checklist is: (1) instrument and timeframe; (2) market structure and zone; (3) exact pattern criteria; (4) confirmation; (5) invalidation; (6) position sizing and costs; (7) journal and review.","hn":"Useful checklist: (1) instrument/timeframe; (2) market structure aur zone; (3) pattern criteria; (4) confirmation; (5) invalidation; (6) position sizing aur costs; (7) journal/review."},"p":{"en":"Historical pattern examples can be selected with hindsight. A real strategy needs predefined rules, transaction costs, out-of-sample testing and ongoing risk controls.","hn":"Historical patterns ko hindsight se select kiya ja sakta hai. Real strategy ke liye predefined rules, transaction costs, out-of-sample testing aur ongoing risk controls chahiye."},"think":{"en":"What is the safest conclusion after recognising a pattern?","hn":"Pattern recognise karne ke baad sabse sensible conclusion kya hai?"},"reveal":{"en":"It is a hypothesis to test—not an instruction or a guaranteed prediction.","hn":"Ye test karne layak hypothesis hai—instruction ya guaranteed prediction nahi."}},{"k":"mc","q":{"en":"Which pattern is commonly watched for a possible reversal after an uptrend?","hn":"Uptrend ke baad possible reversal ke liye kaunsa pattern dekha jata hai?"},"o":[[{"en":"Head and shoulders","hn":"Head and shoulders"},{"en":"It can suggest a possible reversal if the structure and neckline behaviour support it.","hn":"Structure aur neckline behaviour support kare toh possible reversal suggest kar sakta hai."}],[{"en":"Flag","hn":"Flag"},{"en":"A flag is commonly described as a pause/continuation pattern.","hn":"Flag ko commonly pause/continuation pattern kaha jata hai."}],[{"en":"Every doji","hn":"Har doji"},{"en":"A doji alone does not confirm a reversal.","hn":"Doji akeli reversal confirm nahi karti."}]],"a":0},{"k":"mc","q":{"en":"A double top forms but price stays above the intervening support. What is the cautious reading?","hn":"Double top bana par price beech ke support ke upar hai. Cautious reading kya hai?"},"o":[[{"en":"The pattern is not confirmed by a support break","hn":"Support break se pattern confirm nahi hua"},{"en":"Similar highs alone do not establish a confirmed breakdown.","hn":"Sirf similar highs confirmed breakdown nahi banate."}],[{"en":"A fall is guaranteed","hn":"Girawat guaranteed hai"},{"en":"Patterns do not guarantee direction.","hn":"Patterns direction guarantee nahi karte."}],[{"en":"Buy immediately","hn":"Turant buy karo"},{"en":"A shape is not an order instruction.","hn":"Shape order instruction nahi hai."}]],"a":0},{"k":"mc","q":{"en":"What does a triangle pattern tell you about breakout direction?","hn":"Triangle breakout direction ke baare mein kya batata hai?"},"o":[[{"en":"It does not guarantee a direction","hn":"Direction guarantee nahi karta"},{"en":"Breaks can happen either way or fail.","hn":"Break kisi bhi taraf ho sakta hai ya fail ho sakta hai."}],[{"en":"Always upward","hn":"Hamesha upar"},{"en":"That is not supported by the shape alone.","hn":"Sirf shape se ye support nahi hota."}],[{"en":"Always downward","hn":"Hamesha neeche"},{"en":"That is not supported by the shape alone.","hn":"Sirf shape se ye support nahi hota."}]],"a":0},{"k":"mc","q":{"en":"What is a false breakout?","hn":"False breakout kya hai?"},"o":[[{"en":"Price moves beyond a boundary but returns into the prior range","hn":"Price boundary ke paar jaakar purani range mein laut aaye"},{"en":"A break that fails to hold beyond the level may be a false breakout.","hn":"Level ke bahar hold na kar paana false breakout ho sakta hai."}],[{"en":"Any large candle","hn":"Koi bhi badi candle"},{"en":"Candle size alone does not define it.","hn":"Sirf candle size definition nahi hai."}],[{"en":"A guaranteed reversal signal","hn":"Guaranteed reversal signal"},{"en":"It still needs context and a plan.","hn":"Context aur plan phir bhi chahiye."}]],"a":0},{"k":"mc","q":{"en":"A flag appears after a strong move. What is a responsible interpretation?","hn":"Strong move ke baad flag dikhe toh responsible interpretation kya hai?"},"o":[[{"en":"A possible continuation setup that can still fail","hn":"Possible continuation setup jo fail bhi ho sakta hai"},{"en":"The pattern is a hypothesis, not a promise.","hn":"Pattern hypothesis hai, promise nahi."}],[{"en":"The prior trend must resume","hn":"Prior trend zaroor resume hoga"},{"en":"Continuation is not guaranteed.","hn":"Continuation guaranteed nahi."}],[{"en":"The price target is certain","hn":"Price target certain hai"},{"en":"Targets are estimates.","hn":"Targets estimates hote hain."}]],"a":0},{"k":"mc","q":{"en":"Why mark an invalidation level before a trade?","hn":"Trade se pehle invalidation level kyun mark karein?"},"o":[[{"en":"To define where the idea no longer holds","hn":"Jahan idea valid nahi rehta use define karne ke liye"},{"en":"It helps structure risk and position size.","hn":"Risk aur position size structure karne mein help karta hai."}],[{"en":"To guarantee the stop price","hn":"Stop price guarantee karne ke liye"},{"en":"Execution can differ from the trigger.","hn":"Execution trigger se alag ho sakta hai."}],[{"en":"To avoid checking costs","hn":"Costs check na karne ke liye"},{"en":"Costs still matter.","hn":"Costs phir bhi matter karte hain."}]],"a":0},{"k":"mc","q":{"en":"A measured-move target projects the pattern height. What is it?","hn":"Measured-move target pattern ki height project karta hai. Ye kya hai?"},"o":[[{"en":"An estimate based on a convention","hn":"Convention par based estimate"},{"en":"Actual price may stop short or overshoot.","hn":"Actual price pehle ruk ya aage nikal sakti hai."}],[{"en":"A guaranteed destination","hn":"Guaranteed destination"},{"en":"No chart method guarantees the target.","hn":"Koi chart method target guarantee nahi karta."}],[{"en":"The same as a stop-loss","hn":"Stop-loss jaisa hi"},{"en":"Targets and invalidation levels serve different roles.","hn":"Target aur invalidation alag roles hain."}]],"a":0},{"k":"mc","q":{"en":"Why can a pattern look successful in a textbook but fail in live markets?","hn":"Textbook mein successful pattern live market mein fail kyun ho sakta hai?"},"o":[[{"en":"Market conditions, selection bias, costs and execution differ","hn":"Market conditions, selection bias, costs aur execution alag hote hain"},{"en":"Historical examples can be hindsight-selected and live trades have frictions.","hn":"Historical examples hindsight se choose ho sakte hain aur live trades mein frictions hote hain."}],[{"en":"Patterns control the market","hn":"Patterns market control karte hain"},{"en":"They only describe price structure.","hn":"Ye sirf price structure describe karte hain."}],[{"en":"A named pattern never fails","hn":"Named pattern kabhi fail nahi hota"},{"en":"Every pattern can fail.","hn":"Har pattern fail ho sakta hai."}]],"a":0},{"k":"mc","q":{"en":"Which is the better sequence when studying a pattern?","hn":"Pattern study karne ka behtar sequence kya hai?"},"o":[[{"en":"Context → criteria → confirmation → invalidation → risk","hn":"Context → criteria → confirmation → invalidation → risk"},{"en":"This keeps the pattern inside a repeatable plan.","hn":"Isse pattern repeatable plan ka part banta hai."}],[{"en":"Name → instant trade","hn":"Naam → turant trade"},{"en":"Recognition alone is not a plan.","hn":"Sirf pehchan plan nahi hai."}],[{"en":"Target first, no exit","hn":"Pehle target, exit nahi"},{"en":"Risk and invalidation must also be defined.","hn":"Risk aur invalidation bhi define karne chahiye."}]],"a":0},{"k":"mc","q":{"en":"What is the best way to treat chart patterns in a beginner course?","hn":"Beginner course mein chart patterns ko kaise treat karna chahiye?"},"o":[[{"en":"As hypotheses to study and test, not guaranteed signals","hn":"Study/test karne layak hypotheses, guaranteed signals nahi"},{"en":"A pattern is one input among several and may fail.","hn":"Pattern kai inputs mein se ek hai aur fail ho sakta hai."}],[{"en":"As certain forecasts","hn":"Certain forecasts"},{"en":"Markets are uncertain.","hn":"Markets uncertain hain."}],[{"en":"As personalised investment advice","hn":"Personalised investment advice"},{"en":"This educational lesson is not personal advice.","hn":"Ye educational lesson personal advice nahi hai."}]],"a":0},{"k":"end"}];
UNITS.x15=[{"k":"info","t":{"en":"Delta: first-order price sensitivity","hn":"Delta: price ki initial sensitivity"},"hook":{"en":"What does delta primarily estimate?","hn":"Delta mainly kya estimate karta hai?"},"story":{"en":"A call with delta 0.45 may change roughly ₹0.45 for a ₹1 underlying move near the current point, before other effects.","hn":"0.45 delta wala call current point ke paas underlying ₹1 move par roughly ₹0.45 badal sakta hai, doosre effects se pehle."},"s":{"en":"Delta estimates how much an option price may change for a small underlying move, with other inputs held constant. It is not a guaranteed rupee change.","hn":"Delta estimate karta hai ki underlying ke chhote move par option price kitna badal sakta hai, baaki inputs same maan kar. Ye guaranteed rupee change nahi hai."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"What does delta primarily estimate?","hn":"Delta mainly kya estimate karta hai?"},"reveal":{"en":"Local option-price sensitivity to the underlying price","hn":"Underlying price ke prati option-price ki local sensitivity"}},{"k":"info","t":{"en":"Call and put delta signs","hn":"Call aur put delta ke signs"},"hook":{"en":"Which delta sign is typical for a long put?","hn":"Long put ke liye kaunsa delta sign typical hai?"},"story":{"en":"A long put may gain value as the underlying falls, so its delta is usually below zero.","hn":"Underlying girne par long put ki value badh sakti hai, isliye uska delta aam taur par zero se neeche hota hai."},"s":{"en":"For standard long options, call delta is generally positive and put delta generally negative. Magnitudes depend on moneyness, time and volatility.","hn":"Standard long options mein call delta generally positive aur put delta negative hota hai. Magnitude moneyness, time aur volatility par depend karta hai."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"Which delta sign is typical for a long put?","hn":"Long put ke liye kaunsa delta sign typical hai?"},"reveal":{"en":"Negative","hn":"Negative"}},{"k":"info","t":{"en":"Gamma: change in delta","hn":"Gamma: delta mein change"},"hook":{"en":"What does gamma measure?","hn":"Gamma kya measure karta hai?"},"story":{"en":"Near expiry, an at-the-money option can have high gamma, so a small move may change its delta noticeably.","hn":"Expiry ke paas at-the-money option ka gamma high ho sakta hai, isliye chhota move delta ko noticeable badal sakta hai."},"s":{"en":"Gamma estimates how much delta changes as the underlying moves. Higher gamma means delta can change more quickly, all else equal.","hn":"Gamma estimate karta hai ki underlying move hone par delta kitna badalta hai. Baaki sab same ho toh high gamma mein delta zyada jaldi badal sakta hai."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"What does gamma measure?","hn":"Gamma kya measure karta hai?"},"reveal":{"en":"The rate at which delta changes with the underlying","hn":"Underlying ke saath delta kitni rate se badalta hai"}},{"k":"info","t":{"en":"Theta: time sensitivity","hn":"Theta: time sensitivity"},"hook":{"en":"Which Greek is most associated with time decay?","hn":"Time decay se sabse zyada kaunsa Greek juda hai?"},"story":{"en":"A bought option can lose time value during a quiet session even if the underlying barely moves.","hn":"Underlying zyada move na kare tab bhi quiet session mein bought option time value lose kar sakta hai."},"s":{"en":"Theta estimates the effect of time passing on an option value, with other inputs held constant. Long options often have negative theta, but structures differ.","hn":"Theta baaki inputs same maan kar time pass hone ka option value par effect estimate karta hai. Long options mein aksar negative theta hota hai, lekin structures alag hote hain."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"Which Greek is most associated with time decay?","hn":"Time decay se sabse zyada kaunsa Greek juda hai?"},"reveal":{"en":"Theta","hn":"Theta"}},{"k":"info","t":{"en":"Vega: implied-volatility sensitivity","hn":"Vega: implied volatility sensitivity"},"hook":{"en":"Which Greek is most directly linked to implied volatility?","hn":"Implied volatility se directly kaunsa Greek linked hai?"},"story":{"en":"After an event, implied volatility can fall; a long option may lose value even if the underlying moves in the expected direction.","hn":"Event ke baad implied volatility gir sakti hai; underlying expected direction mein jaaye tab bhi long option ki value gir sakti hai."},"s":{"en":"Vega estimates how option value responds to a change in implied volatility, all else equal. It does not tell the direction of the underlying.","hn":"Vega estimate karta hai ki baaki sab same ho toh implied volatility change se option value kaise respond karegi. Ye underlying ki direction nahi batata."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"Which Greek is most directly linked to implied volatility?","hn":"Implied volatility se directly kaunsa Greek linked hai?"},"reveal":{"en":"Vega","hn":"Vega"}},{"k":"info","t":{"en":"Rho: interest-rate sensitivity","hn":"Rho: interest-rate sensitivity"},"hook":{"en":"What does rho describe?","hn":"Rho kya describe karta hai?"},"story":{"en":"For a short-dated trade, rate sensitivity may be less influential than a sharp volatility change, depending on the position.","hn":"Short-dated trade mein position ke hisaab se rate sensitivity, sharp volatility change se kam influential ho sakti hai."},"s":{"en":"Rho estimates option-value sensitivity to interest-rate changes. Its practical importance varies by maturity, contract and market context.","hn":"Rho interest-rate changes ke prati option-value sensitivity estimate karta hai. Iski practical importance maturity, contract aur market context se badalti hai."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"What does rho describe?","hn":"Rho kya describe karta hai?"},"reveal":{"en":"Sensitivity to interest-rate changes","hn":"Interest-rate changes ke prati sensitivity"}},{"k":"info","t":{"en":"Greeks interact; isolate one variable carefully","hn":"Greeks interact karte hain; ek variable carefully isolate karo"},"hook":{"en":"Why might an option behave differently from a simple delta estimate?","hn":"Option simple delta estimate se alag kyun behave kar sakta hai?"},"story":{"en":"A stock rises but the option gains less than expected because implied volatility falls and time passes.","hn":"Stock badhta hai par option expected se kam gain karta hai kyunki implied volatility girti hai aur time pass hota hai."},"s":{"en":"A Greek is a local sensitivity under assumptions. Real option prices reflect multiple inputs moving together, plus spread and liquidity.","hn":"Greek assumptions ke under local sensitivity hai. Real option prices mein multiple inputs ek saath move karte hain, spread aur liquidity bhi matter karte hain."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"Why might an option behave differently from a simple delta estimate?","hn":"Option simple delta estimate se alag kyun behave kar sakta hai?"},"reveal":{"en":"Other inputs and higher-order effects also change","hn":"Doosre inputs aur higher-order effects bhi badalte hain"}},{"k":"info","t":{"en":"Use Greeks with position-level risk","hn":"Greeks ko position-level risk ke saath use karo"},"hook":{"en":"What should accompany a Greek-based view?","hn":"Greek-based view ke saath kya hona chahiye?"},"story":{"en":"Two positions may have similar delta but very different gamma, theta and worst-case loss.","hn":"Do positions ka delta similar ho sakta hai, par gamma, theta aur worst-case loss bahut alag ho sakta hai."},"s":{"en":"Greeks help describe exposure, but position size, maximum loss, expiry, liquidity and scenario analysis are still needed.","hn":"Greeks exposure describe karne mein help karte hain, par position size, maximum loss, expiry, liquidity aur scenario analysis phir bhi chahiye."},"p":{"en":"Greeks are model-based sensitivities, not predictions or standalone trade signals. Values change with market conditions and assumptions.","hn":"Greeks model-based sensitivities hain, predictions ya standalone trade signals nahi. Market conditions aur assumptions se values badalti hain."},"think":{"en":"What should accompany a Greek-based view?","hn":"Greek-based view ke saath kya hona chahiye?"},"reveal":{"en":"Position-level risk and scenario analysis","hn":"Position-level risk aur scenario analysis"}},{"k":"mc","q":{"en":"What does delta primarily estimate?","hn":"Delta mainly kya estimate karta hai?"},"o":[[{"en":"How quickly delta itself changes","hn":"Delta khud kitni jaldi badalta hai"},{"en":"Not quite. Delta estimates how much an option price may change for a small underlying move, with other inputs held constant. It is not a guaranteed rupee change.","hn":"Dobara socho. Delta estimate karta hai ki underlying ke chhote move par option price kitna badal sakta hai, baaki inputs same maan kar. Ye guaranteed rupee change nahi hai."}],[{"en":"Local option-price sensitivity to the underlying price","hn":"Underlying price ke prati option-price ki local sensitivity"},{"en":"Correct. Delta estimates how much an option price may change for a small underlying move, with other inputs held constant. It is not a guaranteed rupee change.","hn":"Sahi. Delta estimate karta hai ki underlying ke chhote move par option price kitna badal sakta hai, baaki inputs same maan kar. Ye guaranteed rupee change nahi hai."}],[{"en":"Sensitivity to implied volatility","hn":"Implied volatility ke prati sensitivity"},{"en":"Not quite. Delta estimates how much an option price may change for a small underlying move, with other inputs held constant. It is not a guaranteed rupee change.","hn":"Dobara socho. Delta estimate karta hai ki underlying ke chhote move par option price kitna badal sakta hai, baaki inputs same maan kar. Ye guaranteed rupee change nahi hai."}]],"a":1},{"k":"mc","q":{"en":"Which delta sign is typical for a long put?","hn":"Long put ke liye kaunsa delta sign typical hai?"},"o":[[{"en":"Negative","hn":"Negative"},{"en":"Correct. For standard long options, call delta is generally positive and put delta generally negative. Magnitudes depend on moneyness, time and volatility.","hn":"Sahi. Standard long options mein call delta generally positive aur put delta negative hota hai. Magnitude moneyness, time aur volatility par depend karta hai."}],[{"en":"Positive","hn":"Positive"},{"en":"Not quite. For standard long options, call delta is generally positive and put delta generally negative. Magnitudes depend on moneyness, time and volatility.","hn":"Dobara socho. Standard long options mein call delta generally positive aur put delta negative hota hai. Magnitude moneyness, time aur volatility par depend karta hai."}],[{"en":"Always exactly zero","hn":"Hamesha exactly zero"},{"en":"Not quite. For standard long options, call delta is generally positive and put delta generally negative. Magnitudes depend on moneyness, time and volatility.","hn":"Dobara socho. Standard long options mein call delta generally positive aur put delta negative hota hai. Magnitude moneyness, time aur volatility par depend karta hai."}]],"a":0},{"k":"mc","q":{"en":"What does gamma measure?","hn":"Gamma kya measure karta hai?"},"o":[[{"en":"The option’s cash premium paid at entry","hn":"Entry par pay kiya option premium"},{"en":"Not quite. Gamma estimates how much delta changes as the underlying moves. Higher gamma means delta can change more quickly, all else equal.","hn":"Dobara socho. Gamma estimate karta hai ki underlying move hone par delta kitna badalta hai. Baaki sab same ho toh high gamma mein delta zyada jaldi badal sakta hai."}],[{"en":"The daily brokerage charge","hn":"Daily brokerage charge"},{"en":"Not quite. Gamma estimates how much delta changes as the underlying moves. Higher gamma means delta can change more quickly, all else equal.","hn":"Dobara socho. Gamma estimate karta hai ki underlying move hone par delta kitna badalta hai. Baaki sab same ho toh high gamma mein delta zyada jaldi badal sakta hai."}],[{"en":"The rate at which delta changes with the underlying","hn":"Underlying ke saath delta kitni rate se badalta hai"},{"en":"Correct. Gamma estimates how much delta changes as the underlying moves. Higher gamma means delta can change more quickly, all else equal.","hn":"Sahi. Gamma estimate karta hai ki underlying move hone par delta kitna badalta hai. Baaki sab same ho toh high gamma mein delta zyada jaldi badal sakta hai."}]],"a":2},{"k":"mc","q":{"en":"Which Greek is most associated with time decay?","hn":"Time decay se sabse zyada kaunsa Greek juda hai?"},"o":[[{"en":"Gamma","hn":"Gamma"},{"en":"Not quite. Theta estimates the effect of time passing on an option value, with other inputs held constant. Long options often have negative theta, but structures differ.","hn":"Dobara socho. Theta baaki inputs same maan kar time pass hone ka option value par effect estimate karta hai. Long options mein aksar negative theta hota hai, lekin structures alag hote hain."}],[{"en":"Theta","hn":"Theta"},{"en":"Correct. Theta estimates the effect of time passing on an option value, with other inputs held constant. Long options often have negative theta, but structures differ.","hn":"Sahi. Theta baaki inputs same maan kar time pass hone ka option value par effect estimate karta hai. Long options mein aksar negative theta hota hai, lekin structures alag hote hain."}],[{"en":"Rho","hn":"Rho"},{"en":"Not quite. Theta estimates the effect of time passing on an option value, with other inputs held constant. Long options often have negative theta, but structures differ.","hn":"Dobara socho. Theta baaki inputs same maan kar time pass hone ka option value par effect estimate karta hai. Long options mein aksar negative theta hota hai, lekin structures alag hote hain."}]],"a":1},{"k":"mc","q":{"en":"Which Greek is most directly linked to implied volatility?","hn":"Implied volatility se directly kaunsa Greek linked hai?"},"o":[[{"en":"Theta","hn":"Theta"},{"en":"Not quite. Vega estimates how option value responds to a change in implied volatility, all else equal. It does not tell the direction of the underlying.","hn":"Dobara socho. Vega estimate karta hai ki baaki sab same ho toh implied volatility change se option value kaise respond karegi. Ye underlying ki direction nahi batata."}],[{"en":"Delta","hn":"Delta"},{"en":"Not quite. Vega estimates how option value responds to a change in implied volatility, all else equal. It does not tell the direction of the underlying.","hn":"Dobara socho. Vega estimate karta hai ki baaki sab same ho toh implied volatility change se option value kaise respond karegi. Ye underlying ki direction nahi batata."}],[{"en":"Vega","hn":"Vega"},{"en":"Correct. Vega estimates how option value responds to a change in implied volatility, all else equal. It does not tell the direction of the underlying.","hn":"Sahi. Vega estimate karta hai ki baaki sab same ho toh implied volatility change se option value kaise respond karegi. Ye underlying ki direction nahi batata."}]],"a":2},{"k":"mc","q":{"en":"What does rho describe?","hn":"Rho kya describe karta hai?"},"o":[[{"en":"Sensitivity to interest-rate changes","hn":"Interest-rate changes ke prati sensitivity"},{"en":"Correct. Rho estimates option-value sensitivity to interest-rate changes. Its practical importance varies by maturity, contract and market context.","hn":"Sahi. Rho interest-rate changes ke prati option-value sensitivity estimate karta hai. Iski practical importance maturity, contract aur market context se badalti hai."}],[{"en":"Sensitivity to time passing","hn":"Time pass hone ke prati sensitivity"},{"en":"Not quite. Rho estimates option-value sensitivity to interest-rate changes. Its practical importance varies by maturity, contract and market context.","hn":"Dobara socho. Rho interest-rate changes ke prati option-value sensitivity estimate karta hai. Iski practical importance maturity, contract aur market context se badalti hai."}],[{"en":"Change in delta for an underlying move","hn":"Underlying move par delta ka change"},{"en":"Not quite. Rho estimates option-value sensitivity to interest-rate changes. Its practical importance varies by maturity, contract and market context.","hn":"Dobara socho. Rho interest-rate changes ke prati option-value sensitivity estimate karta hai. Iski practical importance maturity, contract aur market context se badalti hai."}]],"a":0},{"k":"mc","q":{"en":"Why might an option behave differently from a simple delta estimate?","hn":"Option simple delta estimate se alag kyun behave kar sakta hai?"},"o":[[{"en":"Delta guarantees the final price","hn":"Delta final price guarantee karta hai"},{"en":"Not quite. A Greek is a local sensitivity under assumptions. Real option prices reflect multiple inputs moving together, plus spread and liquidity.","hn":"Dobara socho. Greek assumptions ke under local sensitivity hai. Real option prices mein multiple inputs ek saath move karte hain, spread aur liquidity bhi matter karte hain."}],[{"en":"Other inputs and higher-order effects also change","hn":"Doosre inputs aur higher-order effects bhi badalte hain"},{"en":"Correct. A Greek is a local sensitivity under assumptions. Real option prices reflect multiple inputs moving together, plus spread and liquidity.","hn":"Sahi. Greek assumptions ke under local sensitivity hai. Real option prices mein multiple inputs ek saath move karte hain, spread aur liquidity bhi matter karte hain."}],[{"en":"Greeks ignore all market conditions","hn":"Greeks sab market conditions ignore karte hain"},{"en":"Not quite. A Greek is a local sensitivity under assumptions. Real option prices reflect multiple inputs moving together, plus spread and liquidity.","hn":"Dobara socho. Greek assumptions ke under local sensitivity hai. Real option prices mein multiple inputs ek saath move karte hain, spread aur liquidity bhi matter karte hain."}]],"a":1},{"k":"mc","q":{"en":"What should accompany a Greek-based view?","hn":"Greek-based view ke saath kya hona chahiye?"},"o":[[{"en":"A guarantee that the trade will work","hn":"Trade work karne ki guarantee"},{"en":"Not quite. Greeks help describe exposure, but position size, maximum loss, expiry, liquidity and scenario analysis are still needed.","hn":"Dobara socho. Greeks exposure describe karne mein help karte hain, par position size, maximum loss, expiry, liquidity aur scenario analysis phir bhi chahiye."}],[{"en":"Only the option symbol","hn":"Sirf option symbol"},{"en":"Not quite. Greeks help describe exposure, but position size, maximum loss, expiry, liquidity and scenario analysis are still needed.","hn":"Dobara socho. Greeks exposure describe karne mein help karte hain, par position size, maximum loss, expiry, liquidity aur scenario analysis phir bhi chahiye."}],[{"en":"Position-level risk and scenario analysis","hn":"Position-level risk aur scenario analysis"},{"en":"Correct. Greeks help describe exposure, but position size, maximum loss, expiry, liquidity and scenario analysis are still needed.","hn":"Sahi. Greeks exposure describe karne mein help karte hain, par position size, maximum loss, expiry, liquidity aur scenario analysis phir bhi chahiye."}]],"a":2},{"k":"end"}];
UNITS.x16=[{"k":"info","t":{"en":"An option chain is a contract map","hn":"Option chain contracts ka map hai"},"hook":{"en":"If you want to compare several options on one underlying, what organised view could help?","hn":"Ek underlying ke kai options compare karne hain, toh kaunsa organised view help karega?"},"story":{"en":"Meera opens a hypothetical index option chain. Each row represents a strike, and call and put quotes appear side by side for a selected expiry.","hn":"Meera ek hypothetical index option chain kholti hai. Har row ek strike dikhati hai aur selected expiry ke liye call aur put quotes side-by-side hote hain."},"s":{"en":"An option chain organises option contracts by strike and expiry. Depending on the platform, it can show call and put prices, bid/ask, volume, open interest and implied volatility. It is a structured view of contracts, not a recommendation by itself.","hn":"Option chain contracts ko strike aur expiry ke hisaab se organise karti hai. Platform ke hisaab se call/put prices, bid/ask, volume, open interest aur implied volatility dikh sakte hain. Ye contracts ka structured view hai, apne aap recommendation nahi."},"p":{"en":"Always confirm the underlying, expiry, contract size and data timestamp before comparing rows.","hn":"Rows compare karne se pehle underlying, expiry, contract size aur data ka timestamp confirm karo."},"think":{"en":"What does each row in a typical option chain commonly represent?","hn":"Typical option chain mein har row aam taur par kya represent karti hai?"},"reveal":{"en":"A strike price for the selected expiry and underlying.","hn":"Selected expiry aur underlying ka strike price."}},{"k":"info","t":{"en":"Read the call side and put side","hn":"Call side aur put side ko padho"},"hook":{"en":"Why can a call and a put at the same strike still behave differently?","hn":"Same strike par call aur put phir bhi alag kyun behave kar sakte hain?"},"story":{"en":"At a ₹100 strike, a call gives a right to buy and a put gives a right to sell. Their prices and sensitivities need not match.","hn":"₹100 strike par call buy karne ka right deta hai aur put sell karne ka. Dono ke prices aur sensitivities same hona zaroori nahi."},"s":{"en":"A chain often places calls on one side and puts on the other, with strike in the centre. Read the column heading carefully: the same strike does not make the call and put the same contract.","hn":"Chain mein aksar calls ek side aur puts doosri side hote hain, beech mein strike hota hai. Column heading dhyan se padho: same strike hone se call aur put same contract nahi ban jaate."},"p":{"en":"Do not infer a bullish or bearish signal just because one side has a larger displayed premium. Contract terms and market conditions matter.","hn":"Sirf ek side ka premium zyada dekhkar bullish ya bearish signal mat nikalo. Contract terms aur market conditions matter karte hain."},"think":{"en":"At the same strike, what is the core difference between a call and a put buyer’s right?","hn":"Same strike par call aur put buyer ke right ka core difference kya hai?"},"reveal":{"en":"Call: right to buy; put: right to sell, subject to contract terms.","hn":"Call: buy ka right; put: sell ka right, contract terms ke subject to."}},{"k":"info","t":{"en":"Strike and expiry must match","hn":"Strike aur expiry match karna zaroori hai"},"hook":{"en":"Is a ₹200 strike option expiring this week directly comparable to one expiring next month?","hn":"Is week expire hone wale ₹200 strike option ko next month wale option se directly compare kar sakte hain?"},"story":{"en":"Arjun sees two contracts with the same underlying and strike but different expiry dates. One has more time for the underlying to move.","hn":"Arjun same underlying aur strike ke do contracts dekhta hai, lekin expiry alag hai. Ek contract mein underlying ko move karne ke liye zyada time hai."},"s":{"en":"Expiry changes the time remaining and can change premium, time value and risk. Compare like-for-like contracts: same underlying, expiry, strike, option type and contract size where relevant.","hn":"Expiry remaining time badalti hai aur premium, time value aur risk ko affect kar sakti hai. Like-for-like contracts compare karo: same underlying, expiry, strike, option type aur jahan relevant ho contract size."},"p":{"en":"A chain may retain multiple expiries or require you to select one. Check the expiry selector rather than assuming every visible row belongs to the same expiry.","hn":"Chain mein multiple expiries ho sakti hain ya expiry select karni pad sakti hai. Ye assume mat karo ki har visible row same expiry ki hai."},"think":{"en":"Which fields should be matched first for a fair premium comparison?","hn":"Fair premium comparison ke liye pehle kaunse fields match karne chahiye?"},"reveal":{"en":"Underlying, option type, strike, expiry and relevant contract size/terms.","hn":"Underlying, option type, strike, expiry aur relevant contract size/terms."}},{"k":"info","t":{"en":"ATM, ITM and OTM describe strike position","hn":"ATM, ITM aur OTM strike ki position batate hain"},"hook":{"en":"Underlying ₹104 hai. Which call strike is in the money: ₹100 or ₹110?","hn":"Underlying ₹104 hai. Kaunsa call strike in the money hai: ₹100 ya ₹110?"},"story":{"en":"For a hypothetical underlying at ₹104, the ₹100 call has intrinsic value while the ₹110 call does not. The labels depend on the underlying price and option type.","hn":"Hypothetical underlying ₹104 par ₹100 call ki intrinsic value hai, jabki ₹110 call ki nahi. Labels underlying price aur option type par depend karte hain."},"s":{"en":"For calls, ITM generally means underlying above strike; for puts, ITM generally means underlying below strike. ATM is near the strike, and OTM has no intrinsic value at that moment. Exact ATM conventions can vary.","hn":"Calls ke liye ITM aam taur par underlying strike se upar; puts ke liye underlying strike se neeche hota hai. ATM strike ke paas hota hai aur OTM mein us waqt intrinsic value nahi hoti. Exact ATM convention vary kar sakti hai."},"p":{"en":"Moneyness is not a guarantee of profit. Premium paid, time remaining and costs still matter.","hn":"Moneyness profit ki guarantee nahi hai. Paid premium, remaining time aur costs matter karte hain."},"think":{"en":"Underlying ₹104: which statement about a ₹100 call is generally correct?","hn":"Underlying ₹104 hai: ₹100 call ke baare mein aam taur par kaunsa statement sahi hai?"},"reveal":{"en":"It is ITM because the underlying is above the call strike.","hn":"Ye ITM hai kyunki underlying call strike se upar hai."}},{"k":"info","t":{"en":"Bid, ask and spread affect execution","hn":"Bid, ask aur spread execution ko affect karte hain"},"hook":{"en":"Bid ₹9.80 aur ask ₹10.20 ho, toh spread kitna hai?","hn":"Bid ₹9.80 aur ask ₹10.20 ho, toh spread kitna hai?"},"story":{"en":"A displayed quote has a bid of ₹9.80 and an ask of ₹10.20. The ₹0.40 gap is the quoted spread before fees and slippage.","hn":"Displayed quote mein bid ₹9.80 aur ask ₹10.20 hai. ₹0.40 ka gap quoted spread hai, fees aur slippage se pehle."},"s":{"en":"Bid is the best displayed buying price and ask is the best displayed selling price. The spread is ask minus bid. A market order can execute at available prices, not necessarily at the last traded price.","hn":"Bid best displayed buying price hai aur ask best displayed selling price. Spread = ask minus bid. Market order available prices par execute ho sakta hai, zaroori nahi last traded price par."},"p":{"en":"Wide spreads, thin depth and stale quotes can increase execution uncertainty. Check quote freshness and order-book depth when available.","hn":"Wide spread, thin depth aur stale quotes execution uncertainty badha sakte hain. Available ho toh quote freshness aur order-book depth check karo."},"think":{"en":"Bid ₹9.80, ask ₹10.20. What is the spread?","hn":"Bid ₹9.80, ask ₹10.20. Spread kitna hai?"},"reveal":{"en":"₹0.40 per unit.","hn":"₹0.40 per unit."}},{"k":"info","t":{"en":"Volume is activity during a period","hn":"Volume ek period ki activity hai"},"hook":{"en":"Which field counts contracts traded during a period?","hn":"Ek period mein trade hue contracts kaun count karta hai?"},"story":{"en":"A contract can trade repeatedly during the day. Each eligible trade contributes to the displayed volume according to the exchange’s counting rules.","hn":"Ek contract din bhar repeatedly trade ho sakta hai. Exchange ke counting rules ke hisaab se har eligible trade displayed volume mein contribute karta hai."},"s":{"en":"Volume measures trading activity over a period, often the current session. High volume indicates activity, but by itself it does not reveal whether positions are bullish, bearish, opening or closing.","hn":"Volume ek period ki trading activity measure karta hai, aksar current session ki. High volume activity dikhata hai, lekin apne aap nahi batata ki positions bullish, bearish, opening ya closing hain."},"p":{"en":"Volume can change quickly and should be interpreted with price, spread, liquidity and context.","hn":"Volume jaldi change ho sakta hai; ise price, spread, liquidity aur context ke saath samjho."},"think":{"en":"What does option volume primarily measure?","hn":"Option volume primarily kya measure karta hai?"},"reveal":{"en":"Contracts traded during the measured period.","hn":"Measured period mein trade hue contracts."}},{"k":"info","t":{"en":"Open interest is outstanding contracts","hn":"Open interest abhi open contracts ko dikhata hai"},"hook":{"en":"Does open interest count unique traders?","hn":"Kya open interest unique traders ko count karta hai?"},"story":{"en":"Two parties are on opposite sides of an open derivative contract. Open interest tracks outstanding contracts under the exchange’s definitions, not a headcount of people.","hn":"Ek open derivative contract mein do parties opposite sides par hoti hain. Open interest exchange ki definitions ke hisaab se outstanding contracts track karta hai, logon ki headcount nahi."},"s":{"en":"Open interest is the number of contracts still open at a point in time under the relevant market convention. It differs from volume, which counts trading during a period. Each open contract has both a long and a short side.","hn":"Open interest relevant market convention ke hisaab se ek waqt par open contracts ki sankhya hai. Ye volume se alag hai, jo period ke trades count karta hai. Har open contract ka long aur short dono side hota hai."},"p":{"en":"Rising open interest alone does not prove that “smart money” is bullish or bearish. Interpret changes with price action and context; even then, conclusions are uncertain.","hn":"Sirf rising open interest prove nahi karta ki “smart money” bullish ya bearish hai. Changes ko price action aur context ke saath samjho; phir bhi conclusion uncertain rahega."},"think":{"en":"What is the best distinction between volume and open interest?","hn":"Volume aur open interest mein best distinction kya hai?"},"reveal":{"en":"Volume counts trading over a period; open interest counts outstanding contracts at a point in time.","hn":"Volume period ke trades count karta hai; open interest ek waqt par outstanding contracts count karta hai."}},{"k":"info","t":{"en":"Implied volatility reflects expected variability","hn":"Implied volatility expected variability reflect karti hai"},"hook":{"en":"Does higher IV by itself tell you whether the underlying will rise or fall?","hn":"Kya higher IV akeli batati hai ki underlying upar jayega ya neeche?"},"story":{"en":"Before a major event, option premiums may reflect a wider range of possible price moves. After the event, implied volatility may fall even if the underlying price moves.","hn":"Major event se pehle option premiums possible price moves ka wider range reflect kar sakte hain. Event ke baad underlying price move kare tab bhi implied volatility gir sakti hai."},"s":{"en":"Implied volatility is a value inferred from option prices using a pricing model. It reflects market pricing of future variability, not a directional forecast or a guarantee that a move will occur.","hn":"Implied volatility option prices se pricing model ke through infer ki gayi value hai. Ye future variability ki market pricing reflect karti hai, directional forecast ya move ki guarantee nahi."},"p":{"en":"IV comparisons require comparable contracts and a timestamp. High IV can mean expensive options as well as greater priced-in uncertainty; it is not a standalone trade signal.","hn":"IV compare karne ke liye comparable contracts aur timestamp zaroori hain. High IV ka matlab expensive options aur priced-in uncertainty dono ho sakta hai; ye standalone trade signal nahi."},"think":{"en":"What does implied volatility primarily represent?","hn":"Implied volatility primarily kya represent karti hai?"},"reveal":{"en":"Market-implied expected variability, not direction on its own.","hn":"Market-implied expected variability, apne aap direction nahi."}},{"k":"info","t":{"en":"Read a chain as a snapshot, not a signal","hn":"Chain ko snapshot samjho, signal nahi"},"hook":{"en":"What could go wrong if you read a delayed option chain as live?","hn":"Agar delayed option chain ko live samajh lo toh kya problem ho sakti hai?"},"story":{"en":"A learner sees a premium that looks attractive, but the displayed quote is delayed or the bid/ask market has already moved. The apparent opportunity may no longer exist.","hn":"Learner ko premium attractive lagta hai, lekin quote delayed hai ya bid/ask market move kar chuka hai. Apparent opportunity ab shayad exist na kare."},"s":{"en":"Option-chain values can change quickly. Check whether data is live or delayed, note the timestamp, verify the underlying and expiry, and consider bid/ask, depth, lot size, charges and risk before any decision.","hn":"Option-chain values jaldi badal sakti hain. Data live hai ya delayed, timestamp, underlying aur expiry verify karo; kisi decision se pehle bid/ask, depth, lot size, charges aur risk consider karo."},"p":{"en":"This lesson uses hypothetical examples for education, not live market data or personalised trading advice.","hn":"Ye lesson education ke liye hypothetical examples use karta hai, live market data ya personalised trading advice nahi."},"think":{"en":"What is the safest interpretation of an option-chain snapshot?","hn":"Option-chain snapshot ko sabse safely kaise interpret karna chahiye?"},"reveal":{"en":"A time-sensitive view of listed contracts and quotes, not a guaranteed buy/sell signal.","hn":"Listed contracts aur quotes ka time-sensitive view, guaranteed buy/sell signal nahi."}},{"k":"info","t":{"en":"Use a repeatable reading checklist","hn":"Har baar ek reading checklist follow karo"},"hook":{"en":"Before drawing a conclusion, what should you verify first?","hn":"Conclusion nikalne se pehle sabse pehle kya verify karna chahiye?"},"story":{"en":"A learner checks the underlying, expiry, strike, call/put side, quote timestamp, bid/ask and liquidity before interpreting volume, OI or IV.","hn":"Learner volume, OI ya IV interpret karne se pehle underlying, expiry, strike, call/put side, quote timestamp, bid/ask aur liquidity check karta hai."},"s":{"en":"A practical checklist: (1) confirm underlying and expiry; (2) identify strike and call/put; (3) inspect bid/ask and spread; (4) check volume and OI separately; (5) read IV as variability, not direction; (6) confirm data freshness and contract specifications.","hn":"Practical checklist: (1) underlying aur expiry confirm karo; (2) strike aur call/put identify karo; (3) bid/ask aur spread dekho; (4) volume aur OI ko separately check karo; (5) IV ko variability samjho, direction nahi; (6) data freshness aur contract specifications confirm karo."},"p":{"en":"No single column explains the whole market. The next lesson, Option Greeks, builds on this vocabulary to explain how option prices can respond to different inputs.","hn":"Koi ek column poora market explain nahi karta. Next lesson Option Greeks isi vocabulary par build karega aur samjhayega ki option prices different inputs par kaise react kar sakte hain."},"think":{"en":"Which is the best first step when opening a new chain?","hn":"Nayi chain kholte waqt sabse achha first step kya hai?"},"reveal":{"en":"Verify the underlying, expiry and whether the displayed data is current.","hn":"Underlying, expiry aur displayed data current hai ya nahi verify karo."}},{"k":"mc","q":{"en":"What does a typical row in an option chain primarily organise?","hn":"Option chain ki typical row primarily kya organise karti hai?"},"o":[[{"en":"A strike for a selected underlying and expiry","hn":"Selected underlying aur expiry ka ek strike"},{"en":"Correct: strikes organise the listed call and put contracts.","hn":"Sahi: strikes listed call aur put contracts ko organise karte hain."}],[{"en":"A guaranteed trade recommendation","hn":"Guaranteed trade recommendation"},{"en":"An option chain displays contract information; it does not guarantee a trade outcome.","hn":"Option chain contract information dikhati hai; trade outcome guarantee nahi karti."}],[{"en":"Only the day’s closing price","hn":"Sirf din ka closing price"},{"en":"The chain can show multiple contract fields and changing quotes.","hn":"Chain multiple contract fields aur changing quotes dikha sakti hai."}]],"a":0},{"k":"mc","q":{"en":"Which comparison is most like-for-like?","hn":"Kaunsa comparison sabse zyada like-for-like hai?"},"o":[[{"en":"Different expiries and different strikes","hn":"Different expiries aur different strikes"},{"en":"Changing both fields makes it harder to isolate why premiums differ.","hn":"Dono fields change karne se premium difference ka reason isolate karna mushkil hota hai."}],[{"en":"Same underlying, option type, strike, expiry and relevant contract terms","hn":"Same underlying, option type, strike, expiry aur relevant contract terms"},{"en":"Correct: matching contract terms makes a premium comparison more meaningful.","hn":"Sahi: contract terms match karne se premium comparison meaningful hota hai."}],[{"en":"Any two contracts with similar displayed premiums","hn":"Koi bhi do contracts jinke displayed premiums similar hon"},{"en":"Similar prices do not mean the contracts have similar terms or risk.","hn":"Similar price ka matlab similar terms ya risk nahi."}]],"a":1},{"k":"mc","q":{"en":"Underlying is ₹104. Which call is generally ITM?","hn":"Underlying ₹104 hai. Kaunsa call aam taur par ITM hai?"},"o":[[{"en":"₹110 strike call","hn":"₹110 strike call"},{"en":"The underlying is below ₹110, so this call has no intrinsic value at that moment.","hn":"Underlying ₹110 se neeche hai, isliye is call ki us waqt intrinsic value nahi."}],[{"en":"Both calls must be ATM","hn":"Dono calls ATM hi honge"},{"en":"Moneyness depends on the underlying relative to each strike.","hn":"Moneyness underlying aur har strike ke relation par depend karti hai."}],[{"en":"₹100 strike call","hn":"₹100 strike call"},{"en":"Correct: the underlying is above the ₹100 call strike.","hn":"Sahi: underlying ₹100 call strike se upar hai."}]],"a":2},{"k":"mc","q":{"en":"Bid is ₹9.80 and ask is ₹10.20. What is the quoted spread?","hn":"Bid ₹9.80 aur ask ₹10.20 hai. Quoted spread kitna hai?"},"o":[[{"en":"₹20.00","hn":"₹20.00"},{"en":"Add neither the prices nor confuse the spread with the total.","hn":"Prices add mat karo aur spread ko total mat samjho."}],[{"en":"₹0.40","hn":"₹0.40"},{"en":"Correct: ₹10.20 ask minus ₹9.80 bid equals ₹0.40.","hn":"Sahi: ₹10.20 ask minus ₹9.80 bid = ₹0.40."}],[{"en":"₹9.80","hn":"₹9.80"},{"en":"The bid is one side of the quote, not the spread.","hn":"Bid quote ki ek side hai, spread nahi."}]],"a":1},{"k":"mc","q":{"en":"Which field counts contracts traded during a period?","hn":"Ek period mein trade hue contracts kaun count karta hai?"},"o":[[{"en":"Open interest","hn":"Open interest"},{"en":"Open interest tracks outstanding contracts, not all trades during the period.","hn":"Open interest outstanding contracts track karta hai, period ke saare trades nahi."}],[{"en":"Strike price","hn":"Strike price"},{"en":"Strike is a contract term, not an activity count.","hn":"Strike contract term hai, activity count nahi."}],[{"en":"Volume","hn":"Volume"},{"en":"Correct: volume counts trading activity over the selected period.","hn":"Sahi: volume selected period ki trading activity count karta hai."}]],"a":2},{"k":"mc","q":{"en":"What does open interest represent?","hn":"Open interest kya represent karta hai?"},"o":[[{"en":"Outstanding contracts still open at a point in time","hn":"Ek waqt par abhi open outstanding contracts"},{"en":"Correct: open interest is a count of outstanding contracts under market conventions.","hn":"Sahi: market conventions ke hisaab se open interest outstanding contracts ki count hai."}],[{"en":"The number of unique people trading","hn":"Trade karne wale unique logon ki sankhya"},{"en":"Open interest is not a unique-trader headcount.","hn":"Open interest unique traders ki headcount nahi hai."}],[{"en":"The total premium paid by all buyers","hn":"Sab buyers ka total premium paid"},{"en":"Open interest counts contracts, not the total premium value.","hn":"Open interest contracts count karta hai, total premium value nahi."}]],"a":0},{"k":"mc","q":{"en":"Volume rises while open interest barely changes. What can you conclude?","hn":"Volume badhta hai lekin open interest lagbhag same hai. Kya conclusion nikal sakte hain?"},"o":[[{"en":"The market is certainly bullish","hn":"Market pakka bullish hai"},{"en":"Volume and OI alone do not establish directional intent.","hn":"Sirf volume aur OI directional intent establish nahi karte."}],[{"en":"Trading activity increased, but direction is not proven by that fact alone","hn":"Trading activity badhi, lekin sirf is fact se direction prove nahi hoti"},{"en":"Correct: volume measures activity; OI change and direction need careful context.","hn":"Sahi: volume activity measure karta hai; OI change aur direction ke liye context chahiye."}],[{"en":"Every new trade must create new open interest","hn":"Har naya trade open interest zaroor badhata hai"},{"en":"Trades can open, close or transfer positions under market rules.","hn":"Market rules ke hisaab se trades positions open, close ya transfer kar sakte hain."}]],"a":1},{"k":"mc","q":{"en":"What does implied volatility alone tell you?","hn":"Implied volatility akeli kya batati hai?"},"o":[[{"en":"The exact direction of the next move","hn":"Next move ki exact direction"},{"en":"IV is not a directional guarantee.","hn":"IV directional guarantee nahi hai."}],[{"en":"The guaranteed size of tomorrow’s move","hn":"Kal ke move ka guaranteed size"},{"en":"Implied volatility is a model-implied measure, not a guarantee of realised movement.","hn":"Implied volatility model-implied measure hai, realised movement ki guarantee nahi."}],[{"en":"Market-priced expected variability, not direction by itself","hn":"Market-priced expected variability, apne aap direction nahi"},{"en":"Correct: IV reflects priced-in variability and should be interpreted with context.","hn":"Sahi: IV priced-in variability reflect karti hai aur context ke saath interpret honi chahiye."}]],"a":2},{"k":"mc","q":{"en":"Why check the quote timestamp?","hn":"Quote ka timestamp kyun check karna chahiye?"},"o":[[{"en":"Because displayed quotes can be delayed or stale","hn":"Kyuki displayed quotes delayed ya stale ho sakte hain"},{"en":"Correct: a stale quote may no longer reflect executable market prices.","hn":"Sahi: stale quote ab executable market prices reflect nahi kar sakta."}],[{"en":"It guarantees a profit","hn":"Ye profit guarantee karta hai"},{"en":"A timestamp does not guarantee price or outcome.","hn":"Timestamp price ya outcome guarantee nahi karta."}],[{"en":"It replaces checking the bid and ask","hn":"Ye bid aur ask check karne ki jagah le leta hai"},{"en":"Timestamp and quote quality are different checks.","hn":"Timestamp aur quote quality alag checks hain."}]],"a":0},{"k":"mc","q":{"en":"Which is a safer in
