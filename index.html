","hn":"Clearing ko sabse sahi tarah kaunsa statement describe karta hai?"},"o":[[{"en":"It determines and manages obligations from executed trades","hn":"Executed trades se bani obligations determine aur manage karta hai"},{"en":"Correct. Clearing and settlement are related but distinct.","hn":"Sahi. Clearing aur settlement related hain par alag hain."}],[{"en":"It means the investor has selected a password","hn":"Investor ne password select kiya"},{"en":"That is unrelated to clearing.","hn":"Iska clearing se relation nahi."}],[{"en":"It guarantees the trade will be profitable","hn":"Ye trade ko profitable guarantee karta hai"},{"en":"Clearing does not remove market risk or guarantee profit.","hn":"Clearing market risk khatam ya profit guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"What does settlement complete in a regular delivery trade?","hn":"Regular delivery trade mein settlement kya complete karta hai?"},"o":[[{"en":"The required delivery of funds and securities under the applicable cycle","hn":"Applicable cycle ke tahat funds aur securities ki required delivery"},{"en":"Correct. Settlement completes delivery under the relevant rules.","hn":"Sahi. Settlement relevant rules ke tahat delivery complete karta hai."}],[{"en":"The investor’s research on the company","hn":"Investor ki company research"},{"en":"Research may inform a decision, but it is not settlement.","hn":"Research decision mein help karti hai, par settlement nahi."}],[{"en":"A guarantee that the price will rise","hn":"Price badhne ki guarantee"},{"en":"Settlement is a transaction process, not a return guarantee.","hn":"Settlement transaction process hai, return guarantee nahi."}]],"a":0},{"k":"mc","q":{"en":"Under T+1, when does settlement generally occur?","hn":"T+1 ke tahat settlement aam taur par kab hota hai?"},"o":[[{"en":"On the next settlement business day after trade date","hn":"Trade date ke baad next settlement business day"},{"en":"Correct. Weekends and market holidays can affect the calendar.","hn":"Sahi. Weekend aur market holidays calendar ko affect karte hain."}],[{"en":"Always exactly 24 hours later","hn":"Hamesha exactly 24 ghante baad"},{"en":"T+1 is based on settlement business days, not a fixed 24-hour clock.","hn":"T+1 settlement business days par based hai, fixed 24-hour clock par nahi."}],[{"en":"Only after one full month","hn":"Sirf ek mahine baad"},{"en":"That is not the T+1 meaning.","hn":"T+1 ka matlab ye nahi."}]],"a":0},{"k":"mc","q":{"en":"Which statement about optional T+0 is correct?","hn":"Optional T+0 ke baare mein kaunsa statement sahi hai?"},"o":[[{"en":"It is available only where current eligibility and arrangements allow it","hn":"Sirf wahan available hai jahan current eligibility aur arrangements allow karein"},{"en":"Correct. It is optional and not universal across all securities and trades.","hn":"Sahi. Ye optional hai aur har security/trade ke liye universal nahi."}],[{"en":"Every share and broker must offer it for every trade","hn":"Har share aur broker ko har trade mein offer karna hi hoga"},{"en":"Availability depends on the applicable framework and participation.","hn":"Availability applicable framework aur participation par depend karti hai."}],[{"en":"T+0 means the market has no risk","hn":"T+0 ka matlab market mein risk nahi"},{"en":"Settlement speed does not remove investment or market risk.","hn":"Settlement speed investment ya market risk khatam nahi karti."}]],"a":0},{"k":"mc","q":{"en":"What should you verify before placing a delivery or intraday order?","hn":"Delivery ya intraday order se pehle kya verify karna chahiye?"},"o":[[{"en":"Selected product type, order details and broker rules","hn":"Selected product type, order details aur broker rules"},{"en":"Correct. The product affects how a position is handled.","hn":"Sahi. Product position handling ko affect karta hai."}],[{"en":"Only the app colour","hn":"Sirf app ka colour"},{"en":"Visual design does not explain the product’s trading rules.","hn":"Visual design trading rules nahi batata."}],[{"en":"Assume every buy becomes long-term holding","hn":"Maan lo har buy long-term holding banega"},{"en":"Do not assume; confirm the product type and applicable rules.","hn":"Assume mat karo; product type aur applicable rules confirm karo."}]],"a":0},{"k":"mc","q":{"en":"Your order requested 10 shares, but only 8 executed. Which quantity should you start with when reconciling the trade?","hn":"Order 10 shares ka tha, par 8 execute hue. Trade reconcile karte waqt kis quantity se shuru karoge?"},"o":[[{"en":"The executed quantity of 8, then verify settlement/holding records","hn":"Executed quantity 8, phir settlement/holding records verify karo"},{"en":"Correct. The unfilled remainder may have a separate order status.","hn":"Sahi. Unfilled remainder ka order status alag ho sakta hai."}],[{"en":"Always the original 10 regardless of execution","hn":"Execution chahe jo ho, hamesha original 10"},{"en":"Requested quantity and executed quantity can differ.","hn":"Requested quantity aur executed quantity alag ho sakti hain."}],[{"en":"Zero, because no order can partially execute","hn":"Zero, kyunki partial execution possible nahi"},{"en":"Partial fills can occur; check actual trade records.","hn":"Partial fills ho sakte hain; actual trade records check karo."}]],"a":0},{"k":"mc","q":{"en":"Which practice best protects you when a trade or holding looks wrong?","hn":"Trade ya holding galat lage toh kaunsi practice best hai?"},"o":[[{"en":"Compare official order/trade and demat records; report through official channels","hn":"Official order/trade aur demat records compare karo; official channels se report karo"},{"en":"Correct. Keep evidence and never share credentials.","hn":"Sahi. Evidence sambhalo aur credentials kabhi share mat karo."}],[{"en":"Send your OTP to a stranger who promises a fix","hn":"Fix ka promise karne wale stranger ko OTP bhejo"},{"en":"Never share OTPs, passwords or TPINs.","hn":"OTP, password ya TPIN kabhi share mat karo."}],[{"en":"Ignore the discrepancy permanently","hn":"Discrepancy ko hamesha ignore karo"},{"en":"Investigate and report discrepancies promptly using official channels.","hn":"Discrepancy ko investigate karo aur official channels se jaldi report karo."}]],"a":0},{"k":"mc","q":{"en":"Which statement correctly separates order, execution and settlement?","hn":"Order, execution aur settlement ka sahi difference kya hai?"},"o":[[{"en":"Order is an instruction; execution is a matched trade; settlement delivers funds/securities","hn":"Order instruction hai; execution matched trade hai; settlement funds/securities deliver karta hai"},{"en":"Correct. These are distinct stages of a transaction.","hn":"Sahi. Ye transaction ke alag stages hain."}],[{"en":"All three mean exactly the same thing","hn":"Teeno ka exact same meaning hai"},{"en":"They refer to different stages and statuses.","hn":"Ye alag stages aur statuses ko refer karte hain."}],[{"en":"Settlement happens before an order exists","hn":"Order hone se pehle settlement hota hai"},{"en":"The process starts with an order; settlement follows an executed trade under applicable rules.","hn":"Process order se start hota hai; applicable rules ke tahat settlement executed trade ke baad aata hai."}]],"a":0},{"k":"end"}];
UNITS.x3=[{"k":"info","t":{"en":"Riya wants to buy—but at what price?","hn":"Riya ko buy karna hai—but kis price par?"},"hook":{"en":"Riya sees a share near ₹100. She wants to buy now, but she also does not want to pay too much. Which matters more: execution speed or price control?","hn":"Riya share ko ₹100 ke aas-paas dekhti hai. Woh abhi buy karna chahti hai, par zyada price bhi nahi dena chahti. Kya zyada zaroori hai: jaldi execution ya price control?"},"story":{"en":"Riya opens her broker app. The Buy button only sends an instruction. The order still has to be accepted and matched under the exchange rules.","hn":"Riya broker app kholti hai. Buy button sirf instruction bhejta hai. Order ko exchange rules ke mutabik accept aur match hona abhi baaki hai."},"s":{"en":"An order is an instruction to buy or sell a quantity under specified conditions. Order placement is not the same as execution, and execution is not the same as settlement.","hn":"Order ek instruction hai ki specified conditions par quantity buy ya sell karni hai. Order place hona, execute hona aur settle hona alag stages hain."},"p":{"en":"If Riya submits a buy order for 10 shares, that means she requested 10 shares—not that she definitely owns 10 shares yet.","hn":"Riya 10 shares ka buy order deti hai, iska matlab usne 10 shares maange—not ki uske paas pakka 10 shares aa gaye."},"think":{"en":"What must happen before an order becomes a trade?","hn":"Order trade banne se pehle kya hona chahiye?"},"reveal":{"en":"The order must be accepted and matched with a compatible order under applicable exchange rules; a fill can be partial.","hn":"Applicable exchange rules ke mutabik order accept hokar compatible order se match hona chahiye; fill partial bhi ho sakta hai."}},{"k":"info","t":{"en":"Market order: prioritise execution","hn":"Market order: execution ko priority"},"hook":{"en":"Riya says, “Mujhe trade jaldi chahiye; exact price se zyada execution important hai.” Which order type is designed to prioritise execution at available prices?","hn":"Riya kehti hai, “Mujhe trade jaldi chahiye; exact price se zyada execution important hai.” Available prices par execution ko priority dene ke liye kaunsa order bana hai?"},"story":{"en":"A market order seeks to buy or sell at the best available prices when it reaches the market, subject to liquidity, market conditions and exchange rules.","hn":"Market order market tak pahunchne par best available prices par buy/sell karne ki koshish karta hai; liquidity, market conditions aur exchange rules matter karte hain."},"s":{"en":"Market order prioritises execution, not a guaranteed final price. A large order or a fast market can lead to fills at multiple price levels.","hn":"Market order execution ko priority deta hai, final price guarantee nahi karta. Bada order ya fast market multiple price levels par fill kara sakta hai."},"p":{"en":"If a hypothetical order fills 5 shares at ₹100 and 5 at ₹101, the average fill price is (5×100 + 5×101) ÷ 10 = ₹100.50, before costs.","hn":"Agar example mein 5 shares ₹100 par aur 5 ₹101 par fill hon, average fill price (5×100 + 5×101) ÷ 10 = ₹100.50 hoga, charges se pehle."},"think":{"en":"Does a market order guarantee that every share fills at the last displayed price?","hn":"Kya market order guarantee karta hai ki har share last displayed price par hi fill hoga?"},"reveal":{"en":"No. The displayed price can change; liquidity and available orders affect execution.","hn":"Nahi. Displayed price badal sakta hai; liquidity aur available orders execution ko affect karte hain."}},{"k":"info","t":{"en":"Limit order: control your price","hn":"Limit order: apne price par control"},"hook":{"en":"Riya decides she will pay no more than ₹100. Sellers are currently asking ₹103. What should she understand about a limit buy?","hn":"Riya decide karti hai ki ₹100 se zyada nahi degi. Sellers abhi ₹103 maang rahe hain. Limit buy ke baare mein use kya samajhna chahiye?"},"story":{"en":"A buy limit sets the maximum price the buyer is willing to pay. A sell limit sets the minimum price the seller is willing to accept.","hn":"Buy limit buyer ka maximum acceptable price set karta hai. Sell limit seller ka minimum acceptable price set karta hai."},"s":{"en":"A limit order offers price discipline, but it may remain open or expire if the market does not reach the limit or sufficient quantity is unavailable.","hn":"Limit order price discipline deta hai, lekin market limit tak na aaye ya quantity na mile toh open reh sakta hai ya expire ho sakta hai."},"p":{"en":"Riya’s buy limit is ₹100 while the available ask is ₹103. Her order need not buy at ₹103; it may wait unfilled.","hn":"Riya ka buy limit ₹100 hai aur available ask ₹103 hai. Order ko ₹103 par buy nahi karna chahiye; woh unfilled wait kar sakta hai."},"think":{"en":"What is the trade-off of a limit order?","hn":"Limit order ka trade-off kya hai?"},"reveal":{"en":"Price control in exchange for the possibility that the trade may not happen.","hn":"Price control ke badle trade execute na hone ka chance."}},{"k":"info","t":{"en":"Stop-loss: trigger is not a guarantee","hn":"Stop-loss: trigger guarantee nahi"},"hook":{"en":"Riya owns a share bought at ₹100 and wants an exit instruction if price falls to a chosen level. Does a stop-loss guarantee the exact exit price?","hn":"Riya ne share ₹100 par kharida aur price ek level tak girne par exit instruction chahti hai. Kya stop-loss exact exit price guarantee karta hai?"},"story":{"en":"A stop order uses a trigger condition. Once triggered, the resulting order type and market conditions determine what happens next.","hn":"Stop order trigger condition use karta hai. Trigger hone ke baad resulting order type aur market conditions decide karte hain ki aage kya hoga."},"s":{"en":"A stop-market order can execute at a price different from the trigger. A stop-limit order adds a limit, but may not execute if the market moves beyond that limit. Exact availability and naming vary by broker/exchange.","hn":"Stop-market trigger se alag price par execute ho sakta hai. Stop-limit mein limit bhi hoti hai, lekin market us limit se aage nikal jaye toh execute na ho. Exact availability aur naming broker/exchange par depend karti hai."},"p":{"en":"Illustration: trigger ₹95, but after a sudden gap the next available prices are ₹92 and ₹91. A market-style triggered exit may fill below ₹95; this is not a prediction, just a risk example.","hn":"Example: trigger ₹95 hai, lekin sudden gap ke baad next available prices ₹92 aur ₹91 hain. Market-style triggered exit ₹95 se neeche fill ho sakta hai; ye prediction nahi, risk example hai."},"think":{"en":"Why is “stop-loss placed” not the same as “loss capped exactly at that price”?","hn":"“Stop-loss placed” ka matlab “loss exactly usi price par capped” kyun nahi?"},"reveal":{"en":"The trigger may activate an order, but actual execution depends on order type, liquidity and market gaps.","hn":"Trigger order activate kar sakta hai, lekin actual execution order type, liquidity aur market gap par depend karta hai."}},{"k":"info","t":{"en":"Bid, ask, spread and order book","hn":"Bid, ask, spread aur order book"},"hook":{"en":"The screen shows a best bid of ₹99 and a best ask of ₹101. Why might there be no immediate trade at those displayed prices?","hn":"Screen par best bid ₹99 aur best ask ₹101 hai. In displayed prices par turant trade kyun na ho?"},"story":{"en":"Bid is the price a buyer offers. Ask/offer is the price a seller asks. The order book displays eligible outstanding orders at different prices.","hn":"Bid buyer ka offered price hai. Ask/offer seller ka maanga hua price hai. Order book alag prices par eligible pending orders dikhata hai."},"s":{"en":"The bid–ask spread is best ask minus best bid. Orders may match if a buyer raises the bid to an available ask or a seller accepts an available bid, subject to priority and quantity.","hn":"Bid–ask spread = best ask minus best bid. Buyer available ask tak bid badhaye ya seller available bid accept kare toh priority aur quantity ke mutabik orders match ho sakte hain."},"p":{"en":"Best bid ₹99 and best ask ₹101 gives a spread of ₹2. Quotes and available quantities can change quickly.","hn":"Best bid ₹99 aur best ask ₹101 se spread ₹2 hota hai. Quotes aur available quantity jaldi badal sakti hai."},"think":{"en":"Are bid and ask always equal?","hn":"Kya bid aur ask hamesha equal hote hain?"},"reveal":{"en":"No. The spread is the gap between the best available bid and ask at that moment.","hn":"Nahi. Spread us waqt best available bid aur ask ke beech ka gap hai."}},{"k":"info","t":{"en":"Liquidity, volatility and slippage","hn":"Liquidity, volatility aur slippage"},"hook":{"en":"Riya tries to buy a large quantity, but only a few shares are offered near ₹100. Could her average execution price rise?","hn":"Riya badi quantity buy karna chahti hai, par ₹100 ke paas kuch hi shares available hain. Kya average execution price badh sakta hai?"},"story":{"en":"Liquidity describes how easily an asset can be traded without a large price impact. Volatility describes the extent and speed of price fluctuations. Slippage is the difference between an expected/trigger price and actual execution.","hn":"Liquidity batati hai ki asset ko bade price impact ke bina kitni aasani se trade kar sakte hain. Volatility price ke fluctuation ki magnitude aur speed hai. Slippage expected/trigger price aur actual execution ka difference hai."},"s":{"en":"These concepts are related but different. A thin order book or fast market may cause a market order to consume multiple price levels and receive a different average price.","hn":"Ye concepts related hain, par alag. Thin order book ya fast market mein market order multiple price levels consume kar sakta hai aur average price alag ho sakta hai."},"p":{"en":"Expected buy price ₹100 and actual average fill ₹101.20 means ₹1.20 per share of buy-side slippage relative to that expectation, before costs.","hn":"Expected buy price ₹100 aur actual average fill ₹101.20 ho toh us expectation ke comparison mein ₹1.20 per share buy-side slippage hai, charges se pehle."},"think":{"en":"Does a narrow spread guarantee low slippage for every order size?","hn":"Kya narrow spread har order size ke liye low slippage guarantee karta hai?"},"reveal":{"en":"No. Available depth, order size, speed and market conditions also matter.","hn":"Nahi. Available depth, order size, speed aur market conditions bhi matter karte hain."}},{"k":"info","t":{"en":"Partial fills and order status","hn":"Partial fill aur order status"},"hook":{"en":"Riya submits an order for 100 shares, but only 40 execute. Has she bought 100 shares?","hn":"Riya 100 shares ka order deti hai, lekin sirf 40 execute hote hain. Kya usne 100 shares kharid liye?"},"story":{"en":"A partial fill means only part of the requested quantity has executed. The remaining quantity may stay open or be cancelled/expire under its validity and applicable rules.","hn":"Partial fill ka matlab requested quantity ka sirf ek hissa execute hua. Baaki quantity validity aur rules ke mutabik open reh sakti hai ya cancel/expire ho sakti hai."},"s":{"en":"Inspect the status: open, partially filled, complete, rejected or cancelled. Requested quantity, executed quantity and remaining quantity are different fields.","hn":"Status dekho: open, partially filled, complete, rejected ya cancelled. Requested quantity, executed quantity aur remaining quantity alag cheezein hain."},"p":{"en":"For an order of 100 shares with 40 executed, remaining quantity = 100 − 40 = 60 shares, unless later executed or cancelled.","hn":"100 shares ke order mein 40 execute hue, toh remaining quantity = 100 − 40 = 60 shares, jab tak baad mein execute ya cancel na ho."},"think":{"en":"If the app says “partially filled”, how many shares have definitely executed in this example?","hn":"Agar app “partially filled” dikhata hai, toh is example mein kitne shares definitely execute hue?"},"reveal":{"en":"40 shares. Check updated order status before taking any further action.","hn":"40 shares. Aage kuch karne se pehle updated order status check karo."}},{"k":"info","t":{"en":"Validity, rejection and exchange controls","hn":"Validity, rejection aur exchange controls"},"hook":{"en":"Riya places a Day order that remains unfilled. Should she assume it will remain active forever?","hn":"Riya Day order lagati hai jo unfilled rehta hai. Kya woh assume kare ki order hamesha active rahega?"},"story":{"en":"Order validity defines how long an order can remain active. Day orders generally expire at the end of the relevant trading session if unexecuted; other validity options depend on current broker/exchange support.","hn":"Order validity batati hai order kitni der active reh sakta hai. Day order aam taur par relevant trading session ke end par unexecuted rehne par expire hota hai; doosre options current broker/exchange support par depend karte hain."},"s":{"en":"Orders can also be rejected for reasons such as invalid parameters, insufficient funds/margin or applicable trading controls. Some securities have price bands or other exchange-defined controls. Read the exact rejection message.","hn":"Invalid parameters, insufficient funds/margin ya trading controls ki wajah se order reject ho sakta hai. Kuch securities par price bands ya exchange-defined controls hote hain. Exact rejection message padho."},"p":{"en":"Never assume a rejected order is active. Verify status in the order book and check the reason before deciding what to do next.","hn":"Rejected order ko active assume mat karo. Order book mein status verify karo aur next decision se pehle reason dekho."},"think":{"en":"What should you do after an order rejection?","hn":"Order reject hone ke baad kya karna chahiye?"},"reveal":{"en":"Check the status and reason, verify details and funds, and only then decide whether to amend or submit another order. Avoid blind repeat orders.","hn":"Status aur reason check karo, details/funds verify karo, phir amend ya naya order decide karo. Bina soche repeat order mat bhejo."}},{"k":"info","t":{"en":"Choose the order by understanding the trade-off","hn":"Trade-off samajhkar order choose karo"},"hook":{"en":"Riya has two different goals: one trade where price control matters most, and another where timely execution matters more. Should she use the same order automatically for both?","hn":"Riya ke do alag goals hain: ek trade mein price control sabse important hai, doosre mein timely execution. Kya dono mein automatically same order use kare?"},"story":{"en":"There is no universally best order type. Market orders prioritise execution at available prices; limit orders impose a price boundary; stop orders trigger under specified conditions. Each has risks and limitations.","hn":"Koi ek order type har situation mein best nahi. Market order available prices par execution ko priority deta hai; limit order price boundary lagata hai; stop order specified condition par trigger hota hai. Har ek ki limitations hain."},"s":{"en":"Before submitting, confirm symbol, buy/sell side, quantity, order type, price/trigger, product, validity and estimated funds. Learn the broker’s current order definitions.","hn":"Submit karne se pehle symbol, buy/sell, quantity, order type, price/trigger, product, validity aur estimated funds check karo. Broker ki current order definitions samjho."},"p":{"en":"A limit order can help avoid paying above your chosen buy limit, but it cannot promise that you will get the shares. A stop trigger cannot promise the exact exit price.","hn":"Limit order chosen buy limit se upar pay karne se bachane mein help karta hai, par shares milna promise nahi. Stop trigger exact exit price promise nahi karta."},"think":{"en":"What is the safest general habit before tapping Submit?","hn":"Submit dabane se pehle best general habit kya hai?"},"reveal":{"en":"Review every order field, understand the order type and its failure modes, then verify the resulting order status.","hn":"Har order field review karo, order type aur uske failure modes samjho, phir resulting status verify karo."}},{"k":"mc","q":{"en":"Which order type sets a maximum price a buyer is willing to pay?","hn":"Kaunsa order buyer ka maximum acceptable price set karta hai?"},"o":[[{"en":"A buy limit order","hn":"Buy limit order"},{"en":"Correct. It sets a maximum buy price, but may not execute.","hn":"Sahi. Maximum buy price set karta hai, par execute hona guaranteed nahi."}],[{"en":"A market order","hn":"Market order"},{"en":"A market order prioritises execution at available prices.","hn":"Market order available prices par execution ko priority deta hai."}],[{"en":"A stop trigger alone","hn":"Sirf stop trigger"},{"en":"A trigger is not the same as a buy limit price.","hn":"Trigger aur buy limit price same nahi."}]],"a":0},{"k":"mc","q":{"en":"The best bid is ₹99 and best ask is ₹101. What is the spread?","hn":"Best bid ₹99 aur best ask ₹101 hai. Spread kitna hai?"},"o":[[{"en":"₹2","hn":"₹2"},{"en":"Correct: ₹101 − ₹99 = ₹2.","hn":"Sahi: ₹101 − ₹99 = ₹2."}],[{"en":"₹200","hn":"₹200"},{"en":"Subtract the prices; do not multiply them.","hn":"Prices subtract karo, multiply nahi."}],[{"en":"₹1","hn":"₹1"},{"en":"The gap is two rupees.","hn":"Gap do rupaye ka hai."}]],"a":0},{"k":"mc","q":{"en":"A market order for 100 shares fills 60 shares. What is the remaining quantity?","hn":"100 shares ka market order 60 shares fill karta hai. Remaining quantity kitni hai?"},"o":[[{"en":"40 shares","hn":"40 shares"},{"en":"Correct: 100 − 60 = 40.","hn":"Sahi: 100 − 60 = 40."}],[{"en":"60 shares","hn":"60 shares"},{"en":"That is the executed quantity.","hn":"Ye executed quantity hai."}],[{"en":"100 shares","hn":"100 shares"},{"en":"That is the original requested quantity.","hn":"Ye original requested quantity hai."}]],"a":0},{"k":"mc","q":{"en":"What does slippage describe?","hn":"Slippage kya describe karta hai?"},"o":[[{"en":"Difference between expected/trigger price and actual execution price","hn":"Expected/trigger price aur actual execution price ka difference"},{"en":"Correct. It can be positive or negative relative to the expectation.","hn":"Sahi. Expectation ke comparison mein ye favourable ya adverse ho sakta hai."}],[{"en":"A guaranteed trading fee","hn":"Guaranteed trading fee"},{"en":"Fees and slippage are different concepts.","hn":"Fees aur slippage alag concepts hain."}],[{"en":"The number of shares held in demat","hn":"Demat mein shares ki sankhya"},{"en":"That is a holding quantity.","hn":"Woh holding quantity hai."}]],"a":0},{"k":"mc","q":{"en":"Does a stop-loss guarantee an exact exit price?","hn":"Kya stop-loss exact exit price guarantee karta hai?"},"o":[[{"en":"No; trigger and execution can differ","hn":"Nahi; trigger aur execution alag ho sakte hain"},{"en":"Correct. Gaps, liquidity and order type matter.","hn":"Sahi. Gaps, liquidity aur order type matter karte hain."}],[{"en":"Yes, in every market","hn":"Haan, har market mein"},{"en":"Fast markets and gaps can cause different execution.","hn":"Fast market aur gaps se execution alag ho sakta hai."}],[{"en":"Yes, if the app is open","hn":"Haan, app khula ho toh"},{"en":"An open app does not guarantee execution price.","hn":"App khula hone se execution price guarantee nahi hota."}]],"a":0},{"k":"mc","q":{"en":"What does “partially filled” mean?","hn":"“Partially filled” ka kya matlab hai?"},"o":[[{"en":"Only some of the requested quantity has executed","hn":"Requested quantity ka sirf kuch hissa execute hua"},{"en":"Correct. Check executed and remaining quantities.","hn":"Sahi. Executed aur remaining quantity check karo."}],[{"en":"The whole order completed","hn":"Poora order complete ho gaya"},{"en":"That would be a complete fill.","hn":"Woh complete fill hota."}],[{"en":"The order is guaranteed to fill later","hn":"Order baad mein pakka fill hoga"},{"en":"The remainder may stay open, expire or be cancelled.","hn":"Baaki open reh sakta hai, expire ya cancel ho sakta hai."}]],"a":0},{"k":"mc","q":{"en":"A buy limit is ₹100 but available sellers ask ₹103. What may happen?","hn":"Buy limit ₹100 hai, par sellers ₹103 maang rahe hain. Kya ho sakta hai?"},"o":[[{"en":"The order may remain unfilled","hn":"Order unfilled reh sakta hai"},{"en":"Correct. The limit controls price, not fill certainty.","hn":"Sahi. Limit price control karti hai, fill certainty nahi."}],[{"en":"It must buy at ₹103","hn":"Use ₹103 par kharidna hi hoga"},{"en":"That would exceed the stated buy limit.","hn":"Ye stated buy limit se zyada hoga."}],[{"en":"The exchange guarantees a refund","hn":"Exchange refund guarantee karta hai"},{"en":"No such guarantee follows from a limit order.","hn":"Limit order se aisi guarantee nahi milti."}]],"a":0},{"k":"mc","q":{"en":"Why can a large market order have an average price different from the last displayed price?","hn":"Bade market order ka average price last displayed price se alag kyun ho sakta hai?"},"o":[[{"en":"It can consume available quantities across multiple price levels","hn":"Woh multiple price levels par available quantity consume kar sakta hai"},{"en":"Correct. Order-book depth and market movement matter.","hn":"Sahi. Order-book depth aur market movement matter karte hain."}],[{"en":"The last price is always the guaranteed fill price","hn":"Last price hamesha guaranteed fill price hota hai"},{"en":"Displayed prices do not guarantee all fills.","hn":"Displayed prices sab fills guarantee nahi karte."}],[{"en":"Because market orders cannot execute","hn":"Kyunki market orders execute nahi ho sakte"},{"en":"Market orders can execute subject to market conditions.","hn":"Market conditions ke adheen market orders execute ho sakte hain."}]],"a":0},{"k":"mc","q":{"en":"A Day order is still unfilled at the end of its applicable session. What is generally expected?","hn":"Applicable session ke end par Day order unfilled hai. Aam taur par kya expected hai?"},"o":[[{"en":"It expires under the applicable order rules","hn":"Applicable order rules ke mutabik expire hota hai"},{"en":"Correct. Always verify status and broker/exchange rules.","hn":"Sahi. Status aur broker/exchange rules verify karo."}],[{"en":"It stays open forever","hn":"Hamesha open rehta hai"},{"en":"Day validity does not mean forever.","hn":"Day validity ka matlab hamesha nahi."}],[{"en":"It converts automatically into a market order","hn":"Automatically market order ban jaata hai"},{"en":"Do not assume automatic conversion.","hn":"Automatic conversion assume mat karo."}]],"a":0},{"k":"mc","q":{"en":"What should you do if an order is rejected?","hn":"Order reject ho toh kya karna chahiye?"},"o":[[{"en":"Check the rejection reason, order details and funds before taking another action","hn":"Doosra action lene se pehle rejection reason, details aur funds check karo"},{"en":"Correct. Avoid blind repeated orders.","hn":"Sahi. Bina soche repeated orders mat bhejo."}],[{"en":"Immediately submit the same order repeatedly","hn":"Turant wahi order baar-baar submit karo"},{"en":"Repeated submissions can create confusion or duplicate orders.","hn":"Repeated submissions se confusion ya duplicate orders ho sakte hain."}],[{"en":"Share your OTP with support","hn":"Support ko OTP share karo"},{"en":"Never share OTPs or credentials.","hn":"OTP ya credentials kabhi share mat karo."}]],"a":0},{"k":"mc","q":{"en":"Which statement best describes a limit order?","hn":"Limit order ko sabse achhe se kaunsa statement describe karta hai?"},"o":[[{"en":"It sets a price boundary but does not guarantee execution","hn":"Price boundary set karta hai, par execution guarantee nahi"},{"en":"Correct. Price control and fill certainty are different.","hn":"Sahi. Price control aur fill certainty alag hain."}],[{"en":"It guarantees the best possible price","hn":"Best possible price guarantee karta hai"},{"en":"The market may never reach the limit.","hn":"Market limit tak kabhi na aaye."}],[{"en":"It removes all trading risk","hn":"Saara trading risk hata deta hai"},{"en":"Order choice does not remove market risk.","hn":"Order choice market risk nahi hatati."}]],"a":0},{"k":"end"}];

UNITS.x4=[{"k":"info","t":{"en":"Share or bond: owner or lender?","hn":"Share ya bond: owner ya lender?"},"hook":{"en":"A company wants money to expand. One investor wants ownership; another wants to lend money under agreed terms. Are they buying the same thing?","hn":"Ek company ko expand karne ke liye paisa chahiye. Ek investor ownership chahta hai; doosra agreed terms par paisa lend karna chahta hai. Kya dono same cheez kharid rahe hain?"},"story":{"en":"Meera compares two offers from the same imaginary company: equity shares and a bond. Both relate to the company, but the legal and financial relationship is different.","hn":"Meera ek imaginary company ke do offers compare karti hai: equity shares aur bond. Dono company se related hain, lekin legal aur financial relationship alag hai."},"s":{"en":"An equity share generally represents ownership in a company. A bond is a debt instrument: the issuer borrows money and promises payments according to the bond terms. Shareholders and bondholders therefore have different rights and risks.","hn":"Equity share generally company mein ownership dikhata hai. Bond debt instrument hai: issuer paisa borrow karta hai aur bond terms ke mutabik payments ka promise karta hai. Isliye shareholders aur bondholders ke rights aur risks alag hote hain."},"p":{"en":"Think of a shop: a shareholder owns a small part of the business; a bondholder is a lender to the issuer. This is a simplified concept illustration, not an offer to invest.","hn":"Ek dukaan ka example lo: shareholder business ka chhota hissa own karta hai; bondholder issuer ko lender hota hai. Ye simplified concept illustration hai, investment offer nahi."},"think":{"en":"If the company performs well, does a bond automatically give you ownership?","hn":"Company achha perform kare toh kya bond automatically ownership deta hai?"},"reveal":{"en":"No. A bond is debt; a share represents ownership. Rights depend on the instrument’s legal terms.","hn":"Nahi. Bond debt hai; share ownership represent karta hai. Rights instrument ki legal terms par depend karte hain."}},{"k":"info","t":{"en":"Equity return is not a promise","hn":"Equity return promise nahi hai"},"hook":{"en":"Meera buys a share because she hopes the business will grow. Does that hope guarantee a higher share price or a dividend?","hn":"Meera share kharidti hai kyunki use business growth ki umeed hai. Kya isse higher share price ya dividend guarantee hota hai?"},"story":{"en":"A share price can reflect business results, future expectations, interest rates, broader market conditions and investor demand. The price may rise or fall even when one factor looks positive.","hn":"Share price business results, future expectations, interest rates, broader market conditions aur investor demand reflect kar sakta hai. Ek factor positive hone par bhi price upar ya neeche ja sakta hai."},"s":{"en":"Equity holders may benefit from price appreciation or dividends if declared, but neither is guaranteed. Shareholders also bear market risk and may lose some or all of the money invested.","hn":"Equity holders ko price appreciation ya declared dividend se benefit ho sakta hai, lekin dono guaranteed nahi. Shareholders market risk bhi bear karte hain aur invested amount ka kuch ya poora hissa lose kar sakte hain."},"p":{"en":"Illustration only: a share bought for ₹100 may later trade at ₹120, ₹80 or another price. These numbers are hypothetical, not current market data or a forecast.","hn":"Sirf illustration: ₹100 par kharida share baad mein ₹120, ₹80 ya kisi aur price par trade kar sakta hai. Ye hypothetical numbers hain—current market data ya forecast nahi."},"think":{"en":"Does buying a share mean the investor will definitely receive a dividend?","hn":"Share kharidne ka matlab kya investor ko dividend pakka milega?"},"reveal":{"en":"No. A dividend depends on the company’s declaration and applicable rules; it is not guaranteed.","hn":"Nahi. Dividend company ke declaration aur applicable rules par depend karta hai; guaranteed nahi hai."}},{"k":"info","t":{"en":"Read the bond’s basic terms","hn":"Bond ki basic terms padho"},"hook":{"en":"A bond advertisement shows a coupon rate and maturity date. Which details help you understand what the issuer has promised?","hn":"Bond advertisement coupon rate aur maturity date dikhata hai. Kaunse details issuer ke promise ko samajhne mein help karte hain?"},"story":{"en":"A bond has terms such as issuer, face value, coupon or interest terms, payment frequency, maturity, seniority/security where applicable, and redemption terms. The offer document or information memorandum contains important details.","hn":"Bond ke terms mein issuer, face value, coupon/interest terms, payment frequency, maturity, applicable seniority/security aur redemption terms ho sakte hain. Offer document ya information memorandum mein important details hoti hain."},"s":{"en":"The coupon is the stated interest formula or rate described in the bond terms. Maturity is the scheduled date when principal is due under those terms. Actual payment depends on the instrument and the issuer meeting its obligations.","hn":"Coupon bond terms mein diya stated interest formula ya rate hai. Maturity woh scheduled date hai jab terms ke mutabik principal due hota hai. Actual payment instrument aur issuer ke obligations meet karne par depend karta hai."},"p":{"en":"Hypothetical example: a ₹1,000 face-value bond with a 6% annual coupon may specify ₹60 annual interest before tax, if paid as described. Check the actual document for payment frequency, conditions and charges.","hn":"Hypothetical example: ₹1,000 face-value bond par 6% annual coupon ho toh terms ke mutabik ₹60 annual interest ho sakta hai, tax se pehle. Payment frequency, conditions aur charges actual document mein check karo."},"think":{"en":"Which document should you read before relying on a bond’s payment terms?","hn":"Bond ke payment terms par rely karne se pehle kaunsa document padhna chahiye?"},"reveal":{"en":"Read the current offer document/information memorandum and the specific bond terms; do not rely only on an advertisement.","hn":"Current offer document/information memorandum aur specific bond terms padho; sirf advertisement par rely mat karo."}},{"k":"info","t":{"en":"Coupon and yield are different","hn":"Coupon aur yield alag hain"},"hook":{"en":"An older bond pays a fixed coupon, but new bonds now offer higher rates. Why might someone pay less for the older bond?","hn":"Ek purana bond fixed coupon deta hai, lekin naye bonds ab higher rates offer karte hain. Koi purane bond ke liye kam price kyun de sakta hai?"},"story":{"en":"A bond’s coupon is a term of the instrument. Yield measures return relative to the price paid and the cash flows expected. Market price can change while the coupon terms remain the same.","hn":"Bond ka coupon instrument ki term hai. Yield paid price aur expected cash flows ke relative return measure karta hai. Coupon terms same rehne par bhi market price badal sakta hai."},"s":{"en":"When market interest rates rise, an existing lower-coupon bond may become less attractive and its market price may fall; when rates fall, its price may rise. The size of the effect depends on duration, credit and other factors.","hn":"Market interest rates badhne par existing lower-coupon bond kam attractive ho sakta hai aur uska market price gir sakta hai; rates girne par price badh sakta hai. Effect duration, credit aur doosre factors par depend karta hai."},"p":{"en":"Hypothetical comparison: the coupon printed on a bond does not reset merely because market rates change. Its yield at today’s price can change. This example is conceptual, not a live quote.","hn":"Hypothetical comparison: market rates badalne se bond par printed coupon automatically reset nahi hota. Aaj ke price par uska yield badal sakta hai. Ye conceptual example hai, live quote nahi."},"think":{"en":"If a bond’s market price falls while its coupon terms stay fixed, can its yield change?","hn":"Bond ka market price gire aur coupon terms fixed rahein, toh kya yield badal sakta hai?"},"reveal":{"en":"Yes. Yield depends on the price paid and expected cash flows, not only on the coupon rate.","hn":"Haan. Yield paid price aur expected cash flows par depend karta hai, sirf coupon rate par nahi."}},{"k":"info","t":{"en":"Issuer risk and ratings","hn":"Issuer risk aur ratings"},"hook":{"en":"A bond is labelled “rated”. Does that mean repayment is guaranteed?","hn":"Bond par “rated” likha hai. Kya iska matlab repayment guaranteed hai?"},"story":{"en":"Credit risk is the possibility that an issuer may delay or fail to make interest or principal payments. A credit rating expresses a rating agency’s opinion under its rating framework; it is not a guarantee.","hn":"Credit risk ka matlab issuer interest ya principal payment delay kar sakta hai ya fail ho sakta hai. Credit rating rating agency ki framework ke under opinion hoti hai; guarantee nahi."},"s":{"en":"Consider the issuer’s financial condition, rating rationale and changes, security/collateral and ranking where applicable, covenants, liquidity, maturity and concentration. Even a higher rating does not remove all risk or prevent a downgrade.","hn":"Issuer ki financial condition, rating rationale aur changes, applicable security/collateral aur ranking, covenants, liquidity, maturity aur concentration dekho. Higher rating bhi saara risk khatam nahi karti aur downgrade ko prevent nahi karti."},"p":{"en":"A rating is one input in due diligence, not a substitute for reading the terms or understanding the risk of loss.","hn":"Rating due diligence ka ek input hai, terms padhne ya loss risk samajhne ka substitute nahi."},"think":{"en":"Does a credit rating guarantee that every payment will be made on time?","hn":"Kya credit rating guarantee karti hai ki har payment time par hoga?"},"reveal":{"en":"No. A rating is an opinion on credit risk, not a repayment guarantee.","hn":"Nahi. Rating credit risk par opinion hai, repayment guarantee nahi."}},{"k":"info","t":{"en":"Government and corporate debt are not identical","hn":"Government aur corporate debt same nahi"},"hook":{"en":"Two bonds show similar yields, but one is issued by a government and one by a company. Is issuer identity irrelevant?","hn":"Do bonds ka yield similar hai, lekin ek government aur ek company ne issue kiya. Kya issuer identity irrelevant hai?"},"story":{"en":"Different issuers have different credit, liquidity, legal and market risks. Government securities, corporate bonds and other debt instruments can also have different terms and trading conditions.","hn":"Alag issuers ke credit, liquidity, legal aur market risks alag hote hain. Government securities, corporate bonds aur doosre debt instruments ke terms aur trading conditions bhi alag ho sakte hain."},"s":{"en":"Do not treat “debt” as a synonym for “risk-free”. Consider sovereign/issuer risk, interest-rate risk, inflation risk, liquidity risk, reinvestment risk and the exact instrument terms.","hn":"“Debt” ko “risk-free” ka synonym mat samjho. Sovereign/issuer risk, interest-rate risk, inflation risk, liquidity risk, reinvestment risk aur exact instrument terms consider karo."},"p":{"en":"Two bonds with the same stated coupon may still differ in issuer quality, maturity, market price, liquidity and expected return.","hn":"Same stated coupon wale do bonds bhi issuer quality, maturity, market price, liquidity aur expected return mein alag ho sakte hain."},"think":{"en":"Is every debt instrument automatically risk-free because it is not equity?","hn":"Kya equity na hone ki wajah se har debt instrument automatically risk-free hai?"},"reveal":{"en":"No. Debt has its own credit, interest-rate, liquidity and other risks.","hn":"Nahi. Debt mein credit, interest-rate, liquidity aur doosre risks hote hain."}},{"k":"info","t":{"en":"A bond can lose value before maturity","hn":"Maturity se pehle bond ki value gir sakti hai"},"hook":{"en":"An investor needs money before a bond matures. Can the sale price be lower than the purchase price?","hn":"Investor ko bond maturity se pehle paisa chahiye. Kya sale price purchase price se kam ho sakta hai?"},"story":{"en":"If a bond is sold in the secondary market, the price depends on available buyers and sellers, interest rates, credit outlook, remaining maturity and liquidity. A sale before maturity may produce a capital gain or loss.","hn":"Bond secondary market mein sell ho toh price available buyers/sellers, interest rates, credit outlook, remaining maturity aur liquidity par depend karta hai. Maturity se pehle sale par capital gain ya loss ho sakta hai."},"s":{"en":"A stated maturity value is not the same as a guaranteed market resale price before maturity. Some instruments may be difficult to sell quickly at a desired price.","hn":"Stated maturity value aur maturity se pehle guaranteed resale price same nahi. Kuch instruments ko desired price par jaldi sell karna mushkil ho sakta hai."},"p":{"en":"Before investing, ask when you may need the money and whether you can tolerate a price decline or limited liquidity. This is a learning prompt, not personalised advice.","hn":"Invest karne se pehle socho paisa kab chahiye aur price decline ya limited liquidity tolerate kar sakte ho ya nahi. Ye learning prompt hai, personalised advice nahi."},"think":{"en":"If you sell a bond before maturity, is the original purchase price guaranteed?","hn":"Bond maturity se pehle sell karne par original purchase price guaranteed hai?"},"reveal":{"en":"No. The secondary-market price may be higher or lower than your purchase price.","hn":"Nahi. Secondary-market price purchase price se zyada ya kam ho sakta hai."}},{"k":"info","t":{"en":"Compare instruments by terms, not slogans","hn":"Instruments ko terms se compare karo, slogans se nahi"},"hook":{"en":"One product advertises a “high return”; another lists a lower yield but clearer terms. What should a learner compare?","hn":"Ek product “high return” advertise karta hai; doosra lower yield ke saath clearer terms batata hai. Learner ko kya compare karna chahiye?"},"story":{"en":"Compare the issuer, legal claim, cash-flow terms, maturity, risks, liquidity, fees, tax treatment and whether the product fits the purpose. No single headline number tells the whole story.","hn":"Issuer, legal claim, cash-flow terms, maturity, risks, liquidity, fees, tax treatment aur product purpose se fit hai ya nahi—compare karo. Ek headline number poori story nahi batata."},"s":{"en":"Read current official exchange/issuer documents. If you need a personal recommendation, consider a suitably registered professional. This course provides general education and does not recommend a security.","hn":"Current official exchange/issuer documents padho. Personal recommendation chahiye toh suitably registered professional consider karo. Ye course general education deta hai, kisi security ko recommend nahi karta."},"p":{"en":"This lesson uses simplified hypothetical examples. Verify live prices, yields, ratings, charges and current legal/tax treatment from the relevant official documents before acting.","hn":"Is lesson mein simplified hypothetical examples hain. Action lene se pehle live prices, yields, ratings, charges aur current legal/tax treatment relevant official documents se verify karo."},"think":{"en":"What is the strongest basis for comparing two bonds?","hn":"Do bonds compare karne ka sabse strong basis kya hai?"},"reveal":{"en":"Their full terms, risks, price/yield, issuer and liquidity—not a slogan or rating alone.","hn":"Unke full terms, risks, price/yield, issuer aur liquidity—not sirf slogan ya rating."}},{"k":"mc","q":{"en":"Which statement best describes a share compared with a bond?","hn":"Bond ke comparison mein share ko best kaise describe karenge?"},"o":[[{"en":"A share generally represents ownership; a bond is debt","hn":"Share generally ownership hai; bond debt hai"},{"en":"Correct. The instruments create different rights and risks.","hn":"Sahi. Dono instruments ke rights aur risks alag hain."}],[{"en":"A bond always gives company ownership","hn":"Bond hamesha company ownership deta hai"},{"en":"No. A bond is a debt instrument.","hn":"Nahi. Bond debt instrument hai."}],[{"en":"Both guarantee a profit","hn":"Dono profit guarantee karte hain"},{"en":"Neither instrument guarantees an investment profit.","hn":"Koi bhi instrument profit guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"A company does not declare a dividend this year. Is that automatically a breach of every shareholder’s promise?","hn":"Company is saal dividend declare nahi karti. Kya ye har shareholder ke promise ka breach hai?"},"o":[[{"en":"No; dividends are not guaranteed and depend on declaration and applicable rules","hn":"Nahi; dividend guaranteed nahi, declaration aur rules par depend karta hai"},{"en":"Correct. A share does not promise a fixed dividend.","hn":"Sahi. Share fixed dividend promise nahi karta."}],[{"en":"Yes; every share must pay monthly interest","hn":"Haan; har share ko monthly interest dena hi hoga"},{"en":"Shares are not bonds with fixed coupon terms.","hn":"Shares fixed coupon wale bonds nahi hain."}],[{"en":"Only if the share price rises","hn":"Sirf share price badhne par"},{"en":"Price movement does not create a guaranteed dividend.","hn":"Price movement dividend guarantee nahi karta."}]],"a":0},{"k":"mc","q":{"en":"A bond has ₹1,000 face value and a hypothetical 6% annual coupon. What is 6% of face value for one year before tax, if paid as stated?","hn":"Bond ki face value ₹1,000 hai aur hypothetical annual coupon 6% hai. Terms ke mutabik ek saal ka 6% kitna hoga, tax se pehle?"},"o":[[{"en":"₹60","hn":"₹60"},{"en":"Correct. This is simple illustrative arithmetic; actual payment terms must be checked.","hn":"Sahi. Ye simple illustrative calculation hai; actual payment terms check karo."}],[{"en":"₹6","hn":"₹6"},{"en":"6% of ₹1,000 is ₹60.","hn":"₹1,000 ka 6% ₹60 hota hai."}],[{"en":"₹600","hn":"₹600"},{"en":"That would be 60% of face value.","hn":"Ye face value ka 60% hoga."}]],"a":0},{"k":"mc","q":{"en":"Market interest rates rise. What may happen to an existing lower-coupon bond’s market price, all else equal?","hn":"Market interest rates badhein toh existing lower-coupon bond ke market price ka kya ho sakta hai, baaki sab same rahe?"},"o":[[{"en":"It may fall","hn":"Gir sakta hai"},{"en":"Correct. Its fixed cash flows may look less attractive than new issues.","hn":"Sahi. Uske fixed cash flows naye issues ke comparison mein kam attractive lag sakte hain."}],[{"en":"It must double","hn":"Double hona hi chahiye"},{"en":"There is no such guarantee.","hn":"Aisi koi guarantee nahi."}],[{"en":"It cannot move before maturity","hn":"Maturity se pehle move nahi kar sakta"},{"en":"Bonds can trade at changing market prices.","hn":"Bonds changing market prices par trade kar sakte hain."}]],"a":0},{"k":"mc","q":{"en":"What does a credit rating do?","hn":"Credit rating kya karti hai?"},"o":[[{"en":"Expresses a rating agency’s opinion on credit risk","hn":"Credit risk par rating agency ki opinion deti hai"},{"en":"Correct. It is not a guarantee of repayment.","hn":"Sahi. Ye repayment guarantee nahi hai."}],[{"en":"Guarantees every payment","hn":"Har payment guarantee karti hai"},{"en":"Ratings do not eliminate default risk.","hn":"Rating default risk khatam nahi karti."}],[{"en":"Sets the bond’s resale price forever","hn":"Bond ka resale price hamesha ke liye set karti hai"},{"en":"Market prices can change.","hn":"Market prices badal sakte hain."}]],"a":0},{"k":"mc","q":{"en":"Which risk can affect a bond sold before maturity?","hn":"Maturity se pehle bond sell karne par kaunsa risk matter kar sakta hai?"},"o":[[{"en":"Market price may be below the purchase price","hn":"Market price purchase price se neeche ho sakta hai"},{"en":"Correct. Interest rates, credit outlook and liquidity can affect resale value.","hn":"Sahi. Interest rates, credit outlook aur liquidity resale value ko affect kar sakte hain."}],[{"en":"The original price is legally guaranteed in every case","hn":"Har case mein original price legally guaranteed hai"},{"en":"That is not a general rule.","hn":"Ye general rule nahi."}],[{"en":"Bond prices cannot change","hn":"Bond price change nahi ho sakta"},{"en":"Tradable bond prices can change.","hn":"Tradable bond prices badal sakte hain."}]],"a":0},{"k":"mc","q":{"en":"Which is the best way to compare two debt products?","hn":"Do debt products compare karne ka best tareeka kya hai?"},"o":[[{"en":"Read issuer, terms, risks, liquidity, price/yield, fees and current disclosures","hn":"Issuer, terms, risks, liquidity, price/yield, fees aur current disclosures padho"},{"en":"Correct. No single headline figure captures all risks.","hn":"Sahi. Ek headline figure saare risks nahi batata."}],[{"en":"Choose only the highest advertised coupon","hn":"Sirf highest advertised coupon choose karo"},{"en":"Coupon alone does not describe price, risk or liquidity.","hn":"Coupon akela price, risk ya liquidity nahi batata."}],[{"en":"Choose the highest rating without reading anything else","hn":"Bina kuch aur padhe highest rating choose karo"},{"en":"A rating is only one input.","hn":"Rating sirf ek input hai."}]],"a":0},{"k":"mc","q":{"en":"A bond is called “government” or “corporate”. What else should you verify?","hn":"Bond ko “government” ya “corporate” kaha gaya hai. Aur kya verify karna chahiye?"},"o":[[{"en":"The exact instrument terms, issuer, risks and official disclosures","hn":"Exact instrument terms, issuer, risks aur official disclosures"},{"en":"Correct. Labels do not replace due diligence.","hn":"Sahi. Labels due diligence ka substitute nahi."}],[{"en":"Nothing; all debt is risk-free","hn":"Kuch nahi; saara debt risk-free hai"},{"en":"Debt instruments can have different risks.","hn":"Debt instruments ke risks alag ho sakte hain."}],[{"en":"Only the logo colour","hn":"Sirf logo ka colour"},{"en":"Design does not establish the instrument’s risk.","hn":"Design instrument ka risk establish nahi karta."}]],"a":0},{"k":"mc","q":{"en":"The lesson shows a hypothetical bond example. What should you do before making a real decision?","hn":"Lesson hypothetical bond example dikhata hai. Real decision se pehle kya karna chahiye?"},"o":[[{"en":"Check current official documents and relevant professional advice if needed","hn":"Current official documents aur zaroorat par relevant professional advice check karo"},{"en":"Correct. Illustrations are not live quotes or personalised advice.","hn":"Sahi. Illustration live quote ya personalised advice nahi hota."}],[{"en":"Treat the example as today’s guaranteed offer","hn":"Example ko aaj ka guaranteed offer samjho"},{"en":"The example is conceptual, not a live offer.","hn":"Example conceptual hai, live offer nahi."}],[{"en":"Ignore the issuer’s terms","hn":"Issuer ke terms ignore karo"},{"en":"The terms are essential.","hn":"Terms essential hain."}]],"a":0},{"k":"end"}];
UNITS.x5=[{"k":"info","t":{"en":"A mutual fund pools money","hn":"Mutual fund paisa pool karta hai"},"hook":{"en":"You have a small amount to invest and do not want to choose each security yourself. What structure lets many investors pool money into a portfolio?","hn":"Aapke paas invest karne ke liye chhoti amount hai aur har security khud choose nahi karna chahte. Kaunsa structure kai investors ka paisa portfolio mein pool karta hai?"},"story":{"en":"A mutual fund collects money from investors by issuing units and invests according to the scheme’s stated objective and documents. A fund manager and investment process operate within the scheme’s rules.","hn":"Mutual fund investors se units issue karke paisa collect karta hai aur scheme ke stated objective aur documents ke mutabik invest karta hai. Fund manager aur investment process scheme rules ke andar kaam karte hain."},"s":{"en":"Pooling can provide access to a portfolio of assets, but diversification depends on what the scheme actually holds. The fund’s value can rise or fall, and returns are not guaranteed.","hn":"Pooling se assets ke portfolio tak access mil sakta hai, lekin diversification scheme ke actual holdings par depend karta hai. Fund ki value upar ya neeche ho sakti hai; return guaranteed nahi."},"p":{"en":"Think of a shared basket: each investor owns units representing a proportional interest in the scheme, not direct personal ownership of every security in the basket.","hn":"Shared basket socho: har investor ke paas units hote hain jo scheme mein proportional interest represent karte hain—not basket ki har security ka direct personal ownership."},"think":{"en":"Does a mutual fund remove all investment risk?","hn":"Kya mutual fund saara investment risk hata deta hai?"},"reveal":{"en":"No. Risk depends on the scheme’s holdings, strategy, costs and market conditions.","hn":"Nahi. Risk scheme ke holdings, strategy, costs aur market conditions par depend karta hai."}},{"k":"info","t":{"en":"NAV is a per-unit value, not a cheapness score","hn":"NAV per-unit value hai, cheapness score nahi"},"hook":{"en":"Fund A has NAV ₹10 and Fund B has NAV ₹100. Does that alone make Fund A cheaper or better?","hn":"Fund A ka NAV ₹10 aur Fund B ka ₹100 hai. Kya isse Fund A automatically cheaper ya better hai?"},"story":{"en":"NAV per unit reflects the scheme’s net asset value divided by units outstanding, calculated under applicable rules. A lower NAV does not by itself mean a scheme is cheaper, safer or more likely to grow.","hn":"NAV per unit scheme ki net asset value ko outstanding units se divide karke milta hai, applicable rules ke mutabik. Lower NAV apne aap scheme ko cheaper, safer ya zyada growth-worthy nahi banata."},"s":{"en":"What matters more includes portfolio, objective, costs, risk, performance relative to an appropriate benchmark, investment process and fit for the investor’s goal. Compare like with like.","hn":"Zyada important hain portfolio, objective, costs, risk, suitable benchmark ke against performance, investment process aur investor ke goal se fit. Similar products ko compare karo."},"p":{"en":"Illustration: investing ₹1,000 at NAV ₹10 gives 100 units before applicable costs; at NAV ₹100 it gives 10 units. The economic value depends on how the investment performs, not unit count alone.","hn":"Illustration: ₹1,000 ko NAV ₹10 par invest karne se applicable costs se pehle 100 units milte hain; NAV ₹100 par 10 units. Economic value performance par depend karti hai, sirf unit count par nahi."},"think":{"en":"Does a lower NAV automatically mean higher future returns?","hn":"Kya lower NAV automatically higher future returns deta hai?"},"reveal":{"en":"No. NAV level alone does not predict future performance.","hn":"Nahi. Sirf NAV level future performance predict nahi karta."}},{"k":"info","t":{"en":"Equity, debt and hybrid funds","hn":"Equity, debt aur hybrid funds"},"hook":{"en":"Two mutual funds both say “mutual fund”, but one mainly holds shares and the other mainly holds bonds. Should their risks be assumed identical?","hn":"Do mutual funds dono “mutual fund” hain, lekin ek mainly shares aur doosra mainly bonds rakhta hai. Kya dono ka risk same assume karna chahiye?"},"story":{"en":"Scheme categories and mandates matter. Equity-oriented funds, debt funds, hybrid funds and other categories can have different objectives, holdings, volatility and risks. The category name is only the start; read the scheme documents.","hn":"Scheme categories aur mandates matter karte hain. Equity-oriented funds, debt funds, hybrid funds aur doosri categories ke objectives, holdings, volatility aur risks alag ho sakte hain. Category name sirf shuruaat hai; scheme documents padho."},"s":{"en":"Debt funds can face interest-rate, credit and liquidity risks; equity funds face equity-market risks; hybrid funds combine exposures in the proportions and manner described by their mandate. No category guarantees a return.","hn":"Debt funds mein interest-rate, credit aur liquidity risks ho sakte hain; equity funds equity-market risks face karte hain; hybrid funds mandate ke mutabik exposures combine karte hain. Koi category return guarantee nahi karti."},"p":{"en":"A fund label does not replace the latest portfolio disclosure, scheme information document, key information memorandum and Riskometer.","hn":"Fund label latest portfolio disclosure, scheme information document, key information memorandum aur Riskometer ka substitute nahi."},"think":{"en":"What should you read to understand what a fund may invest in?","hn":"Fund kis cheez mein invest kar sakta hai, ye samajhne ke liye kya padhein?"},"reveal":{"en":"Read the scheme mandate and current official scheme documents, not just the category name or advertisement.","hn":"Scheme mandate aur current official scheme documents padho, sirf category name ya advertisement nahi."}},{"k":"info","t":{"en":"Active and index funds","hn":"Active aur index funds"},"hook":{"en":"One fund’s manager selects investments; another aims to track an index. What is the key difference?","hn":"Ek fund ka manager investments select karta hai; doosra index track karne ka aim rakhta hai. Main difference kya hai?"},"story":{"en":"An active fund uses a management strategy to select or weight investments with the aim described in its mandate. An index fund generally aims to track an identified index, subject to tracking difference/error and fund costs.","hn":"Active fund mandate ke mutabik investments select ya weight karne ki management strategy use karta hai. Index fund generally identified index ko track karne ka aim rakhta hai, tracking difference/error aur costs ke subject mein."},"s":{"en":"An index fund does not guarantee the index’s return exactly. An active fund does not guarantee that its manager will outperform the benchmark. Compare objective, benchmark, costs, risk and consistency.","hn":"Index fund index ka return exactly guarantee nahi karta. Active fund manager benchmark ko outperform karega, ye bhi guaranteed nahi. Objective, benchmark, costs, risk aur consistency compare karo."},"p":{"en":"“Active” does not mean automatically better, and “index” does not mean risk-free. Both can fall when their underlying markets fall.","hn":"“Active” ka matlab automatically better nahi, aur “index” ka matlab risk-free nahi. Underlying market girne par dono gir sakte hain."},"think":{"en":"Does an index fund guarantee that your investment will match the index perfectly?","hn":"Kya index fund guarantee karta hai ki investment index ko perfectly match karega?"},"reveal":{"en":"No. Costs and tracking difference/error can cause performance to differ.","hn":"Nahi. Costs aur tracking difference/error se performance alag ho sakti hai."}},{"k":"info","t":{"en":"ETF versus a conventional mutual fund","hn":"ETF aur conventional mutual fund"},"hook":{"en":"You want to buy an index-tracking fund. One option trades on an exchange during market hours; another is transacted with the fund using its applicable process. What should you compare?","hn":"Aap index-tracking fund lena chahte hain. Ek option market hours mein exchange par trade hota hai; doosra fund ke applicable process se transact hota hai. Kya compare karein?"},"story":{"en":"An ETF is traded on an exchange like a listed security, so the traded price can move during the session and may differ from indicative/net asset value. Conventional open-ended mutual fund purchases/redemptions generally use applicable end-of-day NAV rules and cut-offs.","hn":"ETF listed security ki tarah exchange par trade hota hai, isliye session mein traded price move kar sakta hai aur indicative/net asset value se differ ho sakta hai. Conventional open-ended mutual fund purchase/redemption generally applicable end-of-day NAV rules aur cut-offs use karta hai."},"s":{"en":"ETFs may require a demat/trading setup and are subject to brokerage, bid–ask spread and liquidity considerations. Mutual fund schemes may have their own transaction process, exit load and other conditions. Check the current scheme and platform terms.","hn":"ETF ke liye demat/trading setup chahiye ho sakta hai aur brokerage, bid–ask spread aur liquidity matter karte hain. Mutual fund schemes ka apna transaction process, exit load aur conditions ho sakti hain. Current scheme aur platform terms check karo."},"p":{"en":"Do not assume every ETF is liquid or that every ETF trades exactly at NAV. Check trading volume, spread, tracking and product documents.","hn":"Har ETF liquid hai ya exactly NAV par trade karega, aisa assume mat karo. Trading volume, spread, tracking aur product documents check karo."},"think":{"en":"Can an ETF’s exchange price differ from its NAV?","hn":"Kya ETF ka exchange price uske NAV se differ kar sakta hai?"},"reveal":{"en":"Yes. Supply/demand, liquidity and market conditions can create a premium or discount.","hn":"Haan. Supply/demand, liquidity aur market conditions se premium ya discount ho sakta hai."}},{"k":"info","t":{"en":"SIP is a method, not a return guarantee","hn":"SIP ek method hai, return guarantee nahi"},"hook":{"en":"Someone says a monthly SIP makes losses impossible. Is that correct?","hn":"Koi kehta hai monthly SIP se loss impossible ho jata hai. Kya ye sahi hai?"},"story":{"en":"A Systematic Investment Plan (SIP) is a way to invest a specified amount at regular intervals into a mutual fund scheme. It describes the contribution method, not a separate asset or guaranteed-return product.","hn":"Systematic Investment Plan (SIP) mutual fund scheme mein regular intervals par specified amount invest karne ka tareeka hai. Ye contribution method batata hai, alag asset ya guaranteed-return product nahi."},"s":{"en":"Regular investing can spread purchase dates across market conditions, but it cannot ensure a profit, prevent losses or make an unsuitable scheme suitable. Units bought at different NAVs also do not remove market risk.","hn":"Regular investing se purchase dates alag market conditions mein spread ho sakti hain, lekin profit ensure nahi, loss prevent nahi aur unsuitable scheme suitable nahi ban jaati. Alag NAV par units kharidne se market risk khatam nahi hota."},"p":{"en":"Illustration only: ₹1,000 invested each month buys different unit quantities when NAV changes. The eventual result depends on the scheme’s performance, costs, duration and other factors.","hn":"Sirf illustration: NAV change hone par har month ₹1,000 se alag unit quantity mil sakti hai. Final result scheme performance, costs, duration aur doosre factors par depend karta hai."},"think":{"en":"Does a SIP guarantee profit because investments are spread over time?","hn":"Kya SIP time mein investments spread hone se profit guarantee karti hai?"},"reveal":{"en":"No. A SIP is a contribution method; the investment can still lose value.","hn":"Nahi. SIP contribution method hai; investment ki value phir bhi gir sakti hai."}},{"k":"info","t":{"en":"Fees and direct/regular plans","hn":"Fees aur direct/regular plans"},"hook":{"en":"Two plans invest in the same scheme portfolio but have different expense ratios. Why should you care about costs?","hn":"Do plans same scheme portfolio mein invest karte hain lekin expense ratio alag hai. Costs matter kyun karti hain?"},"story":{"en":"A scheme’s Total Expense Ratio (TER) represents specified operating and management expenses charged to the scheme under applicable rules. Such expenses affect the NAV and therefore investor outcomes over time.","hn":"Scheme ka Total Expense Ratio (TER) applicable rules ke under specified operating aur management expenses represent karta hai. Ye expenses NAV aur time ke saath investor outcome ko affect karte hain."},"s":{"en":"Direct and regular plans of a scheme generally have the same underlying portfolio but different distribution arrangements and expense structures. Compare the current TER and understand the service/distribution route; lower cost alone does not establish suitability.","hn":"Scheme ke direct aur regular plans ka underlying portfolio generally same hota hai, lekin distribution arrangement aur expense structure alag hote hain. Current TER compare karo aur service/distribution route samjho; sirf lower cost suitability establish nahi karti."},"p":{"en":"TER can change. Check the scheme’s current disclosure and official AMFI/AMC information instead of memorising an old percentage.","hn":"TER badal sakta hai. Purana percentage yaad karne ke bajay scheme ka current disclosure aur official AMFI/AMC information check karo."},"think":{"en":"What should you compare before assuming a plan is lower-cost?","hn":"Plan lower-cost assume karne se pehle kya compare karna chahiye?"},"reveal":{"en":"Compare current disclosed TER, transaction costs where relevant and the actual services/distribution route.","hn":"Current disclosed TER, relevant transaction costs aur actual services/distribution route compare karo."}},{"k":"info","t":{"en":"Riskometer, factsheet and scheme documents","hn":"Riskometer, factsheet aur scheme documents"},"hook":{"en":"A fund’s recent return looks attractive. Which documents help you understand the risk and what the fund actually owns?","hn":"Fund ka recent return attractive lagta hai. Risk aur actual holdings samajhne ke liye kaunse documents help karte hain?"},"story":{"en":"Use the current Riskometer, scheme information document (SID), key information memorandum (KIM), factsheet and portfolio disclosures. They describe different aspects such as risk level, objective, strategy, costs, holdings and performance context.","hn":"Current Riskometer, scheme information document (SID), key information memorandum (KIM), factsheet aur portfolio disclosures use karo. Ye risk level, objective, strategy, costs, holdings aur performance context jaise alag aspects batate hain."},"s":{"en":"A Riskometer is a risk indicator, not a personal suitability approval or guarantee. Past performance is not a promise of future returns. Compare performance with an appropriate benchmark and check dates and assumptions.","hn":"Riskometer risk indicator hai, personal suitability approval ya guarantee nahi. Past performance future returns ka promise nahi. Appropriate benchmark se performance compare karo aur dates/assumptions check karo."},"p":{"en":"Current documents matter because portfolios, risk levels, fees and market conditions can change. Avoid screenshots without dates or unverified social-media claims.","hn":"Current documents matter karte hain kyunki portfolios, risk levels, fees aur market conditions badal sakte hain. Bina date ke screenshots ya unverified social-media claims avoid karo."},"think":{"en":"Does a Riskometer guarantee that the fund is suitable for every investor?","hn":"Kya Riskometer guarantee karta hai ki fund har investor ke liye suitable hai?"},"reveal":{"en":"No. It communicates scheme risk; personal goals, time horizon and ability to bear loss also matter.","hn":"Nahi. Ye scheme risk communicate karta hai; personal goals, time horizon aur loss bear karne ki ability bhi matter karti hai."}},{"k":"info","t":{"en":"Diversification helps, but cannot remove every risk","hn":"Diversification help karti hai, har risk nahi hataati"},"hook":{"en":"A fund owns 30 companies, but most are in one industry. Is the portfolio automatically well-diversified?","hn":"Fund 30 companies own karta hai, lekin zyada tar ek industry mein hain. Kya portfolio automatically well-diversified hai?"},"story":{"en":"Diversification spreads exposure across assets, issuers, sectors or other risk sources. The actual degree depends on holdings and correlations; a large number of holdings alone does not guarantee broad diversification.","hn":"Diversification assets, issuers, sectors ya doosre risk sources mein exposure spread karti hai. Actual degree holdings aur correlations par depend karta hai; sirf holdings ki badi count broad diversification guarantee nahi karti."},"s":{"en":"Diversification can reduce some concentration risk but cannot eliminate broad market risk, liquidity risk, credit risk or losses. Read the portfolio disclosures and understand the strategy.","hn":"Diversification kuch concentration risk kam kar sakti hai, lekin broad market risk, liquidity risk, credit risk ya losses eliminate nahi karti. Portfolio disclosures padho aur strategy samjho."},"p":{"en":"A fund with many closely related holdings may still be exposed to the same market shock.","hn":"Bahut saari closely related holdings wala fund bhi same market shock se exposed ho sakta hai."},"think":{"en":"Does owning many securities automatically eliminate investment risk?","hn":"Kya bahut securities own karne se investment risk automatically khatam ho jata hai?"},"reveal":{"en":"No. Diversification can reduce some risks, but it cannot eliminate all risks or guarantee gains.","hn":"Nahi. Diversification kuch risks reduce kar sakti hai, lekin saare risks ya gains guarantee nahi karti."}},{"k":"info","t":{"en":"Check redemption, exit load and tax separately","hn":"Redemption, exit load aur tax alag check karo"},"hook":{"en":"You may need your money before you expected. Is every fund redemption instant, free and taxed the same way?","hn":"Aapko expected se pehle paisa chahiye. Kya har fund redemption instant, free aur same tax treatment wala hota hai?"},"story":{"en":"Redemption timelines, cut-offs, exit loads, settlement processes and restrictions depend on the scheme, transaction and applicable rules. Tax treatment may differ by fund type, acquisition/redemption dates and the law applying to the relevant tax year.","hn":"Redemption timeline, cut-offs, exit load, settlement process aur restrictions scheme, transaction aur applicable rules par depend karte hain. Tax treatment fund type, acquisition/redemption dates aur relevant tax year ke law par alag ho sakta hai."},"s":{"en":"Do not memorise a universal tax rate from this lesson. India’s Income-tax Act, 2025 came into force on 1 April 2026, while transitional rules preserve treatment for earlier tax years and proceedings. For a real transaction, check current CBDT/Income Tax Department guidance and consult a qualified tax professional where needed.","hn":"Is lesson se universal tax rate yaad mat karo. India ka Income-tax Act, 2025 1 April 2026 se effective hua, jabki transitional rules earlier tax years aur proceedings ka treatment preserve karte hain. Real transaction ke liye current CBDT/Income Tax Department guidance check karo aur zaroorat par qualified tax professional se baat karo."},"p":{"en":"This lesson is general education. Scheme data and numerical examples are conceptual unless explicitly sourced and dated; verify current official disclosures before investing or filing taxes.","hn":"Ye lesson general education hai. Scheme data aur numerical examples conceptual hain jab tak explicitly source aur date na di ho; invest ya tax file karne se pehle current official disclosures verify karo."},"think":{"en":"Where should you verify current tax treatment for a real mutual fund redemption?","hn":"Real mutual fund redemption ke current tax treatment ko kahan verify karna chahiye?"},"reveal":{"en":"Use current official Income Tax Department/CBDT guidance and qualified professional advice when needed.","hn":"Current official Income Tax Department/CBDT guidance aur zaroorat par qualified professional advice use karo."}},{"k":"mc","q":{"en":"What does a mutual fund generally do?","hn":"Mutual fund generally kya karta hai?"},"o":[[{"en":"Pools investors’ money and invests according to its scheme mandate","hn":"Investors ka paisa pool karke scheme mandate ke mutabik invest karta hai"},{"en":"Correct. Its portfolio and risks depend on the scheme.","hn":"Sahi. Portfolio aur risks scheme par depend karte hain."}],[{"en":"Guarantees every investor a profit","hn":"Har investor ko profit guarantee karta hai"},{"en":"Mutual fund returns are not guaranteed.","hn":"Mutual fund returns guaranteed nahi."}],[{"en":"Works only as a bank savings account","hn":"Sirf bank savings account ki tarah kaam karta hai"},{"en":"A mutual fund invests in assets under its scheme mandate.","hn":"Mutual fund scheme mandate ke assets mein invest karta hai."}]],"a":0},{"k":"mc","q":{"en":"Fund A has NAV ₹10 and Fund B has NAV ₹100. Which conclusion is valid from NAV alone?","hn":"Fund A ka NAV ₹10 aur Fund B ka ₹100 hai. Sirf NAV se kaunsa conclusion valid hai?"},"o":[[{"en":"Neither fund is automatically cheaper or better from NAV alone","hn":"Sirf NAV se koi fund automatically cheaper ya better nahi"},{"en":"Correct. NAV level alone does not predict future returns.","hn":"Sahi. NAV level akela future returns predict nahi karta."}],[{"en":"Fund A must earn ten times more","hn":"Fund A ko ten times zyada earn karna hi hai"},{"en":"That does not follow from NAV.","hn":"Ye NAV se conclude nahi hota."}],[{"en":"Fund B cannot lose money","hn":"Fund B paisa lose nahi kar sakta"},{"en":"All market-linked funds can lose value.","hn":"Market-linked funds ki value gir sakti hai."}]],"a":0},{"k":"mc","q":{"en":"What does an index fund generally aim to do?","hn":"Index fund generally kya karne ka aim rakhta hai?"},"o":[[{"en":"Track a specified index, subject to tracking difference/error and costs","hn":"Specified index ko tracking difference/error aur costs ke subject mein track karna"},{"en":"Correct. Exact matching is not guaranteed.","hn":"Sahi. Exact matching guaranteed nahi."}],[{"en":"Guarantee positive returns every year","hn":"Har saal positive return guarantee karna"},{"en":"No fund can promise that as a general rule.","hn":"General rule ke taur par koi fund ye promise nahi kar sakta."}],[{"en":"Always outperform active funds","hn":"Hamesha active funds se outperform karna"},{"en":"That is not the objective of a typical index fund.","hn":"Typical index fund ka objective ye nahi."}]],"a":0},{"k":"mc","q":{"en":"Which statement about ETFs is correct?","hn":"ETF ke baare mein kaunsa statement sahi hai?"},"o":[[{"en":"An ETF trades on an exchange and its price can differ from NAV","hn":"ETF exchange par trade hota hai aur price NAV se differ kar sakta hai"},{"en":"Correct. Liquidity, spreads and market conditions matter.","hn":"Sahi. Liquidity, spreads aur market conditions matter karte hain."}],[{"en":"Every ETF always trades exactly at NAV","hn":"Har ETF hamesha exactly NAV par trade hota hai"},{"en":"Market price can differ from NAV.","hn":"Market price NAV se differ kar sakta hai."}],[{"en":"An ETF has no costs","hn":"ETF ka koi cost nahi hota"},{"en":"Brokerage, spreads and other costs may apply.","hn":"Brokerage, spreads aur doosre costs apply ho sakte hain."}]],"a":0},{"k":"mc","q":{"en":"What does a SIP guarantee?","hn":"SIP kya guarantee karti hai?"},"o":[[{"en":"A regular investment method, not a guaranteed return","hn":"Regular investment method, guaranteed return nahi"},{"en":"Correct. The investment can still lose value.","hn":"Sahi. Investment ki value phir bhi gir sakti hai."}],[{"en":"A fixed profit every month","hn":"Har month fixed prof
