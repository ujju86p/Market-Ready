terpretation of a wide bid-ask spread?","hn":"Wide bid-ask spread ki safer interpretation kya hai?"},"o":[[{"en":"The option must be undervalued","hn":"Option undervalued hi hoga"},{"en":"A wide spread does not prove underpricing.","hn":"Wide spread underpricing prove nahi karta."}],[{"en":"Execution may be less favourable or less certain","hn":"Execution less favourable ya less certain ho sakta hai"},{"en":"Correct: spread and available depth affect execution quality.","hn":"Sahi: spread aur available depth execution quality affect karte hain."}],[{"en":"The option is certain to move sharply","hn":"Option ka sharp move certain hai"},{"en":"Spread alone does not predict the underlying move.","hn":"Spread akela underlying move predict nahi karta."}]],"a":1},{"k":"mc","q":{"en":"Which statement about open interest is accurate?","hn":"Open interest ke baare mein kaunsa statement accurate hai?"},"o":[[{"en":"Every increase proves buyers are stronger than sellers","hn":"Har increase prove karta hai ki buyers sellers se stronger hain"},{"en":"Every open contract has both a long and a short side.","hn":"Har open contract ka long aur short dono side hota hai."}],[{"en":"It is interchangeable with volume","hn":"Ye volume ke interchangeable hai"},{"en":"Volume counts activity over a period; OI counts outstanding contracts.","hn":"Volume period ki activity count karta hai; OI outstanding contracts count karta hai."}],[{"en":"It counts outstanding contracts, but is not a standalone direction signal","hn":"Ye outstanding contracts count karta hai, lekin standalone direction signal nahi"},{"en":"Correct: OI needs context and cannot alone reveal directional intent.","hn":"Sahi: OI ko context chahiye aur ye akela directional intent nahi batata."}]],"a":2},{"k":"mc","q":{"en":"Before using an option chain, what should you verify first?","hn":"Option chain use karne se pehle kya verify karna chahiye?"},"o":[[{"en":"Underlying, expiry and data freshness","hn":"Underlying, expiry aur data freshness"},{"en":"Correct: establish exactly which contracts and timestamp you are viewing.","hn":"Sahi: pehle confirm karo ki kaunse contracts aur kis timestamp ka data dekh rahe ho."}],[{"en":"Only the largest volume number","hn":"Sirf sabse bada volume number"},{"en":"A single column cannot explain the whole market.","hn":"Ek column poora market explain nahi kar sakta."}],[{"en":"Only the highest premium","hn":"Sirf highest premium"},{"en":"The highest premium alone says little without contract terms and context.","hn":"Contract terms aur context ke bina highest premium bahut kam batata hai."}]],"a":0},{"k":"mc","q":{"en":"What is the best use of a hypothetical option-chain example in this lesson?","hn":"Is lesson mein hypothetical option-chain example ka best use kya hai?"},"o":[[{"en":"Treat it as a live buy/sell signal","hn":"Use live buy/sell signal samajhna"},{"en":"Hypothetical examples teach reading skills, not live recommendations.","hn":"Hypothetical examples reading skills sikhate hain, live recommendations nahi."}],[{"en":"Practise reading fields and recognising limits of the data","hn":"Fields padhna aur data ki limits samajhna practise karna"},{"en":"Correct: practise the framework, then verify current data and risks independently.","hn":"Sahi: framework practise karo, phir current data aur risks independently verify karo."}],[{"en":"Assume all option chains use identical layouts","hn":"Assume karna ki sab option chains ka layout same hota hai"},{"en":"Platforms may label or arrange fields differently.","hn":"Platforms fields ko alag label ya arrange kar sakte hain."}]],"a":1},{"k":"end"}];
UNITS.x17=[{"k":"info","t":{"en":"A straddle uses the same strike and expiry","hn":"Straddle mein same strike aur expiry hoti hai"},"hook":{"en":"What defines a standard long straddle?","hn":"Standard long straddle ko kya define karta hai?"},"story":{"en":"A trader expects a large move but is unsure of direction and buys both rights at the same strike.","hn":"Trader ko bada move expected hai par direction unsure hai, isliye same strike par dono rights buy karta hai."},"s":{"en":"A long straddle typically buys a call and a put on the same underlying with the same strike and expiry. It costs two premiums.","hn":"Long straddle mein typically same underlying par same strike aur expiry ka call aur put buy hota hai. Ismein do premiums lagte hain."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"What defines a standard long straddle?","hn":"Standard long straddle ko kya define karta hai?"},"reveal":{"en":"Long call and long put with the same strike and expiry","hn":"Same strike aur expiry ka long call aur long put"},"g":"payoff"},{"k":"info","t":{"en":"A strangle uses different strikes","hn":"Strangle mein different strikes hoti hain"},"hook":{"en":"How do strikes usually differ in a long strangle?","hn":"Long strangle mein strikes aam taur par kaise differ karti hain?"},"story":{"en":"The call strike sits above spot and the put strike below spot, so the combined premium is often lower than a comparable straddle but needs a larger move.","hn":"Call strike spot se upar aur put strike neeche hota hai; combined premium aksar comparable straddle se kam, par larger move chahiye."},"s":{"en":"A long strangle typically buys an out-of-the-money call and an out-of-the-money put with the same expiry but different strikes.","hn":"Long strangle mein typically same expiry par different strikes ka OTM call aur OTM put buy hota hai."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"How do strikes usually differ in a long strangle?","hn":"Long strangle mein strikes aam taur par kaise differ karti hain?"},"reveal":{"en":"Call strike is above and put strike below the current underlying price","hn":"Call strike current price se upar aur put strike neeche"}},{"k":"info","t":{"en":"Direction uncertainty is not enough","hn":"Sirf direction uncertainty kaafi nahi"},"hook":{"en":"What must a long straddle/strangle overcome to profit at expiry?","hn":"Expiry par profit ke liye long straddle/strangle ko kya overcome karna hota hai?"},"story":{"en":"The underlying moves, but not far enough to cover the combined premium; the position can still lose.","hn":"Underlying move karta hai par combined premium cover karne jitna nahi; position phir bhi loss de sakti hai."},"s":{"en":"A long straddle/strangle generally needs a sufficiently large move before expiry to offset the premiums and costs.","hn":"Long straddle/strangle ko premiums aur costs cover karne ke liye expiry se pehle kaafi bada move generally chahiye."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"What must a long straddle/strangle overcome to profit at expiry?","hn":"Expiry par profit ke liye long straddle/strangle ko kya overcome karna hota hai?"},"reveal":{"en":"Combined premium and transaction costs","hn":"Combined premium aur transaction costs"}},{"k":"info","t":{"en":"Breakeven levels come from total cost","hn":"Break-even total cost se nikalta hai"},"hook":{"en":"With strike ₹100 and combined premium ₹12, what are the simplified long-straddle break-evens?","hn":"Strike ₹100 aur combined premium ₹12 ho toh simplified break-evens kya hain?"},"story":{"en":"Strike is ₹100; call premium ₹7 and put premium ₹5. Total premium is ₹12, so simplified break-evens are ₹88 and ₹112.","hn":"Strike ₹100; call premium ₹7 aur put premium ₹5. Total premium ₹12 hai, simplified break-evens ₹88 aur ₹112 hain."},"s":{"en":"For a simple long straddle held to expiry, break-evens are strike plus total premium and strike minus total premium, before fees.","hn":"Expiry tak hold kiye simple long straddle ke break-evens strike plus total premium aur strike minus total premium hote hain, fees se pehle."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"With strike ₹100 and combined premium ₹12, what are the simplified long-straddle break-evens?","hn":"Strike ₹100 aur combined premium ₹12 ho toh simplified break-evens kya hain?"},"reveal":{"en":"₹88 and ₹112","hn":"₹88 aur ₹112"}},{"k":"info","t":{"en":"Implied volatility affects entry cost","hn":"Implied volatility entry cost ko affect karti hai"},"hook":{"en":"What risk does elevated IV create for a newly bought straddle?","hn":"Elevated IV par naya straddle buy karne ka risk kya hai?"},"story":{"en":"A trader buys before an event at elevated IV. The event passes and IV falls, offsetting some benefit of the price move.","hn":"Trader elevated IV par event se pehle buy karta hai. Event ke baad IV girti hai aur price move ka kuch benefit offset ho sakta hai."},"s":{"en":"High implied volatility can make both bought options expensive; a later volatility drop can hurt a long-volatility position.","hn":"High implied volatility dono bought options ko expensive bana sakti hai; baad mein volatility drop long-volatility position ko hurt kar sakta hai."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"What risk does elevated IV create for a newly bought straddle?","hn":"Elevated IV par naya straddle buy karne ka risk kya hai?"},"reveal":{"en":"Premium may be high and IV may later contract","hn":"Premium high ho sakta hai aur IV baad mein contract kar sakti hai"}},{"k":"info","t":{"en":"Time decay affects long positions","hn":"Time decay long positions ko affect karta hai"},"hook":{"en":"If the underlying stays quiet, what can happen to a long straddle?","hn":"Underlying quiet rahe toh long straddle ke saath kya ho sakta hai?"},"story":{"en":"The underlying stays near the middle for several days; both options lose time value.","hn":"Underlying kai din middle ke paas rehta hai; dono options time value lose kar sakte hain."},"s":{"en":"A long straddle or strangle usually has time decay exposure: if the move does not arrive soon enough, time value may erode.","hn":"Long straddle ya strangle mein usually time-decay exposure hota hai: move time par na aaye toh time value ghatt sakti hai."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"If the underlying stays quiet, what can happen to a long straddle?","hn":"Underlying quiet rahe toh long straddle ke saath kya ho sakta hai?"},"reveal":{"en":"Time decay can reduce the options’ value","hn":"Time decay options ki value ghata sakta hai"}},{"k":"info","t":{"en":"Short volatility has a different risk shape","hn":"Short volatility ka risk profile alag hai"},"hook":{"en":"What is a key risk of a short straddle?","hn":"Short straddle ka key risk kya hai?"},"story":{"en":"A short straddle earns a small premium while the underlying makes an extreme move. The loss can overwhelm premium received.","hn":"Short straddle small premium kamata hai par underlying extreme move karta hai. Loss received premium se bahut bada ho sakta hai."},"s":{"en":"Selling a straddle/strangle collects premium but can expose the trader to large losses if the underlying moves sharply; margin and risk controls matter.","hn":"Straddle/strangle sell karne par premium milta hai, par underlying sharply move kare toh large loss ho sakta hai; margin aur risk controls important hain."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"What is a key risk of a short straddle?","hn":"Short straddle ka key risk kya hai?"},"reveal":{"en":"A large move can create losses far above premium received","hn":"Bada move received premium se kaafi bada loss de sakta hai"}},{"k":"info","t":{"en":"Compare payoff after realistic costs","hn":"Realistic costs ke baad payoff compare karo"},"hook":{"en":"What should be included when evaluating a multi-leg payoff?","hn":"Multi-leg payoff evaluate karte waqt kya include karna chahiye?"},"story":{"en":"A theoretical payoff shows a small profit, but wide spreads and two-leg execution costs remove it.","hn":"Theoretical payoff small profit dikhata hai, par wide spread aur two-leg execution cost usse hata dete hain."},"s":{"en":"Compare expiry payoff, total premium, fees, bid-ask spread and likely execution. A payoff diagram is not a guarantee of actual fills.","hn":"Expiry payoff, total premium, fees, bid-ask spread aur likely execution compare karo. Payoff diagram actual fills ki guarantee nahi hai."},"p":{"en":"Multi-leg option strategies can lose money; understand payoff, expiry, execution costs and assignment/settlement terms before use.","hn":"Multi-leg option strategies mein loss ho sakta hai; use se pehle payoff, expiry, execution cost aur assignment/settlement terms samjho."},"think":{"en":"What should be included when evaluating a multi-leg payoff?","hn":"Multi-leg payoff evaluate karte waqt kya include karna chahiye?"},"reveal":{"en":"Premiums, fees, spread and execution assumptions","hn":"Premiums, fees, spread aur execution assumptions"}},{"k":"mc","q":{"en":"What defines a standard long straddle?","hn":"Standard long straddle ko kya define karta hai?"},"o":[[{"en":"Two calls with different expiries","hn":"Different expiry ke do calls"},{"en":"Not quite. A long straddle typically buys a call and a put on the same underlying with the same strike and expiry. It costs two premiums.","hn":"Dobara socho. Long straddle mein typically same underlying par same strike aur expiry ka call aur put buy hota hai. Ismein do premiums lagte hain."}],[{"en":"Long call and long put with the same strike and expiry","hn":"Same strike aur expiry ka long call aur long put"},{"en":"Correct. A long straddle typically buys a call and a put on the same underlying with the same strike and expiry. It costs two premiums.","hn":"Sahi. Long straddle mein typically same underlying par same strike aur expiry ka call aur put buy hota hai. Ismein do premiums lagte hain."}],[{"en":"A short call alone","hn":"Sirf short call"},{"en":"Not quite. A long straddle typically buys a call and a put on the same underlying with the same strike and expiry. It costs two premiums.","hn":"Dobara socho. Long straddle mein typically same underlying par same strike aur expiry ka call aur put buy hota hai. Ismein do premiums lagte hain."}]],"a":1},{"k":"mc","q":{"en":"How do strikes usually differ in a long strangle?","hn":"Long strangle mein strikes aam taur par kaise differ karti hain?"},"o":[[{"en":"Call strike is above and put strike below the current underlying price","hn":"Call strike current price se upar aur put strike neeche"},{"en":"Correct. A long strangle typically buys an out-of-the-money call and an out-of-the-money put with the same expiry but different strikes.","hn":"Sahi. Long strangle mein typically same expiry par different strikes ka OTM call aur OTM put buy hota hai."}],[{"en":"Both strikes must be identical","hn":"Dono strikes identical honi chahiye"},{"en":"Not quite. A long strangle typically buys an out-of-the-money call and an out-of-the-money put with the same expiry but different strikes.","hn":"Dobara socho. Long strangle mein typically same expiry par different strikes ka OTM call aur OTM put buy hota hai."}],[{"en":"Both options must be in the money","hn":"Dono options ITM honi chahiye"},{"en":"Not quite. A long strangle typically buys an out-of-the-money call and an out-of-the-money put with the same expiry but different strikes.","hn":"Dobara socho. Long strangle mein typically same expiry par different strikes ka OTM call aur OTM put buy hota hai."}]],"a":0},{"k":"mc","q":{"en":"What must a long straddle/strangle overcome to profit at expiry?","hn":"Expiry par profit ke liye long straddle/strangle ko kya overcome karna hota hai?"},"o":[[{"en":"Only the strike price","hn":"Sirf strike price"},{"en":"Not quite. A long straddle/strangle generally needs a sufficiently large move before expiry to offset the premiums and costs.","hn":"Dobara socho. Long straddle/strangle ko premiums aur costs cover karne ke liye expiry se pehle kaafi bada move generally chahiye."}],[{"en":"The number of candles on a chart","hn":"Chart par candles ki sankhya"},{"en":"Not quite. A long straddle/strangle generally needs a sufficiently large move before expiry to offset the premiums and costs.","hn":"Dobara socho. Long straddle/strangle ko premiums aur costs cover karne ke liye expiry se pehle kaafi bada move generally chahiye."}],[{"en":"Combined premium and transaction costs","hn":"Combined premium aur transaction costs"},{"en":"Correct. A long straddle/strangle generally needs a sufficiently large move before expiry to offset the premiums and costs.","hn":"Sahi. Long straddle/strangle ko premiums aur costs cover karne ke liye expiry se pehle kaafi bada move generally chahiye."}]],"a":2},{"k":"mc","q":{"en":"With strike ₹100 and combined premium ₹12, what are the simplified long-straddle break-evens?","hn":"Strike ₹100 aur combined premium ₹12 ho toh simplified break-evens kya hain?"},"o":[[{"en":"₹95 and ₹105","hn":"₹95 aur ₹105"},{"en":"Not quite. For a simple long straddle held to expiry, break-evens are strike plus total premium and strike minus total premium, before fees.","hn":"Dobara socho. Expiry tak hold kiye simple long straddle ke break-evens strike plus total premium aur strike minus total premium hote hain, fees se pehle."}],[{"en":"₹88 and ₹112","hn":"₹88 aur ₹112"},{"en":"Correct. For a simple long straddle held to expiry, break-evens are strike plus total premium and strike minus total premium, before fees.","hn":"Sahi. Expiry tak hold kiye simple long straddle ke break-evens strike plus total premium aur strike minus total premium hote hain, fees se pehle."}],[{"en":"₹100 only","hn":"Sirf ₹100"},{"en":"Not quite. For a simple long straddle held to expiry, break-evens are strike plus total premium and strike minus total premium, before fees.","hn":"Dobara socho. Expiry tak hold kiye simple long straddle ke break-evens strike plus total premium aur strike minus total premium hote hain, fees se pehle."}]],"a":1},{"k":"mc","q":{"en":"What risk does elevated IV create for a newly bought straddle?","hn":"Elevated IV par naya straddle buy karne ka risk kya hai?"},"o":[[{"en":"It guarantees a larger move","hn":"Ye larger move guarantee karta hai"},{"en":"Not quite. High implied volatility can make both bought options expensive; a later volatility drop can hurt a long-volatility position.","hn":"Dobara socho. High implied volatility dono bought options ko expensive bana sakti hai; baad mein volatility drop long-volatility position ko hurt kar sakta hai."}],[{"en":"It removes time decay","hn":"Ye time decay hata deta hai"},{"en":"Not quite. High implied volatility can make both bought options expensive; a later volatility drop can hurt a long-volatility position.","hn":"Dobara socho. High implied volatility dono bought options ko expensive bana sakti hai; baad mein volatility drop long-volatility position ko hurt kar sakta hai."}],[{"en":"Premium may be high and IV may later contract","hn":"Premium high ho sakta hai aur IV baad mein contract kar sakti hai"},{"en":"Correct. High implied volatility can make both bought options expensive; a later volatility drop can hurt a long-volatility position.","hn":"Sahi. High implied volatility dono bought options ko expensive bana sakti hai; baad mein volatility drop long-volatility position ko hurt kar sakta hai."}]],"a":2},{"k":"mc","q":{"en":"If the underlying stays quiet, what can happen to a long straddle?","hn":"Underlying quiet rahe toh long straddle ke saath kya ho sakta hai?"},"o":[[{"en":"Time decay can reduce the options’ value","hn":"Time decay options ki value ghata sakta hai"},{"en":"Correct. A long straddle or strangle usually has time decay exposure: if the move does not arrive soon enough, time value may erode.","hn":"Sahi. Long straddle ya strangle mein usually time-decay exposure hota hai: move time par na aaye toh time value ghatt sakti hai."}],[{"en":"It must earn a profit","hn":"Profit hona hi chahiye"},{"en":"Not quite. A long straddle or strangle usually has time decay exposure: if the move does not arrive soon enough, time value may erode.","hn":"Dobara socho. Long straddle ya strangle mein usually time-decay exposure hota hai: move time par na aaye toh time value ghatt sakti hai."}],[{"en":"Its premium becomes zero immediately","hn":"Premium turant zero ho jata hai"},{"en":"Not quite. A long straddle or strangle usually has time decay exposure: if the move does not arrive soon enough, time value may erode.","hn":"Dobara socho. Long straddle ya strangle mein usually time-decay exposure hota hai: move time par na aaye toh time value ghatt sakti hai."}]],"a":0},{"k":"mc","q":{"en":"What is a key risk of a short straddle?","hn":"Short straddle ka key risk kya hai?"},"o":[[{"en":"Loss is always limited to premium received","hn":"Loss hamesha received premium tak limited hai"},{"en":"Not quite. Selling a straddle/strangle collects premium but can expose the trader to large losses if the underlying moves sharply; margin and risk controls matter.","hn":"Dobara socho. Straddle/strangle sell karne par premium milta hai, par underlying sharply move kare toh large loss ho sakta hai; margin aur risk controls important hain."}],[{"en":"A large move can create losses far above premium received","hn":"Bada move received premium se kaafi bada loss de sakta hai"},{"en":"Correct. Selling a straddle/strangle collects premium but can expose the trader to large losses if the underlying moves sharply; margin and risk controls matter.","hn":"Sahi. Straddle/strangle sell karne par premium milta hai, par underlying sharply move kare toh large loss ho sakta hai; margin aur risk controls important hain."}],[{"en":"It cannot require margin","hn":"Ismein margin ki zaroorat nahi ho sakti"},{"en":"Not quite. Selling a straddle/strangle collects premium but can expose the trader to large losses if the underlying moves sharply; margin and risk controls matter.","hn":"Dobara socho. Straddle/strangle sell karne par premium milta hai, par underlying sharply move kare toh large loss ho sakta hai; margin aur risk controls important hain."}]],"a":1},{"k":"mc","q":{"en":"What should be included when evaluating a multi-leg payoff?","hn":"Multi-leg payoff evaluate karte waqt kya include karna chahiye?"},"o":[[{"en":"Only the maximum possible profit","hn":"Sirf maximum possible profit"},{"en":"Not quite. Compare expiry payoff, total premium, fees, bid-ask spread and likely execution. A payoff diagram is not a guarantee of actual fills.","hn":"Dobara socho. Expiry payoff, total premium, fees, bid-ask spread aur likely execution compare karo. Payoff diagram actual fills ki guarantee nahi hai."}],[{"en":"Only the underlying last price","hn":"Sirf underlying ka last price"},{"en":"Not quite. Compare expiry payoff, total premium, fees, bid-ask spread and likely execution. A payoff diagram is not a guarantee of actual fills.","hn":"Dobara socho. Expiry payoff, total premium, fees, bid-ask spread aur likely execution compare karo. Payoff diagram actual fills ki guarantee nahi hai."}],[{"en":"Premiums, fees, spread and execution assumptions","hn":"Premiums, fees, spread aur execution assumptions"},{"en":"Correct. Compare expiry payoff, total premium, fees, bid-ask spread and likely execution. A payoff diagram is not a guarantee of actual fills.","hn":"Sahi. Expiry payoff, total premium, fees, bid-ask spread aur likely execution compare karo. Payoff diagram actual fills ki guarantee nahi hai."}]],"a":2},{"k":"end"}];
UNITS.x18=[{"k":"info","t":{"en":"MTF is a financed share purchase","hn":"MTF financed share purchase hai"},"hook":{"en":"In a simplified MTF example, who funds the financed portion of an eligible share purchase?","hn":"Simplified MTF example mein eligible share purchase ka financed portion kaun fund karta hai?"},"story":{"en":"Ravi contributes part of the purchase cost and the broker finances the remaining eligible amount under the facility.","hn":"Ravi purchase cost ka ek hissa deta hai aur facility ke under broker eligible remaining amount finance karta hai."},"s":{"en":"Margin Trading Facility (MTF) is a broker-provided facility for eligible shares where the client contributes part of the purchase and the broker finances part, subject to applicable rules and disclosures. It is borrowing-linked exposure, not a discount.","hn":"Margin Trading Facility (MTF) mein eligible shares ke liye client purchase ka kuch hissa deta hai aur broker kuch finance karta hai, applicable rules aur disclosures ke subject to. Ye borrowing-linked exposure hai, discount nahi."},"p":{"en":"Eligibility, funding ratio, charges and risk controls vary. Read the current broker terms before using MTF.","hn":"Eligibility, funding ratio, charges aur risk controls alag ho sakte hain. MTF use karne se pehle current broker terms padho."},"think":{"en":"What makes MTF different from buying fully with your own cash?","hn":"MTF ko apne cash se fully buy karne se kya alag banata hai?"},"reveal":{"en":"A financed portion creates funding costs and additional obligations.","hn":"Financed portion se funding costs aur extra obligations banti hain."}},{"k":"info","t":{"en":"Separate your contribution from total exposure","hn":"Apna contribution aur total exposure alag samjho"},"hook":{"en":"You contribute ₹30,000 toward a ₹1,00,000 eligible position. Before costs, what is the total market exposure?","hn":"Aap ₹1,00,000 eligible position mein ₹30,000 contribute karte ho. Costs se pehle total market exposure kitni hai?"},"story":{"en":"Ravi focuses only on the ₹30,000 he paid. But the share price movement applies to the whole ₹1,00,000 position.","hn":"Ravi sirf ₹30,000 par focus karta hai jo usne diya. Lekin share price ka movement poori ₹1,00,000 position par apply hota hai."},"s":{"en":"Total exposure is the value of the shares held, not merely the client’s contribution. A 5% fall on ₹1,00,000 is a ₹5,000 price loss before costs—about 16.7% of a ₹30,000 contribution in this simplified example.","hn":"Total exposure held shares ki value hoti hai, sirf client contribution nahi. ₹1,00,000 par 5% fall ka matlab costs se pehle ₹5,000 loss—simplified example mein ₹30,000 contribution ka lagbhag 16.7%."},"p":{"en":"The calculation ignores fees, financing, taxes, changing margins and any other adjustments.","hn":"Is calculation mein fees, financing, taxes, changing margins aur doosre adjustments include nahi hain."},"think":{"en":"Why can the same market fall have a larger percentage impact on your contribution?","hn":"Same market fall aapke contribution par larger percentage impact kyun daal sakti hai?"},"reveal":{"en":"Because the exposure is larger than the client’s own contribution.","hn":"Kyunki exposure client ke apne contribution se badi hai."}},{"k":"info","t":{"en":"Funding charges accumulate over time","hn":"Funding charges time ke saath jama ho sakte hain"},"hook":{"en":"A position moves slightly in your favour over several weeks. Can funding charges still reduce the net outcome?","hn":"Position kuch hafton mein thodi favourable move karti hai. Kya funding charges phir bhi net outcome ghata sakte hain?"},"story":{"en":"A small price gain is partly offset by funding charges and transaction costs while Ravi keeps the financed position open.","hn":"Ravi financed position open rakhta hai; chhota price gain funding charges aur transaction costs se partly offset ho jata hai."},"s":{"en":"MTF outcomes depend on price change minus financing and transaction costs, plus applicable taxes/fees. The longer a funded position stays open, the more charges may accrue according to the facility’s pricing method.","hn":"MTF outcome price change minus financing aur transaction costs, plus applicable taxes/fees par depend karta hai. Funded position jitni der open rahe, facility pricing ke hisaab se charges jama ho sakte hain."},"p":{"en":"Check the actual rate, how it is calculated, billing frequency and any other charges in the current disclosure.","hn":"Current disclosure mein actual rate, calculation method, billing frequency aur other charges check karo."},"think":{"en":"What should a realistic MTF outcome estimate include?","hn":"Realistic MTF outcome estimate mein kya include hona chahiye?"},"reveal":{"en":"Price change, funding charges, transaction costs and applicable fees/taxes.","hn":"Price change, funding charges, transaction costs aur applicable fees/taxes."}},{"k":"info","t":{"en":"Leverage magnifies loss relative to own capital","hn":"Leverage apne capital ke comparison mein loss bada sakta hai"},"hook":{"en":"If ₹1,00,000 of shares falls 5%, what is the price loss before costs?","hn":"₹1,00,000 ke shares 5% girte hain. Costs se pehle price loss kitna hai?"},"story":{"en":"A ₹5,000 loss may look modest against the full position but is significant against a ₹30,000 contribution.","hn":"₹5,000 loss full position ke comparison mein chhota lag sakta hai, lekin ₹30,000 contribution ke comparison mein significant hai."},"s":{"en":"A financed position can create a loss that is a larger percentage of the client’s own capital. Funding obligations and charges do not disappear simply because the share price fell.","hn":"Financed position se client ke apne capital ke comparison mein bada percentage loss ho sakta hai. Share price girne se funding obligations aur charges khatam nahi hote."},"p":{"en":"Do not use leverage just because it increases the amount you can buy.","hn":"Sirf isliye leverage mat use karo kyunki isse buying amount badh jata hai."},"think":{"en":"What is the price loss on ₹1,00,000 after a 5% fall?","hn":"₹1,00,000 par 5% fall ke baad price loss kitna hai?"},"reveal":{"en":"₹5,000 before costs.","hn":"Costs se pehle ₹5,000."}},{"k":"info","t":{"en":"A margin shortfall can force decisions quickly","hn":"Margin shortfall par jaldi decision lena pad sakta hai"},"hook":{"en":"If the broker’s required margin is no longer met, can the position always be held until recovery?","hn":"Broker ki required margin meet na ho, toh kya position hamesha recovery tak hold kar sakte hain?"},"story":{"en":"A sharp decline reduces the equity supporting Ravi’s MTF position. The facility may require additional funds or reduce the position under its terms.","hn":"Tez girawat Ravi ki MTF position ko support karne wali equity ghatati hai. Facility terms ke under extra funds maange ja sakte hain ya position reduce ho sakti hai."},"s":{"en":"If required margin or collateral is insufficient, the client may need to add funds or collateral, or reduce exposure. Depending on the agreement, the broker may be able to sell holdings or otherwise enforce the terms.","hn":"Required margin ya collateral insufficient ho toh client ko funds/collateral add karna ya exposure reduce karna pad sakta hai. Agreement ke hisaab se broker holdings sell kar sakta hai ya terms enforce kar sakta hai."},"p":{"en":"A forced sale may occur at an unfavourable time or price; exact rights and process depend on the facility terms.","hn":"Forced sale unfavourable time ya price par ho sakti hai; exact rights aur process facility terms par depend karte hain."},"think":{"en":"What should you know before opening an MTF position?","hn":"MTF position kholne se pehle kya pata hona chahiye?"},"reveal":{"en":"Shortfall triggers, response deadlines and the broker’s rights under the agreement.","hn":"Shortfall triggers, response deadlines aur agreement ke under broker ke rights."}},{"k":"info","t":{"en":"Holding period changes the cost calculation","hn":"Holding period cost calculation badal deta hai"},"hook":{"en":"If the expected gain is small, why might a longer holding period matter?","hn":"Expected gain chhota hai toh longer holding period kyun matter karta hai?"},"story":{"en":"Ravi expects a 2% move but holds for longer than planned. Financing costs continue to accrue and the price may also move against him.","hn":"Ravi 2% move expect karta hai lekin planned time se zyada hold karta hai. Funding costs accrue hote rehte hain aur price against bhi ja sakta hai."},"s":{"en":"The expected price move must be compared with funding cost over the actual holding period, transaction costs and downside scenarios. A thesis that works before costs may not work after costs.","hn":"Expected price move ko actual holding period ki funding cost, transaction costs aur downside scenarios se compare karo. Jo thesis costs se pehle work kare, zaroori nahi costs ke baad bhi kare."},"p":{"en":"Avoid assuming a financed trade will close on your planned date or at your target price.","hn":"Ye assume mat karo ki financed trade planned date ya target price par hi close hogi."},"think":{"en":"What can make a small expected gain unattractive in MTF?","hn":"MTF mein chhota expected gain unattractive kis wajah se ho sakta hai?"},"reveal":{"en":"Funding and transaction costs relative to the expected gain.","hn":"Expected gain ke comparison mein funding aur transaction costs."}},{"k":"info","t":{"en":"MTF is not the same as a futures contract","hn":"MTF aur futures contract same nahi hain"},"hook":{"en":"Does buying shares through MTF create the same contract as buying a futures contract?","hn":"MTF se shares kharidna kya futures contract kharidne jaisa hi contract create karta hai?"},"story":{"en":"Ravi compares two different products: financed ownership of eligible shares and a standardised futures contract with expiry and settlement rules.","hn":"Ravi do alag products compare karta hai: eligible shares ki financed ownership aur expiry/settlement rules wala standardised futures contract."},"s":{"en":"MTF generally involves a financed purchase of eligible shares under a broker facility. Futures are derivatives contracts with their own specifications, expiry, margin and settlement obligations. The risk mechanics differ.","hn":"MTF generally broker facility ke under eligible shares ki financed purchase hai. Futures apni specifications, expiry, margin aur settlement obligations wale derivatives contracts hain. Dono ke risk mechanics alag hain."},"p":{"en":"Product names, permissions and terms can change; confirm the instrument and contract details before placing an order.","hn":"Product names, permissions aur terms badal sakte hain; order se pehle instrument aur contract details confirm karo."},"think":{"en":"What is the key product distinction?","hn":"Product ka key distinction kya hai?"},"reveal":{"en":"MTF finances eligible share purchases; futures are derivative contracts.","hn":"MTF eligible share purchase finance karta hai; futures derivative contracts hain."}},{"k":"info","t":{"en":"Run a pre-trade MTF checklist","hn":"Trade se pehle MTF checklist banao"},"hook":{"en":"Before using MTF, what would you check first: price target only, or total costs and downside obligations too?","hn":"MTF use karne se pehle sirf price target check karoge ya total costs aur downside obligations bhi?"},"story":{"en":"Before entering, Ravi writes down the position value, own contribution, financing rate, plausible loss, shortfall process and exit conditions.","hn":"Entry se pehle Ravi position value, own contribution, financing rate, plausible loss, shortfall process aur exit conditions likhta hai."},"s":{"en":"A practical checklist includes eligibility, own contribution, total exposure, funding charges, transaction costs, concentration, plausible adverse moves, shortfall deadlines, liquidation terms and a realistic exit plan.","hn":"Practical checklist mein eligibility, own contribution, total exposure, funding charges, transaction costs, concentration, plausible adverse moves, shortfall deadlines, liquidation terms aur realistic exit plan include karo."},"p":{"en":"This is educational guidance, not a recommendation to use MTF or a particular security.","hn":"Ye educational guidance hai, MTF ya kisi specific security ko use karne ki recommendation nahi."},"think":{"en":"What should a pre-trade checklist include beyond the expected price move?","hn":"Expected price move ke alawa pre-trade checklist mein kya hona chahiye?"},"reveal":{"en":"Costs, total exposure, affordable downside, shortfall rules and exit conditions.","hn":"Costs, total exposure, affordable downside, shortfall rules aur exit conditions."}},{"k":"mc","q":{"en":"In a typical MTF arrangement, who finances the financed portion?","hn":"Typical MTF arrangement mein financed portion kaun finance karta hai?"},"o":[[{"en":"The broker, under the facility terms","hn":"Facility terms ke under broker"},{"en":"Correct: the broker provides financing under applicable terms and rules.","hn":"Sahi: broker applicable terms aur rules ke under financing deta hai."}],[{"en":"The stock exchange guarantees it at no cost","hn":"Stock exchange bina cost guarantee karta hai"},{"en":"MTF is not a no-cost exchange guarantee.","hn":"MTF exchange ki no-cost guarantee nahi hai."}],[{"en":"The company issuing the shares","hn":"Shares issue karne wali company"},{"en":"The issuer is not ordinarily the lender in an MTF facility.","hn":"Issuer ordinarily MTF facility ka lender nahi hota."}]],"a":0},{"k":"mc","q":{"en":"You have ₹30,000 of own contribution against ₹1,00,000 exposure. A 5% fall causes what price loss before costs?","hn":"₹1,00,000 exposure ke against apna contribution ₹30,000 hai. 5% fall se costs se pehle kitna price loss hoga?"},"o":[[{"en":"₹1,500","hn":"₹1,500"},{"en":"Calculate 5% on the full ₹1,00,000 exposure.","hn":"Full ₹1,00,000 exposure par 5% calculate karo."}],[{"en":"₹5,000","hn":"₹5,000"},{"en":"Correct: 5% × ₹1,00,000 = ₹5,000 before costs.","hn":"Sahi: 5% × ₹1,00,000 = costs se pehle ₹5,000."}],[{"en":"₹30,000","hn":"₹30,000"},{"en":"₹30,000 is the contribution, not the loss from a 5% price move.","hn":"₹30,000 contribution hai, 5% price move ka loss nahi."}]],"a":1},{"k":"mc","q":{"en":"Which items belong in an MTF outcome estimate?","hn":"MTF outcome estimate mein kaun si cheezein honi chahiye?"},"o":[[{"en":"Only the share’s closing price","hn":"Sirf share ka closing price"},{"en":"The closing price alone omits costs and the entry price.","hn":"Sirf closing price costs aur entry price omit karta hai."}],[{"en":"Only the broker-funded amount","hn":"Sirf broker-funded amount"},{"en":"The funded amount alone does not show the outcome.","hn":"Sirf funded amount outcome nahi batata."}],[{"en":"Price change, financing and transaction costs, plus applicable fees/taxes","hn":"Price change, financing aur transaction costs, plus applicable fees/taxes"},{"en":"Correct: net outcome must account for price change and relevant costs.","hn":"Sahi: net outcome mein price change aur relevant costs account hone chahiye."}]],"a":2},{"k":"mc","q":{"en":"Why can a longer MTF holding period reduce net returns?","hn":"Longer MTF holding period net returns kyun ghata sakta hai?"},"o":[[{"en":"Funding charges may continue to accumulate","hn":"Funding charges jama hote reh sakte hain"},{"en":"Correct: charges can accrue according to the facility’s pricing method.","hn":"Sahi: facility pricing method ke hisaab se charges accrue ho sakte hain."}],[{"en":"Funding charges always stop after one day","hn":"Funding charges hamesha ek din baad ruk jaate hain"},{"en":"Do not assume charges stop after one day; check the terms.","hn":"Ye assume mat karo ki charges ek din baad ruk jaate hain; terms check karo."}],[{"en":"The share price is fixed during MTF","hn":"MTF mein share price fixed hota hai"},{"en":"MTF does not fix the market price.","hn":"MTF market price fix nahi karta."}]],"a":0},{"k":"mc","q":{"en":"What can happen if MTF margin requirements are not met?","hn":"MTF margin requirements meet na hon toh kya ho sakta hai?"},"o":[[{"en":"The broker must wait indefinitely","hn":"Broker ko indefinitely wait karna hoga"},{"en":"The facility terms may allow action if requirements are not met.","hn":"Requirements meet na hone par facility terms action allow kar sakte hain."}],[{"en":"Additional funds/collateral may be required or holdings may be reduced under terms","hn":"Terms ke under extra funds/collateral maange ja sakte hain ya holdings reduce ho sakti hain"},{"en":"Correct: the exact process depends on current disclosures and the agreement.","hn":"Sahi: exact process current disclosures aur agreement par depend karta hai."}],[{"en":"All losses are cancelled","hn":"Saare losses cancel ho jaate hain"},{"en":"A shortfall does not cancel losses.","hn":"Shortfall losses cancel nahi karta."}]],"a":1},{"k":"mc","q":{"en":"Which statement best distinguishes MTF from futures?","hn":"MTF aur futures ka best distinction kya hai?"},"o":[[{"en":"They are identical products with identical risks","hn":"Dono identical products aur risks hain"},{"en":"Their structures and obligations differ.","hn":"Dono ki structures aur obligations alag hain."}],[{"en":"MTF is a financed eligible-share purchase; futures are derivatives contracts","hn":"MTF financed eligible-share purchase hai; futures derivatives contracts hain"},{"en":"Correct: their contract and risk mechanics differ.","hn":"Sahi: contract aur risk mechanics alag hain."}],[{"en":"Futures never use margin","hn":"Futures mein kabhi margin nahi hota"},{"en":"Futures generally involve margin requirements.","hn":"Futures mein generally margin requirements hoti hain."}]],"a":1},{"k":"mc","q":{"en":"Which is the most useful pre-trade question for MTF?","hn":"MTF ke liye sabse useful pre-trade question kya hai?"},"o":[[{"en":"Can I buy the largest amount shown in the app?","hn":"Kya app mein dikhayi largest amount buy kar sakta hoon?"},{"en":"Platform capacity is not a suitability measure.","hn":"Platform capacity suitability measure nahi hai."}],[{"en":"Can I recover any loss by averaging down?","hn":"Kya averaging down se loss recover kar sakta hoon?"},{"en":"Averaging down adds exposure and does not guarantee recovery.","hn":"Averaging down exposure badhata hai aur recovery guarantee nahi karta."}],[{"en":"Can I afford the downside and costs, and do I understand shortfall/liquidation terms?","hn":"Kya downside aur costs afford kar sakta hoon, aur shortfall/liquidation terms samajhta hoon?"},{"en":"Correct: affordability, costs and facility obligations matter before entry.","hn":"Sahi: entry se pehle affordability, costs aur facility obligations matter karte hain."}]],"a":2},{"k":"mc","q":{"en":"A financed position is up 2%, but funding and transaction costs exceed that gain. What is the likely net result before other adjustments?","hn":"Financed position 2% up hai, lekin funding aur transaction costs gain se zyada hain. Other adjustments se pehle likely net result kya hai?"},"o":[[{"en":"A net loss","hn":"Net loss"},{"en":"Correct: costs can outweigh the price gain.","hn":"Sahi: costs price gain se zyada ho sakti hain."}],[{"en":"A guaranteed profit","hn":"Guaranteed profit"},{"en":"A price rise does not guarantee a net profit.","hn":"Price rise net profit guarantee nahi karta."}],[{"en":"No costs apply because price rose","hn":"Price badha toh costs apply nahi hoti"},{"en":"Costs can apply even when price rises.","hn":"Price rise hone par bhi costs apply ho sakti hain."}]],"a":0},{"k":"end"}];
UNITS.x20=[{"k":"info","t":{"en":"Define market context first","hn":"Pehle market context define karo"},"hook":{"en":"What should be assessed before interpreting a setup signal?","hn":"Setup signal interpret karne se pehle kya assess karna chahiye?"},"story":{"en":"A breakout signal during a thin, event-driven session may behave differently from one in a liquid, orderly session.","hn":"Thin event-driven session ka breakout, liquid orderly session ke breakout se alag behave kar sakta hai."},"s":{"en":"Context may include trend, range, volatility, liquidity, event risk and timeframe. The same signal can mean different things in different conditions.","hn":"Context mein trend, range, volatility, liquidity, event risk aur timeframe ho sakte hain. Same signal alag conditions mein alag meaning de sakta hai."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"What should be assessed before interpreting a setup signal?","hn":"Setup signal interpret karne se pehle kya assess karna chahiye?"},"reveal":{"en":"Market context and chosen timeframe","hn":"Market context aur chosen timeframe"}},{"k":"info","t":{"en":"Make the trigger observable","hn":"Trigger ko observable banao"},"hook":{"en":"Which is the more testable entry rule?","hn":"Kaunsa entry rule zyada testable hai?"},"story":{"en":"“Buy when it looks strong” is vague; “enter only after a 15-minute close above the level” is testable.","hn":"“Strong dikhe toh buy” vague hai; “15-minute close level ke upar aaye tab entry” testable hai."},"s":{"en":"An entry trigger should be specific enough to identify consistently, such as a close beyond a defined level plus a stated confirmation rule.","hn":"Entry trigger itna specific hona chahiye ki consistently identify ho, jaise defined level ke beyond close aur stated confirmation rule."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"Which is the more testable entry rule?","hn":"Kaunsa entry rule zyada testable hai?"},"reveal":{"en":"A defined close beyond a level with stated timeframe","hn":"Stated timeframe mein defined level ke beyond close"}},{"k":"info","t":{"en":"Define invalidation before entry","hn":"Entry se pehle invalidation define karo"},"hook":{"en":"What is invalidation for?","hn":"Invalidation ka purpose kya hai?"},"story":{"en":"A breakout fails back into the range; the prewritten plan says this invalidates the setup.","hn":"Breakout fail hokar range mein laut aata hai; prewritten plan ke hisaab se setup invalidate hota hai."},"s":{"en":"Invalidation states what would show the trade idea is wrong. It supports an exit plan and prevents moving the goalposts after entry.","hn":"Invalidation batata hai ki trade idea kis condition mein galat maana jayega. Ye exit plan support karta hai aur entry ke baad rules badalne se bachata hai."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"What is invalidation for?","hn":"Invalidation ka purpose kya hai?"},"reveal":{"en":"Define the condition that disproves the trade idea","hn":"Trade idea galat hone ki condition define karna"}},{"k":"info","t":{"en":"Risk and size must match","hn":"Risk aur size match hone chahiye"},"hook":{"en":"What should guide position size?","hn":"Position size kis basis par honi chahiye?"},"story":{"en":"Two trades have the same stop distance but different contract multipliers; the same quantity can create different risk.","hn":"Do trades ka stop distance same hai par contract multiplier alag; same quantity alag risk create kar sakti hai."},"s":{"en":"Position size should be based on acceptable loss, stop distance, instrument value and realistic costs—not on confidence alone.","hn":"Position size acceptable loss, stop distance, instrument value aur realistic costs par based honi chahiye, sirf confidence par nahi."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"What should guide position size?","hn":"Position size kis basis par honi chahiye?"},"reveal":{"en":"Risk budget, stop distance and instrument specifications","hn":"Risk budget, stop distance aur instrument specifications"}},{"k":"info","t":{"en":"Plan exits and time-based rules","hn":"Exit aur time-based rules plan karo"},"hook":{"en":"Why include a time-based exit or cancellation rule?","hn":"Time-based exit ya cancellation rule kyun rakhein?"},"story":{"en":"An intraday setup has not triggered by the planned time; the rule says cancel rather than chase it late.","hn":"Intraday setup planned time tak trigger nahi hua; rule kehta hai late chase karne ke bajay cancel karo."},"s":{"en":"Exit logic may include stop, target, trailing rule, time exit or invalidation. Different exit rules should be explicit and testable.","hn":"Exit logic mein stop, target, trailing rule, time exit ya invalidation ho sakta hai. Rules explicit aur testable hone chahiye."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"Why include a time-based exit or cancellation rule?","hn":"Time-based exit ya cancellation rule kyun rakhein?"},"reveal":{"en":"To avoid holding or chasing beyond the tested plan","hn":"Tested plan ke bahar hold ya chase karne se bachne ke liye"}},{"k":"info","t":{"en":"Costs and liquidity change outcomes","hn":"Costs aur liquidity result badalte hain"},"hook":{"en":"What can make a profitable-looking gross setup lose net of costs?","hn":"Gross mein profitable setup costs ke baad loss-making kyun ho sakta hai?"},"story":{"en":"A backtest assumes entry at the signal price, but the live spread is wide and the order fills worse.","hn":"Backtest signal price par entry assume karta hai, par live spread wide hai aur order worse fill hota hai."},"s":{"en":"Spread, slippage, fees, taxes, market impact and partial fills can change net results, especially in fast or thin markets.","hn":"Spread, slippage, fees, taxes, market impact aur partial fills net result badal sakte hain, khaaskar fast ya thin markets mein."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"What can make a profitable-looking gross setup lose net of costs?","hn":"Gross mein profitable setup costs ke baad loss-making kyun ho sakta hai?"},"reveal":{"en":"Spread, slippage and fees","hn":"Spread, slippage aur fees"}},{"k":"info","t":{"en":"One setup needs consistent rules","hn":"Ek setup ke rules consistent hone chahiye"},"hook":{"en":"Why keep setup rules consistent during evaluation?","hn":"Evaluation ke dauran setup rules consistent kyun rakhein?"},"story":{"en":"A trader changes the trigger after each loss, so it becomes impossible to know whether the original method had an edge.","hn":"Trader har loss ke baad trigger badalta hai, isliye original method ka edge assess nahi ho pata."},"s":{"en":"Changing rules trade by trade makes results hard to evaluate. Record the exact conditions and evaluate a meaningful sample, not one outcome.","hn":"Har trade mein rules badalne se results evaluate karna mushkil hota hai. Exact conditions record karo aur ek outcome ke bajay meaningful sample evaluate karo."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"Why keep setup rules consistent during evaluation?","hn":"Evaluation ke dauran setup rules consistent kyun rakhein?"},"reveal":{"en":"To assess the same method across comparable cases","hn":"Comparable cases mein same method assess karne ke liye"}},{"k":"info","t":{"en":"Paper-test before risking capital","hn":"Capital risk karne se pehle paper-test karo"},"hook":{"en":"What is a limitation of paper trading?","hn":"Paper trading ki limitation kya hai?"},"story":{"en":"A simulated order always fills at the candle close; a live order may not.","hn":"Simulated order candle close par fill hota hai; live order shayad na ho."},"s":{"en":"Paper testing can check rule clarity and workflow, but it may understate slippage, partial fills, fees and emotional pressure.","hn":"Paper testing rule clarity aur workflow check kar sakti hai, par slippage, partial fills, fees aur emotional pressure ko kam dikha sakti hai."},"p":{"en":"A setup is a repeatable decision framework, not a prediction. Define context, trigger, invalidation, size and exit before entry.","hn":"Setup repeatable decision framework hai, prediction nahi. Entry se pehle context, trigger, invalidation, size aur exit define karo."},"think":{"en":"What is a limitation of paper trading?","hn":"Paper trading ki limitation kya hai?"},"reveal":{"en":"It may not reproduce real execution and emotions","hn":"Real execution aur emotions reproduce nahi kar sakti"}},{"k":"mc","q":{"en":"What should be assessed before interpreting a setup signal?","hn":"Setup signal interpret karne se pehle kya assess karna chahiye?"},"o":[[{"en":"Only the indicator colour","hn":"Sirf indicator ka colour"},{"en":"Not quite. Context may include trend, range, volatility, liquidity, event risk and timeframe. The same signal can mean different things in different conditions.","hn":"Dobara socho. Context mein trend, range, volatility, liquidity, event risk aur timeframe ho sakte hain. Same signal alag conditions mein alag meaning de sakta hai."}],[{"en":"Market context and chosen timeframe","hn":"Market context aur chosen timeframe"},{"en":"Correct. Context may include trend, range, volatility, liquidity, event risk and timeframe. The same signal can mean different things in different conditions.","hn":"Sahi. Context mein trend, range, volatility, liquidity, event risk aur timeframe ho sakte hain. Same signal alag conditions mein alag meaning de sakta hai."}],[{"en":"Only yesterday’s profit","hn":"Sirf kal ka profit"},{"en":"Not quite. Context may include trend, range, volatility, liquidity, event risk and timeframe. The same signal can mean different things in different conditions.","hn":"Dobara socho. Context mein trend, range, volatility, liquidity, event risk aur timeframe ho sakte hain. Same signal alag conditions mein alag meaning de sakta hai."}]],"a":1},{"k":"mc","q":{"en":"Which is the more testable entry rule?","hn":"Kaunsa entry rule zyada testable hai?"},"o":[[{"en":"A defined close beyond a level with stated timeframe","hn":"Stated timeframe mein defined level ke beyond close"},{"en":"Correct. An entry trigger should be specific enough to identify consistently, such as a close beyond a defined level plus a stated confirmation rule.","hn":"Sahi. Entry trigger itna specific hona chahiye ki consistently identify ho, jaise defined level ke beyond close aur stated confirmation rule."}],[{"en":"Buy when the chart feels positive","hn":"Chart positive feel ho toh buy"},{"en":"Not quite. An entry trigger should be specific enough to identify consistently, such as a close beyond a defined level plus a stated confirmation rule.","hn":"Dobara socho. Entry trigger itna specific hona chahiye ki consistently identify ho, jaise defined level ke beyond close aur stated confirmation rule."}],[{"en":"Enter whenever social media is excited","hn":"Social media excited ho toh enter"},{"en":"Not quite. An entry trigger should be specific enough to identify consistently, such as a close beyond a defined level plus a stated confirmation rule.","hn":"Dobara socho. Entry trigger itna specific hona chahiye ki consistently identify ho, jaise defined level ke beyond close aur stated confirmation rule."}]],"a":0},{"k":"mc","q":{"en":"What is invalidation for?","hn":"Invalidation ka purpose kya hai?"},"o":[[{"en":"Guarantee the stop will fill at the exact price","hn":"Stop exact price par fill hone ki guarantee"},{"en":"Not quite. Invalidation states what would show the trade idea is wrong. It supports an exit plan and prevents moving the goalposts after entry.","hn":"Dobara socho. Invalidation batata hai ki trade idea kis condition mein galat maana jayega. Ye exit plan support karta hai aur entry ke baad rules badalne se bachata hai."}],[{"en":"Increase the target after every loss","hn":"Har loss ke baad target badhana"},{"en":"Not quite. Invalidation states what would show the trade idea is wrong. It supports an exit plan and prevents moving the goalposts after entry.","hn":"Dobara socho. Invalidation batata hai ki trade idea kis condition mein galat maana jayega. Ye exit plan support karta hai aur entry ke baad rules badalne se bachata hai."}],[{"en":"Define the condition that disproves the trade idea","hn":"Trade idea galat hone ki condition define karna"},{"en":"Correct. Invalidation states what would show the trade idea is wrong. It supports an exit plan and prevents moving the goalposts after entry.","hn":"Sahi. Invalidation batata hai ki trade idea kis condition mein galat maana jayega. Ye exit plan support karta hai aur entry ke baad rules badalne se bachata hai."}]],"a":2},{"k":"mc","q":{"en":"What should guide position size?","hn":"Position size kis basis par honi chahiye?"},"o":[[{"en":"How excited the trader feels","hn":"Trader kitna excited hai"},{"en":"Not quite. Position size should be based on acceptable loss, stop distance, instrument value and realistic costs—not on confidence alone.","hn":"Dobara socho. Position size acceptable loss, stop distance, instrument value aur realistic costs par based honi chahiye, sirf confidence par nahi."}],[{"en":"Risk budget, stop distance and instrument specifications","hn":"Risk budget, stop distance aur instrument specifications"},{"en":"Correct. Position size should be based on acceptable loss, stop distance, instrument value and realistic costs—not on confidence alone.","hn":"Sahi. Position size acceptable loss, stop distance, instrument value aur realistic costs par based honi chahiye, sirf confidence par nahi."}],[{"en":"The maximum quantity the broker permits","hn":"Broker ki maximum permitted quantity"},{"en":"Not quite. Position size should be based on acceptable loss, stop distance, instrument value and realistic costs—not on confidence alone.","hn":"Dobara socho. Position size acceptable loss, stop distance, instrument value aur realistic costs par based honi chahiye, sirf confidence par nahi."}]],"a":1},{"k":"mc","q":{"en":"Why include a time-based exit or cancellation rule?","hn":"Time-based exit ya cancellation rule kyun rakhein?"},"o":[[{"en":"To ensure every trade becomes profitable","hn":"Har trade profitable karne ke liye"},{"en":"Not quite. Exit logic may include stop, target, trailing rule, time exit or invalidation. Different exit rules should be explicit and testable.","hn":"Dobara socho. Exit logic mein stop, target, trailing rule, time exit ya invalidation ho sakta hai. Rules explicit aur testable hone chahiye."}],[{"en":"To remove all market risk","hn":"Saara market risk hatane ke liye"},{"en":"Not quite. Exit logic may include stop, target, trailing rule, time exit or invalidation. Different exit rules should be explicit and testable.","hn":"Dobara socho. Exit logic mein stop, target, trailing rule, time exit ya invalidation ho sakta hai. Rules explicit aur testable hone chahiye."}],[{"en":"To avoid holding or chasing beyond the tested plan","hn":"Tested plan ke bahar hold ya chase karne se bachne ke liye"},{"en":"Correct. Exit logic may include stop, target, trailing rule, time exit or invalidation. Different exit rules should be explicit and testable.","hn":"Sahi. Exit logic mein stop, target, trailing rule, time exit ya invalidation ho sakta hai. Rules explicit aur testable hone chahiye."}]],"a":2},{"k":"mc","q":{"en":"What can make a profitable-looking gross setup lose net of costs?","hn":"Gross mein profitable setup costs ke baad loss-making kyun ho sakta hai?"},"o":[[{"en":"Spread, slippage and fees","hn":"Spread, slippage aur fees"},{"en":"Correct. Spread, slippage, fees, taxes, market impact and partial fills can change net results, especially in fast or thin markets.","hn":"Sahi. Spread, slippage, fees, taxes, market impact aur partial fills net result badal sakte hain, khaaskar fast ya thin markets mein."}],[{"en":"The chart background colour","hn":"Chart ka background colour"},{"en":"Not quite. Spread, slippage, fees, taxes, market impact and partial fills can change net results, especially in fast or thin markets.","hn":"Dobara socho. Spread, slippage, fees, taxes, market impact aur partial fills net result badal sakte hain, khaaskar fast ya thin markets mein."}],[{"en":"The name of the setup","hn":"Setup ka naam"},{"en":"Not quite. Spread, slippage, fees, taxes, market impact and partial fills can change net results, especially in fast or thin markets.","hn":"Dobara socho. Spread, slippage, fees, taxes, market impact aur partial fills net result badal sakte hain, khaaskar fast ya thin markets mein."}]],"a":0},{"k":"mc","q":{"en":"Why keep setup rules consistent during evaluation?","hn":"Evaluation ke dauran setup rules consistent kyun rakhein?"},"o":[[{"en":"To guarantee a win streak","hn":"Win streak guarantee karne ke liye"},{"en":"Not quite. Changing rules trade by trade makes results hard to evaluate. Record the exact conditions and evaluate a meaningful sample, not one outcome.","hn":"Dobara socho. Har trade mein rules badalne se results evaluate karna mushkil hota hai. Exact conditions record karo aur ek outcome ke bajay meaningful sample evaluate karo."}],[{"en":"To assess the same method across comparable cases","hn":"Comparable cases mein same method assess karne ke liye"},{"en":"Correct. Changing rules trade by trade makes results hard to evaluate. Record the exact conditions and evaluate a meaningful sample, not one outcome.","hn":"Sahi. Har trade mein rules badalne se results evaluate karna mushkil hota hai. Exact conditions record karo aur ek outcome ke bajay meaningful sample evaluate karo."}],[{"en":"To avoid recording losing trades","hn":"Losing trades record na karne ke liye"},{"en":"Not quite. Changing rules trade by trade makes results hard to evaluate. Record the exact conditions and evaluate a meaningful sample, not one outcome.","hn":"Dobara socho. Har trade mein rules badalne se results evaluate karna mushkil hota hai. Exact conditions record karo aur ek outcome ke bajay meaningful sample evaluate karo."}]],"a":1},{"k":"mc","q":{"en":"What is a limitation of paper trading?","hn":"Paper trading ki limitation kya hai?"},"o":[[{"en":"It proves future profits","hn":"Future profits prove karti hai"},{"en":"Not quite. Paper testing can check rule clarity and workflow, but it may understate slippage, partial fills, fees and emotional pressure.","hn":"Dobara socho. Paper testing rule clarity aur workflow check kar sakti hai, par slippage, partial fills, fees aur emotional pressure ko kam dikha sakti hai."}],[{"en":"It removes the need for risk limits","hn":"Risk limits ki zaroorat hata deti hai"},{"en":"Not quite. Paper testing can check rule clarity and workflow, but it may understate slippage, partial fills, fees and emotional pressure.","hn":"Dobara socho. Paper testing rule clarity aur workflow check kar sakti hai, par slippage, partial fills, fees aur emotional pressure ko kam dikha sakti hai."}],[{"en":"It may not reproduce real execution and emotions","hn":"Real execution aur emotions reproduce nahi kar sakti"},{"en":"Correct. Paper testing can check rule clarity and workflow, but it may understate slippage, partial fills, fees and emotional pressure.","hn":"Sahi. Paper testing rule clarity aur workflow check kar sakti hai, par slippage, partial fills, fees aur emotional pressure ko kam dikha sakti hai."}]],"a":2},{"k":"end"}];
UNITS.x21=[{"k":"info","t":{"en":"A scanner returns candidates, not decisions","hn":"Scanner candidates deta hai, decisions nahi"},"hook":{"en":"What is the proper role of a scanner?","hn":"Scanner ka sahi role kya hai?"},"story":{"en":"A scan finds stocks above a moving average; the learner still checks liquidity, event risk and the full setup.","hn":"Scan moving average ke upar stocks dhoondhta hai; learner phir bhi liquidity, event risk aur full setup check karta hai."},"s":{"en":"A scanner applies explicit conditions to a defined universe and returns matches for further review.","hn":"Scanner defined universe par explicit conditions lagakar matches deta hai, jinhe further review chahiye."},"p":{"en":"Scanners and indicators filter information; they do not guarantee signals. Validate data, liquidity, rules and execution before acting.","hn":"Scanners aur indicators information filter karte hain; guaranteed signal nahi dete. Action se pehle data, liquidity, rules aur execution validate karo."},"think":{"en":"What is the proper role of a scanner?","hn":"Scanner ka sahi role kya hai?"},"reveal":{"en":"Shortlist candidates for further analysis","hn":"Further analysis ke liye candidates shortlist karna"}},{"k":"info","t":{"en":"Turn vague ideas into rules","hn":"Vague ideas ko rules mein badlo"},"hook":{"en":"Why document scanner settings?","hn":"Scanner settings document kyun karein?"},"story":{"en":"“Strong stock” is vague; “close above a 20-day high with minimum average traded value” is more testable.","hn":"“Strong stock” vague hai; “20-day high ke upar close aur minimum average traded value” zyada testable hai."},"s":{"en":"A reproducible scan defines universe, timeframe, data source, indicator settings, thresholds and excluded cases.","hn":"Reproducible scan universe, timeframe, data source, indicator settings, thresholds aur excluded cases define karta hai."},"p":{"en":"Scanners and indicators filter information; they do not guarantee signals. Validate data, liquidity, rules and execution before acting.","hn":"Scanners aur indicators information filter karte hain; guaranteed signal nahi dete. Action se pehle data, liquidity, rules aur execution validate karo."},"think":{"en":"Why document scanner settings?","hn":"Scanner settings document kyun karein?"},"reveal":{"en":"So results can be reproduced and audited","hn":"Taaki results reproduce aur audit ho sakein"}},{"k":"info","t":{"en":"Volume is not the whole of liquidity","hn":"Volume hi poori liquidity nahi"},"hook":{"en":"Which set of fields helps assess tradability?","hn":"Tradability assess karne ke liye kaunse fields help karte hain?"},"story":{"en":"A high-volume instrument can still have a temporarily wide spread during a volatile event.","hn":"High-volume instrument mein bhi volatile event ke dauran temporarily wide spread ho sakta hai."},"s":{"en":"Liquidity also depends on bid-ask spread, market depth, order size and how much price may move during execution.","hn":"Liquidity bid-ask spread, market depth, order size aur execution ke dauran price kitna move karega, is par bhi depend karti hai."},"p":{"en":"Scanners and indicators filter information; they do not guarantee signals. Validate data, liquidity, rules and execution before acting.","hn":"Scanners aur indicators information filter karte hain; guaranteed signal nahi dete. Action se pehle data, liquidity, rules aur execution validate karo."},"think":{"en":"Which set of fields helps assess tradability?","hn":"Tradability assess karne ke liye kaunse fields help karte hain?"},"reveal":{"en":"Volume, spread, depth and expected order size","hn":"Volume, spread, depth aur expected order size"}},{"k":"info","t":{"en":"Check data freshness and source","hn":"Data freshness aur source check karo"},"hook":{"en":"What can reveal stale scanner data?","hn":"Stale scanner data kaise identify ho sakta hai?"},"story":{"en":"A scanner displays yesterday’s close as if it were current, causing a false alert.","hn":"Scanner kal ar dashboard stale warning ke bina last value dikhata rehta hai."},"s":{"en":"Automated alerts need clear timestamps, error states, rate-limit handling and duplicate suppression. A silent failure must not look like a fresh signal.","hn":"Automated alerts mein clear timestamps, error states, rate-limit handling aur duplicate suppression chahiye. Silent failure ko fresh signal jaisa nahi dikhna chahiye."},"p":{"en":"Scanners and indicators filter information; they do not guarantee signals. Validate data, liquidity, rules and execution before acting.","hn":"Scanners aur indicators information filter karte hain; guaranteed signal nahi dete. Action se pehle data, liquidity, rules aur execution validate karo."},"think":{"en":"What should an alert system show when data is stale?","hn":"Data stale ho toh alert system ko kya dikhana chahiye?"},"reveal":{"en":"A visible stale/error state and last-updated time","hn":"Visible stale/error state aur last-updated time"}},{"k":"info","t":{"en":"Validate out of sample before automation","hn":"Automation se pehle out-of-sample validate karo"},"hook":{"en":"What should be tested before linking a scanner to orders?","hn":"Scanner ko orders se link karne se pehle kya test karein?"},"story":{"en":"A scanner alert is correct in normal conditions but behaves badly during an API outage; the failure mode needs a test.","hn":"Normal conditions mein alert sahi hai par API outage mein fail hota hai; failure mode test karna zaroori hai."},"s":{"en":"Before automating, test with unseen data, realistic costs, rejected/partial orders, outages and a safe paper mode.","hn":"Automation se pehle unseen data, realistic costs, rejected/partial orders, outages aur safe paper mode ke saath test karo."},"p":{"en":"Scanners and indicators filter information; they do not guarantee signals. Validate data, liquidity, rules and execution before acting.","hn":"Scanners aur indicators information filter karte hain; guaranteed signal nahi dete. Action se pehle data, liquidity, rules aur execution validate karo."},"think":{"en":"What should be tested before linking a scanner to orders?","hn":"Scanner ko orders se link karne se pehle kya test karein?"},"reveal":{"en":"Unseen data, costs, outages and order-failure handling","hn":"Unseen data, costs, outages aur order-failure handling"}},{"k":"mc","q":{"en":"What is the proper role of a scanner?","hn":"Scanner ka sahi role kya hai?"},"o":[[{"en":"Make an automatic buy decision","hn":"Automatic buy decision lena"},{"en":"Not quite. A scanner applies explicit conditions to a defined universe and returns matches for further review.","hn":"Dobara socho. Scanner defined universe par explicit conditions lagakar matches deta hai, jinhe further review chahiye."}],[{"en":"Shortlist candidates for further analysis","hn":"Further analysis ke liye candidates shortlist karna"},{"en":"Correct. A scanner applies explicit conditions to a defined universe and returns matches for further review.","hn":"Sahi. Scanner defined universe par explicit conditions lagakar matches deta hai, jinhe further review chahiye."}],[{"en":"Guarantee a target will be reached","hn":"Target reach hone ki guarantee"},{"en":"Not quite. A scanner applies explicit conditions to a defined universe and returns matches for further review.","hn":"Dobara socho. Scanner defined universe par explicit conditions lagakar matches deta hai, jinhe further review chahiye."}]],"a":1},{"k":"mc","q":{"en":"Why document scanner settings?","hn":"Scanner settings document kyun karein?"},"o":[[{"en":"So results can be reproduced and audited","hn":"Taaki results reproduce aur audit ho sakein"},{"en":"Correct. A reproducible scan defines universe, timeframe, data source, indicator settings, thresholds and excluded cases.","hn":"Sahi. Reproducible scan universe, timeframe, data source, indicator settings, thresholds aur excluded cases define karta hai."}],[{"en":"So the scanner cannot ever fail","hn":"Taaki scanner kabhi fail na ho"},{"en":"Not UNITS.x22=[{"k":"info","t":{"en":"Record the plan before the outcome","hn":"Outcome se pehle plan record karo"},"hook":{"en":"Why record the plan before the trade?","hn":"Trade se pehle plan kyun record karein?"},"story":{"en":"Writing down the plan first helps distinguish a valid planned loss from an impulsive trade.","hn":"Pehle plan likhne se planned valid loss aur impulsive trade ka difference samajh aata hai."},"s":{"en":"Capture the setup, rationale, planned entry, invalidation, target, position size and expected risk before the trade outcome is known.","hn":"Trade ka outcome pata hone se pehle setup, rationale, planned entry, invalidation, target, position size aur expected risk record karo."},"p":{"en":"A journal evaluates process as well as outcome. Record costs, execution, planned risk and rule adherence; paper results may differ from live trading.","hn":"Journal process aur outcome dono evaluate karta hai. Costs, execution, planned risk aur rule adherence record karo; paper result live trading se alag ho sakta hai."},"think":{"en":"Why record the plan before the trade?","hn":"Trade se pehle plan kyun record karein?"},"reveal":{"en":"To compare the actual decision with the original rules","hn":"Actual decision ko original rules se compare karne ke liye"}},{"k":"info","t":{"en":"Track execution and costs","hn":"Execution aur costs track karo"},"hook":{"en":"Which result is more useful for evaluating performance?","hn":"Performance evaluate karne ke liye kaunsa result zyada useful hai?"},"story":{"en":"A trade shows ₹500 gross profit but fees and poor fills materially reduce net profit.","hn":"Trade ₹500 gross profit dikhata hai par fees aur poor fills net profit ko kaafi reduce karte hain."},"s":{"en":"Record actual fills, partial fills, spread, slippage, brokerage, taxes and other costs; gross P&L can overstate the real result.","hn":"Actual fills, partial fills, spread, slippage, brokerage, taxes aur doosre costs record karo; gross P&L real result ko over ":"Ek trade nahi, sample review karo"},"hook":{"en":"What is a better basis for judging a strategy?","hn":"Strategy judge karne ka better basis kya hai?"},"story":{"en":"One losing trade does not prove a method is broken; a repeated pattern across many comparable trades deserves investigation.","hn":"Ek losing trade method fail hone ka proof nahi; comparable trades mein repeated pattern investigation deserve karta hai."},"s":{"en":"Look for patterns across a meaningful sample and segment by setup, market regime and execution quality. Avoid changing rules after every result.","hn":"Meaningful sample mein patterns dekho aur setup, market regime aur execution quality ke hisaab se segment karo. Har result ke baad rules mat badlo."},"p":{"en":"A journal evaluates process as well as outcome. Record costs, execution, planned risk and rule adherence; paper results may differ from live trading.","hn":"Journal process aur outcome dono evaluate karta hai. Costs, execution, planned risk aur rule adherence record karo; paper result live trading se alag ho sakta hai."},"think":{"en":"What is a better basis for judging a strategy?","hn":"Strategy judge karne ka better basis kya hai?"},"reveal":{"en":"A meaningful sample with consistent rules","hn":"Consistent rules ke saath meaningful sample"}},{"k":"info","t":{"en":"Turn review into one measured change","hn":"Review ko ek measured change mein badlo"},"hook":{"en":"How should a journal review lead to improvement?","hn":"Journal review se improvement kaise aani chahiye?"},"story":{"en":"A trader targets fewer late entries for the next 20 setups and tracks adherence instead of changing five indicators.","hn":"Trader agle 20 setups mein late entries kam karne ka target rakhta hai aur five indicators badalne ke bajay adherence track karta hai."},"s":{"en":"Choose a specific process improvement, define how to measure it and review again after enough observations; avoid changing many variables at once.","hn":"Specific process improvemen
